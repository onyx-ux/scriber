# Addresses that reach the dashboard without a password.
#
# Anything not listed here is asked for the username and password in
# config/.htpasswd instead — see templates/default.conf.template, which uses
# `satisfy any` so either one is enough.
#
# Add or remove a line and `docker compose restart dashboard`; no rebuild.

allow 127.0.0.1;        # the PC it runs on
allow 192.168.0.0/24;   # the house LAN
allow 172.21.0.0/16;    # this stack's own compose network

# That last line was 172.16.0.0/12 until 2026-08-30, and narrowing it is the
# whole of a real fix rather than tidying.
#
# The /12 is every docker network on the machine, not this one — the hand-run
# Vaultwarden's, the older cloudflared's, anything started later. All of them
# were waved through here without a password, and all of them were trusted by
# set_real_ip_from to say via CF-Connecting-IP which address this file should
# judge them by.
#
# It also made the realip rewrite load-bearing in the worst way. Requests down
# the tunnel arrive from inside that range, so the ONLY thing standing between
# a stranger and the dashboard was CF-Connecting-IP being applied first. Any
# day that stopped happening — a moved subnet, a missing header — the failure
# was silent and it was "the whole internet is on the allow list".
#
# With the /16 the same failure lands the other way: an unrewritten tunnel
# request is not on this list either, so it gets a password prompt instead of
# the house keys. Fail-closed and visible beats fail-open and quiet.
#
# WHY NOT DROP IT ENTIRELY: measured rather than assumed. A browser on the LAN
# arrives as its own 192.168.0.x — docker preserves the source address, so the
# /24 above covers the house. A request made ON the Pi (curl over ssh, a health
# check) arrives as 172.21.0.1, the compose bridge gateway, and nothing else
# here matches it. Deleting the line locks the operator out of their own box
# from the one place they are most likely to be standing.
#
# Compose picks that subnet, so it can move if the network is recreated. After
# any `docker compose down`, check it still matches:
#
#   docker network inspect pi-service_default \
#     -f '{{range .IPAM.Config}}{{.Subnet}} gw={{.Gateway}}{{end}}'

# The house, as the internet sees it.
#
# Traffic through https://quill.thehouseofcake.org does not arrive from the
# LAN. It arrives from cloudflared, on a docker address that the line above
# would wave through — which would hand the whole dashboard to anyone who knows
# the hostname. The template stops that by rewriting the client address to the
# real visitor's (CF-Connecting-IP) before this file is consulted, so a request
# through the tunnel is judged on where the PERSON is, not on where the tunnel
# is. Read templates/default.conf.template before touching either.
#
# So one more line here is the whole of "only the house gets in without a
# password" for the public hostname:
#
#   allow 203.0.113.7;    # your WAN address
#
# It is left commented out in the repo and set for real only on the machine
# that serves this. The repo is public, and a home's WAN address is a home's
# address — the LAN range above is generic, this would not be. Read the current
# one off the machine itself with:
#
#   curl -s https://cloudflare.com/cdn-cgi/trace | grep '^ip='
#
# Two things follow from it living outside git. A fresh checkout over a live
# one takes the entry with it, and a home connection changing address ages it
# out — but neither locks anybody out, because the far side of `satisfy any` is
# the .htpasswd prompt rather than a wall. It costs a password, not access.
