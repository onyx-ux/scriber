services:
  # Runs on the PC. A single static page plus a thin proxy to the bot's status
  # API on the Pi.
  #
  # The page used to fetch the Pi directly from the browser, with no backend
  # at all. That was fine while the dashboard was LAN-only and the API was
  # unauthenticated, and stops being fine the moment either changes: every
  # viewer would need to reach port 8090 themselves, and the API token would
  # have to sit in the page source. nginx proxies /api instead and adds the
  # token server-side, so the Pi's API can stay on the LAN even if the
  # dashboard is published.
  #
  # Access: LAN addresses pass straight through; anything else is asked for a
  # username and password. See templates/default.conf.template.
  #
  # Point it at a different bot without rebuilding:
  #   http://localhost:8095/?api=http://other-host:8090
  dashboard:
    image: nginx:alpine
    container_name: scriber-dashboard
    restart: unless-stopped
    ports:
      # 8095 on the host — 8080 was already taken on this PC (the same reason
      # the whisper server sits on 8089).
      - '8095:80'
    environment:
      # Where the bot's status API lives, from inside this container.
      PI_API: ${PI_API:-http://pihouse.local:8090}
      # Must match STATUS_TOKEN in pi-service/.env, or the Pi returns 401.
      STATUS_TOKEN: ${STATUS_TOKEN}
    volumes:
      - ./html:/usr/share/nginx/html:ro
      # envsubst runs over these at start-up, so the token is injected from
      # the environment rather than committed.
      - ./templates:/etc/nginx/templates:ro
      # Who gets in without a password. Kept out of the template so the list
      # can be edited without a container rebuild.
      - ./config/allowed-ips.conf:/etc/nginx/allowed-ips.conf:ro
      # htpasswd -B -c config/.htpasswd <username>
      - ./config/.htpasswd:/etc/nginx/.htpasswd:ro
