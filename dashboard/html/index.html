<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quill</title>
<!-- Inline so the page stays a single self-contained file with no second
     request — and so a tab left open is findable by its icon rather than by
     reading titles. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%AA%B6%3C/text%3E%3C/svg%3E">
<!-- Three faces, each doing one job: Plex Sans for interface, Plex Mono for
     anything you read as data (timers, counts, refs), Spectral for the prose
     the summariser wrote. Every one has a system fallback, so the page still
     reads properly when the browser is offline — which on a LAN dashboard
     pointed at a Raspberry Pi is a real state, not a hypothetical. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  /* Quill's own palette: brass on near-black, sage for what worked, red for
     what is live or broken. Warm greys throughout — the ground is not neutral,
     it leans slightly blue and the text leans slightly warm, which is what
     stops a dark interface reading as a terminal. */
  :root {
    --ink: #0E1014;         /* the page */
    --panel: #12151A;       /* rails and columns */
    --raise: #15181E;       /* cards on the panel */
    --raise-2: #1B1F26;     /* rows, inputs */
    --line: #232730;        /* borders */
    --line-2: #2C313B;      /* borders that need to be seen */

    --text: #E9E5DC;        /* primary, warm off-white */
    --text-2: #C6C1B6;      /* secondary */
    --dim: #8A8578;         /* labels, metadata */
    --dimmer: #6E6A5E;      /* the quietest thing that is still legible */

    --brass: #C9A227;       /* the accent: attention, and anything primary */
    --brass-dim: #3A3529;   /* its tint, for fills and borders */
    --sage: #7BA05B;        /* done, healthy */
    --sage-lit: #A7C48F;
    --sage-dim: #3C4A33;
    --red: #D0453C;         /* recording, and failure */
    --red-lit: #E4A9A4;

    --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    --serif: 'Spectral', Georgia, 'Times New Roman', serif;

    --rail: 270px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ink); color: var(--text);
    font: 400 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { margin: 0; font-weight: 500; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--brass); }

  /* Anything you read as a value rather than a sentence: timers, counts,
     session refs, labels. Tabular figures so a column of numbers lines up and
     a ticking timer does not jitter. */
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .label { font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
           text-transform: uppercase; color: var(--dim); }
  .prose { font-family: var(--serif); }

  /* --- shell --- */

  .app { display: grid; grid-template-columns: var(--rail) 1fr; min-height: 100vh; }

  .rail { background: var(--panel); border-right: 1px solid var(--line);
          display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; gap: 12px; align-items: center; padding: 20px 18px 18px; }
  .brand .mark { font-size: 26px; line-height: 1; filter: sepia(1) saturate(3) hue-rotate(4deg); }
  .brand h1 { font-size: 19px; letter-spacing: .2px; }
  .brand .sub { color: var(--dim); font-size: 12px; margin-top: 1px; }

  .rail .label { padding: 0 18px 8px; }
  .rail-list { flex: 1; overflow-y: auto; padding-bottom: 12px; }
  .rail-foot { padding: 14px 18px; border-top: 1px solid var(--line);
               color: var(--dimmer); font-family: var(--mono); font-size: 11.5px; line-height: 1.7; }

  .camp { display: block; width: 100%; text-align: left; cursor: pointer;
          background: none; border: 0; border-left: 2px solid transparent;
          padding: 11px 18px; transition: background .15s, border-color .15s; }
  .camp:hover { background: var(--raise); }
  .camp.on { background: var(--raise); border-left-color: var(--brass); }
  .camp .row1 { display: flex; align-items: center; gap: 8px; }
  .camp .nm { font-weight: 500; }
  .camp .meta { color: var(--dim); font-family: var(--mono); font-size: 11.5px;
                line-height: 1.55; margin-top: 3px; }
  .badge { margin-left: auto; min-width: 19px; padding: 1px 6px; border-radius: 999px;
           background: var(--brass); color: #171204; font-family: var(--mono);
           font-size: 11px; font-weight: 500; text-align: center; }

  /* --- top bar --- */

  .top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
         padding: 18px 24px; border-bottom: 1px solid var(--line);
         position: sticky; top: 0; z-index: 4; background: var(--ink); }
  .top h2 { font-size: 22px; font-family: var(--serif); }
  .health { display: flex; gap: 16px; flex-wrap: wrap; }
  .health span { color: var(--dim); font-family: var(--mono); font-size: 12px; }
  .top .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
         margin-right: 7px; vertical-align: middle; background: var(--dimmer); }
  .dot.ok { background: var(--sage); }
  .dot.bad { background: var(--red); }
  .dot.warn { background: var(--brass); }
  .dot.live { background: var(--red); animation: pulse 1.7s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  /* --- the two columns --- */

  .split { display: grid; grid-template-columns: minmax(380px, 460px) 1fr; align-items: start; }
  .mid { border-right: 1px solid var(--line); min-height: calc(100vh - 71px);
         display: flex; flex-direction: column; }
  .side { padding: 20px 24px 40px; }

  /* --- recording banner --- */

  .rec { padding: 18px 22px 16px; border-bottom: 1px solid var(--line);
         background: linear-gradient(180deg, #1a1216, transparent); }
  .rec .head { color: var(--red); font-family: var(--mono); font-size: 11px;
               letter-spacing: .1em; text-transform: uppercase; }
  .rec .timer { font-family: var(--mono); font-size: 40px; font-weight: 500;
                letter-spacing: -.5px; line-height: 1.15; margin-top: 6px; }
  .rec .where { color: var(--dim); font-family: var(--mono); font-size: 12px; line-height: 1.7; }
  .rec .top-row { display: flex; gap: 18px; align-items: flex-end; }
  .wave { display: flex; align-items: center; gap: 2px; height: 34px; margin-top: 12px; }
  .wave i { flex: 1; background: var(--red); border-radius: 1px; opacity: .85;
            animation: bounce 1.1s ease-in-out infinite; }
  @keyframes bounce { 0%,100% { transform: scaleY(.35) } 50% { transform: scaleY(1) } }

  /* --- sessions --- */

  .sessions { flex: 1; overflow-y: auto; padding: 16px 22px 8px; }
  .sess { padding: 13px 14px; border-radius: 8px; border: 1px solid transparent;
          cursor: pointer; transition: background .15s, border-color .15s; }
  .sess:hover { background: var(--raise); }
  .sess.on { background: var(--raise); border-color: var(--line-2); }
  .sess .l1 { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .sess .ref { font-family: var(--mono); font-size: 13.5px; font-weight: 500; }
  .sess .when { color: var(--dim); font-family: var(--mono); font-size: 11.5px; }
  .sess .tldr { font-family: var(--serif); font-size: 14.5px; line-height: 1.55;
                color: var(--text-2); margin-top: 7px; }
  .sess .facets { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px;
                  color: var(--dimmer); font-family: var(--mono); font-size: 11px; }

  .pill { margin-left: auto; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-2);
          color: var(--dim); font-family: var(--mono); font-size: 10.5px;
          letter-spacing: .04em; white-space: nowrap; }
  .pill.posted { color: var(--sage-lit); border-color: var(--sage-dim); }
  .pill.approval { color: var(--brass); border-color: var(--brass-dim); }
  .pill.failed { color: var(--red-lit); border-color: #4a2a28; }
  .pill.recording { color: var(--red-lit); border-color: #4a2a28; }

  /* --- tabs --- */

  .tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer;
         padding: 0 0 11px; color: var(--dim); font-size: 14.5px; transition: color .15s; }
  .tab:hover { color: var(--text-2); }
  .tab.on { color: var(--text); border-bottom-color: var(--brass); }
  .tab .n { color: var(--dimmer); font-family: var(--mono); font-size: 11.5px; margin-left: 5px; }

  /* --- roster --- */

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 0 0 9px; border-bottom: 1px solid var(--line);
       font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em;
       text-transform: uppercase; color: var(--dim); font-weight: 400; }
  th.r, td.r { text-align: right; }
  td { padding: 11px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .share { display: inline-block; width: 62px; height: 4px; border-radius: 2px;
           background: var(--raise-2); overflow: hidden; vertical-align: middle; margin-right: 9px; }
  .share > i { display: block; height: 100%; background: var(--brass); }
  .share.none > i { background: var(--dimmer); }
  .unset { color: var(--dimmer); font-style: italic; }
  .agreed { color: var(--sage); } .waiting { color: var(--brass); } .never { color: var(--dim); }
  .declined { color: var(--red-lit); }

  /* --- buttons --- */

  .btn { background: transparent; border: 1px solid var(--line-2); border-radius: 7px;
         color: var(--text-2); cursor: pointer; padding: 6px 13px; font-size: 13px;
         transition: border-color .15s, color .15s, background .15s; }
  .btn:hover:not(:disabled) { border-color: var(--dim); color: var(--text); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.go { border-color: var(--brass); color: var(--brass); }
  .btn.go:hover:not(:disabled) { background: var(--brass-dim); color: #F0DFA0; }
  .btn.danger { border-color: #4a2a28; color: var(--red-lit); }
  .btn.danger:hover:not(:disabled) { background: #2a1614; }
  .btn.sm { padding: 3px 9px; font-size: 12px; }
  .acts { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 11px; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 4px; }

  input.in { background: var(--raise-2); border: 1px solid var(--line); border-radius: 7px;
             padding: 6px 10px; font-size: 13px; min-width: 0; }
  input.in:focus { outline: none; border-color: var(--brass); }
  form.f { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }

  /* --- notes --- */

  .notes { margin-top: 22px; padding: 20px 22px; background: var(--raise);
           border: 1px solid var(--line); border-radius: 10px; }
  .notes .head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
                 padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .notes .tldr { font-family: var(--serif); font-size: 17px; line-height: 1.62;
                 margin: 16px 0 4px; max-width: 62ch; }
  .notes h4 { margin: 20px 0 7px; font-family: var(--mono); font-size: 10.5px;
              letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 400; }
  .notes ul { margin: 0; padding-left: 17px; }
  .notes li { margin: 5px 0; line-height: 1.55; color: var(--text-2); }
  .notes .cols { display: grid; gap: 8px 30px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .notes .scene { border-left: 2px solid var(--line-2); padding-left: 14px; margin: 12px 0; }
  .notes .scene h5 { margin: 0 0 4px; font-size: 14.5px; font-weight: 500; }
  .notes .funny li { color: var(--brass); }

  /* --- odds and ends --- */

  .empty { color: var(--dimmer); font-style: italic; padding: 10px 0; }
  .note { color: var(--brass); font-size: 13px; margin-top: 10px; }
  .kv { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0;
        border-bottom: 1px solid var(--line); }
  .kv:last-child { border-bottom: 0; }
  .kv .k { color: var(--dim); }
  .kv .v { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  code { background: var(--raise-2); border-radius: 4px; padding: 1px 6px;
         font-family: var(--mono); font-size: 12.5px; }

  #err { display: none; margin: 16px 24px; padding: 12px 15px; border-radius: 9px;
         background: #221315; border: 1px solid #4a2a28; color: var(--red-lit); font-size: 13.5px; }
  body.stale .split, body.stale .rail-list { opacity: .5; transition: opacity .3s; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
           max-width: 640px; padding: 11px 17px; border-radius: 9px;
           background: var(--raise); border: 1px solid var(--line-2);
           box-shadow: 0 10px 34px #000a; font-size: 13.5px;
           opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .toast.show { opacity: 1; }
  .toast.good { border-color: var(--sage-dim); }
  .toast.bad { border-color: #4a2a28; color: var(--red-lit); }

  @media (max-width: 1100px) {
    .split { grid-template-columns: 1fr; }
    .mid { border-right: 0; border-bottom: 1px solid var(--line); min-height: 0; }
  }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    .rail-list { max-height: 210px; }
    .side { padding: 18px 16px 32px; }
    .top { padding: 14px 16px; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="rail">
    <div class="brand">
      <span class="mark">🪶</span>
      <div>
        <h1>Quill</h1>
        <div class="sub">the scribe at your table</div>
      </div>
    </div>
    <div class="label">Campaigns</div>
    <div class="rail-list" id="rail"></div>
    <div class="rail-foot" id="foot">connecting…</div>
  </nav>

  <main>
    <div class="top">
      <h2 id="title">—</h2>
      <div class="health" id="health"></div>
      <div class="right" id="topacts"></div>
    </div>

    <div id="err"></div>

    <div class="split">
      <div class="mid">
        <div id="rec"></div>
        <div class="sessions">
          <div class="label" style="padding-bottom:10px">Sessions <span style="text-transform:none;letter-spacing:0" id="sesshint"></span></div>
          <div id="sessions"></div>
        </div>
        <div style="padding:14px 22px 20px; border-top:1px solid var(--line)">
          <button class="btn" id="importbtn" style="width:100%">Import a recording</button>
          <div id="importform"></div>
        </div>
      </div>

      <div class="side">
        <div class="tabs" id="tabs"></div>
        <div id="panel"></div>
        <div id="notes"></div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// Same origin by default: nginx proxies /api to the Pi and adds the status
// token on the way through, so the token never reaches the browser and the
// Pi's port can stay on the LAN even when the dashboard is published.
//
// ?api=http://host:port still overrides it, for pointing at a second bot.
const API = new URLSearchParams(location.search).get('api') || window.SCRIBER_API || '/api';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const empty = (m) => `<div class="empty">${esc(m)}</div>`;

// --- what the page is currently looking at -------------------------------
//
// Four things, and every render reads them rather than the DOM. The cards are
// rebuilt from the poll every few seconds, so any state kept in the markup
// would be thrown away mid-click.
const view = { campaignId: null, tab: 'table', meetingId: null, importing: false };

let status = null;   // last /status payload
let detail = null;   // last /campaign?id= payload
let notes = null;    // last /notes?meeting= payload
let lastSeen = null;

const PROVIDERS = { gemini: 'Gemini', anthropic: 'Claude' };

function hhmmss(ms) {
  if (ms == null) return '0:00:00';
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 3600)}:${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}

function ago(iso) {
  if (!iso) return 'never';
  const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 14) return `${days}d ago`;
  return `${Math.floor(days / 7)}w ago`;
}

const shortDate = (iso) =>
  iso ? new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : '';

function sinceLastSeen() {
  if (!lastSeen) return 'never';
  const s = Math.round((Date.now() - lastSeen) / 1000);
  if (s < 2) return 'just now';
  if (s < 60) return `${s}s ago`;
  const m = Math.floor(s / 60);
  return m < 60 ? `${m}m ago` : `${Math.floor(m / 60)}h ago`;
}

const dot = (state) => `<span class="dot ${state === true ? 'ok' : state === false ? 'bad' : ''}"></span>`;

// --- the rail ------------------------------------------------------------

function renderRail() {
  const camps = status?.campaigns ?? [];
  $('rail').innerHTML = camps.length
    ? camps.map((c) => `
        <button class="camp${view.campaignId === c.id ? ' on' : ''}" data-campaign="${c.id}"
                aria-current="${view.campaignId === c.id}">
          <div class="row1">
            ${c.recording ? '<span class="dot live"></span>' : `<span class="dot ${c.claimed ? 'ok' : 'warn'}"></span>`}
            <span class="nm">${esc(c.name || c.channel || 'unnamed')}</span>
            ${c.awaiting ? `<span class="badge">${c.awaiting}</span>` : ''}
          </div>
          <div class="meta">
            ${c.sessions} session${c.sessions === 1 ? '' : 's'} · ${c.hours.toFixed(1)}h<br>
            ${c.lines.toLocaleString()} lines · ${c.members} player${c.members === 1 ? '' : 's'}
          </div>
        </button>`).join('')
    : empty('No campaigns yet.');

  const b = status?.bot;
  $('foot').innerHTML = b
    ? `${esc(b.user || 'offline')}<br>up ${Math.floor(b.uptimeMs / 86400000)}d ${new Date(b.uptimeMs).toISOString().slice(11, 16)}<br><span id="stamp"></span>`
    : 'connecting…';
}

// --- top bar -------------------------------------------------------------

function renderTop() {
  const c = status?.campaigns?.find((x) => x.id === view.campaignId);
  $('title').textContent = c ? c.name || c.channel || 'unnamed campaign' : 'Quill';

  const h = status?.health ?? {};
  $('health').innerHTML = status
    ? [
        `${dot(h.whisperServer)}whisper server`,
        `${dot(h.summariser)}${esc(h.summariserName || 'summariser')}`,
        h.transcribePaused ? `${dot(false)}transcribing paused` : '',
        h.summarisePaused ? `${dot(false)}summarising paused` : '',
      ].filter(Boolean).map((s) => `<span>${s}</span>`).join('')
    : '';

  // Each button says the state it moves TO, so it is the same click whatever
  // the page last managed to render — a toggle sent twice by a double-click,
  // or by two tabs open on this page, lands on the opposite of what the person
  // who clicked it saw.
  const can = status?.actionsEnabled !== false;
  $('topacts').innerHTML = can && status
    ? `<button class="btn sm" data-act="pause" data-queue="transcribe" data-paused="${!h.transcribePaused}"
         ${h.transcribePaused ? '' : 'data-confirm="Pause transcription? Nothing new will start."'}>
         ${h.transcribePaused ? 'Resume transcribing' : 'Pause transcribing'}</button>
       <button class="btn sm" data-act="pause" data-queue="summarize" data-paused="${!h.summarisePaused}"
         ${h.summarisePaused ? '' : 'data-confirm="Pause summarising? Nothing new will start."'}>
         ${h.summarisePaused ? 'Resume summarising' : 'Pause summarising'}</button>`
    : '';
}

// --- the recording banner ------------------------------------------------

function renderRecording() {
  const c = status?.campaigns?.find((x) => x.id === view.campaignId);
  const live = status?.recording?.find((r) => r.guildId === c?.guildId);
  if (!live) { $('rec').innerHTML = ''; return; }

  // Decorative, and honestly so: Discord gives per-speaker clips, not a signal
  // level, so there is no waveform to draw. The bars are seeded from the clip
  // count, which at least means a busy session looks busier than a quiet one.
  const bars = Array.from({ length: 46 }, (_, i) => {
    const h = 25 + ((live.clips * 7 + i * 13) % 70);
    return `<i style="height:${h}%;animation-delay:${(i % 9) * 0.11}s"></i>`;
  }).join('');

  $('rec').innerHTML = `
    <div class="rec">
      <div class="head"><span class="dot live"></span>Recording · session ${live.meetingId}</div>
      <div class="top-row">
        <div class="timer" id="timer">${hhmmss(live.recordingForMs)}</div>
        <div class="where">#${esc(live.channel || 'voice')}<br>${live.clips} clips · ${live.speakers} speaker${live.speakers === 1 ? '' : 's'}</div>
      </div>
      <div class="wave">${bars}</div>
    </div>`;
}

// --- the session list ----------------------------------------------------

const PILL = { posted: 'posted', approval: 'approval', failed: 'failed', recording: 'recording',
               queued: 'queued', working: 'working' };

// A bot older than this page does not send `state`, `job` or the recap facets.
// Deriving what can be derived from the meeting status keeps the page useful
// against it rather than printing "undefined" in every pill — the two are
// deployed from different places (this file from a bind mount, the fields from
// an image), so they are routinely a few minutes out of step.
function normalise(s) {
  if (s.state) return s;
  const status = s.status ?? '';
  return {
    ...s,
    state: status === 'done' ? 'posted' : status.endsWith('_failed') ? 'failed' : status === 'recording' ? 'recording' : 'queued',
    npcs: 0, locations: 0, threads: 0, tldr: '',
    discardable: s.lines === 0 && status !== 'recording',
  };
}

function sessionCard(s) {
  const facets = [
    s.npcs ? `${s.npcs} NPC${s.npcs === 1 ? '' : 's'}` : '',
    s.locations ? `${s.locations} location${s.locations === 1 ? '' : 's'}` : '',
    s.threads ? `${s.threads} thread${s.threads === 1 ? '' : 's'} open` : '',
    !s.lines && s.state !== 'recording' ? 'no audio' : '',
  ].filter(Boolean);

  const line = s.tldr
    ? `<div class="tldr">${esc(s.tldr.length > 190 ? s.tldr.slice(0, 190).replace(/\s+\S*$/, '') + '…' : s.tldr)}</div>`
    : s.state === 'failed'
      ? '<div class="tldr">Nothing was recorded, so retrying cannot help.</div>'
      : s.state === 'approval'
        ? '<div class="tldr">Transcript is ready. Nothing has been summarised or posted yet.</div>'
        : '';

  return `
    <div class="sess${view.meetingId === s.meetingId ? ' on' : ''}" data-session="${s.meetingId}"
         role="button" tabindex="0">
      <div class="l1">
        <span class="ref">${esc(s.ref || `#${s.meetingId}`)}</span>
        <span class="when">${esc(shortDate(s.startedAt))}${s.lines ? ` · ${s.lines.toLocaleString()} lines` : ''}</span>
        <span class="pill ${s.state}">${esc(PILL[s.state] || s.state)}</span>
      </div>
      ${line}
      ${facets.length ? `<div class="facets">${facets.map((f) => `<span>${esc(f)}</span>`).join('')}</div>` : ''}
      ${sessionActions(s)}
    </div>`;
}

// The decision lives on the session it belongs to, rather than in a separate
// queue that makes you find the same session twice.
function sessionActions(s) {
  if (status?.actionsEnabled === false) return '';
  const out = [];

  if (s.job?.status === 'awaiting_approval' && s.job.type === 'transcribe') {
    out.push(`<button class="btn sm go" data-act="transcribe" data-job="${s.job.id}" data-action="now">Transcribe now</button>`,
             `<button class="btn sm" data-act="transcribe" data-job="${s.job.id}" data-action="later">Not yet</button>`,
             `<button class="btn sm" data-act="transcribe" data-job="${s.job.id}" data-action="pi">On the Pi</button>`);
  }
  if (s.job?.status === 'awaiting_approval' && s.job.type === 'summarize') {
    const ps = status?.providers ?? [];
    out.push(...(ps.length > 1
      ? ps.map((p) => `<button class="btn sm go" data-act="summary/approve" data-job="${s.job.id}" data-provider="${esc(p)}">${esc(PROVIDERS[p] || p)}</button>`)
      : [`<button class="btn sm go" data-act="summary/approve" data-job="${s.job.id}">Summarise now</button>`]));
  }
  if (s.discardable && s.state === 'failed') {
    out.push(`<button class="btn sm danger" data-act="session/discard" data-meeting="${s.meetingId}"
      data-confirm="Discard ${s.ref || `#${s.meetingId}`}? It has no transcript, and this stops it retrying.">Discard</button>`);
  }
  if (s.lines) {
    out.push(`<button class="btn sm" data-download="${s.meetingId}">Transcript</button>`);
    out.push(`<button class="btn sm" data-act="summary/again" data-meeting="${s.meetingId}"
      data-confirm="Write the notes for ${s.ref || `#${s.meetingId}`} again?">Re-summarise</button>`);
  }
  return out.length ? `<div class="acts">${out.join('')}</div>` : '';
}

function renderSessions() {
  const list = (detail?.sessions ?? []).map(normalise);
  $('sesshint').textContent = list.length ? '· newest first' : '';
  $('sessions').innerHTML = list.length ? list.map(sessionCard).join('') : empty('Nothing recorded yet.');
}

// --- the side panel ------------------------------------------------------

function renderTabs() {
  if (!detail) { $('tabs').innerHTML = ''; return; }
  const tabs = [
    ['table', 'The table', detail.roster.length],
    ['corrections', 'Corrections', detail.corrections.length],
    ['settings', 'Settings', 0],
  ];
  $('tabs').innerHTML = tabs.map(([id, name, n]) => `
    <button class="tab${view.tab === id ? ' on' : ''}" data-tab="${id}">
      ${esc(name)}${n ? `<span class="n">${n}</span>` : ''}
    </button>`).join('');
}

const CONSENT_CLASS = { granted: 'agreed', declined: 'declined', pending: 'waiting', expired: 'waiting' };

function renderPanel() {
  if (!detail) { $('panel').innerHTML = ''; return; }
  const can = status?.actionsEnabled !== false;

  if (view.tab === 'table') {
    const total = detail.roster.reduce((n, p) => n + p.lines, 0) || 1;
    $('panel').innerHTML = `
      <table>
        <thead><tr>
          <th>Player</th><th>Character</th><th class="r">Lines</th><th class="r">Share</th><th class="r">Consent</th>
        </tr></thead>
        <tbody>${detail.roster.map((p) => {
          const pct = Math.round((p.lines / total) * 100);
          const who = p.displayName || `user ${p.userId.slice(0, 4)}…${p.userId.slice(-4)}`;
          return `<tr>
            <td>${esc(who)}</td>
            <td>${p.characterName
                  ? `<span class="prose">${esc(p.characterName)}</span>`
                  : '<span class="unset">not set</span>'}
                ${can ? `<form class="f" style="margin-top:6px" data-act="roster/character"
                          data-campaign="${detail.id}" data-user="${esc(p.userId)}">
                          <input class="in" name="name" size="11" placeholder="character"
                                 value="${esc(p.characterName || '')}" aria-label="Character for ${esc(who)}">
                          <button class="btn sm go" type="submit">Save</button>
                        </form>` : ''}</td>
            <td class="num r">${p.lines ? p.lines.toLocaleString() : '—'}</td>
            <td class="num r"><span class="share${p.lines ? '' : ' none'}"><i style="width:${p.lines ? pct : 0}%"></i></span>${p.lines ? pct + '%' : ''}</td>
            <td class="r ${CONSENT_CLASS[p.consent.state] || 'never'}">${esc(p.consent.label)}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
      ${detail.roster.length ? '' : empty('Nobody at this table yet.')}
      ${can ? '' : DISABLED}`;
    return;
  }

  if (view.tab === 'corrections') {
    $('panel').innerHTML = `
      ${detail.corrections.length ? `<table><tbody>${detail.corrections.map((c) => `
        <tr>
          <td><span class="mono">${esc(c.wrong)}</span> → <b class="prose">${esc(c.right)}</b></td>
          <td class="r">${can ? `<button class="btn sm" data-act="corrections/remove"
            data-campaign="${detail.id}" data-wrong="${esc(c.wrong)}">Remove</button>` : ''}</td>
        </tr>`).join('')}</tbody></table>` : empty('No corrections saved.')}
      ${can ? `<form class="f" style="margin-top:16px" data-act="corrections/add" data-campaign="${detail.id}">
        <input class="in" name="wrong" placeholder="what whisper hears" required aria-label="Misheard text">
        <input class="in" name="right" placeholder="what it should say" required aria-label="Correct text">
        <button class="btn go" type="submit">Add</button>
      </form>` : DISABLED}
      <div class="empty" style="font-style:normal;color:var(--dim);margin-top:12px">
        Applied to every future transcript, and replayed over this campaign's existing ones.
        Removing one stops it applying; lines already rewritten stay as they are.
      </div>`;
    return;
  }

  $('panel').innerHTML = `
    <div class="kv"><span class="k">Campaign</span><span class="v">${esc(detail.label)}</span></div>
    <div class="kv"><span class="k">Sessions read as</span><span class="v">${esc(detail.sessions[0]?.ref || '—')}</span></div>
    <div class="kv"><span class="k">Notes go to</span><span class="v">${esc(detail.output)}</span></div>
    <div class="kv"><span class="k">Managed</span><span class="v">${detail.claimed ? 'yes' : 'unclaimed'}</span></div>
    <div class="kv"><span class="k">At the table</span><span class="v">${detail.roster.length}</span></div>
    <div class="kv"><span class="k">Agreed to be recorded</span><span class="v">${detail.roster.filter((p) => p.consent.mayRecord).length}</span></div>
    <div class="empty" style="font-style:normal;color:var(--dim);margin-top:14px">
      Renaming a campaign, inviting a player and choosing where notes are posted all happen in Discord,
      where the people they concern are: <code>/campaign rename</code>, <code>/campaign invite</code>,
      <code>/campaign output</code>.
    </div>`;
}

const DISABLED =
  '<div class="note">Actions are turned off on this bot — set <code>STATUS_TOKEN</code> in ' +
  '<code>pi-service/.env</code> (and in the dashboard) to act from here.</div>';

// --- notes ---------------------------------------------------------------

const bullets = (title, lines, cls = '') =>
  lines?.length ? `<div><h4>${title}</h4><ul class="${cls}">${lines.map((l) => `<li>${esc(l)}</li>`).join('')}</ul></div>` : '';

function renderNotes() {
  if (!notes) { $('notes').innerHTML = ''; return; }

  const body = notes.unreadable
    ? `<div class="note">These notes are on disk but are not readable — the stored summary is not valid JSON.
         Re-summarising the session will write them again.</div>`
    : !notes.written
      ? empty('This session has not been summarised yet.')
      : `
        <div class="tldr prose">${esc(notes.tldr) || '<i>No recap was written.</i>'}</div>
        ${notes.scenes.map((s) => `
          <div class="scene">
            <h5 class="prose">${esc(s.title)}</h5>
            <ul>${s.points.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>
          </div>`).join('')}
        <div class="cols">
          ${bullets('NPCs introduced', notes.npcsIntroduced)}
          ${bullets('Locations', notes.locationsVisited)}
          ${bullets('Party decisions', notes.partyDecisions)}
          ${bullets('Still unresolved', notes.unresolvedThreads)}
          ${bullets('Loot and rewards', notes.lootAndRewards)}
          ${bullets('Follow-ups', notes.followUps)}
        </div>
        ${bullets('Worth remembering', notes.funnyMoments, 'funny')}`;

  $('notes').innerHTML = `
    <div class="notes">
      <div class="head">
        <span class="label">${esc(notes.ref || `Session ${notes.meetingId}`)} — the notes Quill posted</span>
        <span class="mono" style="color:var(--dim);font-size:12px">${esc(shortDate(notes.startedAt))}${notes.lines ? ` · ${notes.lines.toLocaleString()} lines` : ''}</span>
        <span style="margin-left:auto"><button class="btn sm" data-close-notes>Close</button></span>
      </div>
      ${body}
    </div>`;
}

// --- import --------------------------------------------------------------

function renderImport() {
  $('importbtn').textContent = view.importing ? 'Cancel' : 'Import a recording';
  if (!view.importing || !detail) { $('importform').innerHTML = ''; return; }
  $('importform').innerHTML = `
    <form class="f" style="margin-top:12px" data-act="import" data-campaign="${detail.id}">
      <input class="in" name="url" type="url" required style="flex:1 1 100%"
             placeholder="https://… a link to the audio" aria-label="Link to the recording">
      <input class="in" name="speaker" placeholder="speaker label (default: Table)" size="16" aria-label="Speaker label">
      <button class="btn go" type="submit">Start import</button>
    </form>
    <div class="empty" style="font-style:normal;color:var(--dim);margin-top:10px;font-size:13px">
      For a game played in person, or anything recorded outside Discord. Every line is attributed to one
      label — a single microphone has no per-speaker channels.
    </div>`;
}

// --- painting ------------------------------------------------------------

function paint() {
  renderRail(); renderTop(); renderRecording(); renderSessions();
  renderTabs(); renderPanel(); renderNotes(); renderImport();

  const rec = status?.recording?.length;
  const needs = (status?.campaigns ?? []).reduce((n, c) => n + (c.awaiting || 0), 0);
  document.title = rec ? '● Recording — Quill' : needs ? `(${needs}) Quill` : 'Quill';
}

// --- loading -------------------------------------------------------------

async function get(path) {
  const res = await fetch(`${API}${path}`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function loadCampaign(id) {
  view.campaignId = id;
  view.meetingId = null;
  notes = null;
  try {
    detail = await get(`/campaign?id=${id}`);
  } catch (err) {
    detail = null;
    toast(`Couldn't load that campaign — ${err.message}`, false);
  }
  paint();
}

async function loadNotes(meetingId) {
  view.meetingId = meetingId;
  try {
    notes = await get(`/notes?meeting=${meetingId}`);
  } catch (err) {
    notes = null;
    toast(`Couldn't load those notes — ${err.message}`, false);
  }
  paint();
}

async function tick() {
  try {
    status = await get('/status');
    lastSeen = Date.now();
    document.body.classList.remove('stale');
    $('err').style.display = 'none';

    // Land on something rather than an empty frame: the campaign that needs a
    // decision, else the one played most recently, which is what /status
    // already sorts by.
    if (view.campaignId == null && status.campaigns?.length) {
      const pick = status.campaigns.find((c) => c.awaiting) || status.campaigns.find((c) => c.recording) || status.campaigns[0];
      await loadCampaign(pick.id);
      return;
    }
    // The open campaign's own detail does not come from the poll, so refresh
    // it when the poll says something about it changed.
    const mine = status.campaigns?.find((c) => c.id === view.campaignId);
    if (mine && detail && (mine.sessions !== detail.sessions.length || mine.awaiting !== countAwaiting())) {
      detail = await get(`/campaign?id=${view.campaignId}`).catch(() => detail);
    }
    paint();
  } catch (err) {
    // The bot being unreachable is itself information. The page dims as well
    // as saying so: a dashboard confidently showing "not recording" while it
    // has no idea is worse than one that admits it lost contact.
    document.body.classList.add('stale');
    document.title = 'Quill — offline';
    $('err').style.display = 'block';
    $('err').innerHTML = `Can't reach the bot at <code>${esc(API)}</code> — ${esc(err.message)}.
      Showing what it last said, ${esc(sinceLastSeen())}.`;
  }
}

const countAwaiting = () =>
  (detail?.sessions ?? []).filter((s) => s.job?.status === 'awaiting_approval').length;

// --- acting --------------------------------------------------------------

let toastTimer = null;
function toast(message, ok) {
  const el = $('toast');
  el.textContent = message;
  el.className = `toast show ${ok ? 'good' : 'bad'}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, ok ? 4500 : 9000);
}

async function send(action, body) {
  try {
    const res = await fetch(`${API}/actions/${action}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const payload = await res.json().catch(() => ({}));
    toast(payload.message || `HTTP ${res.status}`, res.ok && payload.ok !== false);
  } catch (err) {
    toast(`Couldn't reach the bot — ${err.message}`, false);
    return;
  }
  // Straight to a refresh rather than waiting for the next poll: the whole
  // point of pressing the button is to watch the thing move.
  status = await get('/status').catch(() => status);
  if (view.campaignId) detail = await get(`/campaign?id=${view.campaignId}`).catch(() => detail);
  if (view.meetingId) notes = await get(`/notes?meeting=${view.meetingId}`).catch(() => notes);
  paint();
}

// The transcript needs the auth header, which a plain <a href> cannot carry —
// so it is fetched and handed to the browser as a blob rather than linked.
async function downloadTranscript(meetingId) {
  try {
    const res = await fetch(`${API}/transcript?meeting=${meetingId}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement('a');
    a.href = url;
    a.download = `session-${meetingId}-transcript.txt`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (err) {
    toast(`Couldn't fetch that transcript — ${err.message}`, false);
  }
}

// One listener for the whole page rather than one per render. Everything here
// is rebuilt from the poll every few seconds, so a handler attached to a
// button would be thrown away with it — and a click landing in the gap between
// two renders would do nothing at all.
document.addEventListener('click', async (event) => {
  const t = event.target;

  if (t.closest('[data-close-notes]')) { notes = null; view.meetingId = null; return paint(); }

  const camp = t.closest('[data-campaign][class~="camp"]');
  if (camp) return loadCampaign(Number(camp.dataset.campaign));

  const tab = t.closest('[data-tab]');
  if (tab) { view.tab = tab.dataset.tab; return paint(); }

  if (t.closest('#importbtn')) { view.importing = !view.importing; return renderImport(); }

  const dl = t.closest('button[data-download]');
  if (dl) return downloadTranscript(dl.dataset.download);

  const sess = t.closest('.sess[data-session]');
  if (sess && !t.closest('button') && !t.closest('form')) {
    const id = Number(sess.dataset.session);
    return id === view.meetingId ? (notes = null, view.meetingId = null, paint()) : loadNotes(id);
  }

  const btn = t.closest('button[data-act]');
  if (!btn || btn.disabled || btn.type === 'submit') return;
  if (btn.dataset.confirm && !confirm(btn.dataset.confirm)) return;

  const d = btn.dataset;
  const body = {};
  if (d.job) body.jobId = Number(d.job);
  if (d.meeting) body.meetingId = Number(d.meeting);
  if (d.campaign) body.campaignId = Number(d.campaign);
  if (d.user) body.userId = d.user;
  if (d.wrong) body.wrong = d.wrong;
  if (d.provider) body.provider = d.provider;
  if (d.action) body.action = d.action;
  if (d.queue) body.queue = d.queue;
  if (d.paused) body.paused = d.paused === 'true';

  const was = btn.textContent;
  btn.disabled = true; btn.textContent = '…';
  await send(d.act, body);
  btn.disabled = false; btn.textContent = was;
});

// Forms wherever there is something to type: Enter-to-submit and required-field
// validation for free, and both matter for the things typed most often here.
document.addEventListener('submit', async (event) => {
  const form = event.target.closest('form[data-act]');
  if (!form) return;
  event.preventDefault();

  const body = Object.fromEntries(new FormData(form));
  if (form.dataset.campaign) body.campaignId = Number(form.dataset.campaign);
  if (form.dataset.user) body.userId = form.dataset.user;

  const submit = form.querySelector('button[type=submit]');
  if (submit) submit.disabled = true;
  if (form.dataset.act === 'import') view.importing = false;
  await send(form.dataset.act, body);
  if (submit) submit.disabled = false;
});

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    if (notes) { notes = null; view.meetingId = null; return paint(); }
    if (view.importing) { view.importing = false; return renderImport(); }
    return;
  }
  const hit = event.target.closest?.('.camp[data-campaign], .sess[data-session]');
  if (hit && (event.key === 'Enter' || event.key === ' ')) {
    event.preventDefault();
    if (hit.dataset.campaign) return loadCampaign(Number(hit.dataset.campaign));
    return loadNotes(Number(hit.dataset.session));
  }
});

// The timer and the "last seen" age tick on their own second, so both keep
// counting between polls rather than jumping every five.
setInterval(() => {
  const stamp = $('stamp');
  if (stamp) stamp.textContent = `seen ${sinceLastSeen()}`;

  const live = status?.recording?.find(
    (r) => r.guildId === status?.campaigns?.find((c) => c.id === view.campaignId)?.guildId
  );
  const el = $('timer');
  if (el && live && lastSeen) el.textContent = hhmmss(live.recordingForMs + (Date.now() - lastSeen));
}, 1000);

tick();
setInterval(tick, 5000);
</script>
</body>
</html>
