<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quill</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Cpath d='M20.5 2.6c-7 .9-11.8 5-14 11.4l-1.7 4.9 4.8-1.7C16 15 20 10.2 20.5 2.6Z' stroke='%23C9A227' stroke-width='1.3' stroke-linejoin='round'/%3E%3Cpath d='M5.1 19.6 2.6 22.2' stroke='%23C9A227' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- The landing page's three faces, now the tool's as well. Fraunces sets the
     headings, Newsreader carries both the summariser's prose and the interface
     text, and Spline Sans Mono takes anything read as a value - clocks, counts,
     refs, and every button. The gate used to load these separately to stay in
     the landing page's world; the whole dashboard lives there now, so they load
     once, up front. Every one has a system fallback, because a LAN dashboard
     pointed at a Raspberry Pi is opened from machines with no internet. -->
<link rel="stylesheet" href="/dash/fonts/fonts.css">

<!-- Theme before paint. Reading it here rather than in the app script keeps a
     dark-theme reader from being flashed a page of white paper while the rest
     of the file parses. "auto" is stored as no attribute at all, so the media
     query in the stylesheet is what answers. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('quill-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<!-- The ?v= is the commit the files last changed in. Cloudflare had kept
     these for four hours on 2026-09-27 and a phone went on running the old
     dashboard after a deploy; nginx now sends no-cache for /dash/, so this
     only needed changing once, to walk past the copies already held. -->
<link rel="stylesheet" href="/dash/app.css?v=0929f9a">
</head>
<body>

<div class="app">
  <!-- The account, hung off the mark at the end of the top bar. -->
  <div id="sheet"></div>

  <main class="main">
    <header class="top" id="top"></header>
    <div id="banner"></div>
    <div id="screen" class="split"></div>
  </main>
</div>

<div id="modal"></div>
<!-- Every answer this page gives arrives here — the confirmation, the
     refusal, the "can't reach the bot". Without a live region a screen
     reader is told none of it: you press Approve and nothing is announced
     either way, which makes the whole outcome channel of the tool silent.
     gatehouse.html has had this since it was written; this page just never
     got it.

     role="status" already implies polite and atomic; both are spelled out
     anyway, the way the gatehouse spells out aria-live, because older
     assistive tech does not always infer them.

     Deliberately ONE static region rather than swapping in role="alert" for
     the offline notice. Changing role at the same moment as the text is a
     reliable way to have the announcement dropped entirely — screen readers
     read a live region's configuration when it is registered, not when it
     changes. A failure already sits on screen for 9s against a success's
     4.5s (see toast()), which is what actually gives it the longer hearing. -->
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- What is under a name, without going to look. Outside every panel the
     patcher touches, because it is anchored to a element inside one and
     would be thrown away with it. See peekAt(). -->
<div class="peek" id="peek" role="tooltip" hidden></div>

<!-- morph.js patches a panel instead of replacing it, so a poll that lands
     while somebody is typing does not take their caret. The ten scripts after
     it are the dashboard itself, split out of this file on 2026-09-27 without
     changing a line (see ADR-0002). All classic scripts sharing one global
     scope, loaded in order, with no build step. nginx serves them from
     `location /dash/`, which is open like /app/ because they hold no data. -->
<script src="/dash/morph.js"></script>
<script src="/dash/app/01-core.js?v=0929f9a"></script>
<script src="/dash/app/02-names.js?v=0929f9a"></script>
<script src="/dash/app/03-chrome.js?v=0929f9a"></script>
<script src="/dash/app/04-screens.js?v=0929f9a"></script>
<script src="/dash/app/05-threshold.js?v=0929f9a"></script>
<script src="/dash/app/06-campaign.js?v=0929f9a"></script>
<script src="/dash/app/07-tabs.js?v=0929f9a"></script>
<script src="/dash/app/08-readers.js?v=0929f9a"></script>
<script src="/dash/app/09-paint.js?v=0929f9a"></script>
<script src="/dash/app/10-act.js?v=0929f9a"></script>
</body>
</html>
