function renderTop() {
  const h = status?.health ?? {};

  if (view.screen === 'transcript') {
    $('top').innerHTML = `
      ${homeMark}
      <span class="crumb">${esc(script?.campaign || '')}</span>
      <span class="crumb-sep">/</span>
      <span class="crumb">Session ${script?.sessionNumber ?? ''}</span>
      <span class="crumb-sep">/</span>
      <h2>Transcript</h2>
      <div class="right">
        ${script ? `
          <button class="btn" data-copy-transcript>Copy all</button>
          <button class="btn" data-download="${script.meetingId}">Download .txt</button>
          ${script.total && can()
            ? `<button type="button" class="btn go" data-act="summary/again" data-meeting="${script.meetingId}"
                 data-confirm="Write the notes for ${esc(script.ref)} again?">Summarise this</button>`
            : ''}` : ''}
        ${themeSwitch()}
        <button class="btn ghost" data-screen="campaign">Close</button>
      </div>`;
    return;
  }

  // On the campaigns page the mark stands alone and the title is the product.
  // Everywhere else the mark is the first step of a crumb, so the way back to
  // the campaigns is a word as well as an icon.
  const home = view.screen === 'campaigns';
  const title =
    home ? 'Quill'
    : view.screen === 'servers' ? 'Servers'
    : view.screen === 'models' ? 'Models'
    : view.screen === 'access' ? 'Access'
    : campaign()?.name || campaign()?.channel || (status?.campaigns?.length ? 'Quill' : 'Setup');

  // Below dev the health line names nothing. Which transcriber, which model
  // and whose GPU are facts about the owner's machine and their bill; whether
  // the bot can currently turn speech into notes at all is not, and it is the
  // answer to "why hasn't last night appeared".
  const health = !status
    ? ''
    : cap('models')
      ? [
          `<span class="${h.whisperServer === false ? 'down' : ''}">${dotFor(h.whisperServer)}whisper server</span>`,
          `<span class="${h.summariser === false ? 'down' : ''}">${dotFor(h.summariser)}${esc(h.summariserName || 'summariser')}</span>`,
          h.transcribePaused ? '<span class="held"><span class="dot warn"></span>transcribing paused</span>' : '',
          h.summarisePaused ? '<span class="held"><span class="dot warn"></span>summarising paused</span>' : '',
        ].filter(Boolean).join('')
      : `<span class="${h.working === false ? 'down' : ''}">${dotFor(h.working)}${
          h.working === false ? 'writing up is delayed' : h.paused ? 'writing up is paused' : 'writing up is working'
        }</span>`;

  // Each button says the state it moves TO, so it is the same click whatever
  // the page last managed to render — a toggle sent twice by a double-click,
  // or by two tabs open on this page, lands on the opposite of what the person
  // who clicked it saw.
  const buttons = can() && cap('machinery') && status
    ? `<button type="button" class="btn" data-act="pause" data-queue="transcribe" data-paused="${!h.transcribePaused}"
         ${h.transcribePaused ? '' : 'data-confirm="Pause transcription? Nothing new will start."'}>
         ${h.transcribePaused ? 'Resume transcribing' : 'Pause transcribing'}</button>
       <button type="button" class="btn" data-act="pause" data-queue="summarize" data-paused="${!h.summarisePaused}"
         ${h.summarisePaused ? '' : 'data-confirm="Pause summarising? Nothing new will start."'}>
         ${h.summarisePaused ? 'Resume summarising' : 'Pause summarising'}</button>`
    : '';

  $('top').innerHTML = `
    ${homeMark}
    ${home ? '' : `<button type="button" class="crumb crumb-back" data-screen="campaigns">Campaigns</button>
                        <span class="crumb-sep">/</span>`}
    <h2>${esc(title)}</h2>
    <div class="health">${health}</div>
    <div class="right">${buttons}${themeSwitch()}${navMarks()}</div>`;
}

// ==========================================================================
// The banner — the transcriber being unreachable, said once, at the top
// ==========================================================================

function renderBanner() {
  const h = status?.health ?? {};
  // The degraded banner is a machine problem with a machine fix, and every
  // control on it belongs to whoever owns the machine.
  if (!status || !cap('machinery') || h.whisperServer !== false || view.screen === 'transcript') {
    $('banner').innerHTML = '';
    return;
  }

  const held = (status.queue?.queuedTranscribe?.length ?? 0) + (status.working?.transcribing?.length ?? 0);

  $('banner').innerHTML = `
    <div class="banner">
      <span class="dot bad" style="width:10px;height:10px;flex:0 0 10px"></span>
      <div style="flex:1">
        <div class="say">Quill cannot reach the transcriber on your PC.</div>
        <div class="why">
          Nothing is lost — recording, consent DMs and slash commands all still work.
          ${held ? `${plural(held, 'session')} ${held === 1 ? 'is' : 'are'} held until the machine comes back.` : ''}
          ${h.checkedAt ? `Last checked ${esc(since(new Date(h.checkedAt).getTime()))}.` : ''}
        </div>
      </div>
      <div class="row-btns">
        ${can() ? '<button type="button" class="btn danger" data-act="health/probe">Try again now</button>' : ''}
        <button class="btn ghost" data-diagnose>${view.diagnosing ? 'Hide the detail' : 'What is held'}</button>
      </div>
    </div>
    ${view.diagnosing ? diagnosis() : ''}`;
}

function diagnosis() {
  const q = status?.queue ?? {};
  const rows = [
    ...(status?.working?.transcribing ?? []).map((t) => ({ what: `Session #${t.meetingId}`, sub: t.description, tag: 'stopped' })),
    ...(q.queuedTranscribe ?? []).map((j) => ({ what: `Session #${j.meetingId}`, sub: `${plural(j.utterances, 'clip')} on disk`, tag: 'held' })),
    ...(q.awaitingTranscribe ?? []).map((j) => ({ what: `Session #${j.meetingId}`, sub: 'waiting on you, not the PC', tag: 'ready' })),
    ...(q.awaitingSummary ?? []).map((j) => ({ what: `Session #${j.meetingId}`, sub: 'already transcribed · waiting on you', tag: 'ready' })),
  ];

  return `
    <div class="banner-more">
      <div style="flex:1;min-width:280px">
        <div class="cap">The queue right now</div>
        ${rows.length ? `<div class="steps" style="margin-top:16px">${rows.map((r) => `
          <div>
            <div style="flex:1">
              <div class="what">${esc(r.what)}</div>
              <div class="sub">${esc(r.sub ?? '')}</div>
            </div>
            <span class="mono" style="font-size:11px;color:${r.tag === 'ready' ? 'var(--sage-lit)' : 'var(--brass-lit)'}">${r.tag}</span>
          </div>`).join('')}</div>` : '<div class="quiet" style="margin-top:12px">Nothing is queued.</div>'}
        <div class="quiet" style="margin-top:20px;max-width:70ch">
          Nothing expires while the transcriber is away. Audio is only deleted once a transcript exists,
          so every held session still has its clips.
        </div>
      </div>
      <div class="aside">
        <div class="card">
          <div class="cap">The transcriber</div>
          <div class="mono" style="font-size:12.5px;color:var(--text-2);margin-top:12px;line-height:1.9">
            ${esc(status?.health?.whisperServerHost || 'no WHISPER_SERVER_URL set')}<br>
            <span style="color:var(--red-lit)">no reply</span><br>
            checked ${esc(status?.health?.checkedAt ? since(new Date(status.health.checkedAt).getTime()) : 'never')}
          </div>
          <div class="quiet" style="margin-top:12px">
            Nearly always the PC being asleep. Wake it, then press “Try again now”.
          </div>
        </div>
        <div class="card">
          <div class="cap">Still working</div>
          <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px;font-size:13.5px;color:var(--text-2)">
            <div><span class="dot ok"></span> Recording voice channels</div>
            <div><span class="dot ok"></span> Consent DMs</div>
            <div><span class="dot ok"></span> Slash commands</div>
            <div><span class="dot ${status?.health?.summariser === false ? 'bad' : 'ok'}"></span> Summarising, once a transcript exists</div>
          </div>
        </div>
      </div>
    </div>`;
}

// Signing in.
//
// One step and no password. You press the button, Discord asks you, and you
// come back. Discord's answer is exactly as strong as "you control that
// account", and that is the only identity this bot has ever had a use for.
//
// This screen used to be two steps: you typed the Discord name the bot knew
// you by, it DMed you six digits, you typed those back. Everything about that
// was a reimplementation of something Discord already does — including the
// three ways it could fail that had nothing to do with you (the bot not
// sharing a server with you, the name typed a shade wrong, DMs turned off for
// the server), none of which exist here.
// The landing page's typefaces, fetched the first time the gate is drawn.
// Kept out of <head> because this is the only screen that uses them and most
// visits here never see it — a signed-in operator should not pay for three
// families they will never render.
let gateFontsAsked = false;
function loadGateFonts() {
  if (gateFontsAsked) return;
  gateFontsAsked = true;
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href =
    'https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1' +
    '&family=Newsreader:opsz,wght@6..72,300..600' +
    '&family=Spline+Sans+Mono:wght@400;500&display=swap';
  document.head.appendChild(link);
}

// What a sign-in can fail on, said in words rather than in the five the server
// puts on the end of the URL. The reason travels as a fragment because the
// callback is a redirect and has no body to put it in — see auth-routes.js.
const SIGNIN_TROUBLE = {
  denied: 'You told Discord no, so nothing happened. Nothing of yours was shared and you are not signed in.',
  state: 'That sign-in had gone stale — they only last ten minutes. Press the button again and it will work.',
  discord: 'Discord did not finish the sign-in. That is usually momentary; try again.',
  config: 'This bot is not set up for Discord sign-in yet, so there is nothing to sign in to.',
  notinvited: 'Discord knows you, but this bot does not have you on its list yet. Whoever runs it can add you.',
  secret: 'This bot has no key to sign sessions with, so it cannot keep you signed in.',
};

function signInScreen() {
  loadGateFonts();

  return `
    <div class="gate">
      <div class="gate-inner">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20.5 2.6c-7 .9-11.8 5-14 11.4l-1.7 4.9 4.8-1.7C16 15 20 10.2 20.5 2.6Z" stroke="#2434A8" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M5.1 19.6 2.6 22.2" stroke="#2434A8" stroke-width="1.5" stroke-linecap="round"/>
        </svg>

        <p class="gate-eyebrow">One step</p>
        <h1>Sign in to Quill.</h1>

        <p class="gate-say">
          Quill asks Discord who you are — nothing else. There is no password to set, no username to
          spell right and no code to wait for; you say yes on Discord&rsquo;s own screen and come
          straight back here.
        </p>

        ${me && !me.signInAvailable ? `
          <p class="gate-msg bad">
            This bot is not set up for Discord sign-in, so nobody can sign in yet.
            Set <code>${esc(me.signInMissing ?? 'DISCORD_CLIENT_SECRET')}</code> in <code>pi-service/.env</code>.
          </p>` : `
          <div class="gate-btns">
            <a class="gate-btn discord" href="${API}/auth/discord">
              <svg width="21" height="16" viewBox="0 0 71 55" fill="currentColor" aria-hidden="true">

        ${login.message
          ? `<p class="gate-msg${login.failed ? ' bad' : ''}">${esc(login.message)}</p>`
          : ''}

        ${me?.loginRequired ? '' : `
          <div class="gate-btns">
            <button class="gate-btn plain" type="button" data-signin-cancel>Not now — keep looking as the operator</button>
          </div>`}

          your servers, and nothing it could ever post or change on your behalf. It keeps your Discord
          id and the name attached to it, and nothing else — what you can see is worked out from what
          that account owns, runs and plays in.

}

function renderScreen() {
  const el = $('screen');

  const arriving = Date.now() < entersUntil ? 'arriving' : '';

  // Nobody home. Shown instead of the app rather than over it: a dashboard
  // that renders its chrome and then refuses every request is a worse way to
  // learn you are signed out than being asked to sign in.
  // Sign-in is shown when this install demands it, and also when somebody
  // asks for it. Without the second case there was no way to sign in at all
  // while DASHBOARD_REQUIRE_LOGIN was off — which made the one safe order
  // for turning it on (sign in first, so you cannot lock yourself out)
  // impossible to follow.
  // Toggled here rather than in paint() so the class and the screen can never
  // disagree: whatever this function decides to draw is what the body is
  // dressed for. body.gate-open folds away the top bar and turns the page to
  // paper, because the gate is a full-page takeover in the landing
  // page's world rather than a card floating in the dark tool.
  const gateOpen = Boolean(me && !me.signedIn && (me.loginRequired || view.signingIn));
  document.body.classList.toggle('gate-open', gateOpen);

  if (gateOpen) {
    el.className = '';
    el.innerHTML = signInScreen();
    return;
  }

  // The front door. Answered before the campaign screens because it is where
  // the page starts and where every other screen goes back to.
  if (view.screen === 'campaigns' && status?.campaigns?.length) {
    el.className = arriving;
    el.innerHTML = campaignsScreen();
    return;
  }

  if (view.screen === 'transcript') { el.className = 'split'; el.innerHTML = transcriptScreen(); return; }
  if (view.screen === 'servers')    { el.className = arriving; el.innerHTML = serversScreen(); return; }
  if (view.screen === 'models')     { el.className = arriving; el.innerHTML = modelsScreen(); return; }
  if (view.screen === 'access')     { el.className = arriving; el.innerHTML = accessScreen(); return; }

  if (status && !status.campaigns?.length) { el.className = ''; el.innerHTML = firstRun(); return; }

  el.className = `split ${arriving}`.trim();
  el.innerHTML = `
    <div class="sessions">
      <div class="shelf-slider ${view.shelfPicking ? 'picking' : 'picked'}">
        <div class="shelf-page chooser" ${view.shelfPicking ? '' : 'aria-hidden="true"'}>
          ${shelfChooser()}
        </div>
        <div class="shelf-page list" ${view.shelfPicking ? 'aria-hidden="true"' : ''}>
          ${shelfHeader()}
          ${columnList()}
          ${view.shelf === 'sessions' && cap('machinery') ? `
            <div class="foot">
              <button class="btn wide" data-import>${detail?.sessions?.length ? 'Import a recording' : 'Import a recording instead'}</button>
            </div>` : ''}
        </div>
      </div>
    </div>
    <div class="pane">
      <div class="pane-main">
        ${tabsBar()}
        ${paneBody()}
      </div>
      ${view.tab === 'notes' && view.shelf === 'sessions' ? factsRail() : ''}
    </div>`;
}

// --- the first run ---------------------------------------------------------

function firstRun() {

  return `
    <div class="center">
      <div class="kicker">Nothing has been recorded yet</div>
      <h1 class="display" style="font-size:44px;margin-top:18px">Quill is on your server and listening for a table.</h1>
      <div class="say-2" style="font-size:16px">Four things to do once, then it runs on its own.</div>
      <div class="steps" style="margin-top:36px">
        <div>
          <span class="mark done">✓</span>
          <div style="flex:1">
            <div class="what">Quill is signed in${status?.servers?.length ? ` on ${plural(status.servers.length, 'server')}` : ''}</div>
            <div class="sub">${esc(status?.bot?.user || 'connecting…')}${status?.bot?.uptimeMs ? ` · ${uptime(status.bot.uptimeMs)}` : ''}</div>
          </div>
        </div>
        <div class="now">
          <span class="mark" style="border-color:var(--brass);color:var(--brass)">2</span>
          <div style="flex:1">
            <div class="what" style="font-weight:500">Make a campaign</div>
            <div class="sub" style="font-family:var(--sans);font-size:13px">One per game. It holds the roster, the corrections and every session.</div>
          </div>
          ${canCreate()
            ? `<button type="button" class="btn sm go" data-new-campaign>New campaign</button>`
            : `<code>/campaign create</code>`}
        </div>
        <div>
          <span class="mark">3</span>
          <div style="flex:1">
            <div class="what" style="color:var(--dim)">Point it at a voice channel</div>
            <div class="sub" style="font-family:var(--sans);font-size:13px">Quill joins when two of you are in it, and leaves when the last one goes.</div>
          </div>
          <code>/join</code>
        </div>
        <div>
          <span class="mark">4</span>
          <div style="flex:1">
            <div class="what" style="color:var(--dim)">Ask the table</div>
            <div class="sub" style="font-family:var(--sans);font-size:13px">Nobody is recorded until they say yes in a DM.</div>
          </div>
          <code>/campaign invite</code>
        </div>
      </div>
      <div class="quiet" style="margin-top:26px">
        The transcriber runs on your own machine —
        ${h.whisperServer === false ? 'Quill cannot reach it right now.' : h.whisperServer ? 'Quill can reach it.' : 'Quill has not checked yet.'}
        Audio never leaves your network.
      </div>
    </div>`;
}

// ==========================================================================
// The session column
// ==========================================================================

const PILL_WORD = { posted: 'posted', approval: 'approval', failed: 'failed',
                    recording: 'recording', queued: 'queued', working: 'working' };

// What the third tab is called depends on what the column is listing, because
// that tab IS the reading pane — a session's write-up, or whoever you just
// picked out of the campaign.
const READING_NAME = {
  sessions: 'Notes',
  npcs: 'NPC',
  places: 'Place',
  items: 'Item',
};

const SHELVES = [
  ['sessions', 'Sessions'],
  ['npcs', 'NPCs'],
  ['places', 'Places'],
  ['items', 'Items'],
];

const shelfCount = (id) => {
  if (id === 'sessions') return detail?.sessions?.length ?? 0;
  if (!compendium || compendium.campaignId !== view.campaignId || compendium.loading) return null;
  const list = id === 'npcs' ? compendium.npcs : id === 'places' ? compendium.places : compendium.items;
  return (list ?? []).length;
};

// Four ways into the same campaign, in the column that used to only ever hold
// sessions. Picking one collapses the other three sideways to nothing and
// leaves the choice sitting where the row was; clicking it again brings them
// back. The same gesture as the campaign rail, one level in.
// The column, one level in from the campaign rail and behaving the same way.
// It holds two pages side by side in a clipped frame: the list of the four
// things this campaign has, and whichever of them you picked. Choosing slides
// the chooser off to the left and the list in behind it; the header it leaves
// is the way back.

function shelfChooser() {
  const meta = {
    sessions: 'every night written up',
    npcs: 'everyone the party met',
    places: 'everywhere they went',
    items: 'what they came away with',
  };
  return `
    <div class="head"><div class="cap">This campaign</div></div>
    <div class="sess-list">
      ${SHELVES.map(([id, name]) => {
        const count = shelfCount(id);
        return `<button type="button" class="shelf-row${view.shelf === id ? ' on' : ''}" data-shelf="${id}">
          <div class="l1">
            <span class="nm">${esc(name)}</span>
            ${count == null ? '' : `<span class="n">${count}</span>`}
          </div>
          <div class="meta">${meta[id]}</div>
        </button>`;
      }).join('')}
    </div>`;
}

function shelfHeader() {
  const name = SHELVES.find(([id]) => id === view.shelf)?.[1] ?? '';
  const count = shelfCount(view.shelf);
  const order = view.shelf === 'sessions' ? 'newest first' : 'first seen first';
  return `
    <div class="head">
      <button type="button" class="shelf-back" data-shelf-back
              aria-label="Back to what this campaign holds">
        <span class="arw" aria-hidden="true">←</span>${esc(name)}${
          count == null ? '' : `<span class="n">${count}</span>`}
      </button>
      ${count ? `<span class="hint" style="margin-left:auto">${order}</span>` : ''}
    </div>`;
}

function columnList() {
  if (view.shelf === 'sessions') return sessionColumn();

  if (!compendium || compendium.campaignId !== view.campaignId) {
    buildCompendium();
    return '<div class="empty"><div class="quiet">Reading back through the campaign…</div></div>';
  }
  if (compendium.loading) {
    return '<div class="empty"><div class="quiet">Reading back through the campaign…</div></div>';
  }
  if (compendium.error) {
    return `<div class="empty">
      <div class="say">That did not read back.</div>
      <div class="quiet">${esc(compendium.error)}</div>
      <button type="button" class="btn sm" data-rebuild-compendium>Try again</button>
    </div>`;
  }

  if (view.shelf === 'items') {
    const items = compendium.items ?? [];
    if (!items.length) return `<div class="empty"><div class="say">Nothing found yet.</div>
      <div class="quiet">Loot and rewards named in a write-up collect here.</div></div>`;
    return `<div class="sess-list">${items.map((row, i) => `
      <button class="sess${view.entry === `items:${i}` ? ' on' : ''}" data-entry="items:${i}">
        <div class="say" style="margin-top:0">${esc(trim(row.text, 130))}</div>
        <div class="facets"><span>${esc(row.session.ref || `Session ${row.session.sessionNumber}`)}</span></div>
      </button>`).join('')}</div>`;
  }

  const list = compendium[view.shelf] ?? [];
  if (!list.length) {
    const say = view.shelf === 'npcs'
      ? ['Nobody yet.', 'Everyone a write-up names collects here.']
      : ['Nowhere yet.', 'Everywhere a write-up names collects here.'];
    return `<div class="empty"><div class="say">${say[0]}</div><div class="quiet">${say[1]}</div></div>`;
  }

  return `<div class="sess-list">${list.map((e) => `
    <button class="sess${view.entry === `${view.shelf}:${e.key}` ? ' on' : ''}"
            data-entry="${view.shelf}:${esc(e.key)}">
      <div class="l1"><span class="ref">${esc(e.name)}</span>
        <span class="when">${esc(e.first.ref || `Session ${e.first.sessionNumber}`)}</span></div>
      ${e.said[0] ? `<div class="say">${esc(trim(e.said[0].text, 120))}</div>` : ''}
      ${e.asides.length || e.seen.length > 1 ? `<div class="facets">
        ${e.seen.length > 1 ? `<span>${plural(e.seen.length, 'session')}</span>` : ''}
        ${e.asides.length ? `<span>${plural(e.asides.length, 'aside')}</span>` : ''}
      </div>` : ''}
    </button>`).join('')}</div>`;
}

// The reading pane, when what you picked was not a session.
function entryPane() {
  if (!compendium || compendium.campaignId !== view.campaignId || compendium.loading) {
    return '<div class="quiet" style="padding-top:30px">Reading back through the campaign…</div>';
  }

  const [kind, key] = String(view.entry ?? '').split(/:(.*)/);
  if (kind !== view.shelf || key == null || key === '') {
    const what = { npcs: 'somebody', places: 'somewhere', items: 'something' }[view.shelf] || 'something';
    return `
      <div class="kicker" style="margin-top:26px">${esc(READING_NAME[view.shelf] || '')}</div>
      <h1 class="display sm" style="margin-top:12px">Pick ${what} on the left.</h1>
      <div class="say-2">
        Nothing here was written for this page — every line is what the summariser said at the time,
        gathered out of ${plural(compendium.story?.length ?? 0, 'write-up')}.
      </div>`;
  }

  if (kind === 'items') {
    const row = (compendium.items ?? [])[Number(key)];
    if (!row) return '<div class="quiet" style="padding-top:30px">That item is no longer in the notes.</div>';
    return `
      <div class="kicker" style="margin-top:26px">Item</div>
      <h1 class="display sm" style="margin-top:12px;max-width:22ch">${esc(row.text)}</h1>
      <div class="say-2">
        Written down in ${esc(row.session.ref || `Session ${row.session.sessionNumber}`)},
        ${esc(longDate(row.session.startedAt))}.
      </div>
      <div class="comp-bar">
        <button type="button" class="btn sm" data-session="${row.session.meetingId}">Open that session</button>
      </div>`;
  }

  const e = (compendium[kind] ?? []).find((x) => x.key === key);
  if (!e) return '<div class="quiet" style="padding-top:30px">That entry is no longer in the notes.</div>';

  return `
    <div class="kicker" style="margin-top:26px">${kind === 'places' ? 'Place' : 'NPC'}</div>
    <h1 class="display sm" style="margin-top:12px">${esc(e.name)}</h1>
    <div class="say-2">
      ${kind === 'places' ? 'First gone to in' : 'First met in'}
      ${esc(e.first.ref || `Session ${e.first.sessionNumber}`)}, ${esc(longDate(e.first.startedAt))}.
      ${e.seen.length > 1 ? `Named again in ${e.seen.slice(1).map((x) => esc(x.ref || `Session ${x.sessionNumber}`)).join(', ')}.` : ''}
    </div>

    ${e.said.length ? `
      <div class="cap" style="margin:38px 0 14px">What the write-ups say</div>
      <div class="entry-said" style="max-width:70ch">
        ${e.said.map((pt) => `
          <div class="point${e.said.length > 1 ? '' : ' bare'}">
            ${e.said.length > 1 ? `<span class="s">${esc(String(pt.session.sessionNumber ?? ''))}</span>` : ''}
            <span class="p">${esc(pt.text)}</span>
          </div>`).join('')}
      </div>` : ''}

    ${e.asides.length ? `
      <div class="cap" style="margin:38px 0 14px">Worth remembering</div>
      <div style="max-width:70ch">
        ${e.asides.map((a) => `<div class="entry-aside">${esc(a.text)}</div>`).join('')}
      </div>` : ''}

    <div class="comp-bar">
      ${e.seen.map((x) => `<button type="button" class="btn sm" data-session="${x.meetingId}">
        Open ${esc(x.ref || `Session ${x.sessionNumber}`)}</button>`).join('')}
    </div>`;
}

function sessionColumn() {
  const list = sessions();
  if (!list.length) {
    return `
      <div class="empty">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" style="opacity:.5" aria-hidden="true">
          <path d="M20.5 2.6c-7 .9-11.8 5-14 11.4l-1.7 4.9 4.8-1.7C16 15 20 10.2 20.5 2.6Z" stroke="#8A8578" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M5.1 19.6 2.6 22.2" stroke="#8A8578" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <div class="say">Nothing here until you play.</div>
        <div class="quiet">
          Two of you in <span class="mono" style="color:var(--text-2)">${esc(detail?.channel || 'the voice channel')}</span>
          is enough — Quill joins on its own and this fills in.
        </div>
      </div>`;
  }
  return `<div class="sess-list">${list.map(sessionCard).join('')}</div>`;
}

function sessionCard(s) {
  const facets = [
    s.npcs ? plural(s.npcs, 'NPC') : '',
    s.locations ? plural(s.locations, 'location') : '',
    s.threads ? `${plural(s.threads, 'thread')} open` : '',
  ].filter(Boolean);

  const when = [
    shortDate(s.startedAt),
    s.lines ? `${n(s.lines)} lines` : s.state === 'recording' ? 'recording' : 'no audio',
  ].filter(Boolean).join(' · ');

  // One line about the session, in the summariser's own words where they
  // exist. Where they do not, the state is the sentence — which is the whole
  // reason the column is readable at a glance.
  const say = s.tldr
    ? `<div class="say">${esc(trim(s.tldr, 190))}</div>`
    : s.state === 'failed'   ? '<div class="plain">No usable audio in this session.</div>'
    : s.state === 'approval' && s.job?.type === 'summarize'
      ? '<div class="plain">Transcript is ready. Nothing has been summarised or posted yet.</div>'
    : s.state === 'approval' ? '<div class="plain">Waiting for you to say when it may transcribe.</div>'
    : s.state === 'working'  ? '<div class="plain">Being worked on now.</div>'
    : s.state === 'queued'   ? '<div class="plain">In the queue.</div>'
    : '';

  const flags = [
    view.meetingId === s.meetingId ? 'on' : '',
    s.state === 'failed' ? 'failed dead' : '',
    s.state === 'approval' ? 'needs' : '',
  ].filter(Boolean).join(' ');

  return `
    <button class="sess ${flags}" data-session="${s.meetingId}">
      <div class="l1">
        <span class="ref">${esc(s.ref || `#${s.meetingId}`)}</span>
        <span class="when">${esc(when)}</span>
        <span class="pill ${s.state}">${esc(PILL_WORD[s.state] || s.state)}</span>
      </div>
      ${say}
      ${facets.length ? `<div class="facets">${facets.map((f) => `<span>${esc(f)}</span>`).join('')}</div>` : ''}
    </button>`;
}

const trim = (s, max) =>
  s.length > max ? `${s.slice(0, max).replace(/\s+\S*$/, '')}…` : s;

// ==========================================================================
// The pane: four tabs, and the session reader under "Notes"
// ==========================================================================

function tabsBar() {
  if (!detail) return '';
  const tabs = [
    ['table', 'The table', detail.roster.length],
    ['corrections', 'Corrections', detail.corrections.length],
    ['notes', READING_NAME[view.shelf] || 'Notes', 0],
    ['settings', 'Settings', 0],
  ];
  return `<div class="tabs">${tabs.map(([id, name, count]) => `
    <button class="tab${view.tab === id ? ' on' : ''}" data-tab="${id}">
      ${esc(name)}${count ? `<span class="n">${count}</span>` : ''}
    </button>`).join('')}</div>`;
}

function paneBody() {
  if (!detail) return '<div class="quiet" style="padding-top:30px">Loading…</div>';
  if (view.tab === 'table') return rosterTab();
  if (view.tab === 'corrections') return correctionsTab();
  if (view.tab === 'settings') return settingsTab();
  if (view.shelf !== 'sessions') return entryPane();
  return sessionReader();
}

// --- Notes: whatever this session actually is ------------------------------

function sessionReader() {
  const s = selected();
  if (!s) {
    const list = sessions();
    return `<div style="padding-top:60px;max-width:60ch">
      <div class="display sm">${list.length ? 'Pick a session.' : 'Nothing to read yet.'}</div>
      <div class="say-2">${list.length
        ? 'The list on the left is every session this campaign has. Anything waiting on a decision says so.'
        : 'When Quill records a session, its notes land here as soon as the summariser has written them.'}</div>
    </div>`;
  }

  if (s.state === 'recording') return recordingPane(s);
  if (s.state === 'failed') return failedPane(s);
  if (s.job?.status === 'awaiting_approval' && s.job.type === 'summarize') return approvalPane(s);
  if (s.job?.status === 'awaiting_approval' && s.job.type === 'transcribe') return transcribePane(s);
  if (s.job && !s.hasNotes) return queuedPane(s);
  return notesPane(s);
}

function sessionKicker(s, tone = '') {
  const bits = [
    s.lines ? `${n(s.lines)} lines` : null,
    runtime(s.durationMs) ? `${runtime(s.durationMs)} recorded` : null,
    s.job?.provider ? providerName(s.job.provider) : null,
  ].filter(Boolean);
  return `
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
      <div class="kicker ${tone}">Session ${s.sessionNumber ?? s.meetingId} · ${esc(longDate(s.startedAt))}</div>
      ${bits.length ? `<span class="mono" style="font-size:11.5px;color:var(--dim)">${esc(bits.join(' · '))}</span>` : ''}
    </div>`;
}

// The notes, read as a document.
//
// The headline is the first scene's own title. Nothing in the stored recap is
// a title for the whole session — the schema has never had one — so rather
// than inventing a phrase, this borrows the one the summariser actually wrote
// for where the session opens, and falls back to the session's ref.
function notesPane(s) {
  if (!notes || notes.meetingId !== s.meetingId) {
    return `${sessionKicker(s, 'done')}<div class="say-2">Opening…</div>`;
  }
  if (notes.unreadable) {
    return `
      ${sessionKicker(s, 'broken')}
      <h1 class="display" style="margin-top:12px">These notes will not open.</h1>
      <div class="say-2">
        The summary is on disk but is not valid JSON, so nothing can read it — not this page, not the
        Obsidian export, not <code>/recap</code>. Writing them again fixes it; the transcript is untouched.
      </div>
      <div class="row-btns" style="margin-top:22px">
        ${can() ? `<button type="button" class="btn go" data-act="summary/again" data-meeting="${s.meetingId}">Write them again</button>` : ''}
        ${cap('transcripts') ? `<button class="btn" data-transcript="${s.meetingId}">Read the transcript</button>` : ''}
      </div>`;
  }
  if (!notes.written) {
    return `
      ${sessionKicker(s)}
      <h1 class="display" style="margin-top:12px">Not written up yet.</h1>
      <div class="say-2">This session has a transcript but no notes. Summarising posts them the usual way.</div>
      <div class="row-btns" style="margin-top:22px">
        ${can() ? `<button type="button" class="btn go" data-act="summary/again" data-meeting="${s.meetingId}">Summarise it</button>` : ''}
        ${cap('transcripts') ? `<button class="btn" data-transcript="${s.meetingId}">Read the transcript</button>` : ''}
      </div>`;
  }

  const heading = notes.scenes[0]?.title && notes.scenes[0].title !== 'Untitled scene'
    ? notes.scenes[0].title
    : notes.ref || `Session ${s.sessionNumber}`;

  return `
    ${sessionKicker(s, 'done')}
    <div style="display:flex;align-items:flex-end;gap:20px;margin-top:12px;flex-wrap:wrap">
      <h1 class="display">${esc(heading)}</h1>
      <div class="row-btns" style="margin-left:auto;padding-bottom:6px">
        ${cap('transcripts') ? `<button class="btn sm" data-transcript="${s.meetingId}">Transcript</button>` : ''}
        ${can() ? `<button type="button" class="btn sm" data-act="summary/again" data-meeting="${s.meetingId}"
             data-confirm="Write the notes for ${esc(s.ref)} again?">Re-summarise</button>` : ''}
        <button class="btn sm ghost" data-copy-notes>Copy for Obsidian</button>
      </div>
    </div>

    ${notes.tldr ? `<div class="lede">${esc(notes.tldr)}</div>` : ''}

    ${notes.scenes.length ? `
      <div class="cap" style="margin:32px 0 4px">What happened</div>
      <div style="max-width:70ch">
        ${notes.scenes.map((scene, i) => `
          <div class="scene">
            ${i === 0 && scene.title === heading ? '' : `<h4>${esc(scene.title)}</h4>`}
            <p>${scene.points.map(esc).join(' ')}</p>
          </div>`).join('')}
      </div>` : ''}

    ${notes.partyDecisions.length ? `
      <div class="cap" style="margin:32px 0 10px">Party decisions</div>
      <div class="numbered">
        ${notes.partyDecisions.map((d, i) => `
          <div><span class="i">${String(i + 1).padStart(2, '0')}</span><span>${esc(d)}</span></div>`).join('')}
      </div>` : ''}

    ${notes.followUps.length ? `
      <div class="cap" style="margin:32px 0 10px">Follow-ups</div>
      <div class="numbered">
        ${notes.followUps.map((f, i) => `
          <div><span class="i">${String(i + 1).padStart(2, '0')}</span><span>${esc(f)}</span></div>`).join('')}
      </div>` : ''}`;
}

// The session that is waiting for you to spend money on it. The whole point of
// moving approvals off Discord: the decision, and the thing it is about, on
// one screen.
function approvalPane(s) {
  const providers = status?.providers ?? [];

  return `
    ${sessionKicker(s, 'wait')}
    <h1 class="display" style="margin-top:12px">Not written up yet</h1>
    <div class="say-2">
      The transcript is on file — ${plural(s.lines, 'line')}${runtime(s.durationMs) ? ` over ${runtime(s.durationMs)}` : ''},
      corrections already applied. Nothing has been summarised and nothing has been posted.
      ${providers.length > 1 ? 'Pick who writes the notes.' : ''}
    </div>
    ${can() ? `
      <div class="row-btns" style="margin-top:22px">
        ${providers.length
          ? providers.map((p, i) => `
              <button type="button" class="btn ${i === 0 ? 'go big' : 'big'}" data-act="summary/approve"
                      data-job="${s.job.id}" data-provider="${esc(p)}">
                ${i === 0 ? `Summarise with ${esc(providerName(p))}` : esc(providerName(p))}
              </button>`).join('')
          : `<button type="button" class="btn go big" data-act="summary/approve" data-job="${s.job.id}">Summarise now</button>`}
        <button type="button" class="btn big" data-act="summary/park" data-job="${s.job.id}">Leave it parked</button>

          notes post to ${esc(destination())} when they are ready

    ${transcriptPeek(s)}`;
}

function transcribePane(s) {
  return `
    ${sessionKicker(s, 'wait')}
    <h1 class="display" style="margin-top:12px">Waiting to transcribe</h1>
    <div class="say-2">
      This session is recorded and sitting on the Pi. Transcribing it uses the GPU on your PC, so Quill
      asks first rather than seizing the machine in the middle of your evening.
    </div>
    ${can() ? `
      <div class="row-btns" style="margin-top:22px">
        <button type="button" class="btn go big" data-act="transcribe" data-job="${s.job.id}" data-action="now">Transcribe now</button>
        <button type="button" class="btn big" data-act="transcribe" data-job="${s.job.id}" data-action="later">Not yet</button>
        <button type="button" class="btn big" data-act="transcribe" data-job="${s.job.id}" data-action="pi">On the Pi instead</button>
      </div>
      <div class="quiet" style="margin-top:14px">
        “On the Pi” needs no GPU at all, and takes hours rather than minutes.
        ${status?.schedule?.nextAutoWindowAt
          ? `Left alone, the next automatic window opens ${esc(longDate(status.schedule.nextAutoWindowAt))} at ${esc(hhmm(status.schedule.nextAutoWindowAt))}.`

}

function queuedPane(s) {
  const live = (status?.working?.transcribing ?? []).find((t) => t.meetingId === s.meetingId);
  const done = live?.done ?? 0;
  const total = live?.total ?? 0;
  const pct = total ? Math.round((done / total) * 100) : 0;

  return `
    ${sessionKicker(s)}
    <h1 class="display" style="margin-top:12px">${live ? 'Working on it now' : 'Waiting its turn'}</h1>
    <div class="say-2">${esc(live?.description || 'Queued behind whatever is in front of it. Nothing here needs you.')}</div>
    <div class="steps" style="margin-top:30px;max-width:820px">
      <div>
        <span class="mark done">✓</span>
        <div style="flex:1"><div class="what">Recorded</div>
          <div class="sub">${esc(longDate(s.startedAt))}${runtime(s.durationMs) ? ` · ${runtime(s.durationMs)}` : ''}</div></div>
      </div>
      <div class="${live ? 'now' : ''}">
        <span class="mark ${live ? 'live' : ''}">${live ? '' : '2'}</span>
        <div style="flex:1">
          <div class="what" style="${live ? 'font-weight:500' : 'color:var(--dim)'}">Transcribing</div>
          ${live ? `<div class="sub">${esc(live.description)}</div><div class="bar"><i style="width:${pct}%"></i></div>`
                 : '<div class="sub">on the PC, inside the transcribe window</div>'}
        </div>
      </div>
      <div>
        <span class="mark">3</span>
        <div style="flex:1"><div class="what" style="color:var(--dim)">Summarising</div>
          <div class="sub">${status?.schedule?.requireApproval ? 'you will be asked before this starts' : 'starts on its own once the transcript exists'}</div></div>
      </div>
      <div>
        <span class="mark">4</span>
        <div style="flex:1"><div class="what" style="color:var(--dim)">Notes posted to ${esc(destination())}</div></div>

}

function recordingPane(s) {
  const live = (status?.recording ?? []).find((r) => r.meetingId === s.meetingId);
  return `
    <div class="kicker broken"><span class="dot live"></span> Recording · session ${s.sessionNumber ?? s.meetingId}</div>
    <div style="display:flex;align-items:flex-end;gap:24px;margin-top:14px;flex-wrap:wrap">
      <div class="mono" id="timer" style="font-size:52px;font-weight:500;letter-spacing:-1px;line-height:1">
        ${hhmmss(live?.recordingForMs)}
      </div>
      <div class="mono" style="font-size:12.5px;color:var(--dim);line-height:1.8;padding-bottom:6px">
        ${esc(live?.channel || s.channel || '')}<br>
        ${n(live?.clips ?? 0)} clips · ${plural(live?.speakers ?? 0, 'speaker')}
      </div>

function failedPane(s) {
  const job = s.job;
  // The log the design draws by hand, built from what is actually recorded:
  // when the session ran, how many clips survived, and every attempt the job
  // made before it gave up.
  const events = [
    [hhmm(s.startedAt), `joined ${s.channel || 'the voice channel'}`],
    s.endedAt ? [hhmm(s.endedAt), `last voice left · ${runtime(s.durationMs) ?? '0:00'} recorded`] : null,
    [hhmm(s.endedAt || s.startedAt), s.lines ? `${n(s.lines)} lines transcribed` : '0 clips written to disk'],
    job?.attempts ? [null, `${plural(job.attempts, 'attempt')} · ${esc(job.lastError || 'nothing to read')}`] : null,
  ].filter(Boolean);

  return `
    ${sessionKicker(s, 'broken')}
    <h1 class="display" style="margin-top:14px">
      ${s.lines ? 'This session did not finish.' : 'There is nothing to transcribe.'}
    </h1>
    <div class="say-2">
      ${s.lines
        ? `The transcript exists — ${plural(s.lines, 'line')} — but the step after it failed. Trying again is worth a go.`
        : 'Quill joined the channel but no clips survived, so there is no audio to retry. Every attempt fails for the same reason.'}
    </div>
    <div class="card" style="margin-top:30px;max-width:760px">
      <div class="cap" style="margin-bottom:14px">What Quill saw</div>
      <div class="mono" style="display:flex;flex-direction:column;gap:11px;font-size:12.5px;color:var(--text-2)">
        ${events.map(([t, what]) => `
          <div style="display:flex;gap:16px">
            <span style="color:var(--dim);width:64px;flex:0 0 64px">${esc(t || '')}</span>
            <span style="${what.startsWith('0 clips') ? 'color:var(--red-lit)' : ''}">${esc(what)}</span>
          </div>`).join('')}
      </div>
    </div>
    ${can() ? `
      <div class="row-btns" style="margin-top:26px">
        ${s.discardable ? `<button type="button" class="btn warn big" data-act="session/discard" data-meeting="${s.meetingId}"
            data-confirm="Discard ${esc(s.ref)}? It has no transcript, and this stops it retrying.">Discard this session</button>` : ''}
        ${s.lines ? `<button type="button" class="btn go big" data-act="summary/again" data-meeting="${s.meetingId}">Try summarising again</button>` : ''}
        <button class="btn big" data-import>Import a recording instead</button>
      </div>
      <div class="quiet" style="margin-top:20px">
        Discarding removes it from the queue and from the session count. Nothing was ever posted to the channel.
      </div>` : disabledNote()}`;
}

// The first few lines, so the approval decision is made looking at the thing
// rather than at its line count.
function transcriptPeek(s) {
  if (!s.lines) return '';
  const peek = script?.meetingId === s.meetingId ? script.lines.slice(0, 6) : null;

  return `
    <div class="cap" style="margin:34px 0 14px">The transcript, from the top</div>
    <div class="card" style="max-width:none">
      ${peek ? peek.map((l) => `
        <div style="display:grid;grid-template-columns:74px 132px 1fr;gap:16px;align-items:baseline;padding:7px 0">
          <span class="mono" style="font-size:11.5px;color:var(--dim)">${esc(clock(l.ms))}</span>
          <span style="font-size:14px;color:var(--text-2)">${esc(l.speaker)}</span>
          <span style="font-size:14.5px;line-height:1.6;color:var(--text-2)">${esc(l.text)}</span>
        </div>`).join('')
        : '<div class="quiet">Loading the first lines…</div>'}
      <div style="display:flex;align-items:center;gap:12px;margin-top:10px;padding-top:14px;border-top:1px solid var(--line)">
        <span class="mono" style="font-size:11.5px;color:var(--dim)">
          ${peek ? `${n(Math.max(0, (script.total || 0) - peek.length))} more lines` : `${n(s.lines)} lines`}
        </span>
        <button class="btn sm" data-transcript="${s.meetingId}">Open the full transcript</button>
      </div>
    </div>`;
}

// --- the facts rail --------------------------------------------------------

function factsRail() {
  const s = selected();
  if (!s || !notes || notes.meetingId !== s.meetingId || notes.unreadable || !notes.written) return '';

  const block = (title, lines) =>
    lines?.length ? `<div><div class="cap" style="margin-bottom:12px">${title}</div>
      <div class="plainlist">${lines.map(esc).join('<br>')}</div></div>` : '';

  const named = (title, lines) =>
    lines?.length ? `<div><div class="cap" style="margin-bottom:12px">${title}</div>
      <div class="stack">${lines.map((entry) => {
        const { name, rest } = splitEntry(entry);
        return `<div><div class="who">${esc(name)}</div>${rest ? `<div class="what">${esc(rest)}</div>` : ''}</div>`;
      }).join('')}</div></div>` : '';

  const body = [
    notes.unresolvedThreads.length
      ? `<div><div class="cap" style="margin-bottom:12px">Still unresolved</div>
           <div class="stack">${notes.unresolvedThreads.map((t) => `<div class="big">${esc(t)}</div>`).join('')}</div></div>`
      : '',
    named('NPCs introduced', notes.npcsIntroduced),
    block('Locations', notes.locationsVisited),
    block('Loot and rewards', notes.lootAndRewards),
    notes.funnyMoments.length
      ? `<div class="keep"><div class="cap">Worth remembering</div>
           ${notes.funnyMoments.map((f) => `<p>${esc(f)}</p>`).join('')}</div>`
      : '',
  ].filter(Boolean).join('');

  // Marked optional: on a narrower screen the recap's own prose is the thing
  // worth keeping, and everything in this rail is also in the notes body.
  return body ? `<aside class="facts optional">${body}</aside>` : '';
}

// ==========================================================================
// Who and where — the campaign read down instead of across
// ==========================================================================
//
// Nothing new is summarised for this. Every session's notes already carry the
// NPCs it introduced and the places it visited, written at the time by the
// summariser; this reads all of them in one go and lines the repeats up under
// one name. So an entry is not a fresh opinion about a character — it is the
// same sentences that were posted to Discord, in the order they were said.
//
// Cached per campaign, because it is one request per session and the answer
// only changes when a session is summarised again.

let compendium = null;   // see blankCompendium for the shape

// One shape for all three states it can be in — loading, failed, built — so a
// reader never has to work out which one it got.
//
// The three used to be written out by hand at their three call sites, and two
// of them left out `items` and `story`. Every reader but one defends itself
// with `?? []`; shelfCount does not, so a single failed /notes request threw on
// the very next paint and took the whole page down with it.
const blankCompendium = (id, patch = {}) => ({
  campaignId: id, loading: false, error: '',
  story: [], npcs: [], places: [], items: [],
  ...patch,
});

// "Warden Ilse — runs the Greyhollow toll" and "Warden Ilse, who keeps two
// books" are the same person on two different nights. Match on a folded name
// so they land in one entry without needing the summariser to be consistent.
const foldName = (s) => s.toLowerCase().replace(/^(the|a|an)\s+/, '').replace(/[^a-z0-9]+/g, ' ').trim();

function collect(list, entries, session) {
  for (const raw of list ?? []) {
    const { name, rest } = splitEntry(raw);
    const trimmed = (name || '').trim();
    if (!trimmed) continue;
    const key = foldName(trimmed);
    if (!key) continue;

    let entry = entries.get(key);
    if (!entry) {
      entry = { key, name: trimmed, first: session, seen: [], said: [], asides: [] };
      entries.set(key, entry);
    }
    // Sessions arrive newest first, so the last one seen is the earliest.
    entry.first = session;
    if (!entry.seen.some((x) => x.meetingId === session.meetingId)) entry.seen.push(session);
    // The summariser writes "Name — what they are". Its remainder starts
    // mid-sentence, so it gets a capital before it is shown as one.
    if (rest) entry.said.push({ session, text: rest[0].toUpperCase() + rest.slice(1) });
  }
}

async function buildCompendium() {
  const id = view.campaignId;
  compendium = blankCompendium(id, { loading: true });
  paint();

  const withNotes = sessions().filter((s) => s.hasNotes);
  const npcs = new Map();
  const places = new Map();
  const items = [];
  const asides = [];

  // One request per session. Strictly in series a long campaign would take a
  // noticeable few seconds; all at once would put forty requests on a
  // Raspberry Pi in one breath. Six at a time is neither.
  const LANES = 6;

  let read = [];
  try {
    const fetched = [];
    for (let i = 0; i < withNotes.length; i += LANES) {
      const batch = withNotes.slice(i, i + LANES);
      const got = await Promise.all(batch.map((s) => get(`/notes?meeting=${s.meetingId}`)));
      if (view.campaignId !== id) return;           // they moved on mid-read
      batch.forEach((s, j) => fetched.push({ s, n: got[j] }));
    }

    // Collected in the order the sessions are listed — newest first — because
    // collect() leans on that to work out which night was the first.
    for (const { s, n } of fetched) {
      if (!n?.written || n.unreadable) continue;
      collect(n.npcsIntroduced, npcs, s);
      collect(n.locationsVisited, places, s);
      for (const line of n.lootAndRewards ?? []) {
        const text = String(line ?? '').trim();
        if (text) items.push({ session: s, text });
      }
      for (const line of n.funnyMoments ?? []) asides.push({ session: s, text: line });
    }
    read = fetched;
  } catch (err) {
    compendium = blankCompendium(id, { error: err.message });
    return paint();
  }

  // An aside belongs to whoever it is about. The ones that name nobody stay
  // with the campaign rather than being filed under a guess.
  const attach = (map) => {
    for (const entry of map.values()) {
      const needle = entry.name.toLowerCase();
      for (const aside of asides) {
        if (aside.text.toLowerCase().includes(needle)) entry.asides.push(aside);
      }
    }
  };
  attach(npcs);
  attach(places);

  // Oldest first. The session column is newest-first because you want the
  // last night you played; a cast list is the opposite — you meet people in
  // the order the campaign met them, and session one is where most of them
  // are. Sorted newest-first, the founding cast sat at the bottom of the page.
  const order = (a, b) => (a.first.sessionNumber ?? 0) - (b.first.sessionNumber ?? 0);
  // The story in order, one entry per night, with what that night added.
  const story = read
    .filter(({ n }) => n?.written && !n.unreadable)
    .map(({ s, n }) => ({ session: s, notes: n }))
    .sort((a, b) => (a.session.sessionNumber ?? 0) - (b.session.sessionNumber ?? 0));

  compendium = blankCompendium(id, {
    story,
    npcs: [...npcs.values()].sort(order),
    places: [...places.values()].sort(order),
    items: items.sort((a, b) => (a.session.sessionNumber ?? 0) - (b.session.sessionNumber ?? 0)),
  });
  paint();
}

// The word each kind of entry uses for the night it turned up.
const FIRST_WORD = {
  people: 'first met',
  places: 'first gone to',
  items:  'found in',
};

// ==========================================================================
// The table
// ==========================================================================

const CONSENT_CLASS = { granted: 'agreed', declined: 'declined', pending: 'waiting', expired: 'waiting' };

function rosterTab() {
  const roster = detail.roster;
  const waiting = roster.filter((p) => !p.consent.mayRecord);
  const total = roster.reduce((sum, p) => sum + p.lines, 0) || 1;

  const heading = waiting.length
    ? `${waiting.length === 1 ? 'One person' : `${waiting.length} people`} still to hear from`
    : 'Everyone at this table has agreed';

  return `
    <div class="pane-wide" style="padding-top:30px">
      <h1 class="display sm">${esc(heading)}</h1>
      <div class="say-2" style="font-size:15px;max-width:64ch">
        ${waiting.length
          ? `Quill records nobody who has not agreed. Until ${esc(listNames(waiting))} answer, their microphones are skipped and the rest of the table is recorded as normal.`
          : 'Everyone here has said yes in a DM. Anyone who changes their mind can be removed with <code>/campaign remove</code>, and nothing of theirs is captured from that moment on.'}
      </div>

      <div class="grid roster${waiting.length ? '' : ' settled'}" style="margin-top:30px">
        <div class="hd">
          <div>Player</div><div>Character</div>
          <div class="r">Lines</div><div class="r">Share</div>
          ${waiting.length ? '<div class="r">Consent</div>' : ''}
        </div>
        ${roster.map((p) => {
          const pct = Math.round((p.lines / total) * 100);
          const who = whoIs(p);
          return `<div class="tr">
            <div>${esc(who)}</div>
            <div>${characterCell(p, who)}</div>
            <div class="r mono">${p.lines ? n(p.lines) : '—'}</div>
            <div class="r"><span class="share">
              <i class="${p.lines ? '' : 'quiet'}"><b style="width:${p.lines ? pct : 0}%"></b></i>
              <span class="mono" style="font-size:12px;color:var(--dim);width:34px;text-align:right">${p.lines ? `${pct}%` : ''}</span>
            </span></div>
            ${waiting.length ? `
            <div class="r" style="display:flex;justify-content:flex-end;align-items:center;gap:10px">
              <span class="as-val ${p.consent.withdrawn ? 'declined' : CONSENT_CLASS[p.consent.state] || 'never'}">${esc(p.consent.label)}</span>
              ${askable(p) ? `<button type="button" class="btn sm" data-act="roster/invite" data-campaign="${detail.id}"
                data-user="${esc(p.userId)}">${p.consent.state === 'pending' ? 'Ask again' : 'Invite'}</button>` : ''}
            </div>` : ''}
          </div>`;
        }).join('')}
      </div>
      ${roster.length ? '' : '<div class="quiet" style="padding:20px 0">Nobody at this table yet.</div>'}
      ${canManage() ? invitePanel() : ''}
      ${roster.some((p) => p.consent.withdrawn) ? `
        <div style="border-left:2px solid var(--edge);padding-left:16px;margin-top:26px;max-width:70ch">
          <div class="quiet">
            There is no control here to put someone back. If they want to be recorded again they run
            <code>/campaign consent</code> themselves — asking on their behalf is a conversation, not a button.
          </div>
        </div>` : ''}
      ${canManage() ? '' : disabledNote()}
    </div>`;
}

// Who it makes sense to ask.
//
// Not someone who already agreed, and never someone who turned recording off
// themselves — re-asking them is the one thing this screen must not offer,
// because it turns their own decision into something to be nagged about.
const askable = (p) => canManage() && !p.consent.mayRecord && !p.consent.withdrawn && p.consent.state !== 'declined';

const listNames = (people) => {
  const names = people.map(whoIs);
  if (names.length === 1) return names[0];
  if (names.length === 2) return `${names[0]} and ${names[1]}`;
  return `${names.slice(0, -1).join(', ')} and ${names[names.length - 1]}`;
};

// Ask somebody who is not on the roster yet.
//
// Typed, not pasted: the operator knows their table by the name in the channel,
// and a screen that demanded a Discord snowflake would send them back to the
// client to right-click somebody — which is exactly the errand this page exists
// to save. A pasted id still works, for a nickname the search cannot match.
function invitePanel() {
  const found = people.results;

  return `
    <div style="margin-top:34px;max-width:760px">
      <div class="cap" style="margin-bottom:12px">Ask someone new</div>
      <form class="row-btns" data-people-search>
        <input class="in" id="people-q" name="query" style="flex:0 0 280px"
               placeholder="a Discord name, or a pasted user id" value="${esc(people.query)}"
               aria-label="Search this server for a person">
        <button class="btn go" type="submit" ${people.busy ? 'disabled' : ''}>
          ${people.busy ? 'Looking…' : 'Search'}</button>
        ${people.query || found ? '<button class="btn ghost" type="button" data-people-clear>Clear</button>' : ''}
      </form>

      ${people.error ? `<div class="quiet" style="margin-top:12px;color:var(--brass-lit)">${esc(people.error)}</div>` : ''}

      ${found ? (found.length ? `
        <div class="grid" style="margin-top:18px">
          ${found.map((m) => {
            const already = detail.roster.find((p) => p.userId === m.userId);
            return `<div class="tr" style="grid-template-columns:36px 1fr 1fr auto">
              <div>${m.avatar
                ? `<img src="${esc(m.avatar)}" alt="" width="28" height="28" style="border-radius:50%">`
                : '<span class="dot" style="width:28px;height:28px;border-radius:50%"></span>'}</div>
              <div>
                <div style="font-size:14.5px">${esc(m.displayName)}</div>
                <div class="mono" style="font-size:11px;color:var(--dim);margin-top:2px">@${esc(m.username)}</div>
              </div>
              <div class="quiet">${already
                ? (already.consent.mayRecord ? 'already agreed'
                   : already.consent.withdrawn ? 'turned recording off themselves'
                   : already.consent.state === 'pending' ? 'asked, waiting'
                   : 'on the roster, not asked')
                : 'not at this table yet'}</div>
              <div class="r">${already?.consent.mayRecord || already?.consent.withdrawn
                ? ''
                : `<button type="button" class="btn sm go" data-act="roster/invite" data-campaign="${detail.id}"
                     data-user="${esc(m.userId)}">Ask them</button>`}</div>
            </div>`;
          }).join('')}
        </div>` : `<div class="quiet" style="margin-top:14px">
          Nobody in this server matches “${esc(people.query)}”. Discord matches on username and server nickname —
          or paste their user id (right-click them in Discord, Copy User ID).
        </div>`) : ''}

      <div class="quiet" style="margin-top:16px;max-width:70ch">
        They get a DM explaining what is recorded, where it goes and how long it is kept, with the buttons to
        agree or refuse. Nothing of theirs is captured until they say yes.
      </div>
    </div>`;
}

// Click the name to change it, rather than a form under every row. A roster of
// six players was six always-open text boxes, which read as a data-entry
// screen for something you set once.
function characterCell(p, who) {
  // Your own character is yours to name wherever you are welcome, which is
  // what /campaign setchar has always done. Anybody else's needs the table.
  const mine = me?.signedIn && p.userId && p.userId === me.userId;
  if (!canManage() && !mine) {
    return p.characterName ? esc(p.characterName) : '<span class="unset">not set</span>';
  }
  if (view.editing === p.userId) {
    return `<form class="row-btns" data-act="roster/character" data-campaign="${detail.id}" data-user="${esc(p.userId)}">
      <input class="in" name="name" style="width:140px" value="${esc(p.characterName || '')}"
             placeholder="character" aria-label="Character for ${esc(who)}" autofocus>
      <button class="btn sm go" type="submit">Save</button>
      <button class="btn sm ghost" type="button" data-cancel-edit>Cancel</button>
    </form>`;
  }
  return `<button class="charbtn" data-edit="${esc(p.userId)}"
            title="Click to set the character name">${
    p.characterName ? esc(p.characterName) : '<span class="unset">not set</span>'
  }</button>`;
}

function transcriptScreen() {
  if (!script) return '<div class="pane-main"><div class="quiet">Opening the transcript…</div></div>';

  const term = view.search.trim().toLowerCase();
  const lines = script.lines.filter((l) =>
    (!view.speaker || l.userId === view.speaker) && (!term || l.text.toLowerCase().includes(term)));

  return `
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;min-height:0">
        <div class="tr-bar">
          <input class="in" id="tsearch" style="flex:0 0 300px" placeholder="Search ${n(script.total)} lines"
                 value="${esc(view.search)}" aria-label="Search the transcript">
          <div class="row-btns" style="gap:7px">
            <button class="chip ${view.speaker ? '' : 'on'}" data-speaker="">everyone</button>
            ${script.speakers.map((sp) => `
              <button class="chip ${view.speaker === sp.userId ? 'on' : ''}" data-speaker="${esc(sp.userId)}">${esc(sp.name)}</button>`).join('')}
          </div>
          <span class="mono" style="margin-left:auto;font-size:11.5px;color:var(--dim)">
            ${lines.length === script.lines.length ? n(script.total) : `${n(lines.length)} of ${n(script.total)}`} lines
          </span>
        </div>
        <div class="lines">
          ${lines.length ? lines.map((l) => `
            <div class="line">
              <span class="t">${esc(clock(l.ms))}</span>
              <span class="who ${script.speakers.find((s) => s.userId === l.userId)?.manager ? 'owner' : ''}">${esc(l.speaker)}</span>
              <span class="said">${highlight(l.text, term)}</span>
            </div>`).join('')
            : `<div class="quiet" style="padding:40px 0">Nothing matches “${esc(view.search)}”.</div>`}
          ${script.truncated ? '<div class="quiet" style="padding:20px 0">This transcript is longer than the reader shows — download the .txt for all of it.</div>' : ''}
        </div>
      </div>

      <aside class="facts" style="flex:0 0 320px;padding:26px">
        <div>
          <div class="cap" style="margin-bottom:14px">Who spoke</div>
          <div style="display:flex;flex-direction:column;gap:11px">
            ${script.speakers.map((sp) => `
              <div style="display:flex;align-items:center;gap:11px">
                <span style="font-size:13.5px;width:104px;${sp.manager ? 'color:var(--brass)' : ''}">${esc(sp.name)}</span>
                <i style="flex:1;height:5px;border-radius:3px;background:var(--line);display:block;overflow:hidden">
                  <b style="display:block;height:100%;width:${sp.share}%;background:${sp.manager ? 'var(--brass)' : 'var(--edge)'}"></b>
                </i>
                <span class="mono" style="font-size:11px;color:var(--dim);width:34px;text-align:right">${sp.share}%</span>
              </div>`).join('')}
          </div>
        </div>
        ${script.corrections.length ? `
          <div class="keep">
            <div class="cap">Corrections in force</div>
            <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
              ${script.corrections.map((c) => `
                <div style="font-size:13.5px;color:var(--text-2)">“${esc(c.wrong)}” → <b style="color:var(--text)">${esc(c.right)}</b></div>`).join('')}
            </div>
            <div class="quiet" style="margin-top:12px">
              These were applied as the transcript was written, so what you are reading is already corrected.
            </div>
          </div>` : ''}
        <div>
          <div class="cap" style="margin-bottom:12px">This session</div>
          <div class="mono" style="font-size:12.5px;color:var(--text-2);line-height:2">
            ${esc(longDate(script.startedAt))}<br>
            ${esc(n(script.total))} lines · ${plural(script.speakers.length, 'voice')}<br>
            ${esc(script.channel ? `#${script.channel}` : '')}
          </div>
        </div>
        <div class="quiet" style="margin-top:auto">
          ${script.hasNotes
            ? 'The notes for this session are written — close this to read them.'
            : 'No notes exist for this session yet.'}
        </div>
      </aside>`;
}

function highlight(text, term) {
  if (!term) return esc(text);
  const at = text.toLowerCase().indexOf(term);
  if (at < 0) return esc(text);
  return `${esc(text.slice(0, at))}<mark>${esc(text.slice(at, at + term.length))}</mark>${esc(text.slice(at + term.length))}`;
}
