<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quill</title>
<!-- Inline so the page stays a single self-contained file with no second
     request — and so a tab left open is findable by its icon rather than by
     reading titles. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%AA%B6%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #10131a; --card: #171b24; --line: #262c3a;
    --text: #e6e9ef; --dim: #8b93a7;
    --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --live: #f472b6; --accent: #60a5fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  .muted { color: var(--dim); font-size: 13px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0 0 12px; font-weight: 600; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--dim); }
  .val { font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: middle; }
  .ok { background: var(--ok); } .bad { background: var(--bad); } .warn { background: var(--warn); }
  .unknown { background: var(--dim); }
  .live { background: var(--live); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .empty { color: var(--dim); font-style: italic; padding: 6px 0; }
  .item { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .title { font-weight: 600; }
  .item .sub { color: var(--dim); font-size: 13px; margin-top: 3px; }
  .bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .pill.act { color: var(--warn); border-color: var(--warn); }
  #err { display: none; background: #2a1418; border: 1px solid var(--bad); color: #fecaca;
         padding: 12px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 14px; }
  code { background: #0d1017; padding: 1px 6px; border-radius: 4px; font-size: 13px; }

  /* The owner's overview: totals across every table the bot serves, then one
     row per campaign. Above the operational cards because "what is this bot
     actually carrying" is the question you open the page with. */
  .totals { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat .n { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .stat .l { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; margin-top: 2px; }
  .card.wide { margin-bottom: 14px; }
  .camp { display: grid; gap: 4px 12px; grid-template-columns: 1fr auto; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .camp:last-child { border-bottom: 0; }
  .camp .name { font-weight: 600; }
  .camp .meta, .camp .num { color: var(--dim); font-size: 13px; }
  .camp .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); margin-left: 6px; }
  .tag.warn { color: var(--warn); border-color: var(--warn); }
  .tag.live { color: var(--live); border-color: var(--live); }

  /* Anything that acts. These used to be buttons in a Discord DM; the styling
     keeps the same shape of decision — one obvious affirmative, the rest
     quiet — because "approve" and "not yet" should not look equally likely. */
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 7px; cursor: pointer;
           border: 1px solid var(--line); background: #1e2432; color: var(--text); transition: filter .15s; }
  button:hover:not(:disabled) { filter: brightness(1.25); }
  button:disabled { opacity: .45; cursor: default; }
  button.go { background: #14532d; border-color: #22c55e; color: #dcfce7; }
  button.warn { background: #422006; border-color: var(--warn); color: #fde68a; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; max-width: 620px;
           background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px 16px;
           box-shadow: 0 8px 30px #0009; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  .toast.bad { border-color: var(--bad); color: #fecaca; }
  .toast.good { border-color: var(--ok); }
  .note { color: var(--warn); font-size: 13px; margin-top: 10px; }

  /* One campaign, opened. Its own card rather than an expanding row: the
     cards above are rebuilt every five seconds, and a panel with a half-typed
     character name in it must not be one of the things thrown away. */
  .camp { cursor: pointer; }
  .camp:hover .name { color: var(--accent); }
  .camp.open .name { color: var(--accent); }
  #detail { display: none; }
  #detail.open { display: block; }
  .detail-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .detail-head h2 { margin: 0; }
  .cols { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); margin-top: 6px; }
  .cols h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
             margin: 0 0 8px; font-weight: 600; }
  .who { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .who:last-child { border-bottom: 0; }
  .who .sub { color: var(--dim); font-size: 12.5px; }
  .who .acts { margin-top: 0; }
  input, select { font: inherit; font-size: 13px; padding: 5px 9px; border-radius: 7px; min-width: 0;
                  border: 1px solid var(--line); background: #0d1017; color: var(--text); }
  input:focus, select:focus { outline: 1px solid var(--accent); }
  form.inline { display: flex; gap: 7px; margin-top: 10px; flex-wrap: wrap; }
  form.inline input { flex: 1 1 110px; }
  .yes { color: var(--ok); } .no { color: var(--bad); } .maybe { color: var(--warn); }

  /* Session notes. Read at a comfortable measure rather than stretched across
     a 1100px card — this is the one part of the page that is prose, and prose
     set the full width of a dashboard is prose nobody reads. */
  #notes { display: none; }
  #notes.open { display: block; }
  .notes-body { max-width: 68ch; }
  .notes-body .tldr { font-size: 16px; line-height: 1.65; margin: 6px 0 20px; }
  .notes-body h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
                   color: var(--dim); margin: 22px 0 8px; font-weight: 600; }
  .notes-body h4 { font-size: 14.5px; margin: 14px 0 5px; font-weight: 600; }
  .notes-body ul { margin: 0; padding-left: 20px; }
  .notes-body li { margin: 4px 0; line-height: 1.55; }
  .notes-body .scene { border-left: 2px solid var(--line); padding-left: 14px; margin-bottom: 4px; }
  .notes-body .funny li { color: #fde68a; }
  .notes-nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }

  /* --- what needs you, first --- */

  /* A live recording and a session waiting on a decision are the two reasons
     to open this page. They used to be the third and fourth cards in a grid of
     six, below the campaign list, which meant the answer to "is anything
     happening?" was somewhere in the middle of the screen. They now sit
     directly under the header — and vanish entirely when there is nothing,
     so a quiet bot opens on a quiet page rather than on two cards saying
     "Idle" and "Nothing waiting". */
  #attention:empty { display: none; }
  #attention { display: grid; gap: 14px; margin-bottom: 14px;
               grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  .card.attn { border-color: #3b4763; box-shadow: 0 0 0 1px #1d2537, 0 6px 24px #0006; }
  .card.attn.live { border-color: var(--live); }
  .card.attn h2 { color: var(--text); }
  .count { display: inline-block; min-width: 18px; padding: 0 6px; margin-left: 8px;
           border-radius: 999px; background: var(--warn); color: #1a1200;
           font-size: 11px; font-weight: 700; text-align: center; vertical-align: middle; }

  header { position: sticky; top: 0; z-index: 5; padding: 14px 0 10px; margin-bottom: 10px;
           background: linear-gradient(var(--bg) 72%, transparent); }
  body.stale .wrap > *:not(header):not(#err) { opacity: .55; transition: opacity .3s; }

  /* Keyboard reachability. The campaign rows are the page's main navigation
     and were plain divs with a click handler — invisible to Tab, unusable
     without a mouse. */
  .camp { border-radius: 8px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .camp:focus-visible { outline-offset: -2px; }

  .skeleton { color: var(--dim); font-style: italic; padding: 14px 0; }
  .skeleton::after { content: ''; display: inline-block; width: 1em; text-align: left;
                     animation: dots 1.2s steps(4, end) infinite; }
  @keyframes dots { 0% { content: '' } 25% { content: '.' } 50% { content: '..' } 75% { content: '...' } }

  /* Save appears only once a field has actually changed, so a roster of seven
     is seven names rather than seven buttons competing for attention. Only on
     forms that edit something already there — a form you fill from empty needs
     its button visible from the start. */
  form.inline.gated button[type=submit] { visibility: hidden; }
  form.inline.gated.dirty button[type=submit] { visibility: visible; }

  @media (max-width: 640px) {
    body { padding: 14px; }
    .who { grid-template-columns: 1fr; }
    .who .acts { margin-top: 6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Quill</h1>
    <span class="muted" id="who">connecting…</span>
    <span class="muted" style="margin-left:auto" id="stamp"></span>
  </header>

  <div id="err"></div>

  <div id="attention"></div>

  <div class="totals" id="totals"></div>

  <div class="card wide">
    <h2>Campaigns</h2>
    <div id="campaigns"></div>
  </div>

  <div class="card wide" id="detail"></div>
  <div class="card wide" id="notes"></div>

  <div class="grid">
    <div class="card">
      <h2>Working on</h2>
      <div id="working"></div>
    </div>

    <div class="card">
      <h2>Servers</h2>
      <div id="servers"></div>
    </div>

    <div class="card">
      <h2>Schedule</h2>
      <div id="schedule"></div>
    </div>

    <div class="card">
      <h2>Health</h2>
      <div id="health"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Same origin by default: nginx proxies /api to the Pi and adds the status
// token on the way through.
//
// The page used to fetch the Pi directly from the browser, which meant the
// Pi's port had to be reachable by every viewer and any token would have had
// to live in this file, in plain sight. Proxying keeps the token server-side
// and leaves the Pi's API on the LAN, so exposing the dashboard to a URL
// exposes only the dashboard.
//
// ?api=http://host:port still overrides it, for pointing at a second bot.
const API = new URLSearchParams(location.search).get('api') || window.SCRIBER_API || '/api';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

function duration(ms) {
  if (ms == null) return '—';
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  if (h) return `${h}h ${String(m).padStart(2, '0')}m`;
  if (m) return `${m}m ${String(s % 60).padStart(2, '0')}s`;
  return `${s}s`;
}

function whenLocal(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit' });
}

function dot(state) {
  const cls = state === true ? 'ok' : state === false ? 'bad' : 'unknown';
  return `<span class="dot ${cls}"></span>`;
}

const rows = (pairs) => pairs.map(([k, v]) => `<div class="row"><span class="k">${k}</span><span class="val">${v}</span></div>`).join('');
const empty = (msg) => `<div class="empty">${esc(msg)}</div>`;

function ago(iso) {
  if (!iso) return 'never';
  const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 14) return `${days}d ago`;
  return `${Math.floor(days / 7)}w ago`;
}

function render(s) {
  $('who').innerHTML = `${dot(s.bot.online)}${esc(s.bot.user || 'offline')} · up ${duration(s.bot.uptimeMs)} · opus ${esc(s.bot.opus.name)}`;
  // The stamp is driven by its own one-second timer (see sinceLastSeen), so it
  // keeps counting up while the bot is unreachable rather than freezing at the
  // moment contact was lost. Nothing to set here.

  // Older bots won't send these; the page should degrade rather than break.
  const totals = s.totals ?? null;
  $('totals').innerHTML = totals
    ? [
        [totals.campaigns, totals.campaigns === 1 ? 'Campaign' : 'Campaigns'],
        [totals.players, 'Players'],
        [totals.sessions, 'Sessions'],
        [totals.hours.toFixed(0) + 'h', 'Recorded'],
        [totals.lines.toLocaleString(), 'Lines'],
      ]
        .map(([n, l]) => `<div class="stat"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`)
        .join('')
    : '';

  const campaigns = s.campaigns ?? [];
  $('campaigns').innerHTML = campaigns.length
    ? campaigns
        .map((c) => {
          // An unclaimed campaign has nobody who can run /dm or /correct on
          // it, which is worth surfacing — it is the state a campaign gets
          // stranded in when its DM leaves the server.
          const tags =
            (c.recording ? '<span class="tag live">recording</span>' : '') +
            (c.claimed ? '' : '<span class="tag warn">unclaimed</span>') +
            (c.members && c.named < c.members ? `<span class="tag">${c.members - c.named} unnamed</span>` : '');
          const where = c.guildName ? esc(c.guildName) : `server ${esc(c.guildId)}`;
          return `
            <div class="camp${openCampaignId === c.id ? ' open' : ''}" data-campaign="${c.id}"
                 role="button" tabindex="0" aria-expanded="${openCampaignId === c.id}"
                 aria-label="Open ${esc(c.name || c.channel || 'campaign')}">
              <div>
                <div class="name">${esc(c.name || c.channel || 'unnamed campaign')}${tags}</div>
                <div class="meta">${where} · ${c.members} player(s) · last played ${esc(ago(c.lastSessionAt))} · notes → ${esc(c.output)}</div>
              </div>
              <div class="num">${c.sessions} session${c.sessions === 1 ? '' : 's'}<br>${c.hours.toFixed(1)}h · ${c.lines.toLocaleString()} lines</div>
            </div>`;
        })
        .join('')
    : empty('No campaigns yet.');

  // --- the band that only exists when something is happening ---
  const live = s.recording.length
    ? `<div class="card attn live">
         <h2><span class="dot live"></span>Recording now</h2>
         ${s.recording.map((r) => `
           <div class="item">
             <div class="title">${esc(r.guildName)} — ${esc(r.channel || 'voice')}</div>
             <div class="sub">session #${r.meetingId} · ${duration(r.recordingForMs)} · ${r.clips} clips · ${r.speakers} speaker(s)</div>
           </div>`).join('')}
       </div>`
    : '';

  const work = [
    ...s.working.transcribing.map((t) => ({
      title: `Transcribing session #${t.meetingId}`,
      sub: t.description,
      pct: t.total ? Math.round((t.done / t.total) * 100) : null,
    })),
    ...s.working.summarising.map((q) => ({ title: `Summarising session #${q.meetingId}`, sub: esc(q.channel), pct: null })),
  ];
  $('working').innerHTML = work.length
    ? work.map((w) => `
        <div class="item">
          <div class="title">${esc(w.title)}</div>
          <div class="sub">${esc(w.sub)}</div>
          ${w.pct == null ? '' : `<div class="bar"><i style="width:${w.pct}%"></i></div>`}
        </div>`).join('')
    : empty('Idle.');

  // The decisions that used to be buttons in a Discord DM.
  //
  // Ordered so the two that need an answer come first: a session waiting on
  // you is the reason to open this page, and one that is merely queued is not.
  const waiting = [
    ...s.queue.awaitingTranscribe.map((q) => ({ ...q, what: 'needs your approval to transcribe', act: 'transcribe' })),
    ...s.queue.awaitingSummary.map((q) => ({ ...q, what: 'needs your approval to summarise', act: 'summary' })),
    ...s.queue.queuedTranscribe.map((q) => ({ ...q, what: 'approved — waiting for the PC' })),
    ...s.queue.queuedSummary.map((q) => ({ ...q, what: 'queued to summarise' })),
  ];

  const providers = s.providers ?? [];
  const canAct = s.actionsEnabled !== false;

  // A provider is only worth choosing between when there IS a choice. With one
  // configured the button says what it does; with two it says who does it.
  function summaryButtons(jobId) {
    if (providers.length <= 1) {
      return `<button class="go" data-act="summary/approve" data-job="${jobId}">Summarise now</button>`;
    }
    return providers
      .map((p) => `<button class="go" data-act="summary/approve" data-job="${jobId}" data-provider="${esc(p)}">${esc(PROVIDER_NAMES[p] ?? p)}</button>`)
      .join('');
  }

  function actions(q) {
    if (!q.act || !q.jobId || !canAct) return '';
    const buttons =
      q.act === 'transcribe'
        ? `<button class="go" data-act="transcribe" data-job="${q.jobId}" data-action="now">Transcribe now</button>
           <button data-act="transcribe" data-job="${q.jobId}" data-action="later">Not yet</button>
           <button data-act="transcribe" data-job="${q.jobId}" data-action="pi">On the Pi (slow)</button>`
        : summaryButtons(q.jobId);
    return `<div class="acts">${buttons}</div>`;
  }

  // "Release everything" is separated from the per-session buttons on purpose:
  // it is the one click here that spends real money without naming what it
  // spent it on, so it should not sit in the same row as a single approval.
  const bulk = s.queue.awaitingSummary.length;
  const needsYou = waiting.filter((q) => q.act).length;

  const queued = waiting.length
    ? `<div class="card attn">
         <h2>Waiting for you${needsYou ? `<span class="count">${needsYou}</span>` : ''}</h2>
         ${waiting.map((q) => `
           <div class="item">
             <div class="title">#${q.meetingId} — ${esc(q.channel)}</div>
             <div class="sub">${esc(q.what)}${q.utterances ? ` · ${q.utterances} lines` : ''}${q.lastError ? `<br>last error: ${esc(q.lastError)}` : ''}</div>
             ${actions(q)}
           </div>`).join('')}
         ${canAct ? '' : DISABLED_NOTE}
         ${
           bulk > 1 && canAct
             ? `<div class="acts"><button data-act="summary/approve-all" data-confirm="Release all ${bulk} waiting summaries?">Release all ${bulk} summaries</button></div>`
             : ''
         }
       </div>`
    : '';

  $('attention').innerHTML = live + queued;

  // The tab title carries the same two facts, so a dashboard left open in a
  // background tab can still say a session ended and is waiting on you.
  document.title = s.recording.length
    ? '● Recording — Quill'
    : needsYou
      ? `(${needsYou}) Quill`
      : 'Quill';

  $('servers').innerHTML = s.servers.length
    ? s.servers.map((g) => {
        const held = g.campaigns > 1 ? ` <span class="tag">${g.campaigns} campaigns</span>` : '';
        const state = g.recording ? '<span class="pill act">recording</span>' : '<span class="pill">idle</span>';
        return `<div class="row"><span class="k">${dot(true)}${esc(g.name)}${held}</span><span class="val">${state}</span></div>`;
      }).join('')
    : empty('No servers.');

  $('schedule').innerHTML = rows([
    ['Auto window', `${String(s.schedule.windowStartHour).padStart(2, '0')}:00–${String(s.schedule.windowEndHour).padStart(2, '0')}:00${s.schedule.weekdaysOnly ? ' weekdays' : ' daily'}`],
    ['Timezone', esc(s.schedule.timeZone)],
    ['Approval required', s.schedule.requireApproval ? 'yes' : 'no'],
    [s.schedule.inWindowNow ? 'Window' : 'Next window', s.schedule.inWindowNow ? 'open now' : whenLocal(s.schedule.nextAutoWindowAt)],
  ]);

  // The two queues are shown as state plus the button that changes it, rather
  // than a toggle: a toggle sent twice — a double-click, or two tabs open on
  // this page — lands on the opposite of what the person who clicked it saw.
  // Each button says the state it will move to, so it is the same click
  // whatever the page last managed to render.
  const pauseButton = (queue, paused) =>
    !canAct
      ? paused ? 'paused' : 'running'
      : `<button class="${paused ? 'go' : 'warn'}" data-act="pause" data-queue="${queue}" data-paused="${paused ? 'false' : 'true'}"
          ${paused ? '' : `data-confirm="Pause ${queue === 'summarize' ? 'summarising' : 'transcription'}? Nothing new will start."`}>
          ${paused ? 'Resume' : 'Pause'}</button>`;

  $('health').innerHTML = rows([
    ['PC whisper server', `${dot(s.health.whisperServer)}${s.health.whisperServer === null ? 'unknown' : s.health.whisperServer ? 'reachable' : 'not reachable'}`],
    [`Summariser (${esc(s.health.summariserName)})`, `${dot(s.health.summariser)}${s.health.summariser === null ? 'unknown' : s.health.summariser ? 'ready' : 'unavailable'}`],
    [
      `Transcribing ${s.health.transcribePaused ? `${dot(false)}paused` : `${dot(true)}running`}`,
      pauseButton('transcribe', s.health.transcribePaused),
    ],
    [
      `Summarising ${s.health.summarisePaused ? `${dot(false)}paused` : `${dot(true)}running`}`,
      pauseButton('summarize', s.health.summarisePaused),
    ],
  ]);
}

const PROVIDER_NAMES = { gemini: 'Gemini', anthropic: 'Claude' };

// --- one campaign, opened ---
//
// Everything /dm roster, /corrections and /history used to answer, plus the
// two things you actually do with them.
//
// Rendered into its own card, and NOT from the five-second poll. Two reasons:
// this data changes a few times a month rather than a few times a minute, so
// polling it for every campaign the bot serves would grow each request with
// the size of the whole install; and a panel containing a half-typed character
// name must not be one of the things a refresh throws away.

let openCampaignId = null;

function consentClass(state) {
  return state === 'granted' ? 'yes' : state === 'declined' ? 'no' : 'maybe';
}

function rosterRow(view, p) {
  // The Discord display name is what the operator recognises; the id is what
  // the action needs. Showing both means a roster entry is identifiable even
  // for someone the bot has never heard speak, who therefore has no name.
  const who = p.displayName ? esc(p.displayName) : `user ${esc(p.userId)}`;
  const plays = p.characterName ? `plays <b>${esc(p.characterName)}</b>` : '<i>no character set</i>';
  const heard = p.lines ? `${p.lines} line${p.lines === 1 ? '' : 's'}` : 'not recorded yet';

  return `
    <div class="who">
      <div>
        <div>${who}${p.enrolled ? '' : ' <span class="tag warn">not on the roster</span>'}</div>
        <div class="sub">${plays} · ${heard} · <span class="${consentClass(p.consent.state)}">${esc(p.consent.label)}</span></div>
      </div>
      <div class="acts">
        <form class="inline gated" data-act="roster/character" data-campaign="${view.id}" data-user="${esc(p.userId)}">
          <input name="name" placeholder="character" value="${esc(p.characterName || '')}" size="12"
                 aria-label="Character name for ${who}">
          <button type="submit" class="go">Save</button>
        </form>
        ${p.characterName ? `<button data-act="roster/forget" data-campaign="${view.id}" data-user="${esc(p.userId)}">Clear</button>` : ''}
      </div>
    </div>`;
}

function sessionRow(view, s) {
  const done = s.lines > 0;
  return `
    <div class="who">
      <div>
        <div>${esc(s.ref || `#${s.meetingId}`)}</div>
        <div class="sub">${esc((s.startedAt || '').slice(0, 10))} · ${esc(s.status)}${s.lines ? ` · ${s.lines} lines` : ''}</div>
      </div>
      <div class="acts">
        ${s.hasNotes ? `<button class="go" data-notes="${s.meetingId}">Notes</button>` : ''}
        ${done ? `<button data-download="${s.meetingId}">Transcript</button>` : ''}
        ${done ? `<button data-act="summary/again" data-meeting="${s.meetingId}" data-confirm="Write the notes for ${s.ref || `#${s.meetingId}`} again?">Re-summarise</button>` : ''}
      </div>
    </div>`;
}

function renderDetail(view) {
  // Held so the notes reader can offer previous/next without another request.
  // Newest first, matching the order they are listed in.
  notesSessions = view.sessions.filter((s) => s.hasNotes);

  $('detail').className = 'card wide open';
  $('detail').innerHTML = `
    <div class="detail-head">
      <h2>${esc(view.label)}</h2>
      <span class="muted">${view.roster.length} at the table · ${view.sessions.length} session${view.sessions.length === 1 ? '' : 's'}</span>
      <span style="margin-left:auto"><button data-close-detail>Close</button></span>
    </div>
    <div class="cols">
      <div>
        <h3>Roster</h3>
        ${view.roster.length ? view.roster.map((p) => rosterRow(view, p)).join('') : empty('Nobody yet.')}
      </div>
      <div>
        <h3>Corrections</h3>
        ${
          view.corrections.length
            ? view.corrections
                .map(
                  (c) => `
              <div class="who">
                <div><div>"${esc(c.wrong)}" → <b>${esc(c.right)}</b></div></div>
                <div class="acts">
                  <button data-act="corrections/remove" data-campaign="${view.id}" data-wrong="${esc(c.wrong)}">Remove</button>
                </div>
              </div>`
                )
                .join('')
            : empty('None saved.')
        }
        <form class="inline" data-act="corrections/add" data-campaign="${view.id}">
          <input name="wrong" placeholder="what whisper hears" required>
          <input name="right" placeholder="what it should say" required>
          <button type="submit">Add</button>
        </form>
        <div class="sub muted" style="margin-top:8px">
          Applied to every future transcript, and replayed over this campaign's existing ones.
        </div>
      </div>
      <div>
        <h3>Sessions</h3>
        ${view.sessions.length ? view.sessions.map((s) => sessionRow(view, s)).join('') : empty('None recorded.')}

        <h3>Import a recording</h3>
        <form class="inline" data-act="import" data-campaign="${view.id}">
          <input name="url" type="url" placeholder="https://… link to the audio" required style="flex:1 1 100%">
          <input name="speaker" placeholder="speaker label (default: Table)" size="14">
          <button type="submit" class="go">Import</button>
        </form>
        <div class="sub muted" style="margin-top:8px">
          For a game played in person, or anything recorded outside Discord. It runs through the same
          transcribe → summarise → post pipeline, and appears under "Working on" once it starts.
          <b>Every line is attributed to one label</b> — a single microphone has no per-speaker channels.
        </div>
      </div>
    </div>`;
}

async function openCampaign(id, { quiet = false } = {}) {
  openCampaignId = id;
  // Something immediately, so a click on a slow link is not indistinguishable
  // from a click that did nothing. Skipped when refreshing an already-open
  // panel after an action, which would otherwise flash the whole thing away.
  if (!quiet) {
    $('detail').className = 'card wide open';
    $('detail').innerHTML = '<div class="skeleton">Loading</div>';
  }
  try {
    const res = await fetch(`${API}/campaign?id=${id}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    renderDetail(await res.json());
  } catch (err) {
    toast(`Couldn't load that campaign — ${err.message}`, false);
    closeCampaign();
  }
}

function closeCampaign() {
  openCampaignId = null;
  notesSessions = [];
  $('detail').className = 'card wide';
  $('detail').innerHTML = '';
  // Notes belong to the campaign that was open; leaving them behind would
  // leave one table's recap sitting under another table's roster.
  closeNotes();
}

// --- reading a session's notes ---
//
// The recap used to be readable only where it was posted, in a Discord message
// that scrolls away, or in the exported markdown on whichever machine the
// vault syncs to. Neither is a way to look something up six weeks later.

// Sessions of the open campaign that have notes, newest first — so the reader
// gets previous/next without another request.
let notesSessions = [];

const bullets = (title, lines, cls = '') =>
  lines.length ? `<h3>${title}</h3><ul class="${cls}">${lines.map((l) => `<li>${esc(l)}</li>`).join('')}</ul>` : '';

function renderNotes(n) {
  const at = notesSessions.findIndex((s) => s.meetingId === n.meetingId);
  const older = at >= 0 && at < notesSessions.length - 1 ? notesSessions[at + 1] : null;
  const newer = at > 0 ? notesSessions[at - 1] : null;

  const body = n.unreadable
    ? `<div class="note">These notes are on disk but aren't readable — the stored summary isn't valid JSON.
         Re-summarising the session will write them again.</div>`
    : !n.written
      ? empty('No notes yet — this session has not been summarised.')
      : `
        <div class="notes-body">
          <div class="tldr">${esc(n.tldr) || '<i>No recap was written.</i>'}</div>
          ${
            n.scenes.length
              ? `<h3>What happened</h3>` +
                n.scenes
                  .map(
                    (s) => `
                <div class="scene">
                  <h4>${esc(s.title)}</h4>
                  <ul>${s.points.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>
                </div>`
                  )
                  .join('')
              : ''
          }
          ${bullets('Party decisions', n.partyDecisions)}
          ${bullets('Still unresolved', n.unresolvedThreads)}
          ${bullets('Follow-ups', n.followUps)}
          ${bullets('NPCs introduced', n.npcsIntroduced)}
          ${bullets('Locations', n.locationsVisited)}
          ${bullets('Loot and rewards', n.lootAndRewards)}
          ${bullets('Worth remembering', n.funnyMoments, 'funny')}
        </div>`;

  $('notes').className = 'card wide open';
  $('notes').innerHTML = `
    <div class="notes-nav">
      <button data-notes="${older ? older.meetingId : ''}" ${older ? '' : 'disabled'}>← ${
        older ? esc(older.ref || `#${older.meetingId}`) : 'earlier'
      }</button>
      <button data-notes="${newer ? newer.meetingId : ''}" ${newer ? '' : 'disabled'}>${
        newer ? esc(newer.ref || `#${newer.meetingId}`) : 'later'
      } →</button>
      <span style="margin-left:auto"><button data-close-notes>Close</button></span>
    </div>
    <div class="detail-head">
      <h2>${esc(n.ref || `Session #${n.meetingId}`)}</h2>
      <span class="muted">${esc(n.campaign)} · ${esc((n.startedAt || '').slice(0, 10))}${
        n.lines ? ` · ${n.lines} lines` : ''
      }</span>
    </div>
    ${body}`;
  $('notes').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function openNotes(meetingId) {
  try {
    const res = await fetch(`${API}/notes?meeting=${meetingId}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    renderNotes(await res.json());
  } catch (err) {
    toast(`Couldn't load those notes — ${err.message}`, false);
  }
}

function closeNotes() {
  $('notes').className = 'card wide';
  $('notes').innerHTML = '';
}

// The transcript needs the auth header, which a plain <a href> cannot carry —
// so it is fetched and handed to the browser as a blob rather than linked.
async function downloadTranscript(meetingId) {
  try {
    const res = await fetch(`${API}/transcript?meeting=${meetingId}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement('a');
    a.href = url;
    a.download = `session-${meetingId}-transcript.txt`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (err) {
    toast(`Couldn't fetch that transcript — ${err.message}`, false);
  }
}

const DISABLED_NOTE =
  '<div class="note">Actions are turned off on this bot — set <code>STATUS_TOKEN</code> in ' +
  '<code>pi-service/.env</code> (and in the dashboard) to approve from here.</div>';

let toastTimer = null;
function toast(message, ok) {
  const el = $('toast');
  el.textContent = message;
  el.className = `toast show ${ok ? 'good' : 'bad'}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, ok ? 4000 : 9000);
}

// One listener for every button on the page, rather than one per render.
//
// The cards are rebuilt from scratch every five seconds, so any handler
// attached to a button would be thrown away with it — and a click landing in
// the gap between two renders would do nothing at all. Delegation survives
// the rebuild because it is bound to the document, not to the buttons.
document.addEventListener('click', async (event) => {
  // Opening a campaign, closing it, and downloading a transcript are not
  // actions against the API's action table, so they are handled before it.
  if (event.target.closest('[data-close-detail]')) return closeCampaign();
  if (event.target.closest('[data-close-notes]')) return closeNotes();

  const notes = event.target.closest('button[data-notes]');
  if (notes) return notes.dataset.notes ? openNotes(Number(notes.dataset.notes)) : undefined;

  const download = event.target.closest('button[data-download]');
  if (download) return downloadTranscript(download.dataset.download);

  const row = event.target.closest('.camp[data-campaign]');
  if (row) {
    const id = Number(row.dataset.campaign);
    return id === openCampaignId ? closeCampaign() : openCampaign(id);
  }

  const button = event.target.closest('button[data-act]');
  if (!button || button.disabled) return;
  // A submit button inside a form is the form's business, not this listener's
  // — otherwise adding a correction would fire twice, once here without the
  // typed values and once from the submit handler with them.
  if (button.type === 'submit') return;

  if (button.dataset.confirm && !confirm(button.dataset.confirm)) return;

  // Disabled for the round trip so an impatient second click cannot send the
  // same approval twice. The API refuses the duplicate anyway — this just
  // stops the page reporting a confusing "already released" at someone who
  // only meant to click once.
  const label = button.textContent;
  button.disabled = true;
  button.textContent = '…';

  const d = button.dataset;
  const body = {};
  if (d.job) body.jobId = Number(d.job);
  if (d.meeting) body.meetingId = Number(d.meeting);
  if (d.campaign) body.campaignId = Number(d.campaign);
  if (d.user) body.userId = d.user;
  if (d.wrong) body.wrong = d.wrong;
  if (d.provider) body.provider = d.provider;
  if (d.action) body.action = d.action;
  if (d.queue) body.queue = d.queue;
  if (d.paused) body.paused = d.paused === 'true';

  await send(d.act, body);
  button.disabled = false;
  button.textContent = label;
});

// Forms rather than buttons wherever there is something to type. A form gives
// Enter-to-submit and required-field validation for free, and both matter for
// the two things typed most often here: a character name and a correction.
document.addEventListener('submit', async (event) => {
  const form = event.target.closest('form[data-act]');
  if (!form) return;
  event.preventDefault();

  const body = Object.fromEntries(new FormData(form));
  if (form.dataset.campaign) body.campaignId = Number(form.dataset.campaign);
  if (form.dataset.user) body.userId = form.dataset.user;

  const submit = form.querySelector('button[type=submit]');
  if (submit) submit.disabled = true;
  await send(form.dataset.act, body);
  if (submit) submit.disabled = false;
});

// One place that talks to the action API, so the refresh-afterwards rule and
// the error handling are not written twice.
async function send(action, body) {
  try {
    const res = await fetch(`${API}/actions/${action}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const payload = await res.json().catch(() => ({}));
    toast(payload.message || `HTTP ${res.status}`, res.ok && payload.ok !== false);
  } catch (err) {
    toast(`Couldn't reach the bot — ${err.message}`, false);
    return;
  }

  // Straight to a refresh rather than waiting up to five seconds: the whole
  // point of pressing the button is to watch the thing move. The open campaign
  // is reloaded too, since roster and correction actions change what it shows
  // and nothing else will refresh it.
  tick();
  if (openCampaignId) openCampaign(openCampaignId, { quiet: true });
}

// --- keyboard ---
//
// The campaign rows are this page's main navigation and were plain divs with a
// click handler: invisible to Tab, unusable without a mouse. They are buttons
// now in every sense but the tag, so they answer to Enter and Space too.
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    // Innermost first, so Escape backs out one level at a time rather than
    // closing everything and losing your place in the campaign.
    if ($('notes').classList.contains('open')) return closeNotes();
    if (openCampaignId) return closeCampaign();
    return;
  }

  const row = event.target.closest?.('.camp[data-campaign]');
  if (row && (event.key === 'Enter' || event.key === ' ')) {
    event.preventDefault();
    const id = Number(row.dataset.campaign);
    return id === openCampaignId ? closeCampaign() : openCampaign(id);
  }
});

// Save shows itself once a field actually differs from what was loaded — so a
// roster of seven reads as seven names, not seven buttons.
document.addEventListener('input', (event) => {
  const field = event.target.closest('form.inline.gated input');
  if (!field) return;
  const form = field.closest('form');
  const changed = [...form.elements].some((el) => el.name && el.value !== (el.defaultValue ?? ''));
  form.classList.toggle('dirty', changed);
});

let lastSeen = null;

// "updated 21:43:07" is a clock time you have to compare against another clock
// time to learn the only thing you wanted: whether this is current. Seconds ago
// says it directly.
function sinceLastSeen() {
  if (!lastSeen) return 'never';
  const s = Math.round((Date.now() - lastSeen) / 1000);
  if (s < 2) return 'just now';
  if (s < 60) return `${s}s ago`;
  const m = Math.floor(s / 60);
  return m < 60 ? `${m}m ago` : `${Math.floor(m / 60)}h ago`;
}

async function tick() {
  try {
    const res = await fetch(`${API}/status`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    render(await res.json());
    lastSeen = Date.now();
    document.body.classList.remove('stale');
    $('err').style.display = 'none';
  } catch (err) {
    // The bot being unreachable is itself information — say so plainly rather
    // than freezing on numbers that look current. The page dims as well as
    // saying so: a dashboard confidently showing "not recording" while it has
    // no idea is worse than one that admits it lost contact.
    document.body.classList.add('stale');
    document.title = 'Quill — offline';
    $('err').style.display = 'block';
    $('err').innerHTML = `Can't reach the bot at <code>${esc(API)}</code> — ${esc(err.message)}.
      Showing what it last said, ${esc(sinceLastSeen())}.<br>
      Is the Pi up, and is <code>STATUS_PORT</code> set? Override with <code>?api=http://host:port</code>.`;
    $('who').innerHTML = `${dot(false)}unreachable`;
  }
}

// Ticks on its own second so the age keeps counting up while the bot is
// unreachable, instead of freezing at whatever it said when contact was lost.
setInterval(() => {
  $('stamp').textContent = `updated ${sinceLastSeen()}`;
}, 1000);

tick();
setInterval(tick, 5000);
</script>
</body>
</html>
