<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quill</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Cpath d='M20.5 2.6c-7 .9-11.8 5-14 11.4l-1.7 4.9 4.8-1.7C16 15 20 10.2 20.5 2.6Z' stroke='%23C9A227' stroke-width='1.3' stroke-linejoin='round'/%3E%3Cpath d='M5.1 19.6 2.6 22.2' stroke='%23C9A227' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- Three faces, each with one job: Plex Sans for interface, Plex Mono for
     anything read as a value (clocks, counts, refs), Spectral for prose the
     summariser wrote. Every one has a system fallback, because a LAN dashboard
     pointed at a Raspberry Pi is opened from machines with no internet. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* Quill's palette, taken from the design: brass on near-black, sage for
     what worked, red for what is live or broken, amber for what is waiting.
     Warm greys throughout — the ground leans blue and the text leans warm,
     which is what stops a dark interface reading as a terminal. */
  :root {
    --ink:      #0E1014;  /* the page */
    --panel:    #12151A;  /* rail and top bar */
    --column:   #111419;  /* the session column and the facts rail */
    --card:     #15181E;  /* cards on the page */
    --raise:    #1B1F26;  /* selected rows, secondary buttons */
    --sunk:     #0D1017;  /* inputs and read-only values */

    --line:     #232730;  /* the structural borders */
    --line-2:   #262A33;  /* input borders, outer frame */
    --rule:     #1D2027;  /* row rules inside a table */
    --edge:     #3A3529;  /* button borders — warm, not grey */
    --dash:     #2C313B;  /* dashed placeholder outlines */

    --text:     #E9E5DC;
    --text-2:   #C6C1B6;
    --dim:      #8A8578;

    --brass:    #C9A227;
    --brass-lit:#E5C86B;
    --brass-br: #6B5A22;  /* pill border at brass */
    --brass-bg: #241E12;  /* the one brass-tinted fill */
    --sage:     #7BA05B;
    --sage-lit: #A7C48F;
    --sage-br:  #3C4A33;
    --red:      #D0453C;
    --red-lit:  #E4A9A4;
    --red-br:   #6B322D;
    --red-bg:   #2A1817;
    --amber:    #D99A2B;

    --sans:  'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono:  'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    --serif: 'Spectral', Georgia, 'Times New Roman', serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ink); color: var(--text);
    font: 400 15px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { margin: 0; font-weight: 500; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 5px; }
  ::selection { background: #3a2f10; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

  /* Shared idioms, named for what they are rather than how they look. */
  .mono   { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .prose  { font-family: var(--serif); }
  .cap    { font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
            color: var(--dim); font-weight: 600; }
  .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .12em;
            text-transform: uppercase; color: var(--brass); }
  .kicker.done   { color: var(--sage-lit); }
  .kicker.wait   { color: var(--brass-lit); }
  .kicker.broken { color: var(--red-lit); }
  .muted  { color: var(--dim); }
  .quiet  { font-size: 13.5px; color: var(--dim); line-height: 1.6; }

  .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px;
         display: inline-block; background: var(--edge); vertical-align: middle; }
  .dot.ok    { background: var(--sage); }
  .dot.bad   { background: var(--red); }
  .dot.warn  { background: var(--amber); }
  .dot.brass { background: var(--brass); }
  .dot.live  { background: var(--red); animation: pulse 1.8s ease-in-out infinite; }

  /* --- buttons ------------------------------------------------------- */

  .btn { font-size: 13px; padding: 7px 14px; border-radius: 7px;
         border: 1px solid var(--edge); background: var(--raise); color: var(--text);
         cursor: pointer; white-space: nowrap;
         transition: background .13s, border-color .13s, color .13s; }
  .btn:hover:not(:disabled) { border-color: var(--dim); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.go { border-color: var(--brass); background: var(--brass); color: #12151A; font-weight: 600; }
  .btn.go:hover:not(:disabled) { background: var(--brass-lit); border-color: var(--brass-lit); }
  .btn.ghost { background: transparent; color: var(--dim); }
  .btn.ghost:hover:not(:disabled) { color: var(--text-2); }
  .btn.warn { border-color: var(--brass-br); background: var(--brass-bg); color: var(--brass-lit); }
  .btn.danger { border-color: var(--red-br); background: var(--red-bg); color: #E8B0AA; }
  .btn.sm { font-size: 12px; padding: 5px 12px; border-radius: 6px; }
  .btn.wide { width: 100%; padding: 8px 16px; }
  .btn.big { font-size: 14px; padding: 10px 20px; border-radius: 8px; }
  .row-btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .in { padding: 9px 12px; border-radius: 7px; border: 1px solid var(--line-2);
        background: var(--sunk); color: var(--text); font-size: 14px; width: 100%; }
  .in:focus-visible { border-color: var(--brass); outline: none; }
  .in::placeholder { color: #6E6A5E; }
  .val { font-family: var(--mono); font-size: 13.5px; padding: 8px 14px; border-radius: 7px;
         border: 1px solid var(--line-2); background: var(--sunk); color: var(--text);
         white-space: nowrap; }

  /* The segmented control: two or three exclusive choices, no dropdown. */
  .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--sunk);
         border: 1px solid var(--line-2); border-radius: 8px; }
  .seg button { font-size: 12.5px; padding: 6px 14px; border-radius: 5px; border: 0;
                background: transparent; color: var(--dim); cursor: pointer; }
  .seg button:hover:not(.on):not(:disabled) { color: var(--text-2); }
  .seg button.on { background: var(--brass); color: #12151A; font-weight: 600; }
  .seg button:disabled { cursor: default; }

  /* --- shell --------------------------------------------------------- */

  .app { display: flex; min-height: 100vh; }

  .rail { width: 268px; flex: 0 0 268px; background: var(--panel);
          border-right: 1px solid var(--line); display: flex; flex-direction: column;
          position: sticky; top: 0; height: 100vh; }
  .brand { padding: 26px 24px 22px; border-bottom: 1px solid var(--line);
           display: flex; align-items: center; gap: 12px; }
  .brand .name { font-family: var(--serif); font-size: 21px; line-height: 1.15; letter-spacing: .3px; }
  .brand .sub { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-top: 4px; }
  .rail > .cap { padding: 22px 24px 10px; }
  .rail-list { padding: 0 12px; display: flex; flex-direction: column; gap: 6px;
               flex: 0 1 auto; min-height: 0; overflow-y: auto; }
  .rail-nav { padding: 10px 12px 4px; display: flex; flex-direction: column; gap: 2px;
              border-top: 1px solid var(--line); margin-top: 14px; }
  .rail-foot { margin-top: auto; padding: 20px 24px; border-top: 1px solid var(--line);
               font-family: var(--mono); font-size: 11px; color: var(--dim); line-height: 1.7; }

  .camp { display: block; width: 100%; text-align: left; padding: 14px; border: 0;
          border-left: 2px solid transparent; border-radius: 8px; background: transparent;
          cursor: pointer; transition: background .13s; }
  .camp:hover { background: #171B21; }
  .camp.on { background: var(--raise); border-left-color: var(--brass); }
  .camp .l1 { display: flex; align-items: center; gap: 10px; }
  .camp .nm { font-size: 15px; color: var(--text-2); }
  .camp.on .nm { color: var(--text); font-weight: 500; }
  .camp .meta { font-family: var(--mono); font-size: 11px; color: var(--dim);
                margin-top: 7px; line-height: 1.6; }
  .badge { margin-left: auto; font-family: var(--mono); font-size: 10.5px; font-weight: 600;
           background: var(--brass); color: #12151A; padding: 1px 6px; border-radius: 999px; }

  .navlink { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
             padding: 9px 14px; border: 0; border-left: 2px solid transparent;
             border-radius: 8px; background: transparent; color: var(--dim);
             font-size: 14px; cursor: pointer; }
  .navlink:hover { color: var(--text-2); }
  .navlink.on { background: var(--raise); border-left-color: var(--brass); color: var(--text); }
  .navlink .n { font-family: var(--mono); font-size: 11px; color: var(--dim); }

  .placeholder { border: 1px dashed var(--dash); border-radius: 8px;
                 padding: 20px 16px; text-align: center; margin: 0 12px; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .top { height: 76px; flex: 0 0 76px; border-bottom: 1px solid var(--line);
         display: flex; align-items: center; gap: 28px; padding: 0 32px;
         background: var(--panel); position: sticky; top: 0; z-index: 5; }
  .top h2 { font-family: var(--serif); font-size: 22px; font-weight: 400; }
  .top .health { display: flex; gap: 20px; align-items: center;
                 font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .top .health .dot { margin-right: 7px; }
  .top .health .down { color: var(--red-lit); }
  .top .health .held { color: var(--brass-lit); }
  .top .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .crumb { font-family: var(--mono); font-size: 12.5px; color: var(--dim); }
  .crumb-sep { color: var(--edge); }

  /* --- the degraded banner ------------------------------------------- */

  .banner { background: #1E1519; border-bottom: 1px solid #4A2B2B;
            padding: 22px 40px; display: flex; align-items: center; gap: 24px; }
  .banner .say { font-family: var(--serif); font-size: 21px; }
  .banner .why { font-size: 13.5px; color: var(--text-2); margin-top: 6px; line-height: 1.55; }
  .banner-more { padding: 26px 40px; border-bottom: 1px solid var(--line);
                 display: flex; gap: 34px; align-items: flex-start; flex-wrap: wrap; }

  /* --- the split ----------------------------------------------------- */

  /* The mockups are fixed 1920×1080 canvases, so they clip. A real session
     list is forty sessions and a real recap is two screens of prose, so the
     two columns that must not move — the session list and the facts rail —
     stick under the top bar and scroll inside themselves, and the document
     scrolls the reading column. */
  .split { flex: 1; display: flex; align-items: flex-start; }

  .sessions { flex: 0 0 430px; border-right: 1px solid var(--line); background: var(--column);
              display: flex; flex-direction: column;
              position: sticky; top: 76px; height: calc(100vh - 76px); }
  .sessions .head { padding: 20px 24px 12px; display: flex; align-items: baseline; gap: 12px; }
  .sessions .head .hint { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
  .sess-list { flex: 1; overflow-y: auto; padding: 0 12px 12px;
               display: flex; flex-direction: column; gap: 4px; }
  .sessions .foot { padding: 16px 24px; border-top: 1px solid var(--line); }

  .sess { padding: 13px 14px; border-radius: 8px; background: transparent; border: 0;
          width: 100%; text-align: left; cursor: pointer; display: block;
          transition: background .13s; }
  .sess:hover { background: #171B21; }
  .sess.on { background: var(--raise); box-shadow: inset 2px 0 0 var(--brass); }
  .sess.on.failed { box-shadow: inset 2px 0 0 var(--red); }
  .sess .l1 { display: flex; align-items: baseline; gap: 10px; }
  .sess .ref { font-size: 14.5px; color: var(--text); }
  .sess.on .ref, .sess.needs .ref { font-weight: 500; }
  .sess.dead .ref { color: var(--dim); }
  .sess .when { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .sess .say { font-family: var(--serif); font-size: 13.5px; color: var(--text-2);
               margin-top: 8px; line-height: 1.6; }
  .sess .plain { font-size: 13px; color: var(--dim); margin-top: 7px; line-height: 1.5; }
  .sess .facets { display: flex; gap: 14px; margin-top: 9px; flex-wrap: wrap;
                  font-family: var(--mono); font-size: 10.5px; color: var(--dim); }

  .pill { margin-left: auto; font-family: var(--mono); font-size: 10.5px;
          padding: 2px 8px; border-radius: 999px; border: 1px solid var(--edge);
          color: var(--dim); white-space: nowrap; }
  .pill.posted    { border-color: var(--sage-br); color: var(--sage-lit); }
  .pill.approval  { border-color: var(--brass-br); color: var(--brass-lit); }
  .pill.failed    { border-color: var(--red-br); color: var(--red-lit); }
  .pill.recording { border-color: var(--red-br); color: var(--red-lit); }

  /* --- the pane ------------------------------------------------------ */

  .pane { flex: 1; min-width: 0; display: flex; align-items: flex-start; }
  .pane-main { flex: 1; min-width: 0; padding: 30px 40px 44px; }
  .pane-wide { max-width: 980px; }

  .tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--line); }
  .tab { font-size: 14.5px; padding: 0 0 13px; background: transparent; border: 0;
         border-bottom: 2px solid transparent; color: var(--dim); cursor: pointer; }
  .tab:hover { color: var(--text-2); }
  .tab.on { color: var(--text); border-bottom-color: var(--brass); font-weight: 500; }
  .tab .n { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-left: 5px; }

  .display { font-family: var(--serif); font-size: 38px; font-weight: 500;
             letter-spacing: -.4px; line-height: 1.1; }
  .display.sm { font-size: 30px; letter-spacing: -.3px; }
  .lede { font-family: var(--serif); font-size: 19px; line-height: 1.65;
          margin-top: 20px; max-width: 66ch; text-wrap: pretty; }
  .say-2 { font-size: 15.5px; color: var(--text-2); margin-top: 16px;
           line-height: 1.65; max-width: 70ch; }

  .scene { border-left: 2px solid var(--line); padding-left: 18px; margin-top: 18px; }
  .scene h4 { font-family: var(--serif); font-size: 17px; margin-bottom: 7px; }
  .scene p { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--text-2); }
  .numbered { max-width: 70ch; display: flex; flex-direction: column; gap: 8px; }
  .numbered div { display: flex; gap: 12px; font-size: 14.5px; line-height: 1.6; color: var(--text-2); }
  .numbered span.i { color: var(--brass); font-family: var(--mono); font-size: 12px; padding-top: 3px; }

  .facts { flex: 0 0 340px; border-left: 1px solid var(--line); background: var(--column);
           padding: 34px 30px 44px; display: flex; flex-direction: column; gap: 24px;
           position: sticky; top: 76px; max-height: calc(100vh - 76px); overflow-y: auto; }
  .facts .who { font-size: 14px; font-weight: 500; }
  .facts .what { font-size: 13px; color: var(--dim); margin-top: 2px; line-height: 1.5; }
  .facts .plainlist { font-size: 14px; line-height: 1.7; color: var(--text-2); }
  .facts .stack { display: flex; flex-direction: column; gap: 11px; }
  .facts .stack .big { font-size: 14px; line-height: 1.55; color: var(--text); }
  .keep { border-left: 2px solid var(--brass); padding-left: 16px; }
  .keep .cap { color: var(--brass); }
  .keep p { font-family: var(--serif); font-size: 14.5px; line-height: 1.6;
            color: var(--brass-lit); margin: 10px 0 0; }

  /* --- cards and step lists ------------------------------------------ */

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 20px 22px; }
  .card.good { border-color: var(--sage-br); }
  .card h4 { font-family: var(--serif); font-size: 19px; margin-top: 10px; font-weight: 400; }
  .aside { flex: 0 0 330px; display: flex; flex-direction: column; gap: 18px; }

  .steps { display: flex; flex-direction: column; gap: 2px; }
  .steps > div { display: flex; align-items: center; gap: 16px; padding: 18px 20px;
                 background: var(--card); border: 1px solid var(--line); }
  .steps > div:first-child { border-radius: 10px 10px 0 0; }
  .steps > div:last-child { border-radius: 0 0 10px 10px; }
  .steps > div.now { background: #181B21; border-color: var(--edge); }
  .steps .mark { width: 24px; height: 24px; flex: 0 0 24px; border-radius: 50%;
                 border: 1px solid var(--edge); color: var(--dim);
                 display: flex; align-items: center; justify-content: center;
                 font-family: var(--mono); font-size: 12px; }
  .steps .mark.done { background: var(--sage-br); border-color: var(--sage-br); color: var(--sage-lit); }
  .steps .mark.live { background: var(--brass); border-color: var(--brass);
                      animation: pulse 1.6s ease-in-out infinite; }
  .steps .what { font-size: 15px; }
  .steps .sub { font-family: var(--mono); font-size: 11.5px; color: var(--dim); margin-top: 3px; }
  .bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; background: var(--brass); }

  /* --- the roster and correction grids -------------------------------- */

  .grid { width: 100%; }
  .grid .hd, .grid .tr { display: grid; gap: 14px; align-items: center; }
  .grid .hd { padding-bottom: 12px; border-bottom: 1px solid var(--line);
              font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
              text-transform: uppercase; color: var(--dim); }
  .grid .tr { padding: 15px 0; border-bottom: 1px solid var(--rule); }
  .grid .tr:last-child { border-bottom: 0; }
  .grid .r { text-align: right; }
  .roster .hd, .roster .tr { grid-template-columns: 1.4fr 1.4fr 90px 150px 190px; }
  .corr .hd, .corr .tr { grid-template-columns: 1fr 1fr 130px 100px; }
  .set-row { display: flex; justify-content: space-between; align-items: center; gap: 20px;
             padding: 16px 0; border-bottom: 1px solid var(--rule); }
  .set-row .what { font-size: 15px; }
  .set-row .sub { font-size: 13px; color: var(--dim); margin-top: 3px; }

  .share { display: inline-flex; align-items: center; gap: 10px; justify-content: flex-end; }
  .share i { width: 62px; height: 5px; border-radius: 3px; background: var(--line);
             display: block; overflow: hidden; }
  .share i b { display: block; height: 100%; background: var(--brass); }
  .share i.quiet b { background: var(--edge); }
  .unset { color: var(--dim); font-style: italic; }
  .agreed { color: var(--sage-lit); } .waiting { color: var(--amber); }
  .never { color: var(--amber); } .declined { color: var(--red-lit); }
  .as-val { font-family: var(--mono); font-size: 11.5px; }

  .charbtn { background: transparent; border: 0; border-bottom: 1px dotted transparent;
             padding: 0; text-align: left; cursor: pointer; font-size: 14.5px; }
  .charbtn:hover { border-bottom-color: var(--edge); }

  /* --- the transcript reader ------------------------------------------ */

  .tr-bar { padding: 20px 36px; border-bottom: 1px solid var(--rule);
            display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
            position: sticky; top: 76px; z-index: 3; background: var(--ink); }
  .chip { font-family: var(--mono); font-size: 11.5px; padding: 5px 11px; border-radius: 999px;
          border: 1px solid var(--line-2); background: transparent; color: var(--dim); cursor: pointer; }
  .chip.on { background: var(--raise); border-color: var(--edge); color: var(--text); }
  .lines { flex: 1; padding: 8px 36px 40px; }
  .line { display: grid; grid-template-columns: 82px 148px 1fr; gap: 20px;
          padding: 11px 0; align-items: baseline; }
  .line:nth-child(even) { background: var(--column); }
  .line .t { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
  .line .who { font-size: 14px; color: var(--text-2); }
  .line .who.gm { color: var(--brass); }
  .line .said { font-size: 15px; line-height: 1.6; color: var(--text); }
  .line mark { background: transparent; color: var(--brass-lit); border-bottom: 1px dotted var(--brass); }

  /* --- the import dialog ---------------------------------------------- */

  .backdrop { position: fixed; inset: 0; background: #08090CCC; z-index: 20;
              display: grid; place-items: center; padding: 24px; }
  .dialog { width: min(720px, 100%); max-height: 90vh; overflow-y: auto;
            background: var(--card); border: 1px solid var(--edge); border-radius: 14px;
            box-shadow: 0 40px 90px #000A; padding: 34px 38px; }
  .dialog h1 { font-family: var(--serif); font-size: 31px; font-weight: 500;
               margin: 12px 0 0; letter-spacing: -.3px; }
  .dialog .foot { display: flex; align-items: center; gap: 10px; margin-top: 28px;
                  padding-top: 22px; border-top: 1px solid var(--line); }
  .field { margin-top: 18px; }
  .field > label { display: block; font-size: 12.5px; color: var(--dim); margin-bottom: 7px; }
  .warnbox { border-left: 2px solid var(--amber); padding: 2px 0 2px 16px; margin-top: 18px;
             font-size: 13.5px; color: var(--brass-lit); line-height: 1.6; }

  /* --- odds and ends --------------------------------------------------- */

  .empty { display: flex; flex-direction: column; justify-content: center;
           align-items: flex-start; gap: 14px; padding: 0 24px; flex: 1; }
  .empty .say { font-family: var(--serif); font-size: 20px; color: var(--text-2); line-height: 1.35; }
  .center { padding: 72px 60px; max-width: 820px; }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
           max-width: 680px; padding: 12px 18px; border-radius: 9px;
           background: var(--card); border: 1px solid var(--edge);
           box-shadow: 0 10px 34px #000A; font-size: 13.5px; z-index: 40;
           opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  .toast.good { border-color: var(--sage-br); }
  .toast.bad { border-color: var(--red-br); color: var(--red-lit); }
  code { font-family: var(--mono); font-size: 12.5px; background: var(--raise);
         border-radius: 4px; padding: 1px 6px; }
  body.stale .main, body.stale .rail-list { opacity: .55; transition: opacity .3s; }

  /* Narrow screens: the columns stack rather than shrink to unreadable.
     A phone is a real way this gets opened — to approve a summary from the
     sofa — and the session list is the part that matters there. */
  @media (max-width: 1500px) { .facts.optional { display: none; } }
  @media (max-width: 1180px) {
    .facts { display: none; }
    .split { flex-direction: column; }
    .sessions { flex: none; width: 100%; border-right: 0;
                border-bottom: 1px solid var(--line);
                position: static; height: auto; }
    .sess-list { max-height: 42vh; }
    .pane { width: 100%; }
    .pane-main { padding: 26px 24px 40px; }
    .tr-bar { position: static; }
  }
  @media (max-width: 820px) {
    .app { flex-direction: column; }
    .rail { width: 100%; flex: none; height: auto; position: static;
            border-right: 0; border-bottom: 1px solid var(--line); }
    .rail-list { max-height: 190px; }
    .top { height: auto; flex: none; padding: 14px 18px; gap: 14px; flex-wrap: wrap; }
    .banner, .banner-more { padding: 18px 20px; }
    .lines, .tr-bar { padding-inline: 18px; }
    .line { grid-template-columns: 64px 1fr; }
    .line .said { grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="rail">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M20.5 2.6c-7 .9-11.8 5-14 11.4l-1.7 4.9 4.8-1.7C16 15 20 10.2 20.5 2.6Z" stroke="#C9A227" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M6.2 18.3c2.9-4.1 6.8-7.1 11.6-9" stroke="#C9A227" stroke-width="1" opacity=".5"/>
        <path d="M5.1 19.6 2.6 22.2" stroke="#C9A227" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="name">Quill</div>
        <div class="sub">the scribe at your table</div>
      </div>
    </div>
    <div class="cap">Campaigns</div>
    <div id="rail-list"></div>
    <div class="rail-nav" id="rail-nav"></div>
    <div class="rail-foot" id="rail-foot">connecting…</div>
  </nav>

  <main class="main">
    <header class="top" id="top"></header>
    <div id="banner"></div>
    <div id="screen" class="split"></div>
  </main>
</div>

<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
// Same origin by default: nginx proxies /api to the Pi and adds the status
// token on the way through, so the token never reaches the browser and the
// Pi's port can stay on the LAN even when the dashboard is published.
//
// ?api=http://host:port still overrides it, for pointing at a second bot.
const API = new URLSearchParams(location.search).get('api') || window.SCRIBER_API || '/api';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

// --- what the page is looking at ------------------------------------------
//
// Every render reads this rather than the DOM. The whole page is rebuilt from
// the poll every few seconds, so state kept in the markup would be thrown away
// mid-click.
const view = {
  screen: 'campaign',   // campaign | transcript | servers | access
  campaignId: null,
  tab: 'notes',         // notes | table | corrections | settings
  meetingId: null,
  editing: null,        // the user id whose character name is being typed
  importing: false,
  diagnosing: false,    // the degraded banner's detail is open
  search: '',
  speaker: null,        // transcript filter, a user id
};

let status = null;      // last /status
let detail = null;      // last /campaign?id=
let notes = null;       // last /notes?meeting=
let notesKey = null;    // the session and job those notes were fetched for
let script = null;      // last /transcript?…&format=json
let lastSeen = null;

const PROVIDERS = { gemini: 'Gemini', anthropic: 'Claude' };
const providerName = (p) => PROVIDERS[p] || p;

// --- small formatters ------------------------------------------------------

function hhmmss(ms) {
  if (ms == null) return '0:00:00';
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 3600)}:${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}
// A position in the recording, always hh:mm:ss — a three-hour session's
// timestamps have to stay comparable at a glance, and m:ss would read "202:15".
const clock = (ms) => {
  const s = Math.floor((ms ?? 0) / 1000);
  return `${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
};

// How long something ran, in the largest two units that say anything: "3:22"
// for a full evening, "0:04" for the session where everyone left before the
// bot had recorded a sentence. Both are states this actually renders.
const runtime = (ms) => {
  if (!ms) return null;
  const s = Math.round(ms / 1000);
  if (s < 3600) return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const m = Math.round(s / 60);
  return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
};
const shortDate = (iso) =>
  iso ? new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : '';
const longDate = (iso) =>
  iso ? new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const hhmm = (iso) =>
  iso ? new Date(iso).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) : '';
const n = (x) => Number(x ?? 0).toLocaleString();
const plural = (count, word) => `${n(count)} ${word}${count === 1 ? '' : 's'}`;

function since(ms) {
  if (ms == null) return 'never';
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 5) return 'just now';
  if (s < 60) return `${s}s ago`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  return h < 48 ? `${h}h ago` : `${Math.floor(h / 24)}d ago`;
}

const uptime = (ms) =>
  ms == null ? '' : `up ${Math.floor(ms / 86400000)}d ${new Date(ms).toISOString().slice(11, 16)}`;

// A user with no display name has never spoken, so all we have is the id.
// Shown as an id rather than as a blank, because that is the string you paste
// into /campaign invite.
const whoIs = (p) => p.displayName || `user ${p.userId.slice(0, 4)}…${p.userId.slice(-4)}`;

// The design's NPC entries are a name and a description. Real ones are one
// string, and the summariser chooses the punctuation between the two halves —
// so this is the same split the Obsidian exporter and the ledger use, kept
// deliberately identical to campaign/entry-name.js.
const SEPARATOR = /\s*:\s+|\s+[—–-]\s+|,\s+|\s+\(/;
function splitEntry(entry) {
  const s = String(entry ?? '').trim();
  const m = s.match(SEPARATOR);
  if (!m || m.index === 0) return { name: s, rest: '' };
  return { name: s.slice(0, m.index).trim(), rest: s.slice(m.index).replace(/^[\s:—–,(-]+/, '').replace(/\)$/, '') };
}

const dotFor = (state) => `<span class="dot ${state === true ? 'ok' : state === false ? 'bad' : ''}"></span>`;

const can = () => status?.actionsEnabled !== false;

// Where this campaign's notes end up, in words.
//
// Not a channel name with a # in front of it: a campaign's `channel` is the
// last VOICE channel it recorded in, and the default destination is that
// channel's own text feed — or NOTES_CHANNEL_ID, if the Pi sets one. Naming a
// channel here would be a guess, and it would be wrong on exactly the installs
// that configured something.
const destination = () =>
  detail?.output === 'dm' ? 'you, as a DM'
  : detail?.output === 'channel' ? "this campaign's notes channel"
  : 'the channel you played in';

const campaign = () => status?.campaigns?.find((c) => c.id === view.campaignId) ?? null;
const sessions = () => (detail?.sessions ?? []).map(normalise);
const selected = () => sessions().find((s) => s.meetingId === view.meetingId) ?? null;

// A bot older than this page does not send `state`, `job` or the recap facets.
// Deriving what can be derived keeps the page useful against it rather than
// printing "undefined" in every pill — the two are deployed from different
// places (this file from a bind mount, the fields from an image), so they are
// routinely a few minutes out of step.
function normalise(s) {
  if (s.state) return s;
  const st = s.status ?? '';
  return {
    ...s,
    state: st === 'done' ? 'posted' : st.endsWith('_failed') ? 'failed' : st === 'recording' ? 'recording' : 'queued',
    npcs: 0, locations: 0, threads: 0, tldr: '',
    discardable: s.lines === 0 && st !== 'recording',
  };
}

// ==========================================================================
// The rail
// ==========================================================================

function renderRail() {
  const camps = status?.campaigns ?? [];

  $('rail-list').className = camps.length ? 'rail-list' : '';
  $('rail-list').innerHTML = camps.length
    ? camps.map((c) => {
        const bits = [];
        if (c.sessions) bits.push(`${plural(c.sessions, 'session')} · ${c.hours.toFixed(1)}h`);
        else bits.push('no sessions yet');
        if (c.recording) bits.push('recording now');
        else if (c.awaiting) bits.push(`${c.awaiting} waiting on you`);
        else if (c.lines) bits.push(`${n(c.lines)} lines · ${plural(c.members, 'player')}`);
        else bits.push(plural(c.members, 'player'));

        return `<button class="camp${view.campaignId === c.id && view.screen !== 'servers' && view.screen !== 'access' ? ' on' : ''}"
                  data-campaign="${c.id}" aria-current="${view.campaignId === c.id}">
          <div class="l1">
            <span class="dot ${c.recording ? 'live' : c.claimed ? 'warn' : ''}"></span>
            <span class="nm">${esc(c.name || c.channel || 'unnamed')}</span>
            ${c.awaiting ? `<span class="badge">${c.awaiting}</span>` : ''}
          </div>
          <div class="meta">${bits.join('<br>')}</div>
        </button>`;
      }).join('')
    : `<div class="placeholder">
         <div style="font-size:13.5px;color:var(--dim);line-height:1.6">No campaigns yet</div>
         <div class="mono" style="font-size:11.5px;color:var(--brass);margin-top:8px">/campaign create</div>
       </div>`;

  const servers = status?.servers?.length ?? 0;
  $('rail-nav').innerHTML = `
    <button class="navlink${view.screen === 'servers' ? ' on' : ''}" data-screen="servers">
      Servers ${servers ? `<span class="n">${servers}</span>` : ''}
    </button>
    <button class="navlink${view.screen === 'access' ? ' on' : ''}" data-screen="access">Access</button>`;

  const b = status?.bot;
  $('rail-foot').innerHTML = b
    ? `${esc(b.user || 'offline')}<br>${uptime(b.uptimeMs)}<br><span id="stamp" style="opacity:.75"></span>`
    : 'connecting…';
}

// ==========================================================================
// The top bar
// ==========================================================================

function renderTop() {
  const h = status?.health ?? {};

  if (view.screen === 'transcript') {
    $('top').innerHTML = `
      <span class="crumb">${esc(script?.campaign || '')}</span>
      <span class="crumb-sep">/</span>
      <span class="crumb">Session ${script?.sessionNumber ?? ''}</span>
      <span class="crumb-sep">/</span>
      <h2>Transcript</h2>
      <div class="right">
        ${script ? `
          <button class="btn" data-copy-transcript>Copy all</button>
          <button class="btn" data-download="${script.meetingId}">Download .txt</button>
          ${script.total && can()
            ? `<button class="btn go" data-act="summary/again" data-meeting="${script.meetingId}"
                 data-confirm="Write the notes for ${esc(script.ref)} again?">Summarise this</button>`
            : ''}` : ''}
        <button class="btn ghost" data-screen="campaign">Close</button>
      </div>`;
    return;
  }

  const title =
    view.screen === 'servers' ? 'Servers'
    : view.screen === 'access' ? 'Access'
    : campaign()?.name || campaign()?.channel || (status?.campaigns?.length ? 'Quill' : 'Setup');

  const health = status
    ? [
        `<span class="${h.whisperServer === false ? 'down' : ''}">${dotFor(h.whisperServer)}whisper server</span>`,
        `<span class="${h.summariser === false ? 'down' : ''}">${dotFor(h.summariser)}${esc(h.summariserName || 'summariser')}</span>`,
        h.transcribePaused ? '<span class="held"><span class="dot warn"></span>transcribing paused</span>' : '',
        h.summarisePaused ? '<span class="held"><span class="dot warn"></span>summarising paused</span>' : '',
      ].filter(Boolean).join('')
    : '';

  // Each button says the state it moves TO, so it is the same click whatever
  // the page last managed to render — a toggle sent twice by a double-click,
  // or by two tabs open on this page, lands on the opposite of what the person
  // who clicked it saw.
  const buttons = can() && status
    ? `<button class="btn" data-act="pause" data-queue="transcribe" data-paused="${!h.transcribePaused}"
         ${h.transcribePaused ? '' : 'data-confirm="Pause transcription? Nothing new will start."'}>
         ${h.transcribePaused ? 'Resume transcribing' : 'Pause transcribing'}</button>
       <button class="btn" data-act="pause" data-queue="summarize" data-paused="${!h.summarisePaused}"
         ${h.summarisePaused ? '' : 'data-confirm="Pause summarising? Nothing new will start."'}>
         ${h.summarisePaused ? 'Resume summarising' : 'Pause summarising'}</button>`
    : '';

  $('top').innerHTML = `
    <h2>${esc(title)}</h2>
    <div class="health">${health}</div>
    <div class="right">${buttons}</div>`;
}

// ==========================================================================
// The banner — the transcriber being unreachable, said once, at the top
// ==========================================================================

function renderBanner() {
  const h = status?.health ?? {};
  if (!status || h.whisperServer !== false || view.screen === 'transcript') {
    $('banner').innerHTML = '';
    return;
  }

  const held = (status.queue?.queuedTranscribe?.length ?? 0) + (status.working?.transcribing?.length ?? 0);

  $('banner').innerHTML = `
    <div class="banner">
      <span class="dot bad" style="width:10px;height:10px;flex:0 0 10px"></span>
      <div style="flex:1">
        <div class="say">Quill cannot reach the transcriber on your PC.</div>
        <div class="why">
          Nothing is lost — recording, consent DMs and slash commands all still work.
          ${held ? `${plural(held, 'session')} ${held === 1 ? 'is' : 'are'} held until the machine comes back.` : ''}
          ${h.checkedAt ? `Last checked ${esc(since(new Date(h.checkedAt).getTime()))}.` : ''}
        </div>
      </div>
      <div class="row-btns">
        ${can() ? '<button class="btn danger" data-act="health/probe">Try again now</button>' : ''}
        <button class="btn ghost" data-diagnose>${view.diagnosing ? 'Hide the detail' : 'What is held'}</button>
      </div>
    </div>
    ${view.diagnosing ? diagnosis() : ''}`;
}

function diagnosis() {
  const q = status?.queue ?? {};
  const rows = [
    ...(status?.working?.transcribing ?? []).map((t) => ({ what: `Session #${t.meetingId}`, sub: t.description, tag: 'stopped' })),
    ...(q.queuedTranscribe ?? []).map((j) => ({ what: `Session #${j.meetingId}`, sub: `${plural(j.utterances, 'clip')} on disk`, tag: 'held' })),
    ...(q.awaitingTranscribe ?? []).map((j) => ({ what: `Session #${j.meetingId}`, sub: 'waiting on you, not the PC', tag: 'ready' })),
    ...(q.awaitingSummary ?? []).map((j) => ({ what: `Session #${j.meetingId}`, sub: 'already transcribed · waiting on you', tag: 'ready' })),
  ];

  return `
    <div class="banner-more">
      <div style="flex:1;min-width:280px">
        <div class="cap">The queue right now</div>
        ${rows.length ? `<div class="steps" style="margin-top:16px">${rows.map((r) => `
          <div>
            <div style="flex:1">
              <div class="what">${esc(r.what)}</div>
              <div class="sub">${esc(r.sub ?? '')}</div>
            </div>
            <span class="mono" style="font-size:11px;color:${r.tag === 'ready' ? 'var(--sage-lit)' : 'var(--brass-lit)'}">${r.tag}</span>
          </div>`).join('')}</div>` : '<div class="quiet" style="margin-top:12px">Nothing is queued.</div>'}
        <div class="quiet" style="margin-top:20px;max-width:70ch">
          Nothing expires while the transcriber is away. Audio is only deleted once a transcript exists,
          so every held session still has its clips.
        </div>
      </div>
      <div class="aside">
        <div class="card">
          <div class="cap">The transcriber</div>
          <div class="mono" style="font-size:12.5px;color:var(--text-2);margin-top:12px;line-height:1.9">
            ${esc(status?.health?.whisperServerHost || 'no WHISPER_SERVER_URL set')}<br>
            <span style="color:var(--red-lit)">no reply</span><br>
            checked ${esc(status?.health?.checkedAt ? since(new Date(status.health.checkedAt).getTime()) : 'never')}
          </div>
          <div class="quiet" style="margin-top:12px">
            Nearly always the PC being asleep. Wake it, then press “Try again now”.
          </div>
        </div>
        <div class="card">
          <div class="cap">Still working</div>
          <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px;font-size:13.5px;color:var(--text-2)">
            <div><span class="dot ok"></span> Recording voice channels</div>
            <div><span class="dot ok"></span> Consent DMs</div>
            <div><span class="dot ok"></span> Slash commands</div>
            <div><span class="dot ${status?.health?.summariser === false ? 'bad' : 'ok'}"></span> Summarising, once a transcript exists</div>
          </div>
        </div>
      </div>
    </div>`;
}

// ==========================================================================
// Screens
// ==========================================================================

function renderScreen() {
  const el = $('screen');

  if (view.screen === 'transcript') { el.className = 'split'; el.innerHTML = transcriptScreen(); return; }
  if (view.screen === 'servers')    { el.className = ''; el.innerHTML = serversScreen(); return; }
  if (view.screen === 'access')     { el.className = ''; el.innerHTML = accessScreen(); return; }

  if (status && !status.campaigns?.length) { el.className = ''; el.innerHTML = firstRun(); return; }

  el.className = 'split';
  el.innerHTML = `
    <div class="sessions">
      <div class="head">
        <div class="cap">Sessions</div>
        ${detail?.sessions?.length ? '<span class="hint">newest first</span>' : ''}
      </div>
      ${sessionColumn()}
      <div class="foot">
        <button class="btn wide" data-import>${detail?.sessions?.length ? 'Import a recording' : 'Import a recording instead'}</button>
      </div>
    </div>
    <div class="pane">
      <div class="pane-main">
        ${tabsBar()}
        ${paneBody()}
      </div>
      ${view.tab === 'notes' ? factsRail() : ''}
    </div>`;
}

// --- the first run ---------------------------------------------------------

function firstRun() {
  const h = status?.health ?? {};
  return `
    <div class="center">
      <div class="kicker">Nothing has been recorded yet</div>
      <h1 class="display" style="font-size:44px;margin-top:18px">Quill is on your server and listening for a table.</h1>
      <div class="say-2" style="font-size:16px">Four things to do once, then it runs on its own.</div>
      <div class="steps" style="margin-top:36px">
        <div>
          <span class="mark done">✓</span>
          <div style="flex:1">
            <div class="what">Quill is signed in${status?.servers?.length ? ` on ${plural(status.servers.length, 'server')}` : ''}</div>
            <div class="sub">${esc(status?.bot?.user || 'connecting…')}${status?.bot?.uptimeMs ? ` · ${uptime(status.bot.uptimeMs)}` : ''}</div>
          </div>
        </div>
        <div class="now">
          <span class="mark" style="border-color:var(--brass);color:var(--brass)">2</span>
          <div style="flex:1">
            <div class="what" style="font-weight:500">Make a campaign</div>
            <div class="sub" style="font-family:var(--sans);font-size:13px">One per game. It holds the roster, the corrections and every session.</div>
          </div>
          <code>/campaign create</code>
        </div>
        <div>
          <span class="mark">3</span>
          <div style="flex:1">
            <div class="what" style="color:var(--dim)">Point it at a voice channel</div>
            <div class="sub" style="font-family:var(--sans);font-size:13px">Quill joins when two of you are in it, and leaves when the last one goes.</div>
          </div>
          <code>/join</code>
        </div>
        <div>
          <span class="mark">4</span>
          <div style="flex:1">
            <div class="what" style="color:var(--dim)">Ask the table</div>
            <div class="sub" style="font-family:var(--sans);font-size:13px">Nobody is recorded until they say yes in a DM.</div>
          </div>
          <code>/campaign invite</code>
        </div>
      </div>
      <div class="quiet" style="margin-top:26px">
        The transcriber runs on your own machine —
        ${h.whisperServer === false ? 'Quill cannot reach it right now.' : h.whisperServer ? 'Quill can reach it.' : 'Quill has not checked yet.'}
        Audio never leaves your network.
      </div>
    </div>`;
}

// ==========================================================================
// The session column
// ==========================================================================

const PILL_WORD = { posted: 'posted', approval: 'approval', failed: 'failed',
                    recording: 'recording', queued: 'queued', working: 'working' };

function sessionColumn() {
  const list = sessions();
  if (!list.length) {
    return `
      <div class="empty">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" style="opacity:.5" aria-hidden="true">
          <path d="M20.5 2.6c-7 .9-11.8 5-14 11.4l-1.7 4.9 4.8-1.7C16 15 20 10.2 20.5 2.6Z" stroke="#8A8578" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M5.1 19.6 2.6 22.2" stroke="#8A8578" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <div class="say">Nothing here until you play.</div>
        <div class="quiet">
          Two of you in <span class="mono" style="color:var(--text-2)">${esc(detail?.channel || 'the voice channel')}</span>
          is enough — Quill joins on its own and this fills in.
        </div>
      </div>`;
  }
  return `<div class="sess-list">${list.map(sessionCard).join('')}</div>`;
}

function sessionCard(s) {
  const facets = [
    s.npcs ? plural(s.npcs, 'NPC') : '',
    s.locations ? plural(s.locations, 'location') : '',
    s.threads ? `${plural(s.threads, 'thread')} open` : '',
  ].filter(Boolean);

  const when = [
    shortDate(s.startedAt),
    s.lines ? `${n(s.lines)} lines` : s.state === 'recording' ? 'recording' : 'no audio',
  ].filter(Boolean).join(' · ');

  // One line about the session, in the summariser's own words where they
  // exist. Where they do not, the state is the sentence — which is the whole
  // reason the column is readable at a glance.
  const say = s.tldr
    ? `<div class="say">${esc(trim(s.tldr, 190))}</div>`
    : s.state === 'failed'   ? '<div class="plain">No usable audio in this session.</div>'
    : s.state === 'approval' && s.job?.type === 'summarize'
      ? '<div class="plain">Transcript is ready. Nothing has been summarised or posted yet.</div>'
    : s.state === 'approval' ? '<div class="plain">Waiting for you to say when it may transcribe.</div>'
    : s.state === 'working'  ? '<div class="plain">Being worked on now.</div>'
    : s.state === 'queued'   ? '<div class="plain">In the queue.</div>'
    : '';

  const flags = [
    view.meetingId === s.meetingId ? 'on' : '',
    s.state === 'failed' ? 'failed dead' : '',
    s.state === 'approval' ? 'needs' : '',
  ].filter(Boolean).join(' ');

  return `
    <button class="sess ${flags}" data-session="${s.meetingId}">
      <div class="l1">
        <span class="ref">${esc(s.ref || `#${s.meetingId}`)}</span>
        <span class="when">${esc(when)}</span>
        <span class="pill ${s.state}">${esc(PILL_WORD[s.state] || s.state)}</span>
      </div>
      ${say}
      ${facets.length ? `<div class="facets">${facets.map((f) => `<span>${esc(f)}</span>`).join('')}</div>` : ''}
    </button>`;
}

const trim = (s, max) =>
  s.length > max ? `${s.slice(0, max).replace(/\s+\S*$/, '')}…` : s;

// ==========================================================================
// The pane: four tabs, and the session reader under "Notes"
// ==========================================================================

function tabsBar() {
  if (!detail) return '';
  const tabs = [
    ['table', 'The table', detail.roster.length],
    ['corrections', 'Corrections', detail.corrections.length],
    ['notes', 'Notes', 0],
    ['settings', 'Settings', 0],
  ];
  return `<div class="tabs">${tabs.map(([id, name, count]) => `
    <button class="tab${view.tab === id ? ' on' : ''}" data-tab="${id}">
      ${esc(name)}${count ? `<span class="n">${count}</span>` : ''}
    </button>`).join('')}</div>`;
}

function paneBody() {
  if (!detail) return '<div class="quiet" style="padding-top:30px">Loading…</div>';
  if (view.tab === 'table') return rosterTab();
  if (view.tab === 'corrections') return correctionsTab();
  if (view.tab === 'settings') return settingsTab();
  return sessionReader();
}

// --- Notes: whatever this session actually is ------------------------------

function sessionReader() {
  const s = selected();
  if (!s) {
    const list = sessions();
    return `<div style="padding-top:60px;max-width:60ch">
      <div class="display sm">${list.length ? 'Pick a session.' : 'Nothing to read yet.'}</div>
      <div class="say-2">${list.length
        ? 'The list on the left is every session this campaign has. Anything waiting on a decision says so.'
        : 'When Quill records a session, its notes land here as soon as the summariser has written them.'}</div>
    </div>`;
  }

  if (s.state === 'recording') return recordingPane(s);
  if (s.state === 'failed') return failedPane(s);
  if (s.job?.status === 'awaiting_approval' && s.job.type === 'summarize') return approvalPane(s);
  if (s.job?.status === 'awaiting_approval' && s.job.type === 'transcribe') return transcribePane(s);
  if (s.job && !s.hasNotes) return queuedPane(s);
  return notesPane(s);
}

function sessionKicker(s, tone = '') {
  const bits = [
    s.lines ? `${n(s.lines)} lines` : null,
    runtime(s.durationMs) ? `${runtime(s.durationMs)} recorded` : null,
    s.job?.provider ? providerName(s.job.provider) : null,
  ].filter(Boolean);
  return `
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
      <div class="kicker ${tone}">Session ${s.sessionNumber ?? s.meetingId} · ${esc(longDate(s.startedAt))}</div>
      ${bits.length ? `<span class="mono" style="font-size:11.5px;color:var(--dim)">${esc(bits.join(' · '))}</span>` : ''}
    </div>`;
}

// The notes, read as a document.
//
// The headline is the first scene's own title. Nothing in the stored recap is
// a title for the whole session — the schema has never had one — so rather
// than inventing a phrase, this borrows the one the summariser actually wrote
// for where the session opens, and falls back to the session's ref.
function notesPane(s) {
  if (!notes || notes.meetingId !== s.meetingId) {
    return `${sessionKicker(s, 'done')}<div class="say-2">Opening…</div>`;
  }
  if (notes.unreadable) {
    return `
      ${sessionKicker(s, 'broken')}
      <h1 class="display" style="margin-top:12px">These notes will not open.</h1>
      <div class="say-2">
        The summary is on disk but is not valid JSON, so nothing can read it — not this page, not the
        Obsidian export, not <code>/recap</code>. Writing them again fixes it; the transcript is untouched.
      </div>
      <div class="row-btns" style="margin-top:22px">
        ${can() ? `<button class="btn go" data-act="summary/again" data-meeting="${s.meetingId}">Write them again</button>` : ''}
        <button class="btn" data-transcript="${s.meetingId}">Read the transcript</button>
      </div>`;
  }
  if (!notes.written) {
    return `
      ${sessionKicker(s)}
      <h1 class="display" style="margin-top:12px">Not written up yet.</h1>
      <div class="say-2">This session has a transcript but no notes. Summarising posts them the usual way.</div>
      <div class="row-btns" style="margin-top:22px">
        ${can() ? `<button class="btn go" data-act="summary/again" data-meeting="${s.meetingId}">Summarise it</button>` : ''}
        <button class="btn" data-transcript="${s.meetingId}">Read the transcript</button>
      </div>`;
  }

  const heading = notes.scenes[0]?.title && notes.scenes[0].title !== 'Untitled scene'
    ? notes.scenes[0].title
    : notes.ref || `Session ${s.sessionNumber}`;

  return `
    ${sessionKicker(s, 'done')}
    <div style="display:flex;align-items:flex-end;gap:20px;margin-top:12px;flex-wrap:wrap">
      <h1 class="display">${esc(heading)}</h1>
      <div class="row-btns" style="margin-left:auto;padding-bottom:6px">
        <button class="btn sm" data-transcript="${s.meetingId}">Transcript</button>
        ${can() ? `<button class="btn sm" data-act="summary/again" data-meeting="${s.meetingId}"
             data-confirm="Write the notes for ${esc(s.ref)} again?">Re-summarise</button>` : ''}
        <button class="btn sm ghost" data-copy-notes>Copy for Obsidian</button>
      </div>
    </div>

    ${notes.tldr ? `<div class="lede">${esc(notes.tldr)}</div>` : ''}

    ${notes.scenes.length ? `
      <div class="cap" style="margin:32px 0 4px">What happened</div>
      <div style="max-width:70ch">
        ${notes.scenes.map((scene) => `
          <div class="scene">
            <h4>${esc(scene.title)}</h4>
            <p>${scene.points.map(esc).join(' ')}</p>
          </div>`).join('')}
      </div>` : ''}

    ${notes.partyDecisions.length ? `
      <div class="cap" style="margin:32px 0 10px">Party decisions</div>
      <div class="numbered">
        ${notes.partyDecisions.map((d, i) => `
          <div><span class="i">${String(i + 1).padStart(2, '0')}</span><span>${esc(d)}</span></div>`).join('')}
      </div>` : ''}

    ${notes.followUps.length ? `
      <div class="cap" style="margin:32px 0 10px">Follow-ups</div>
      <div class="numbered">
        ${notes.followUps.map((f, i) => `
          <div><span class="i">${String(i + 1).padStart(2, '0')}</span><span>${esc(f)}</span></div>`).join('')}
      </div>` : ''}`;
}

// The session that is waiting for you to spend money on it. The whole point of
// moving approvals off Discord: the decision, and the thing it is about, on
// one screen.
function approvalPane(s) {
  const providers = status?.providers ?? [];

  return `
    ${sessionKicker(s, 'wait')}
    <h1 class="display" style="margin-top:12px">Not written up yet</h1>
    <div class="say-2">
      The transcript is on file — ${plural(s.lines, 'line')}${runtime(s.durationMs) ? ` over ${runtime(s.durationMs)}` : ''},
      corrections already applied. Nothing has been summarised and nothing has been posted.
      ${providers.length > 1 ? 'Pick who writes the notes.' : ''}
    </div>
    ${can() ? `
      <div class="row-btns" style="margin-top:22px">
        ${providers.length
          ? providers.map((p, i) => `
              <button class="btn ${i === 0 ? 'go big' : 'big'}" data-act="summary/approve"
                      data-job="${s.job.id}" data-provider="${esc(p)}">
                ${i === 0 ? `Summarise with ${esc(providerName(p))}` : esc(providerName(p))}
              </button>`).join('')
          : `<button class="btn go big" data-act="summary/approve" data-job="${s.job.id}">Summarise now</button>`}
        <button class="btn big" data-act="summary/park" data-job="${s.job.id}">Leave it parked</button>
        <span class="mono" style="font-size:11.5px;color:var(--dim);margin-left:6px">
          notes post to ${esc(destination())} when they are ready
        </span>
      </div>` : disabledNote()}
    ${transcriptPeek(s)}`;
}

function transcribePane(s) {
  return `
    ${sessionKicker(s, 'wait')}
    <h1 class="display" style="margin-top:12px">Waiting to transcribe</h1>
    <div class="say-2">
      This session is recorded and sitting on the Pi. Transcribing it uses the GPU on your PC, so Quill
      asks first rather than seizing the machine in the middle of your evening.
    </div>
    ${can() ? `
      <div class="row-btns" style="margin-top:22px">
        <button class="btn go big" data-act="transcribe" data-job="${s.job.id}" data-action="now">Transcribe now</button>
        <button class="btn big" data-act="transcribe" data-job="${s.job.id}" data-action="later">Not yet</button>
        <button class="btn big" data-act="transcribe" data-job="${s.job.id}" data-action="pi">On the Pi instead</button>
      </div>
      <div class="quiet" style="margin-top:14px">
        “On the Pi” needs no GPU at all, and takes hours rather than minutes.
        ${status?.schedule?.nextAutoWindowAt
          ? `Left alone, the next automatic window opens ${esc(longDate(status.schedule.nextAutoWindowAt))} at ${esc(hhmm(status.schedule.nextAutoWindowAt))}.`
          : ''}
      </div>` : disabledNote()}`;
}

function queuedPane(s) {
  const live = (status?.working?.transcribing ?? []).find((t) => t.meetingId === s.meetingId);
  const done = live?.done ?? 0;
  const total = live?.total ?? 0;
  const pct = total ? Math.round((done / total) * 100) : 0;

  return `
    ${sessionKicker(s)}
    <h1 class="display" style="margin-top:12px">${live ? 'Working on it now' : 'Waiting its turn'}</h1>
    <div class="say-2">${esc(live?.description || 'Queued behind whatever is in front of it. Nothing here needs you.')}</div>
    <div class="steps" style="margin-top:30px;max-width:820px">
      <div>
        <span class="mark done">✓</span>
        <div style="flex:1"><div class="what">Recorded</div>
          <div class="sub">${esc(longDate(s.startedAt))}${runtime(s.durationMs) ? ` · ${runtime(s.durationMs)}` : ''}</div></div>
      </div>
      <div class="${live ? 'now' : ''}">
        <span class="mark ${live ? 'live' : ''}">${live ? '' : '2'}</span>
        <div style="flex:1">
          <div class="what" style="${live ? 'font-weight:500' : 'color:var(--dim)'}">Transcribing</div>
          ${live ? `<div class="sub">${esc(live.description)}</div><div class="bar"><i style="width:${pct}%"></i></div>`
                 : '<div class="sub">on the PC, inside the transcribe window</div>'}
        </div>
      </div>
      <div>
        <span class="mark">3</span>
        <div style="flex:1"><div class="what" style="color:var(--dim)">Summarising</div>
          <div class="sub">${status?.schedule?.requireApproval ? 'you will be asked before this starts' : 'starts on its own once the transcript exists'}</div></div>
      </div>
      <div>
        <span class="mark">4</span>
        <div style="flex:1"><div class="what" style="color:var(--dim)">Notes posted to ${esc(destination())}</div></div>
      </div>
    </div>`;
}

function recordingPane(s) {
  const live = (status?.recording ?? []).find((r) => r.meetingId === s.meetingId);
  return `
    <div class="kicker broken"><span class="dot live"></span> Recording · session ${s.sessionNumber ?? s.meetingId}</div>
    <div style="display:flex;align-items:flex-end;gap:24px;margin-top:14px;flex-wrap:wrap">
      <div class="mono" id="timer" style="font-size:52px;font-weight:500;letter-spacing:-1px;line-height:1">
        ${hhmmss(live?.recordingForMs)}
      </div>
      <div class="mono" style="font-size:12.5px;color:var(--dim);line-height:1.8;padding-bottom:6px">
        ${esc(live?.channel || s.channel || '')}<br>
        ${n(live?.clips ?? 0)} clips · ${plural(live?.speakers ?? 0, 'speaker')}
      </div>
    </div>
    <div class="say-2">
      Audio is being written to the Pi and nothing has left your network. Transcription starts when the
      last person leaves the channel${status?.schedule?.requireApproval ? ' — and Quill will ask before it uses the PC' : ''}.
    </div>
    <div class="quiet" style="margin-top:20px">End it from Discord with <code>/leave</code>.</div>`;
}

function failedPane(s) {
  const job = s.job;
  // The log the design draws by hand, built from what is actually recorded:
  // when the session ran, how many clips survived, and every attempt the job
  // made before it gave up.
  const events = [
    [hhmm(s.startedAt), `joined ${s.channel || 'the voice channel'}`],
    s.endedAt ? [hhmm(s.endedAt), `last voice left · ${runtime(s.durationMs) ?? '0:00'} recorded`] : null,
    [hhmm(s.endedAt || s.startedAt), s.lines ? `${n(s.lines)} lines transcribed` : '0 clips written to disk'],
    job?.attempts ? [null, `${plural(job.attempts, 'attempt')} · ${esc(job.lastError || 'nothing to read')}`] : null,
  ].filter(Boolean);

  return `
    ${sessionKicker(s, 'broken')}
    <h1 class="display" style="margin-top:14px">
      ${s.lines ? 'This session did not finish.' : 'There is nothing to transcribe.'}
    </h1>
    <div class="say-2">
      ${s.lines
        ? `The transcript exists — ${plural(s.lines, 'line')} — but the step after it failed. Trying again is worth a go.`
        : 'Quill joined the channel but no clips survived, so there is no audio to retry. Every attempt fails for the same reason.'}
    </div>
    <div class="card" style="margin-top:30px;max-width:760px">
      <div class="cap" style="margin-bottom:14px">What Quill saw</div>
      <div class="mono" style="display:flex;flex-direction:column;gap:11px;font-size:12.5px;color:var(--text-2)">
        ${events.map(([t, what]) => `
          <div style="display:flex;gap:16px">
            <span style="color:var(--dim);width:64px;flex:0 0 64px">${esc(t || '')}</span>
            <span style="${what.startsWith('0 clips') ? 'color:var(--red-lit)' : ''}">${esc(what)}</span>
          </div>`).join('')}
      </div>
    </div>
    ${can() ? `
      <div class="row-btns" style="margin-top:26px">
        ${s.discardable ? `<button class="btn warn big" data-act="session/discard" data-meeting="${s.meetingId}"
            data-confirm="Discard ${esc(s.ref)}? It has no transcript, and this stops it retrying.">Discard this session</button>` : ''}
        ${s.lines ? `<button class="btn go big" data-act="summary/again" data-meeting="${s.meetingId}">Try summarising again</button>` : ''}
        <button class="btn big" data-import>Import a recording instead</button>
      </div>
      <div class="quiet" style="margin-top:20px">
        Discarding removes it from the queue and from the session count. Nothing was ever posted to the channel.
      </div>` : disabledNote()}`;
}

// The first few lines, so the approval decision is made looking at the thing
// rather than at its line count.
function transcriptPeek(s) {
  if (!s.lines) return '';
  const peek = script?.meetingId === s.meetingId ? script.lines.slice(0, 6) : null;

  return `
    <div class="cap" style="margin:34px 0 14px">The transcript, from the top</div>
    <div class="card" style="max-width:none">
      ${peek ? peek.map((l) => `
        <div style="display:grid;grid-template-columns:74px 132px 1fr;gap:16px;align-items:baseline;padding:7px 0">
          <span class="mono" style="font-size:11.5px;color:var(--dim)">${esc(clock(l.ms))}</span>
          <span style="font-size:14px;color:var(--text-2)">${esc(l.speaker)}</span>
          <span style="font-size:14.5px;line-height:1.6;color:var(--text-2)">${esc(l.text)}</span>
        </div>`).join('')
        : '<div class="quiet">Loading the first lines…</div>'}
      <div style="display:flex;align-items:center;gap:12px;margin-top:10px;padding-top:14px;border-top:1px solid var(--line)">
        <span class="mono" style="font-size:11.5px;color:var(--dim)">
          ${peek ? `${n(Math.max(0, (script.total || 0) - peek.length))} more lines` : `${n(s.lines)} lines`}
        </span>
        <button class="btn sm" data-transcript="${s.meetingId}">Open the full transcript</button>
      </div>
    </div>`;
}

// --- the facts rail --------------------------------------------------------

function factsRail() {
  const s = selected();
  if (!s || !notes || notes.meetingId !== s.meetingId || notes.unreadable || !notes.written) return '';

  const block = (title, lines) =>
    lines?.length ? `<div><div class="cap" style="margin-bottom:12px">${title}</div>
      <div class="plainlist">${lines.map(esc).join('<br>')}</div></div>` : '';

  const named = (title, lines) =>
    lines?.length ? `<div><div class="cap" style="margin-bottom:12px">${title}</div>
      <div class="stack">${lines.map((entry) => {
        const { name, rest } = splitEntry(entry);
        return `<div><div class="who">${esc(name)}</div>${rest ? `<div class="what">${esc(rest)}</div>` : ''}</div>`;
      }).join('')}</div></div>` : '';

  const body = [
    notes.unresolvedThreads.length
      ? `<div><div class="cap" style="margin-bottom:12px">Still unresolved</div>
           <div class="stack">${notes.unresolvedThreads.map((t) => `<div class="big">${esc(t)}</div>`).join('')}</div></div>`
      : '',
    named('NPCs introduced', notes.npcsIntroduced),
    block('Locations', notes.locationsVisited),
    block('Loot and rewards', notes.lootAndRewards),
    notes.funnyMoments.length
      ? `<div class="keep"><div class="cap">Worth remembering</div>
           ${notes.funnyMoments.map((f) => `<p>${esc(f)}</p>`).join('')}</div>`
      : '',
  ].filter(Boolean).join('');

  // Marked optional: on a narrower screen the recap's own prose is the thing
  // worth keeping, and everything in this rail is also in the notes body.
  return body ? `<aside class="facts optional">${body}</aside>` : '';
}

// ==========================================================================
// The table
// ==========================================================================

const CONSENT_CLASS = { granted: 'agreed', declined: 'declined', pending: 'waiting', expired: 'waiting' };

function rosterTab() {
  const roster = detail.roster;
  const waiting = roster.filter((p) => !p.consent.mayRecord);
  const total = roster.reduce((sum, p) => sum + p.lines, 0) || 1;

  const heading = waiting.length
    ? `${waiting.length === 1 ? 'One person' : `${waiting.length} people`} still to hear from`
    : 'Everyone at this table has agreed';

  return `
    <div class="pane-wide" style="padding-top:30px">
      <h1 class="display sm">${esc(heading)}</h1>
      <div class="say-2" style="font-size:15px;max-width:64ch">
        ${waiting.length
          ? `Quill records nobody who has not agreed. Until ${esc(listNames(waiting))} answer, their microphones are skipped and the rest of the table is recorded as normal.`
          : 'Everyone here has said yes in a DM. Anyone who changes their mind can be removed with <code>/campaign remove</code>, and nothing of theirs is captured from that moment on.'}
      </div>

      <div class="grid roster" style="margin-top:30px">
        <div class="hd">
          <div>Player</div><div>Character</div>
          <div class="r">Lines</div><div class="r">Share</div><div class="r">Consent</div>
        </div>
        ${roster.map((p) => {
          const pct = Math.round((p.lines / total) * 100);
          const who = whoIs(p);
          return `<div class="tr">
            <div>${esc(who)}</div>
            <div>${characterCell(p, who)}</div>
            <div class="r mono">${p.lines ? n(p.lines) : '—'}</div>
            <div class="r"><span class="share">
              <i class="${p.lines ? '' : 'quiet'}"><b style="width:${p.lines ? pct : 0}%"></b></i>
              <span class="mono" style="font-size:12px;color:var(--dim);width:34px;text-align:right">${p.lines ? `${pct}%` : ''}</span>
            </span></div>
            <div class="r" style="display:flex;justify-content:flex-end;align-items:center;gap:10px">
              <span class="as-val ${CONSENT_CLASS[p.consent.state] || 'never'}">${esc(p.consent.label)}</span>
              ${p.consent.mayRecord ? '' : '<button class="btn sm" data-invite>Invite</button>'}
            </div>
          </div>`;
        }).join('')}
      </div>
      ${roster.length ? '' : '<div class="quiet" style="padding:20px 0">Nobody at this table yet.</div>'}
      ${can() ? '' : disabledNote()}
    </div>`;
}

const listNames = (people) => {
  const names = people.map(whoIs);
  if (names.length === 1) return names[0];
  if (names.length === 2) return `${names[0]} and ${names[1]}`;
  return `${names.slice(0, -1).join(', ')} and ${names[names.length - 1]}`;
};

// Click the name to change it, rather than a form under every row. A roster of
// six players was six always-open text boxes, which read as a data-entry
// screen for something you set once.
function characterCell(p, who) {
  if (!can()) return p.characterName ? esc(p.characterName) : '<span class="unset">not set</span>';
  if (view.editing === p.userId) {
    return `<form class="row-btns" data-act="roster/character" data-campaign="${detail.id}" data-user="${esc(p.userId)}">
      <input class="in" name="name" style="width:140px" value="${esc(p.characterName || '')}"
             placeholder="character" aria-label="Character for ${esc(who)}" autofocus>
      <button class="btn sm go" type="submit">Save</button>
      <button class="btn sm ghost" type="button" data-cancel-edit>Cancel</button>
    </form>`;
  }
  return `<button class="charbtn" data-edit="${esc(p.userId)}"
            title="Click to set the character name">${
    p.characterName ? esc(p.characterName) : '<span class="unset">not set</span>'
  }</button>`;
}

// ==========================================================================
// Corrections
// ==========================================================================

function correctionsTab() {
  const list = detail.corrections;
  return `
    <div style="display:flex;gap:40px;padding-top:30px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:0;max-width:900px">
        <h1 class="display sm">What Whisper keeps getting wrong</h1>
        <div class="say-2" style="font-size:15px;max-width:70ch">
          Fantasy names come back mangled. Write the fix once and Quill applies it to every future
          transcript, then replays it over the ones this campaign already has.
        </div>

        <div class="grid corr" style="margin-top:30px">
          <div class="hd">
            <div>Heard as</div><div>Should read</div>
            <div class="r">In transcripts</div><div></div>
          </div>

function highlight(text, term) {
  if (!term) return esc(text);
  const at = text.toLowerCase().indexOf(term);
  if (at < 0) return esc(text);
  return `${esc(text.slice(0, at))}<mark>${esc(text.slice(at, at + term.length))}</mark>${esc(text.slice(at + term.length))}`;
}
