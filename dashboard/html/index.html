     the sidenotes’, and below 1300px there is no rail at all. That last one
     is the right answer rather than a gap: a window that narrow is a window
     you scroll, and an index of a page you can see the end of is furniture. */
  .parts { display: flex; flex-direction: column; gap: 1px; }
  .parts-row {
    display: flex; gap: 10px; align-items: baseline; text-align: left;
    background: none; border: 0; padding: 5px 0 5px 12px; cursor: pointer;
    border-left: 2px solid var(--rule); color: var(--dim);
    font: inherit; font-size: 13px; line-height: 1.35;
    transition: color .15s, border-color .15s;
  }
  .parts-row:hover { color: var(--text-2); border-left-color: var(--edge); }
  .parts-row .n {
    font-family: var(--mono); font-size: 10px; color: var(--dim);
    font-variant-numeric: tabular-nums; flex: 0 0 auto;
  }
  .parts-row .t { flex: 1; min-width: 0; }
  /* The one on screen. The pen rather than the highlighter: this is a place
     in the document, not something Quill kept. */
  .parts-row.here { color: var(--text); border-left-color: var(--pen); }
  .parts-row.here .n { color: var(--pen); }
  @media (prefers-reduced-motion: reduce) { .parts-row { transition: none; } }
  /* ----------------------------------------------------------------------
     A rule the write-up names, and where it is written down.

     Quieter than a wikilink, and that is the whole design. A name in this
     campaign is somewhere to go IN this campaign; a spell is a footnote — it
     leaves the product entirely, and a reader who follows one has stopped
     reading the recap. So it takes the dim rule rather than the pen, keeps
     the colour of its sentence, and only firms up under the cursor.

     An anchor rather than a button, because it is a real address: it opens
     in a tab, it can be copied, and middle-click does what middle-click
     does. rel="noopener noreferrer" because target="_blank" hands the new
     page a handle on this one otherwise.  */
  .rule {
    color: inherit; text-decoration: none;
    border-bottom: 1px dotted var(--dim);
    transition: border-color .12s;
  }
  .rule:hover, .rule:focus-visible {
    border-bottom-color: var(--text-2); border-bottom-style: solid;
    outline: none;
  }
  .rule:focus-visible { border-radius: 2px; box-shadow: 0 0 0 2px var(--pen-br); }
  @media (prefers-reduced-motion: reduce) { .rule { transition: none; } }

  .theme { margin-left: 4px; }
  .theme button { padding: 5px 10px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }

  /* ======================================================================
     Who and where
     ======================================================================
     The summariser already names every NPC and every place, once per session,
     and then that naming is stranded in the session it came from. Read down
     the campaign instead of across it and the same names line up into a cast
     list: who they are, the night they walked on, and what has been said
     about them since.

     Read the way the items are read — one list, down the page, under the
     night that put each name on it. A person used to be a page, and the page
     held a name, a date and two sentences, so reading everyone the party met
     meant opening forty of them.

     The headings come from `first` rather than from every night a name is in.
     An item's whole life is the night it was found; a person recurs, and the
     one night that is uniquely theirs is the night they walked on.  */

  .cast-row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto;
    gap: 4px 22px; padding: 16px 0 17px 2px;
    border-bottom: 1px solid var(--rule);
    scroll-margin-top: calc(var(--above, 76px) + 16px);
  }
  .cast-row .nm {
    font-family: var(--display); font-variation-settings: 'SOFT' 0, 'WONK' 1;
    font-size: 17.5px; font-weight: 400; letter-spacing: -.005em;
    line-height: 1.3; color: var(--text);
  }

  /* The nights a name came back in, on the line the name is on. An item has
     one night and nothing to say about it; a person has a run of them, and
     that run read down the right-hand edge is the campaign's recurring cast —
     which is the one thing a shelf of separate pages could not show at all. */
  .cast-row .again {
    font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
    color: var(--dim); font-variant-numeric: tabular-nums;
    white-space: nowrap; padding-top: 6px;
  }
  .cast-row .again b { font-weight: 400; color: var(--text-2); }

  .cast-said { grid-column: 1 / -1; margin-top: 6px; min-width: 0; }
  .cast-said p {
    margin: 0; font-family: var(--serif); font-size: 15px;
    line-height: 1.62; color: var(--text-2);
  }
  .cast-said p + p { margin-top: 7px; }

  /* The highlighter, spent here the way the rest of the page spends it: on
     the line somebody will want to read out loud. */
  .entry-aside {
    margin-top: 11px; border-left: 2px solid var(--mark); padding: 2px 0 2px 15px;
    font-size: 14.5px; line-height: 1.6; color: var(--text);
  }
  .entry-aside + .entry-aside { margin-top: 9px; }

  /* Landed on, from the index or from a name in a write-up. A whole cast
     entry washed yellow is a block of highlighter five lines deep, so the
     mark goes down its edge instead: the same arrival the item ledger uses,
     at the size this row actually is. */
  .cast-row.flash { animation: landed 1.5s ease-out; }
  @keyframes landed {
    from { box-shadow: inset 3px 0 0 var(--mark); background: var(--hover); }
    to   { box-shadow: inset 3px 0 0 transparent; background: transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .cast-row.flash { animation: none; } }

  /* An index row. The column is the way into the list rather than a second
     copy of it, so it carries the two things you scan a cast for — the name
     and the night — and leaves the prose to the page. */
  .sess-list.index { gap: 1px; }
  .sess.thin { padding: 10px 14px 11px; display: flex; align-items: baseline; gap: 12px; }
  .sess.thin .ref { font-size: 15px; min-width: 0; }
  .sess.thin .when {
    display: inline; margin-top: 0; margin-left: auto; white-space: nowrap;
  }

  @media (max-width: 700px) {
    .cast-row { grid-template-columns: minmax(0, 1fr); }
    .cast-row .again { padding-top: 0; }
  }

  /* The column holds two pages in a clipped frame and slides between them,
     the same gesture the campaign rail uses one level out: choose, and what
     you chose from leaves to the left while what you chose arrives behind it.
     The header it leaves is the way back.

     Both pages are absolutely positioned so the one on its way out does not
     stretch the frame to the height of the one coming in. */
  .sessions { display: flex; flex-direction: column; }

  .shelf-slider { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .shelf-page {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: var(--column);
    transition: transform .42s cubic-bezier(.22,.72,.2,1);
  }
  .shelf-slider.picking .chooser { transform: translateX(0); }
  .shelf-slider.picking .list    { transform: translateX(100%); }
  .shelf-slider.picked  .chooser { transform: translateX(-100%); }
  .shelf-slider.picked  .list    { transform: translateX(0); }
  .shelf-slider.picking .list,
  .shelf-slider.picked  .chooser { pointer-events: none; }

  /* A row of the chooser: Sessions, NPCs, Places, Items. Built like a ledger
     entry one level in, so picking what to read repeats the shape of picking
     the campaign. */
  .shelf-row {
    display: block; width: 100%; text-align: left;
    padding: 15px 15px 16px; border: 0; border-left: 2px solid transparent;
    border-radius: 10px; background: transparent; cursor: pointer;
    transition: background .13s;
  }
  .shelf-row:hover { background: var(--hover); }
  .shelf-row.on { background: var(--raise); border-left-color: var(--pen); }
  .shelf-row .l1 { display: flex; align-items: baseline; gap: 10px; }
  .shelf-row .nm { font-size: 15.5px; color: var(--text); }
  .shelf-row .n {
    margin-left: auto; font-family: var(--mono); font-size: 11.5px;
    color: var(--dim); font-variant-numeric: tabular-nums;
  }
  .shelf-row .meta {
    font-family: var(--mono); font-size: 11px; color: var(--dim);
    margin-top: 7px; letter-spacing: .03em;
  }

  /* The header of a chosen list, which is also the way out of it. */
  .shelf-back {
    display: inline-flex; align-items: baseline; gap: 9px;
    font-family: var(--mono); font-size: 11.5px;
    letter-spacing: .14em; text-transform: uppercase;
    padding: 4px 10px 4px 6px; margin-left: -6px; border-radius: 7px;
    border: 0; background: transparent; color: var(--text);
    cursor: pointer; transition: background .13s, color .13s;
  }
  .shelf-back:hover { background: var(--hover); }
  .shelf-back .arw { color: var(--pen); font-size: 13px; letter-spacing: 0; }
  .shelf-back .n { color: var(--dim); letter-spacing: .02em; }

  @media (prefers-reduced-motion: reduce) {
    .shelf-page { transition-duration: .01ms; }
  }

  @media (max-width: 1180px) {
    .pane-main { padding: 30px 26px 48px; }
    .sessions { flex: none; }
  }
  @media (max-width: 820px) {
    /* The top bar carries two pause buttons and the theme switch. At 430px
       that is wider than the phone, and .right pinning itself to the end with
       margin-left:auto meant it overflowed rather than wrapped. */
    .top .right { margin-left: 0; flex-wrap: wrap; }
    .theme { margin-left: 0; }

    /* Five tabs do not fit a phone. The strip scrolls inside itself rather
       than widening the page — nothing else on the page scrolls sideways. */
    /* Wrapped, not scrolled. Four tabs are wider than a phone, and a strip
       that scrolls with its scrollbar hidden shows the last one sliced
       mid-word with nothing saying there is more of it — which reads as a
       broken tab, not a hidden one. Two rows fit and are wholly visible, and
       Settings gives up its right-hand berth because on two rows there is no
       far end to be pushed to. */
    .tabs { flex-wrap: wrap; gap: 18px; }
    .tab { white-space: nowrap; flex: 0 0 auto; }
    .tab.apart { margin-left: 0; }

    .sheet { top: 60px; right: 12px; left: 12px; width: auto;
             max-height: calc(100vh - 76px); }
  }
  /* ======================================================================
     The gate — the sign-in screen, in the landing page's world.
     ======================================================================
     Somebody arriving from / clicked "Log in" on a page made of pale paper
     and ultramarine, and used to land here in the dark. That cut said "you
     have left the website" at the exact moment we were asking them to trust
     us with their Discord account.
     So the gate keeps the landing page's palette and typefaces, and the tool
     goes dark once they are through it. The dashboard's own tokens are
     untouched — everything below is scoped to body.gate-open or .gate, and
     nothing here leaks into a signed-in page.

     The typefaces load on demand, from loadGateFonts(). Most visits to this
     page never see this screen and should not pay for three extra families.  */
  body.gate-open { background: #E6E8E3; }
  /* The palette is the light one here whatever the theme says, so the
     selection has to be too. Left to the token, a dark-theme reader gets the
     dark band under this screen's dark type and cannot read what they have
     just selected. */
  body.gate-open ::selection { background: #C9D0EE; }
  body.gate-open .sheet,
  body.gate-open .top,
  body.gate-open #banner { display: none; }
  body.gate-open .app { display: block; min-height: 100vh; }
  body.gate-open .main { display: block; }

  .gate {
    --paper:   #E6E8E3;
    --paper-2: #DEE2DA;
    --paper-3: #D4D9CF;
    --ink:     #171C22;
    --ink-soft:#5C665E;
    --edge:    #C4CABE;
    --pen:     #2434A8;

    --g-display: 'Fraunces', 'Hoefler Text', Georgia, serif;
    --g-body:    'Newsreader', Georgia, 'Times New Roman', serif;
    --g-mono:    'Spline Sans Mono', ui-monospace, Consolas, monospace;

    background: var(--paper);
    color: var(--ink);
    font-family: var(--g-body);
    min-height: 100vh;
    padding: 10vh 24px 60px;
  }
  .gate-inner { max-width: 470px; margin: 0 auto; }

  .gate-eyebrow {
    font-family: var(--g-mono);
    font-size: 11.5px; letter-spacing: .19em; text-transform: uppercase;
    color: var(--pen); margin: 20px 0 0;
  }
  .gate h1 {
    font-family: var(--g-display);
    font-variation-settings: 'SOFT' 0, 'WONK' 1;
    font-weight: 400;
    font-size: clamp(30px, 5vw, 42px);
    line-height: 1.06; letter-spacing: -.022em;
    margin: 14px 0 0; color: var(--ink); text-wrap: balance;
  }
  .gate-say {
    font-size: 17px; line-height: 1.6; color: var(--ink-soft);
    margin: 14px 0 0; max-width: 44ch;
  }
  .gate-say b { color: var(--ink); font-weight: 600; }
  /* What the button will actually do, set below it rather than inside it. A
     label labels; the explaining goes here. */
  .gate-say.quiet-say { font-size: 14px; margin-top: 12px; opacity: .72; }

  .gate-btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .gate-btn {
    font-family: var(--g-mono);
    font-size: 13px; letter-spacing: .02em;
    padding: 12px 22px; border-radius: 5px;
    border: 1px solid var(--pen); background: var(--pen); color: var(--paper);
    cursor: pointer;
    transition: background .16s ease, border-color .16s ease;
  }
  .gate-btn:hover:not(:disabled) { background: #1B2A92; border-color: #1B2A92; }
  .gate-btn:disabled { opacity: .55; cursor: default; }
  .gate-btn.quiet { background: transparent; color: var(--pen); border-color: var(--edge); }
  .gate-btn.quiet:hover { background: transparent; border-color: var(--pen); }
  .gate-btn.plain {
    background: transparent; border-color: transparent; color: var(--ink-soft);
    padding-inline: 0; text-decoration: underline; text-underline-offset: 3px;
  }
  .gate-btn.plain:hover { background: transparent; color: var(--pen); }

  /* The one button on the page, and the whole of signing in.
     Discord's own blurple rather than the ink this page uses everywhere else,
     because it is the one control here that hands you to somebody else: the
     colour is the promise about where the next screen comes from. */
  .gate-btn.discord {
    display: inline-flex; align-items: center; gap: 10px;
    background: #5865F2; border-color: #5865F2; color: #fff;
    text-decoration: none; font-size: 13.5px; padding: 13px 24px;
  }
  .gate-btn.discord:hover { background: #4752C4; border-color: #4752C4; }
  .gate-btn.discord svg { flex: none; }
  .gate :focus-visible { outline: 2px solid var(--pen); outline-offset: 3px; border-radius: 3px; }

  .gate-msg {
    font-family: var(--g-mono); font-size: 12px; line-height: 1.6;
    margin-top: 18px; padding-left: 14px;
    border-left: 2px solid var(--pen); color: var(--ink-soft);
  }
  .gate-msg.bad { border-left-color: #A8322B; color: #8C2F29; }

  .gate-foot {
    margin-top: 38px; padding-top: 18px;
    border-top: 1px solid var(--edge);
    font-size: 14.5px; line-height: 1.62; color: var(--ink-soft);
    max-width: 50ch;
  }
  .gate-back {
    display: inline-block; margin-top: 22px;
    font-family: var(--g-mono); font-size: 12px; letter-spacing: .04em;
    color: var(--ink-soft); text-decoration: none;
  }
  .gate-back:hover { color: var(--pen); }

  @media (max-width: 520px) {
    .gate { padding-top: 6vh; }
  }

  /* ======================================================================
     The threshold — the one screen somebody sees the first time they sign in
     ======================================================================
     WORK IN PROGRESS. See "new features.md" → Work in progress, and the
     TODO beside welcomeScreen() at the foot of this file.

     Everywhere else in this product the page is the tool: a desk, a ledger, a
     gatehouse. This is the one screen that is the BOOK, and the only place the
     book speaks. So it is neither the dashboard dressed differently nor the
     landing page a second time — it is a lit sheet in a dark room that writes
     while you watch, and hands you the one door you actually need.

     Two rules keep it from being decoration:

       It never asks a question it can already answer. What tables somebody can
       see is in /status before this screen draws, so it is never asked about —
       only the things the bot genuinely cannot know are.

       The answer not taken is ruled through rather than removed. That is this
       product's own mark, used on the landing page and in the gatehouse for
       "struck from the record, not destroyed", and it is what leaves a page
       that reads afterwards as something written rather than something clicked.

     Always the dark, whatever the theme is set to, for the same reason the gate
     is always the landing page's paper: this is a moment rather than a tool,
     and it happens once. Everything here is scoped to body.thr-open or .thr,
     and nothing leaks into the signed-in page.

     White on black, and no sheet under it. The first cut of this drew a lit
     page of vellum floating in the room, which was the literal reading of "a
     quill writing on a page" and the wrong one: a rectangle of paper is a
     card, and a card is a thing the tool would show you. Taking it away leaves
     the writing alone in the dark with nothing around it to be, which is the
     whole effect being reached for. The ink is what carries the moment, so the
     ink is the only thing on screen.                                          */

  body.thr-open {
    /* Not flat black — a breath of light behind where the writing lands, so
       the dark reads as a room rather than as a switched-off screen. */
    background: #08090B radial-gradient(120% 80% at 50% 30%, #14161C 0%, #0B0C10 46%, #08090B 78%) fixed;
  }
  body.thr-open ::selection { background: #343E72; }
  body.thr-open .sheet,
  body.thr-open .top,
  body.thr-open #banner { display: none; }
  body.thr-open .app { display: block; min-height: 100vh; }
  body.thr-open .main { display: block; }

  .thr {
    --ink:    #EFECE4;   /* dry ink — warm white, not paper white */
    --soft:   #8A8C86;
    --rule:   #2A2D34;
    /* Ultramarine is the pen everywhere else in this product and is unreadable
       on a dark ground, so the wet stroke is the same hue lifted to a legible
       tint — exactly what the dashboard's dark theme does with --pen. */
    --wet:    #8FA0F5;

    /* Fire, and the only warm thing on the screen. Two accents with one job
       each and no overlap: blue is ink going onto the page, amber is the page
       going. The highlighter this screen used to mark a chosen line with has
       gone — the torch marks it now, and one mark for one idea is the rule the
       rest of this product is built on. */
    --ember-hot:  #FFE1B0;
    --ember:      #E9922F;
    --ember-deep: #8A3F12;

    --t-display: 'Fraunces', 'Hoefler Text', Georgia, serif;
    --t-body:    'Newsreader', Georgia, 'Times New Roman', serif;
    --t-mono:    'Spline Sans Mono', ui-monospace, Consolas, monospace;

    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8vh 20px 44px;
  }

  /* Centred, and holding one exchange at a time. The min-height is what stops
     the two questions from sitting at different heights on the screen: they are
     the same moment asked twice, and a composition that jumps between them
     would say they were not. */
  .thr-sheet {
    position: relative;
    width: 100%; max-width: 660px;
    min-height: 330px;
    display: flex; flex-direction: column; justify-content: center;
    text-align: center;
    color: var(--ink);
    font-family: var(--t-body);
    animation: thr-in .6s cubic-bezier(.22,.72,.2,1) both;
  }
  @keyframes thr-in { from { opacity: 0; transform: translateY(14px); } }

  .thr-cap {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    font-family: var(--t-mono);
    font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--soft); margin: 0 0 34px;
  }

  /* The lettering, and the only prose on the screen. Fraunces with WONK on is
     the closest a variable face gets to a hand that is enjoying itself, which
     is the whole voice here.

     There is no second register. Every explaining line this screen used to
     carry under its questions has gone: a page written one word at a time
     cannot also have small print beside it, because the eye reads the still
     text while the pen is still working and the effect is over before the
     sentence is. Whatever is worth saying is said in the hand. */
  .thr-line {
    font-family: var(--t-display);
    font-variation-settings: 'SOFT' 60, 'WONK' 1;
    font-style: italic; font-weight: 400;
    font-size: clamp(23px, 3.5vw, 31px);
    line-height: 1.4; letter-spacing: -.012em;
    margin: 0 auto 6px; max-width: 30ch; text-wrap: balance;
  }

  /* Ink leaves the nib wet and dries a beat later. One class per character, one
     animation, no timer per glyph. */
  .thr .ch { opacity: 0; }
  .thr .ch.on { animation: thr-ink .9s ease-out forwards; }
  /* Already on the page, and not to be written again. Anything split into
     glyphs at the last moment — the answers, when the fire reaches them — is
     lit rather than inked: running the writing animation over text the reader
     has been looking at for ten seconds re-wets it in front of them. */
  .thr .ch.lit { opacity: 1; }
  /* One word, which a line may not be broken inside. See thrSplit. */
  .thr .wd { white-space: nowrap; }
  @keyframes thr-ink {
    0%   { opacity: .5; color: var(--wet); }
    28%  { opacity: 1;  color: var(--wet); }
    100% { opacity: 1;  color: inherit; }
  }

  /* The quill itself, driven frame by frame from welcomeWrite.
     No transition on the transform: a transition is a jump with a smear over
     it, and what this has to do is travel. It turns about its own tip, which is
     why the origin is the point of the nib in its box and not the middle. */
  .thr-nib {
    position: absolute; left: 0; top: 0;
    width: 24px; height: 24px; pointer-events: none;
    transform-origin: 5px 19px;
    opacity: 0; transition: opacity .3s;
    transform: translate(-100px, -100px);
  }
  .thr-nib.on { opacity: 1; }

  /* The two answers, which are two lines in a ledger rather than two buttons.
     Ruled off from each other, marked in the margin, and struck through once
     the choice is made. */
  .thr-choices { margin-top: 26px; position: relative; }

  /* Everything that is not the writing itself — the small print, the choices,
     the doors — waits until the pen has stopped. The block being written keeps
     its lines hidden until the driver has split them into glyphs, so there is
     no flash of the whole sentence before it is written. */
  .thr-block.now .thr-after { opacity: 0; transition: opacity .5s ease; }
  .thr-block.now.ready .thr-after { opacity: 1; }
  .thr-block.now .thr-line[data-w] { opacity: 0; }
  .thr-block.now.writing .thr-line[data-w] { opacity: 1; }

  /* The written line, read rather than seen. The glyph split above is for the
     eye only; a screen reader gets the sentence. */
  .thr .sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }

  .thr-choice {
    display: block; width: 100%; text-align: center;
    position: relative;
    padding: 16px 52px;
    border: 0; border-top: 1px solid var(--rule);
    background: none; color: var(--ink);
    font-family: var(--t-body); font-size: 20px; line-height: 1.45;
    cursor: pointer;
    transition: color .22s;
  }
  .thr-choice:last-child { border-bottom: 1px solid var(--rule); }
  .thr-choice[disabled] { cursor: default; }

  /* -- The torch --------------------------------------------------------
     ONE flame, and it marks where you are. It used to burn at the end of every
     line at once, which made it scenery: two torches always lit say nothing
     about which line you are on, and the thing this screen most needs to say
     at rest is exactly that. So it is a cursor — it slides from line to line
     as you move, and the light it throws moves with it.

     Two gradients on one span — a body and a hotter core — flickering on
     different clocks so the pair never repeats the same shape twice. No image
     and no library: a flame is a soft teardrop and a slow scale, and anything
     more literal would look like a sticker. */
  .wisp {
    position: absolute; right: 16px; top: 0;
    width: 18px; height: 30px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .3s ease, transform .26s cubic-bezier(.3,.8,.3,1);
  }
  .wisp.lit { opacity: 1; }

  /* The line the torch is standing at. The wash is the light it is throwing,
     so it falls off towards the middle of the row and has a source. */
  .thr-choice.picked {
    color: var(--ember-hot);
    background: radial-gradient(120% 200% at 100% 50%, #E9922F1C 0%, #E9922F00 62%);
  }
  .wisp::before, .wisp::after {
    content: ''; position: absolute; left: 50%;
    transform-origin: 50% 88%;
  }
  /* The body: a teardrop, narrow at the top, and the spill of light it throws
     is the box-shadow rather than a second element. */
  .wisp::before {
    width: 15px; height: 20px; bottom: 5px; margin-left: -7.5px;
    background: linear-gradient(to top, var(--ember) 0%, var(--ember-hot) 62%, #FFF6E6 100%);
    border-radius: 50% 50% 50% 50% / 64% 64% 36% 36%;
    box-shadow: 0 0 16px 3px #E9922F4D;
    filter: blur(1.3px);
    animation: wisp 2.9s ease-in-out infinite;
  }
  /* The core, on its own clock so the pair never repeats the same shape. */
  .wisp::after {
    width: 5px; height: 10px; bottom: 8px; margin-left: -2.5px;
    background: linear-gradient(to top, var(--ember-hot), #FFFDF6);
    border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
    filter: blur(.5px);
    animation: wisp 1.7s ease-in-out infinite reverse;
  }
  @keyframes wisp {
    0%, 100% { transform: scale(1, 1);       opacity: .85; }
    28%      { transform: scale(.92, 1.22);  opacity: 1; }
    54%      { transform: scale(1.06, .9);   opacity: .68; }
    78%      { transform: scale(.97, 1.1);   opacity: .95; }
  }
  /* The line you took, held for half a second before the fire takes it. The
     press has to read as a choice being made before it reads as a page being
     destroyed — so the row lights first, the flame swells where it stands, and
     only then does anything catch. */
  .thr-choice.chosen {
    color: var(--ember-hot);
    background: radial-gradient(120% 220% at 100% 50%, #E9922F38 0%, #E9922F00 68%);
    animation: thr-taken .5s ease-out;
  }
  @keyframes thr-taken {
    0%   { background-color: #E9922F00; }
    35%  { background-color: #E9922F1F; }
    100% { background-color: #E9922F00; }
  }
  /* The flame swells where it is standing and goes up with the page. The swell
     is on the flame's two halves rather than on the span, because the span's
     own transform is where it is standing and an animation over that would
     move it back to the top of the list to burn. */
  .thr-block.burning .wisp { animation: wisp-flare 1s ease-out .28s forwards; }
  .thr-block.burning .wisp::before,
  .thr-block.burning .wisp::after { animation: wisp-swell .9s ease-out .28s forwards; }
  @keyframes wisp-flare {
    0%   { opacity: 1; filter: none; }
    26%  { opacity: 1; filter: brightness(1.6); }
    100% { opacity: 0; filter: blur(7px) brightness(1.9); }
  }
  @keyframes wisp-swell {
    0%   { transform: scale(1); }
    100% { transform: scale(2.8); }
  }

  /* -- Burning it away --------------------------------------------------
     The answer does not get filed, it gets consumed: the torch flares, the
     fire runs out from it across everything on screen, and what is left is a
     dark page for the next line to be written on.

     Every glyph is already its own span from the writing, so the front is real
     rather than a gradient sliding over a block — each character catches when
     the fire reaches IT, ordered by its distance from the flame. The delay is
     set per glyph in welcomeBurn; the animation is one line of CSS.

     No transform on the glyphs. They are inline spans, transforms do not apply
     to those, and making them inline-block to get one would let the browser
     break a line between any two letters. Colour, glow and opacity say it.

     The fill is `both`, and it is load-bearing. This animation REPLACES the one
     that wrote the glyph, and a written glyph is only visible because THAT one
     filled forwards to opacity 1 over a base rule of opacity 0. Fill only
     forwards and every character still waiting its turn falls back to the base
     rule and vanishes the instant the fire starts — which looks exactly like
     the whole page going up at once, from the wrong end. Filling backwards as
     well holds each glyph at the 0% keyframe until its own delay is up. */
  .thr .ch.burn { animation: thr-burn .95s ease-in both; }
  @keyframes thr-burn {
    0%   { opacity: 1; }
    20%  { color: var(--ember-hot); text-shadow: 0 0 12px var(--ember); opacity: 1; }
    55%  { color: var(--ember);     text-shadow: 0 0 20px var(--ember-deep); opacity: .82; }
    100% { color: var(--ember-deep); text-shadow: none; opacity: 0; }
  }

  .thr-block.burning .thr-choice { animation: thr-scorch .9s ease-in forwards; }
  @keyframes thr-scorch {
    0%   { border-color: var(--rule); }
    40%  { border-color: var(--ember); }
    100% { border-color: transparent; }
  }
  .thr-block.burning .thr-choice:not(.chosen) .wisp { opacity: 0; }
  /* Whatever the fire has not reached goes with the rest of the page. --ash is
     written by welcomeBurn: it is however long the slowest glyph took. */
  .thr-block.burning { animation: thr-ash .5s ease-in var(--ash, 1s) forwards; }
  @keyframes thr-ash { to { opacity: 0; } }

  /* -- Typed in the same hand -------------------------------------------
     The two places this screen takes something back: what the table is called,
     and who else is at it. Set in the same face at the same size as the
     writing, on a rule rather than in a box — what you type continues the
     sentence the book has just written, and a grey input box in the middle of
     that would be the tool interrupting. The caret is the one thing in it that
     is ember: it is the only mark on this screen being made by the reader. */
  .thr-form { margin-top: 28px; }
  .thr-in {
    display: block; width: 100%; max-width: 26ch; margin: 0 auto;
    padding: 4px 2px 10px; text-align: center;
    background: none; border: 0; border-bottom: 1px solid var(--rule);
    color: var(--ink); caret-color: var(--ember);
    font-family: var(--t-display);
    font-variation-settings: 'SOFT' 60, 'WONK' 1;
    font-style: italic; font-weight: 400;
    font-size: clamp(22px, 3.2vw, 28px); line-height: 1.35;
    transition: border-color .2s;
  }
  .thr-in::placeholder { color: var(--soft); opacity: .6; }
  .thr-in:focus { outline: none; border-bottom-color: var(--ember); }
  .thr-form .thr-doors { margin-top: 20px; }

  /* A refusal, or a search that found nobody. Mono, because it is the machine
     answering rather than the book writing — the same distinction the ledger
     entry's caption makes. */
  .thr-note {
    margin: 16px auto 0; max-width: 46ch;
    font-family: var(--t-mono); font-size: 11.5px; line-height: 1.7;
    letter-spacing: .04em; color: var(--soft);
  }

  /* Somebody the search found. The line is the person, and lighting its torch
     asks them. */
  .thr-choice.person { padding-top: 13px; padding-bottom: 13px; }
  .thr-who { display: block; font-size: 19px; line-height: 1.3; }
  .thr-at {
    display: block; margin-top: 3px;
    font-family: var(--t-mono); font-size: 11px; letter-spacing: .06em;
    color: var(--soft);
  }
  /* Asked, and their own light is left burning on that line. Not a tick: the
     one flame on this screen is the cursor, and what it leaves behind where it
     has been is an ember. */
  .thr-choice.asked { color: var(--soft); cursor: default; }
  .thr-choice.asked::after {
    content: ''; position: absolute; right: 21px; top: 50%; margin-top: -3px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ember); box-shadow: 0 0 9px 2px #E9922F55;
  }
  .thr-choice.asked.picked { color: var(--soft); }

  /* The small print, and the one place this screen's no-subtext rule is broken
     on purpose.

     Everywhere else, anything worth saying is a line the pen writes at the size
     everything else is written at — a rule that exists because explaining text
     under a heading is where an interface starts hedging. It does not survive
     contact with consent. "Yours as well?" is a fair question only if the
     person answering it knows what is captured, where it goes and how long it
     is kept, and those three facts do not fit in a written line and must not be
     summarised into one. So they are set here, plainly, in the machine's own
     face rather than the book's: this part is not the story talking. */
  .thr-terms {
    margin: 22px auto 0; max-width: 52ch; padding: 0; list-style: none;
    font-family: var(--t-mono); font-size: 11.5px; line-height: 1.85;
    letter-spacing: .03em; color: var(--soft); text-align: left;
  }
  .thr-terms li { padding-left: 16px; position: relative; }
  .thr-terms li::before {
    content: ''; position: absolute; left: 2px; top: 9px;
    width: 4px; height: 4px; border-radius: 50%; background: var(--rule);
  }
  .thr-terms b { color: var(--ink); font-weight: 400; }

  /* An address to hand round. Selectable, wrapping anywhere, and never
     shortened: a link with an ellipsis in the middle is a link somebody copies
     and cannot use. */
  .thr-link {
    display: block; margin: 18px auto 0; max-width: 46ch; padding: 12px 14px;
    border: 1px dashed var(--rule); border-radius: 4px;
    font-family: var(--t-mono); font-size: 12px; line-height: 1.6;
    color: var(--wet); word-break: break-all; user-select: all;
  }

  /* The line the whole screen has been walking towards: their name, written
     into the book. */
  .thr-entry { margin-top: 34px; padding-top: 20px; border-top: 1px solid var(--rule); }
  .thr-entry-name {
    font-family: var(--t-display);
    font-variation-settings: 'SOFT' 40, 'WONK' 1;
    font-style: italic; font-size: clamp(28px, 4.8vw, 40px);
    line-height: 1.1; letter-spacing: -.02em; margin: 0;
  }
  .thr-entry-cap {
    font-family: var(--t-mono); font-size: 10.5px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--soft); margin: 10px 0 0;
  }

  .thr-doors {
    display: flex; flex-wrap: wrap; gap: 10px;
    align-items: center; justify-content: center; margin-top: 30px;
  }
  /* Outlined rather than filled. A solid block of the lifted pen is the
     brightest thing that could be put on this ground, and the brightest thing
     on the screen has to be the writing. */
  .thr-door {
    font-family: var(--t-mono); font-size: 13px; letter-spacing: .02em;
    padding: 12px 22px; border: 1px solid var(--wet); border-radius: 4px;
    background: #8FA0F514; color: var(--wet);
    text-decoration: none; cursor: pointer;
    transition: background .16s, border-color .16s, color .16s;
  }
  .thr-door:hover { background: #8FA0F526; }
  .thr-door.quiet { background: transparent; color: var(--soft); border-color: var(--rule); }
  .thr-door.quiet:hover { background: transparent; color: var(--ink); border-color: var(--soft); }
  .thr-cmd {
    font-family: var(--t-mono); font-size: 14px;
    padding: 11px 16px; border: 1px dashed var(--rule); border-radius: 4px;
    color: var(--wet); background: transparent;
  }

  .thr-skip {
    width: 100%; max-width: 660px; text-align: center;
    margin-top: 34px;
    font-family: var(--t-mono); font-size: 11.5px; letter-spacing: .06em;
  }
  .thr-skip button {
    background: none; border: 0; padding: 0; cursor: pointer;
    color: #6E7079; text-decoration: underline; text-underline-offset: 3px;
    font: inherit;
  }
  .thr-skip button:hover { color: var(--ink); }

  /* Said plainly, on the same line as the eyebrow, because a screen that is
     still being written should say so to the person it is being written for.
     On the eyebrow's line rather than floating in a corner: with no card under
     it there is no corner for it to be in. */
  .thr-wip {
    margin-left: auto;
    font-size: 9.5px; letter-spacing: .2em;
    border: 1px solid var(--rule); border-radius: 3px; padding: 3px 7px;
  }

  .thr :focus-visible { outline: 2px solid var(--wet); outline-offset: 3px; }

  @media (max-width: 560px) {
    .thr { padding-top: 4vh; }
    .thr-sheet { padding: 34px 26px 30px; }
    .thr-choice { font-size: 17.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .thr-sheet { animation: none; }
    .thr .ch, .thr .ch.on, .thr .ch.lit, .thr .ch.burn { opacity: 1; animation: none; }
    .thr-nib { display: none; }
    /* The torch stops flickering and stops sliding, but it stays lit and it
       still stands beside the line you are on — it is the selector, and a
       selector that disappears with the motion setting is a control gone. */
    .wisp { transition: opacity .3s; }
    .wisp::before, .wisp::after { animation: none; }
    .thr-choice.chosen { animation: none; }
    .thr-block.burning .wisp,
    .thr-block.burning .wisp::before,
    .thr-block.burning .wisp::after { animation: none; }
    .thr-block.burning, .thr-block.burning .thr-choice { animation: none; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- The account, hung off the mark at the end of the top bar. -->
  <div id="sheet"></div>

  <main class="main">
    <header class="top" id="top"></header>
    <div id="banner"></div>
    <div id="screen" class="split"></div>
  </main>
</div>

<div id="modal"></div>
<!-- Every answer this page gives arrives here — the confirmation, the
     refusal, the "can't reach the bot". Without a live region a screen
     reader is told none of it: you press Approve and nothing is announced
     either way, which makes the whole outcome channel of the tool silent.
     gatehouse.html has had this since it was written; this page just never
     got it.

     role="status" already implies polite and atomic; both are spelled out
     anyway, the way the gatehouse spells out aria-live, because older
     assistive tech does not always infer them.

     Deliberately ONE static region rather than swapping in role="alert" for
     the offline notice. Changing role at the same moment as the text is a
     reliable way to have the announcement dropped entirely — screen readers
     read a live region's configuration when it is registered, not when it
     changes. A failure already sits on screen for 9s against a success's
     4.5s (see toast()), which is what actually gives it the longer hearing. -->
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- What is under a name, without going to look. Outside every panel the
     patcher touches, because it is anchored to a element inside one and
     would be thrown away with it. See peekAt(). -->
<div class="peek" id="peek" role="tooltip" hidden></div>

<!-- Patches a panel instead of replacing it, so a poll that lands while
     somebody is typing does not take their caret. Ordinary script, absolute
     path, no build step: nginx's catch-all `location /` serves it under the
     same gate as the page, and the test harness reads it off disk. -->
<script src="/dash/morph.js"></script>
<script>
// Same origin by default: nginx proxies /api to the Pi and adds the status
// token on the way through, so the token never reaches the browser and the
// Pi's port can stay on the LAN even when the dashboard is published.
//
// ?api=http://host:port still overrides it, for pointing at a second bot.
// `?api=` and window.SCRIBER_API point the page at a bot somewhere else. They
// are development affordances and they are now restricted to a path on this
// origin, which they were not until 2026-08-30.
//
// This page is public at quill.thehouseofcake.org. An absolute value meant a
// link on the REAL hostname could turn the real dashboard into a client of
// somebody else's server: no cookie theft (fetch defaults to same-origin
// credentials) and no injection (everything drawn goes through esc()/wiki()),
// but the whole interface became theirs to write, and every correction or
// roster search typed into it was posted to them. A convincing password prompt
// on your own domain is worth more to an attacker than an alert box.
//
// A leading slash that is not followed by another slash or a backslash is a
// path here and cannot be a host — `//evil.tld` and `/\evil.tld` are both
// read as protocol-relative by browsers, so both are refused.
const samePath = (v) => (typeof v === 'string' && /^\/(?![/\\])/.test(v) ? v : null);
const API = samePath(new URLSearchParams(location.search).get('api'))
  || samePath(window.SCRIBER_API) || '/api';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

// --- what the page is looking at ------------------------------------------
//
// Every render reads this rather than the DOM. The whole page is rebuilt from
// the poll every few seconds, so state kept in the markup would be thrown away
// mid-click.
const view = {
  screen: 'desk',       // desk | campaigns | campaign | transcript | servers | models
  signingIn: false,     // asked for the sign-in card while it was optional
  campaignId: null,
  tab: 'notes',         // notes | table | corrections | compendium | settings
  shelf: 'sessions',    // what the middle column lists: sessions | npcs | places | items
  shelfPicking: true,   // the column showing the four rather than one of them
  entry: null,          // the name last landed on in the list, as "<shelf>:<key>"
  meetingId: null,
  editing: null,        // the user id whose character name is being typed
  fixing: false,        // the correction form is open on the notes being read
  outputPicking: false, // the channel picker is open under the destination switch
  heir: null,           // who the handover picker is pointed at, before the press
  importing: false,
  creating: false,
  deleting: false,
  askingRestore: null,   // { id, name } of a deleted campaign being asked about
  reviewing: null,       // the id of a restore request being read
  diagnosing: false,    // the degraded banner's detail is open
  sheet: null,          // the account panel, hung off the top bar: account
  search: '',
  speaker: null,        // transcript filter, a user id
  picking: null,        // whose colour the picker is open for, a user id
};

// Only one dialog is ever open. Kept in one place because every opener has to
// clear the others, and a page left with two flags set shows the first one
// forever while every click on the second looks like a dead button.
const closeDialogs = () => {
  view.importing = false;
  view.creating = false;
  view.deleting = false;
  view.askingRestore = null;
  view.reviewing = null;
  view.picking = null;
  // A sheet is a dialog too as far as "only one thing is open" goes: the
  // campaigns sheet opens the new-campaign form, and leaving the sheet up
  // behind it would put a second scrim over the first one's buttons.
  view.sheet = null;
};

let me = null;          // last /me — who the bot thinks is looking
let status = null;      // last /status
let detail = null;      // last /campaign?id=
let notes = null;       // last /notes?meeting=
let notesKey = null;    // the session and job those notes were fetched for
let script = null;      // last /transcript?…&format=json
let lastSeen = null;

// The member search on the table tab. `results: null` means "not searched
// yet", which renders as nothing — distinct from `[]`, which is the honest
// and different statement that nobody matched.
const people = { query: '', results: null, error: '', busy: false };

// The sign-in card's own state, which is now only whatever went wrong last
// time. There are no steps left to be on: the card is a sentence and a button,
// and everything between pressing it and coming back happens on Discord.
const login = { message: '', failed: false };

const PROVIDERS = { gemini: 'Gemini', anthropic: 'Claude' };
const providerName = (p) => PROVIDERS[p] || p;

// --- small formatters ------------------------------------------------------

function hhmmss(ms) {
  if (ms == null) return '0:00:00';
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 3600)}:${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}
// A position in the recording, always hh:mm:ss — a three-hour session's
// timestamps have to stay comparable at a glance, and m:ss would read "202:15".
const clock = (ms) => {
  const s = Math.floor((ms ?? 0) / 1000);
  return `${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
};

// How long something ran, in the largest two units that say anything: "3:22"
// for a full evening, "0:04" for the session where everyone left before the
// bot had recorded a sentence. Both are states this actually renders.
const runtime = (ms) => {
  if (!ms) return null;
  const s = Math.round(ms / 1000);
  if (s < 3600) return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const m = Math.round(s / 60);
  return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
};
const shortDate = (iso) =>
  iso ? new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : '';
const longDate = (iso) =>
  iso ? new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const hhmm = (iso) =>
  iso ? new Date(iso).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) : '';
const n = (x) => Number(x ?? 0).toLocaleString();
const plural = (count, word) => `${n(count)} ${word}${count === 1 ? '' : 's'}`;

function since(ms) {
  if (ms == null) return 'never';
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 5) return 'just now';
  if (s < 60) return `${s}s ago`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  return h < 48 ? `${h}h ago` : `${Math.floor(h / 24)}d ago`;
}

const uptime = (ms) =>
  ms == null ? '' : `up ${Math.floor(ms / 86400000)}d ${new Date(ms).toISOString().slice(11, 16)}`;

// A user with no display name has never spoken, so all we have is the id.
// Shown as an id rather than as a blank, because that is the string you paste
// into /campaign invite.
const whoIs = (p) => p.displayName || `user ${p.userId.slice(0, 4)}…${p.userId.slice(-4)}`;

// The design's NPC entries are a name and a description. Real ones are one
// string, and the summariser chooses the punctuation between the two halves —
// so this is the same split the Obsidian exporter and the ledger use, kept
// deliberately identical to campaign/entry-name.js.
const SEPARATOR = /\s*:\s+|\s+[—–-]\s+|,\s+|\s+\(/;
function splitEntry(entry) {
  const s = String(entry ?? '').trim();
  const m = s.match(SEPARATOR);
  if (!m || m.index === 0) return { name: s, rest: '' };
  return { name: s.slice(0, m.index).trim(), rest: s.slice(m.index).replace(/^[\s:—–,(-]+/, '').replace(/\)$/, '') };
}

// A session is "Session 4" wherever a person reads about one.
//
// The bot's own reference is "Cipher_04", and it has to be: it is typed into
// a slash command on a server that may run several campaigns, so it carries
// its campaign with it. Inside this page the campaign is the thing you are
// already in, so the slug says nothing the header does not — it just reads
// like a filename. The number is what the table calls the night.
const sessionName = (s) =>
  s?.sessionNumber != null ? `Session ${s.sessionNumber}`
  : s?.ref ? String(s.ref)
  : s?.meetingId != null ? `Session #${s.meetingId}`
  : 'Session';


// ==========================================================================
// What is behind a name
// ==========================================================================

// A wikilink says there is more; this says what, without spending the reader
// their place in the sentence to find out. Everything in the card is already
// in memory — the compendium is what made the name a link in the first place —
// so hovering costs nothing and asks the bot for nothing.

let peekFor = null;      // the element the card is currently anchored to
let peekTimer = 0;

// The entry a wikilink points at, or nothing.
//
// A link only exists because vocabulary() found the name, and vocabulary()
// only answers when the compendium is loaded for this campaign — so in
// practice this always finds one. It still checks, because "the link exists
// therefore the entry does" is a fact about today’s wiki() rather than a
// promise, and the failure would be a card with a blank in it.
function peekEntry(ref) {
  const [kind, key] = String(ref ?? '').split(':');
  if (!compendium || compendium.campaignId !== view.campaignId) return null;
  return (compendium[kind] ?? []).find((e) => e.key === key) ?? null;
}

const PEEK_KIND = { npcs: 'Who', places: 'Where' };

function peekCard(entry, kind) {
  // The first thing the summariser wrote about them, which is the sentence
  // that introduced them. Later ones are what happened next, and a card is
  // not the place to catch up on a campaign.
  const what = entry.said[0]?.text ?? '';
  const nights = entry.seen.length;
  const first = entry.first ? sessionName(entry.first) : '';
  const word = kind === 'places' ? 'First gone to' : 'First met';
  return `
    <span class="peek-kind">${esc(PEEK_KIND[kind] ?? '')}</span>
    <span class="peek-name">${esc(entry.name)}</span>
    ${what ? `<span class="peek-what">${esc(what)}</span>` : ''}
    <span class="peek-foot">${first ? `${esc(word)} in ${esc(first)}` : ''}${
      nights > 1 ? ` &middot; in ${nights} nights` : ''}</span>`;
}

// Where the card goes. Under the name by preference, above it when there is
// no room below, and never off either side.
function peekPlace(anchor, card) {
  const a = anchor.getBoundingClientRect();
  const box = card.getBoundingClientRect();
  const GAP = 9;
  const EDGE = 12;

  let top = a.bottom + GAP;
  if (top + box.height > window.innerHeight - EDGE) {
    const above = a.top - box.height - GAP;
    // Only flip if flipping is actually better. On a short window both ends
    // are cramped, and a card half off the top is worse than one half off
    // the bottom, which at least starts at the name.
    if (above >= EDGE) top = above;
  }

  let left = a.left;
  const most = window.innerWidth - box.width - EDGE;
  if (left > most) left = most;
  if (left < EDGE) left = EDGE;

  card.style.top = `${Math.round(top)}px`;
  card.style.left = `${Math.round(left)}px`;
}

function peekAt(anchor) {
  const entry = peekEntry(anchor.dataset.entry);
  if (!entry) return;
  const [kind] = String(anchor.dataset.entry).split(':');
  const card = $('peek');
  if (!card) return;

  peekFor = anchor;
  card.innerHTML = peekCard(entry, kind);
  card.hidden = false;
  // Measured after it has content and before it is shown, so the flip test
  // above is reading this card rather than the last one.
  peekPlace(anchor, card);
  card.classList.add('up');
}

function peekAway() {
  clearTimeout(peekTimer);
  peekTimer = 0;
  peekFor = null;
  const card = $('peek');
  if (!card) return;
  card.classList.remove('up');
  card.hidden = true;
}

// A pause before it appears, because a card that follows the pointer across a
// paragraph is a page that flickers. None on the way out.
const PEEK_WAIT = 320;

document.addEventListener('mouseover', (event) => {
  const link = event.target.closest?.('.wiki[data-entry]');
  if (!link) { if (peekFor) peekAway(); return; }
  if (link === peekFor) return;
  clearTimeout(peekTimer);
  peekTimer = setTimeout(() => peekAt(link), PEEK_WAIT);
});

// Keyboard readers get it without the wait: tabbing to a link is already the
// deliberate act the delay exists to wait for.
document.addEventListener('focusin', (event) => {
  const link = event.target.closest?.('.wiki[data-entry]');
  if (link) peekAt(link); else if (peekFor) peekAway();
});
document.addEventListener('focusout', () => { if (peekFor) peekAway(); });

// A scroll moves the name out from under a card fixed to the viewport, and a
// click is going somewhere. Both are reasons to close rather than to chase.
window.addEventListener('scroll', () => { if (peekFor) peekAway(); }, true);
document.addEventListener('click', () => { if (peekFor) peekAway(); }, true);


// --- the rules a write-up names ---------------------------------------------
//
// Fetched rather than carried: the table is 26KB of spell names and would sit
// in this page whether or not anybody opened a write-up. One request per
// edition, kept for the life of the tab.
//
// Two editions and they are different lists — 2024 dropped spells the 2014
// books had — so what is linked depends on which rulebook the campaign says it
// plays out of. A link to a page that 404s is worse than no link.

let rules = null;   // { edition, by: Map<name, url>, re: RegExp }

async function loadRules(edition) {
  const want = String(edition || '2024');
  if (rules && rules.edition === want) return;
  try {
    const got = await get(`/rules?edition=${encodeURIComponent(want)}`);
    const by = new Map(got.spells.map((s) => [s.name, s.url]));

    // ONE regex for the whole list rather than one per name. The campaign
    // vocabulary is a dozen entries and can afford a pass each; this is three
    // hundred and sixty, against every passage, on a page that repaints every
    // five seconds.
    //
    // Longest first, because alternation takes the first branch that matches
    // at a position: without it, a two-word spell whose first word is also a
    // spell would be claimed by the shorter one and point at the wrong page.
    const names = [...by.keys()].sort((a, b) => b.length - a.length).map(escapeRe);
    rules = {
      edition: got.edition,
      label: got.label,
      by,
      re: names.length
        ? new RegExp(`(^|[^A-Za-z0-9'’])(${names.join('|')})(?![A-Za-z0-9])`, 'g')
        : null,
    };
  } catch (err) {
    // A write-up with no rules links reads exactly as it did last week. Not
    // worth a toast, and definitely not worth stopping the page for.
    rules = null;
  }
}

// Where each rule name falls in a passage, skipping anything the campaign’s
// own names have already claimed.
//
// First occurrence only, per name, per passage — the same rule the wikilinker
// uses next door, and for the same reason: the fourth Fireball in a paragraph
// connects nothing the first did not.
function ruleSpans(raw, taken) {
  if (!rules?.re) return [];
  const spans = [];
  const seen = new Set();
  rules.re.lastIndex = 0;
  let m;
  while ((m = rules.re.exec(raw))) {
    const start = m.index + m[1].length;
    const end = start + m[2].length;
    rules.re.lastIndex = end;
    if (seen.has(m[2]) || taken(start, end)) continue;
    seen.add(m[2]);
    spans.push({ start, end, url: rules.by.get(m[2]) });
  }
  return spans;
}
// --- wikilinks -------------------------------------------------------------
//
// Every NPC and every place a write-up has named already has somewhere to be
// on this page. So a recap that names one should be a way of getting there,
// and this is what makes it one: the campaign's own compendium is the
// vocabulary, and any name in it that turns up in the prose becomes a link to
// that entry.
//
// The rules are deliberately the four the Obsidian exporter already uses, in
// export/linkify.js, so a name is a link in the vault if and only if it is a
// link here:
//
//   * FIRST OCCURRENCE ONLY, per name, per passage. A link either exists or
//     it does not; the fourth "Kerowyn" in a paragraph adds nothing to what
//     is connected and costs the sentence its rhythm.
//   * CASE-SENSITIVE. These are proper nouns, and matching loosely would put
//     a link on "the citadel" in ordinary prose.
//   * WHOLE WORDS, with a trailing possessive left outside the link, so
//     "Kerowyn's" links Kerowyn rather than something called "Kerowyn's".
//   * LONGEST FIRST, so "Sunless Citadel" is linked whole instead of having
//     "Citadel" claimed out from under it.
//
// Nothing is asked of the summariser for this, on purpose. Links written into
// the stored recap would exist only for sessions summarised after the prompt
// changed; every session already written would need re-summarising — real
// money, on the owner's bill — to gain one; and the model would be inventing
// link targets with no way of knowing which entries exist. Linking at the
// moment of reading, against the list the campaign actually has, is
// retrospective for nothing and cannot point at a page that is not there.

const MIN_LINK_WORD = 3;
const escapeRe = (t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

// A name worth matching on. Proper nouns start with a capital, and a short
// single word — an NPC called "Al" — would fire on any stray occurrence.
const matchable = (name) =>
  /^[A-Z]/.test(name) && (name.includes(' ') || name.length >= MIN_LINK_WORD);

function vocabulary() {
  if (!compendium || compendium.campaignId !== view.campaignId) return [];
  const out = [];
  for (const kind of ['npcs', 'places']) {
    for (const e of compendium[kind] ?? []) {
      if (matchable(e.name)) out.push({ name: e.name, kind, key: e.key });
    }
  }
  return out.sort((a, b) => b.name.length - a.name.length);
}

// Where in a passage each name falls, once. Shared by the two things that
// need it — the reader, which wraps a name in a button, and the clipboard,
// which wraps it in brackets — so a link is in one if and only if it is in the
// other.
//
// `except` is the entry currently being read, so an NPC's own page does not
// fill up with links back to itself.
function wikiSpans(raw, except) {
  const vocab = vocabulary().filter((v) => `${v.kind}:${v.key}` !== except);
  if (!raw || !vocab.length) return [];

  const spans = [];
  const clash = (start, end) => spans.some((sp) => start < sp.end && end > sp.start);

  for (const v of vocab) {
    // The apostrophe is excluded BEFORE the name and allowed after it. Before,
    // it stops "Malley" matching inside "O'Malley"; after, allowing it is what
    // makes a possessive link at all. Whitespace inside a name matches any run
    // of it, because a name copied out of a transcript really does sometimes
    // carry two spaces.
    const re = new RegExp(
      `(^|[^A-Za-z0-9'\u2019])(${escapeRe(v.name).replace(/\s+/g, '\\s+')})(?![A-Za-z0-9])`,
      'g'
    );
    let m;
    while ((m = re.exec(raw))) {
      const start = m.index + m[1].length;
      const end = start + m[2].length;
      // The first occurrence that is still free. A longer name having claimed
      // this one does not mean this name goes unlinked in the passage.
      if (!clash(start, end)) { spans.push({ start, end, v }); break; }
      re.lastIndex = end;
    }
  }

  // The rules go in after the campaign’s own names and never over them. A
  // table that has an NPC called Sanctuary means the person, and the one
  // thing this must not do is send a reader out of the product to read about
  // somebody they know.
  spans.push(...ruleSpans(raw, clash));
  return spans.sort((a, b) => a.start - b.start);
}

// Escaping and linking happen in one pass. Two passes would mean either
// matching names inside text that is already escaped — where "&amp;" is
// something a name could be found in the middle of — or building a tag into a
// string that is escaped afterwards, which prints the tag.
function wiki(text, except = null) {
  const raw = String(text ?? '');
  const spans = wikiSpans(raw, except);
  if (!spans.length) return esc(raw);

  let out = '';
  let at = 0;
  for (const sp of spans) {
    const word = esc(raw.slice(sp.start, sp.end));
    out += esc(raw.slice(at, sp.start));
    out += sp.url
      ? `<a class="rule" href="${esc(sp.url)}" target="_blank" rel="noopener noreferrer"`
        + ` title="Read ${word} on the ${esc(rules?.label ?? 'rules')} wiki">${word}</a>`
      : `<button type="button" class="wiki" data-entry="${sp.v.kind}:${esc(sp.v.key)}">${word}</button>`;
    at = sp.end;
  }
  return out + esc(raw.slice(at));
}

// The same links, written the way a vault writes them. What this page draws as
// an underline is [[Wren Halloway]] in a file, and a recap pasted into Obsidian
// ought to arrive already joined to the notes the exporter makes.
function wikiText(text) {
  const raw = String(text ?? '');
  const spans = wikiSpans(raw, null);
  if (!spans.length) return raw;

  let out = '';
  let at = 0;
  for (const sp of spans) {
    const word = raw.slice(sp.start, sp.end);
    // A rules link is left as plain words. [[Fireball]] in a vault means a
    // note called Fireball, which the exporter does not write and the reader
    // does not have — so bracketing it would fill their graph with dead ends.
    // The address is on the page they copied it from.
    out += raw.slice(at, sp.start) + (sp.url ? word : `[[${word}]]`);
    at = sp.end;
  }
  return out + raw.slice(at);
}

const dotFor = (state) => `<span class="dot ${state === true ? 'ok' : state === false ? 'bad' : ''}"></span>`;

// What this viewer may do.
//
// The server has already cut the payload to match — see web/scope.js — so
// nothing here is a security control. It is what stops the page rendering a
// row of buttons that would all answer 403, which is a worse way to learn what
// you are allowed to do than not being offered it.
//
// Defaults to true against a bot too old to answer /me, so an out-of-step
// deploy degrades to the behaviour that existed before levels did.
const cap = (name) => (me?.can ? Boolean(me.can[name]) : true);

// Starting a campaign needs somewhere to put it. The bot works out which
// servers those are and sends the list; an empty list means the button would
// only ever open a dialog with nothing to pick, so it is not drawn at all.
const canCreate = () => status?.actionsEnabled !== false && (status?.canCreateIn?.length ?? 0) > 0;

// Deleting is not the same authority as managing. A server owner can manage a
// campaign in their Discord; only whoever actually runs it can delete it. The
// bot decides — this only mirrors the answer so the button is not drawn for
// somebody who would be refused.
const RESTORE_DAYS = 30;
const canDelete = () =>
  status?.actionsEnabled !== false && Boolean(detail?.viewerCan?.delete);

// Whether actions are possible at all: the bot must accept them, and this
// viewer must be allowed to make them.
const can = () => status?.actionsEnabled !== false && cap('approvals');

// Managing one campaign is a different question from the machinery — a
// campaign's own creator may edit its roster without being able to pause a
// queue that belongs to somebody else's hardware.
const canManage = () => status?.actionsEnabled !== false && (detail?.viewerCan?.manage ?? cap('manage'));

// Handing a campaign to somebody else. Narrower than managing it: who runs a
// campaign is a question about who somebody IS on this bot, and assigning that
// sits with the Level and Tier columns rather than inside one campaign's own
// settings. A manager keeps everything else on this screen.
const canHandOver = () => status?.actionsEnabled !== false && cap('everything');

// Where this campaign's notes end up, in words.
//
// Not a channel name with a # in front of it: a campaign's `channel` is the
// last VOICE channel it recorded in, and the default destination is that
// channel's own text feed — or NOTES_CHANNEL_ID, if the Pi sets one. Naming a
// channel here would be a guess, and it would be wrong on exactly the installs
// that configured something.
const destination = () =>
  detail?.output === 'dm' ? 'you, as a DM'
  : detail?.output === 'channel' ? "this campaign's notes channel"
  : 'the channel you played in';

const campaign = () => status?.campaigns?.find((c) => c.id === view.campaignId) ?? null;
const sessions = () => (detail?.sessions ?? []).map(normalise);
const selected = () => sessions().find((s) => s.meetingId === view.meetingId) ?? null;

// A bot older than this page does not send `state`, `job` or the recap facets.
// Deriving what can be derived keeps the page useful against it rather than
// printing "undefined" in every pill — the two are deployed from different
// places (this file from a bind mount, the fields from an image), so they are
// routinely a few minutes out of step.
function normalise(s) {
  if (s.state) return s;
  const st = s.status ?? '';
  return {
    ...s,
    state: st === 'done' ? 'posted' : st.endsWith('_failed') ? 'failed' : st === 'recording' ? 'recording' : 'queued',
    npcs: 0, locations: 0, threads: 0, tldr: '',
    discardable: s.lines === 0 && st !== 'recording',
  };
}

// ==========================================================================
// The theme
// ==========================================================================
//
// Three states, not two. "auto" is the absence of a stored choice, so a person
// who never touches this follows their machine forever rather than being
// frozen at whatever it happened to be the first time they opened the page.
// The <script> in <head> reads the same key before first paint.

const themeMode = () => {
  try {
    const t = localStorage.getItem('quill-theme');
    return t === 'dark' || t === 'light' ? t : 'auto';
  } catch (e) { return 'auto'; }
};

function setTheme(mode) {
  try {
    if (mode === 'auto') localStorage.removeItem('quill-theme');
    else localStorage.setItem('quill-theme', mode);
  } catch (e) {}
  if (mode === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', mode);
  paint();
}

const themeSwitch = () => {
  const now = themeMode();
  return `<div class="seg theme" role="group" aria-label="Theme">${
    [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']].map(([id, name]) =>
      `<button type="button" class="${now === id ? 'on' : ''}" data-theme-set="${id}"
         aria-pressed="${now === id}">${name}</button>`).join('')
  }</div>`;
};

// ==========================================================================
// The campaigns page, and going in
// ==========================================================================

// What is true about a table right now, and worth acting on. Only ever one
// thing: a campaign being recorded is not also waiting on you, and a campaign
// with nothing to say gets no line rather than a line saying nothing.
//
// Deliberately not `claimed`. It reads like a live state and is not one — it
// means the campaign has a DM who runs it, which is a fact about the campaign
// rather than something happening tonight. The signal an operator actually
// wants from it is the opposite one, a campaign with nobody running it, and
// that is a different line than this.
const campaignState = (c) =>
  c.recording ? { key: 'live', dot: 'live', say: 'recording now' }
  : c.awaiting ? { key: 'wait', dot: 'brass', say: `${plural(c.awaiting, 'night')} waiting on you` }
  : null;

// "played 2 days ago". Days rather than hours, because the unit a campaign is
// measured in is the night it was played, and "played 14h ago" is a sentence
// about a server rather than about a game.
function lastPlayed(iso) {
  if (!iso) return 'no nights recorded';
  const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (days <= 0) return 'played today';
  if (days === 1) return 'played yesterday';
  if (days < 14) return `played ${days} days ago`;
  if (days < 60) return `played ${Math.round(days / 7)} weeks ago`;
  return `played ${Math.round(days / 30)} months ago`;
}

// The tally: one stroke per night. Written up, waiting on you, and still with
// the transcriber, in that order — so the strokes read left to right as the
// life of a session, and the pen-coloured ones are always the ones to look at.
//
// Capped, because past about forty strokes the row stops being a shape you can
// take in at a glance and the number is the better answer.
const TALLY_CAP = 40;
function tally(c) {
  const total = c.sessions ?? 0;
  if (!total) return '';
  const shown = Math.min(total, TALLY_CAP);
  const wait = Math.min(c.awaiting ?? 0, shown);
  const done = Math.max(0, Math.min(c.completed ?? 0, shown - wait));

  const marks = Array.from({ length: shown }, (_, i) =>
    i < done ? 'done' : i < done + wait ? 'wait' : '');

  const groups = [];
  for (let i = 0; i < marks.length; i += 5) {
    groups.push(`<span class="grp">${
      marks.slice(i, i + 5).map((k) => `<i class="${k}"></i>`).join('')}</span>`);
  }
  return `<span class="tally" aria-hidden="true">${groups.join('')}${
    total > shown ? `<span class="rest">+${total - shown}</span>` : ''}</span>`;
}

// Small numbers as words. A display face setting "6 campaigns" reads like a
// receipt; past twelve the word is longer than the thing it counts.
const WORDS = ['no', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven',
               'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve'];
const count = (x) => (x < WORDS.length ? WORDS[x] : String(x));

// How many tables somebody sits at, remarked upon. Indexed by that number, so
// the page gets quietly more concerned about you as the list grows.
//
// Dry rather than loud, and none of them repeats the number the sentence has
// already said. This is the first line on the first screen, read every time
// anybody opens the dashboard — a joke at that frequency has to be quiet
// enough to live with, so these are asides in the scribe's voice rather than
// punchlines, and they are set in the dim colour to read as muttering.
const REMARKS = [
  '',                                            // 0 — the first-run screen answers instead
  'A good place to start.',
  'Twice the names to keep straight.',
  'The calendar is doing the hard part.',
  'Somebody at your table is very patient.',
  'Quill has stopped asking when you sleep.',
  'This is less a hobby than a rota.',
  'One for every night of the week.',
  'Somewhere, a session zero is weeping.',
  'The ink budget has become a real concern.',
  'Quill would like a word.',
  'Nobody needs this many worlds.',
  'One for every month, apparently.',
];
const remark = (howMany) => REMARKS[howMany] ?? 'Quill has stopped counting and started worrying.';

// The send-off, on a night with nothing running — which is most of them.
//
// This line is the first thing anybody sees, and it is standing in the doorway
// of an evening of D&D. Two earlier attempts got that wrong in the same way.
// "Everything is written up." was a status. So was every line that replaced
// it, because each one opened by saying what Quill was doing — "Nothing is
// running", "Quill is idle", "Between nights" — and spent the good half of the
// sentence on the machine rather than on the game.
//
// Nobody signs in to find out how the bot is feeling. The state is already
// drawn: a live table gets a band, a queue gets a band, and their absence is
// the answer on its own. So the head is not a status at all now. It is a quip
// to send somebody off with, and it is the only place in this product allowed
// to be purely for fun.
//
// Table talk, not fantasy diction: split parties, hoards, plot hooks nobody
// pulls, a plan that lasts one round. Mock-heroic and dry rather than loud —
// the joke carries the energy, so none of them needs an exclamation mark.
//
// Two constraints hold, and both are load-bearing rather than stylistic:
//
//   - None may claim the writing is finished. scope.js zeroes `awaiting` for
//     anybody who may not see the queue, so "all written up" would be Quill
//     vouching to a player for something it had never shown them. Because
//     these say nothing about Quill at all, the operator and a player can be
//     given the same line — and a test holds the two equal, so if they ever
//     diverge a claim has crept back in.
//   - None may need an apostrophe. These are single-quoted literals in a file
//     patched by exact string match, and a stray escape is a silent corruption
//     rather than a syntax error.
const ONWARD = [
  'Fortune favours the party that splits up.',
  'Somewhere a goblin is having a normal day.',
  'The map has edges. Go past them.',
  'The hoard will not loot itself.',
  'Every legend started with a bad idea.',
  'May your plans survive the first round.',
  'Roll badly. It makes a better story.',
  'Go forth and ignore the plot hook.',
  'Trust the dice. They have never let anyone down.',
  'Go and make something worth writing down.',
];

// Which of them today gets. Fixed to the date and not to chance: the desk
// re-renders on every five-second poll, so a line picked at random would
// change while somebody was still reading it. A day book has one line per
// day, and ten of them is enough that the one you get feels like today's
// rather than like a rotation you have learned.
//
// Counted in local days rather than UTC ones, so it turns over at the reader's
// midnight rather than in the middle of somebody's session.
const onward = () => {
  const d = new Date();
  const day = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  return ONWARD[day % ONWARD.length];
};

// ==========================================================================
// The desk — the front door, and the answer before the question
// ==========================================================================
//
// Signing in used to land on the ledger of campaigns, which answers "which
// table" and nothing else. Then it landed on a sheet of squares headed
// "Where would you like to start?", which asked the question instead of
// answering it and headed four of its squares with a count rather than a
// name — "Three servers", "Four tables" — so there was nothing on the page
// to scan.
//
// This screen answers first. The head reports the one thing that is true
// right now, in Quill's own voice. Under it, tonight: a live recording and
// nights waiting to be written up, full width, drawn only when they exist —
// there is no "nothing is recording" band, because a page of absences is a
// worse answer than a shorter page. Under THAT, the index: every standing
// place there is to go, named, with its figure ruled across to the right.
//
// The rule the whole screen is built on: prose gets words ("Two nights are
// waiting"), the figure column gets digits ("2 nights"). A count never takes
// the display face, and a place is never nameless.

// A day book is headed with its date, and this is the only place on the page
// where today is the subject.
const today = () => {
  try {
    return new Date().toLocaleDateString(undefined,
      { weekday: 'long', day: 'numeric', month: 'long' });
  } catch {
    return '';
  }
};

// The mark that means "this goes somewhere". One glyph on every band and
// every door, so the affordance is a single sign rather than four.
const ARW = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
  <path d="M4.5 12h14m-6-5.5L18.5 12 12.5 17.5" stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// One entry in the index. Name at the left margin, leader ruled across to the
// figure, arrow past it, and what is behind the door on the line below.
//
// `fig` is allowed to be empty: the gatehouse is a page about people rather
// than a page of things to count, and a leader that runs all the way to the
// arrow says that more honestly than an invented number would.
const door = (attrs, { name, say, fig = '' }) => `
  <button type="button" class="door" ${attrs}>
    <span class="door-name">${esc(name)}</span>
    <span class="door-lead" aria-hidden="true"></span>
    <span class="door-fig">${esc(fig)}</span>
    <span class="door-arw">${ARW}</span>
    <span class="door-say">${esc(say)}</span>
  </button>`;

// One band. `mark` carries markup — the live dot is part of the label, not a
// decoration beside it — so it is the one field here that is not escaped.
const band = (attrs, { tone, mark, name, say, fig, figAttrs = '', go }) => `
  <button type="button" class="band ${tone}" ${attrs}>
    <span class="band-main">
      <span class="band-mark">${mark}</span>
      <span class="band-name">${esc(name)}</span>
      <span class="band-say">${esc(say)}</span>
    </span>
    <span class="band-end">
      <span class="band-fig" ${figAttrs}>${esc(fig)}</span>
      <span class="band-go">${esc(go)}${ARW}</span>
    </span>
  </button>`;

function deskScreen() {
  const camps = status?.campaigns ?? [];
  const rec = camps.find((c) => c.recording) ?? null;
  // One flag, one session. The flag used to mean "this Discord is recording",
  // so it lit every campaign in the server and the count had to be of distinct
  // guilds to avoid reporting two sessions off one /join. It now means "THIS
  // table is recording" — and counting guilds would under-report the other
  // way, since a Discord with a second bot can genuinely hold two at once.
  const sessions = camps.filter((c) => c.recording).length;
  // The live session behind the recording campaign, which is where the clock
  // and the clip count come from. Matched on the meeting rather than the
  // guild, which picks an arbitrary one of two tables in the same Discord.
  const onAir = rec ? (status?.recording ?? []).find((r) => r.meetingId === rec.meetingId) : null;

  const waiting = camps.reduce((sum, c) => sum + (c.awaiting || 0), 0);
  const needy = camps.filter((c) => c.awaiting).sort((a, b) => b.awaiting - a.awaiting)[0];
  const held = Boolean(waiting && needy && can());

  const nights = camps.reduce((sum, c) => sum + (c.sessions || 0), 0);
  const hours = camps.reduce((sum, c) => sum + (c.hours || 0), 0);

  // What Quill has to report — at most one thing, and the most urgent one.
  // A table on the air beats a queue; a queue beats a quiet night; and a
  // desk with nothing recorded on it yet is not owed a joke.
  const verdict = sessions
    ? (sessions === 1 ? 'Quill is at the table.' : `Quill is at ${count(sessions).toLowerCase()} tables.`)
    : held
      ? `${count(waiting)} night${waiting === 1 ? ' is' : 's are'} waiting to be written up.`
      : nights ? onward()
      : 'Nothing on file yet.';

  // What the book has come to. Never about tonight, always true.
  //
  // Not the number of tables: the Campaigns door carries that figure three
  // inches below, and the same count said twice on one screen only makes the
  // reader check whether they are two different numbers. This line is the
  // VOLUME of what Quill has kept, which nothing else on the desk says.
  const onFile = nights
    ? [plural(nights, 'night'), hours >= 1 ? `${Math.round(hours)} hours recorded` : '']
        .filter(Boolean).join('  ·  ')
    : '';

  const bands = [];

  if (rec) {
    bands.push(band(`data-campaign="${rec.id}"`, {
      tone: 'live',
      mark: '<span class="dot live"></span>Recording',
