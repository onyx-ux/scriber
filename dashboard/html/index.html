            </span></div>
            <div class="r" style="display:flex;justify-content:flex-end;align-items:center;gap:10px">
              <span class="as-val ${p.consent.withdrawn ? 'declined' : CONSENT_CLASS[p.consent.state] || 'never'}">${esc(p.consent.label)}</span>
              ${askable(p) ? `<button type="button" class="btn sm" data-act="roster/invite" data-campaign="${detail.id}"
                data-user="${esc(p.userId)}">${p.consent.state === 'pending' ? 'Ask again' : 'Invite'}</button>` : ''}
            </div>
          </div>`;
        }).join('')}
      </div>
      ${roster.length ? '' : '<div class="quiet" style="padding:20px 0">Nobody at this table yet.</div>'}
      ${canManage() ? invitePanel() : ''}
      ${roster.some((p) => p.consent.withdrawn) ? `
        <div style="border-left:2px solid var(--edge);padding-left:16px;margin-top:26px;max-width:70ch">
          <div class="quiet">
            There is no control here to put someone back. If they want to be recorded again they run
            <code>/campaign consent</code> themselves — asking on their behalf is a conversation, not a button.
          </div>
        </div>` : ''}
      ${canManage() ? '' : disabledNote()}
    </div>`;
}

// Who it makes sense to ask.
//
// Not someone who already agreed, and never someone who turned recording off
// themselves — re-asking them is the one thing this screen must not offer,
// because it turns their own decision into something to be nagged about.
const askable = (p) => canManage() && !p.consent.mayRecord && !p.consent.withdrawn && p.consent.state !== 'declined';

const listNames = (people) => {
  const names = people.map(whoIs);
  if (names.length === 1) return names[0];
  if (names.length === 2) return `${names[0]} and ${names[1]}`;
  return `${names.slice(0, -1).join(', ')} and ${names[names.length - 1]}`;
};

// Ask somebody who is not on the roster yet.
//
// Typed, not pasted: the operator knows their table by the name in the channel,
// and a screen that demanded a Discord snowflake would send them back to the
// client to right-click somebody — which is exactly the errand this page exists
// to save. A pasted id still works, for a nickname the search cannot match.
function invitePanel() {
  const found = people.results;

  return `
    <div style="margin-top:34px;max-width:760px">
      <div class="cap" style="margin-bottom:12px">Ask someone new</div>
      <form class="row-btns" data-people-search>
        <input class="in" id="people-q" name="query" style="flex:0 0 280px"
               placeholder="a Discord name, or a pasted user id" value="${esc(people.query)}"
               aria-label="Search this server for a person">
        <button class="btn go" type="submit" ${people.busy ? 'disabled' : ''}>
          ${people.busy ? 'Looking…' : 'Search'}</button>
        ${people.query || found ? '<button class="btn ghost" type="button" data-people-clear>Clear</button>' : ''}
      </form>

      ${people.error ? `<div class="quiet" style="margin-top:12px;color:var(--brass-lit)">${esc(people.error)}</div>` : ''}

      ${found ? (found.length ? `
        <div class="grid" style="margin-top:18px">
          ${found.map((m) => {
            const already = detail.roster.find((p) => p.userId === m.userId);
            return `<div class="tr" style="grid-template-columns:36px 1fr 1fr auto">
              <div>${m.avatar
                ? `<img src="${esc(m.avatar)}" alt="" width="28" height="28" style="border-radius:50%">`
                : '<span class="dot" style="width:28px;height:28px;border-radius:50%"></span>'}</div>
              <div>
                <div style="font-size:14.5px">${esc(m.displayName)}</div>
                <div class="mono" style="font-size:11px;color:var(--dim);margin-top:2px">@${esc(m.username)}</div>
              </div>
              <div class="quiet">${already
                ? (already.consent.mayRecord ? 'already agreed'
                   : already.consent.withdrawn ? 'turned recording off themselves'
                   : already.consent.state === 'pending' ? 'asked, waiting'
                   : 'on the roster, not asked')
                : 'not at this table yet'}</div>
              <div class="r">${already?.consent.mayRecord || already?.consent.withdrawn
                ? ''
                : `<button type="button" class="btn sm go" data-act="roster/invite" data-campaign="${detail.id}"
                     data-user="${esc(m.userId)}">Ask them</button>`}</div>
            </div>`;
          }).join('')}
        </div>` : `<div class="quiet" style="margin-top:14px">
          Nobody in this server matches “${esc(people.query)}”. Discord matches on username and server nickname —
          or paste their user id (right-click them in Discord, Copy User ID).
        </div>`) : ''}

      <div class="quiet" style="margin-top:16px;max-width:70ch">
        They get a DM explaining what is recorded, where it goes and how long it is kept, with the buttons to
        agree or refuse. Nothing of theirs is captured until they say yes.
      </div>
    </div>`;
}

// Click the name to change it, rather than a form under every row. A roster of
// six players was six always-open text boxes, which read as a data-entry
// screen for something you set once.
function characterCell(p, who) {
  // Your own character is yours to name wherever you are welcome, which is
  // what /campaign setchar has always done. Anybody else's needs the table.
  const mine = me?.signedIn && p.userId && p.userId === me.userId;
  if (!canManage() && !mine) {
    return p.characterName ? esc(p.characterName) : '<span class="unset">not set</span>';
  }
  if (view.editing === p.userId) {
    return `<form class="row-btns" data-act="roster/character" data-campaign="${detail.id}" data-user="${esc(p.userId)}">
      <input class="in" name="name" style="width:140px" value="${esc(p.characterName || '')}"
             placeholder="character" aria-label="Character for ${esc(who)}" autofocus>
      <button class="btn sm go" type="submit">Save</button>
      <button class="btn sm ghost" type="button" data-cancel-edit>Cancel</button>
    </form>`;
  }
  return `<button class="charbtn" data-edit="${esc(p.userId)}"
            title="Click to set the character name">${
    p.characterName ? esc(p.characterName) : '<span class="unset">not set</span>'
  }</button>`;
}

// ==========================================================================
// Corrections
// ==========================================================================

function correctionsTab() {
  const list = detail.corrections;
  return `
    <div style="display:flex;gap:40px;padding-top:30px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:0;max-width:900px">
        <h1 class="display sm">What Whisper keeps getting wrong</h1>
        <div class="say-2" style="font-size:15px;max-width:70ch">
          Fantasy names come back mangled. Write the fix once and Quill applies it to every future
          transcript, then replays it over the ones this campaign already has.
        </div>

        <div class="grid corr" style="margin-top:30px">
          <div class="hd">
            <div>Heard as</div><div>Should read</div>
            <div class="r">In transcripts</div><div></div>
          </div>
          ${list.map((c) => `
            <div class="tr">
              <div class="mono" style="font-size:14px;color:var(--text-2)">“${esc(c.wrong)}”</div>
              <div style="font-size:15px;font-weight:500">${esc(c.right)}</div>
              <div class="r mono" style="font-size:13px;color:var(--dim)">${c.lines == null ? '—' : `${n(c.lines)} lines`}</div>
              <div class="r">${canManage() ? `<button type="button" class="btn sm" data-act="corrections/remove"
                data-campaign="${detail.id}" data-wrong="${esc(c.wrong)}">Remove</button>` : ''}</div>
            </div>`).join('')}
          ${canManage() ? `
            <form class="tr" data-act="corrections/add" data-campaign="${detail.id}" style="border-bottom:0;padding-top:18px">
              <input class="in" name="wrong" placeholder="what Whisper hears" required aria-label="Misheard text">
              <input class="in" name="right" placeholder="what it should say" required aria-label="Correct text">
              <div></div>
              <div class="r"><button class="btn go" type="submit">Add</button></div>
            </form>` : ''}
        </div>
        ${list.length ? '' : '<div class="quiet" style="padding-top:18px">No corrections saved yet.</div>'}
        ${canManage() ? '' : disabledNote()}
      </div>

      <div class="aside">
        <div class="card">
          <div class="cap">Replay</div>
          <h4>${list.length ? plural(list.length, 'rule') : 'Nothing saved'}</h4>
          <div class="quiet" style="margin-top:8px">
            Adding a correction already rewrites this campaign's transcripts. Replay is for the sessions
            that arrived afterwards from somewhere else — an import, or anything recovered from a crash.
          </div>
          ${canManage() && list.length ? `<button type="button" class="btn wide" style="margin-top:16px" data-act="corrections/replay"
            data-campaign="${detail.id}"
            data-confirm="Replay every correction over this campaign's transcripts?">Replay over everything again</button>` : ''}
        </div>
        <div class="card">
          <div class="cap">What this does not touch</div>
          <div class="quiet" style="margin-top:10px">
            Notes already written keep the old spelling — the summariser wrote them from the transcript as
            it was. Re-summarise a session to regenerate one.
          </div>
        </div>
      </div>
    </div>`;
}

// ==========================================================================
// Settings

function settingsTab() {
  const s = status?.schedule ?? {};
  const roster = detail.roster;
  const agreed = roster.filter((p) => p.consent.mayRecord).length;
  const asked = roster.filter((p) => p.consent.state === 'pending' || p.consent.state === 'expired').length;
  const never = roster.filter((p) => p.consent.state === 'unasked' || p.consent.state === 'declined').length;
  const providers = status?.providers ?? [];
  const mode = detail.output === 'dm' ? 'dm' : detail.output === 'channel' ? 'channel' : 'default';

  const row = (what, sub, control) => `
    <div class="set-row">
      <div><div class="what">${what}</div><div class="sub">${sub}</div></div>
      <div>${control}</div>
    </div>`;

  return `
    <div style="display:flex;gap:40px;padding-top:30px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:0;max-width:820px">
        <h1 class="display sm">How this campaign runs</h1>

        <div class="cap" style="margin:28px 0 6px">Where the notes go</div>
        ${row('Destination', 'Everyone in the channel sees the write-up, or only you do',
          // The middle option is shown but never settable from here: choosing a
          // channel means listing the channels the bot may post in, which only
          // Discord can answer. It is still a state a campaign can be IN, so it
          // has to be visible — and leaving it out was a dead end, because a
          // campaign posting to a chosen channel could then never be moved.
          `<div class="seg" data-seg="output">
             <button type="button" class="${mode === 'default' ? 'on' : ''}" data-act="campaign/output" data-campaign="${detail.id}"
                     data-mode="default" ${canManage() ? '' : 'disabled'}>Where we played</button>
             <button class="${mode === 'channel' ? 'on' : ''}" disabled
                     title="Set with /campaign output in Discord, where the channels can be listed">A chosen channel</button>
             <button type="button" class="${mode === 'dm' ? 'on' : ''}" data-act="campaign/output" data-campaign="${detail.id}"
                     data-mode="dm" ${canManage() && detail.claimed ? '' : 'disabled'}>DM to me</button>
           </div>`)}
        ${row('Last recorded in', 'The voice channel Quill most recently joined for this campaign',
          `<span class="val">${esc(detail.channel || 'never recorded')}</span>`)}
        ${row('Who writes them',
          providers.length > 1
            ? 'Chosen at the moment of approval, per session'
            : 'The only summariser with an API key on this bot',
          providers.length
            ? `<div class="seg">${providers.map((p) => `
                 <button class="${p === status?.health?.summariserName ? 'on' : ''}" disabled>${esc(providerName(p))}</button>`).join('')}</div>`
            : '<span class="val">none configured</span>')}

        <div class="cap" style="margin:32px 0 6px">Recording</div>
        ${row('Ask me before summarising', 'Nothing is posted until you release it',
          `<span class="val">${s.requireApproval ? 'on' : 'off'}</span>`)}
        ${row('Transcribe automatically', 'Only inside the window, so the PC is free while you work',
          `<div class="row-btns">
             <span class="val">${String(s.windowStartHour ?? 0).padStart(2, '0')}:00 – ${String(s.windowEndHour ?? 0).padStart(2, '0')}:00</span>
             <span class="val">${s.weekdaysOnly ? 'weekdays' : 'any day'}</span>
           </div>`)}
        ${row('Timezone',
          s.nextAutoWindowAt
            ? `Next window opens ${esc(longDate(s.nextAutoWindowAt))} at ${esc(hhmm(s.nextAutoWindowAt))}`
            : 'No automatic window scheduled',
          `<span class="val">${esc(s.timeZone || 'system')}</span>`)}

        <div class="quiet" style="margin-top:20px;max-width:70ch">
          The window, the timezone and the approval switch are set once in <code>pi-service/.env</code> on the
          Pi, because they describe the machine rather than this campaign. Renaming, inviting a player, and
          posting into a specific channel happen in Discord where the people they concern are —
          <code>/campaign rename</code>, <code>/campaign invite</code>, <code>/campaign output</code>.
        </div>
      </div>

      <div class="aside">
        <div class="card good">
          <div class="cap" style="color:var(--sage-lit)">Audio</div>
          <h4>Deleted once transcribed</h4>
          <div class="quiet" style="color:var(--text-2)">
            Quill keeps the transcript and the notes. The recording itself never leaves your network and is
            not kept, and this cannot be turned off.
          </div>
        </div>
        <div class="card">
          <div class="cap">Consent</div>
          <div style="display:flex;flex-direction:column;gap:9px;margin-top:12px">
            <div style="display:flex;justify-content:space-between;font-size:13.5px"><span>Agreed</span><span class="mono agreed">${agreed}</span></div>
            <div style="display:flex;justify-content:space-between;font-size:13.5px"><span>Asked, waiting</span><span class="mono waiting">${asked}</span></div>
            <div style="display:flex;justify-content:space-between;font-size:13.5px"><span>Never asked</span><span class="mono never">${never}</span></div>
          </div>
          ${asked + never ? `<button class="btn wide" style="margin-top:16px" data-tab="table">
            Ask the ${asked + never === 1 ? 'one who has not answered' : `${asked + never} who have not answered`}
          </button>` : ''}
        </div>
        <div class="card">
          <div class="cap">Reading it elsewhere</div>
          <div class="quiet" style="margin-top:10px">
            Every session is exported as markdown into the Obsidian vault on the Pi, alongside the campaign's
            NPC and location ledgers. <code>/campaign export</code> attaches a transcript in Discord.
          </div>
        </div>
        ${canDelete() ? `
        <div class="card danger">
          <div class="cap" style="color:var(--red-lit)">Deleting this campaign</div>
          <div class="quiet" style="margin-top:10px;color:var(--text-2)">
            It leaves every list straight away, and nothing is erased — not a session, not a line anybody
            spoke. You have ${RESTORE_DAYS} days to change your mind.
          </div>
          <button type="button" class="btn wide danger" style="margin-top:16px" data-delete-campaign>
            Delete ${esc(detail.name || detail.label || 'this campaign')}
          </button>
        </div>` : ''}
      </div>
    </div>`;
}

const disabledNote = () => `

// ==========================================================================
// The transcript reader
// ==========================================================================

function transcriptScreen() {
  if (!script) return '<div class="pane-main"><div class="quiet">Opening the transcript…</div></div>';

  const term = view.search.trim().toLowerCase();
  const lines = script.lines.filter((l) =>
    (!view.speaker || l.userId === view.speaker) && (!term || l.text.toLowerCase().includes(term)));

  return `
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;min-height:0">
        <div class="tr-bar">
          <input class="in" id="tsearch" style="flex:0 0 300px" placeholder="Search ${n(script.total)} lines"
                 value="${esc(view.search)}" aria-label="Search the transcript">
          <div class="row-btns" style="gap:7px">
            <button class="chip ${view.speaker ? '' : 'on'}" data-speaker="">everyone</button>
            ${script.speakers.map((sp) => `
              <button class="chip ${view.speaker === sp.userId ? 'on' : ''}" data-speaker="${esc(sp.userId)}">${esc(sp.name)}</button>`).join('')}
          </div>
          <span class="mono" style="margin-left:auto;font-size:11.5px;color:var(--dim)">
            ${lines.length === script.lines.length ? n(script.total) : `${n(lines.length)} of ${n(script.total)}`} lines
          </span>
        </div>
        <div class="lines">
          ${lines.length ? lines.map((l) => `
            <div class="line">
              <span class="t">${esc(clock(l.ms))}</span>
              <span class="who ${script.speakers.find((s) => s.userId === l.userId)?.manager ? 'owner' : ''}">${esc(l.speaker)}</span>
              <span class="said">${highlight(l.text, term)}</span>
            </div>`).join('')
            : `<div class="quiet" style="padding:40px 0">Nothing matches “${esc(view.search)}”.</div>`}
          ${script.truncated ? '<div class="quiet" style="padding:20px 0">This transcript is longer than the reader shows — download the .txt for all of it.</div>' : ''}
        </div>
      </div>

      <aside class="facts" style="flex:0 0 320px;padding:26px">
        <div>
          <div class="cap" style="margin-bottom:14px">Who spoke</div>
          <div style="display:flex;flex-direction:column;gap:11px">
            ${script.speakers.map((sp) => `
              <div style="display:flex;align-items:center;gap:11px">
                <span style="font-size:13.5px;width:104px;${sp.manager ? 'color:var(--brass)' : ''}">${esc(sp.name)}</span>
                <i style="flex:1;height:5px;border-radius:3px;background:var(--line);display:block;overflow:hidden">
                  <b style="display:block;height:100%;width:${sp.share}%;background:${sp.manager ? 'var(--brass)' : 'var(--edge)'}"></b>
                </i>
                <span class="mono" style="font-size:11px;color:var(--dim);width:34px;text-align:right">${sp.share}%</span>
              </div>`).join('')}
          </div>
        </div>
        ${script.corrections.length ? `
          <div class="keep">
            <div class="cap">Corrections in force</div>
            <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
              ${script.corrections.map((c) => `
                <div style="font-size:13.5px;color:var(--text-2)">“${esc(c.wrong)}” → <b style="color:var(--text)">${esc(c.right)}</b></div>`).join('')}
            </div>
            <div class="quiet" style="margin-top:12px">
              These were applied as the transcript was written, so what you are reading is already corrected.
            </div>
          </div>` : ''}
        <div>
          <div class="cap" style="margin-bottom:12px">This session</div>
          <div class="mono" style="font-size:12.5px;color:var(--text-2);line-height:2">
            ${esc(longDate(script.startedAt))}<br>
            ${esc(n(script.total))} lines · ${plural(script.speakers.length, 'voice')}<br>
            ${esc(script.channel ? `#${script.channel}` : '')}
          </div>
        </div>
        <div class="quiet" style="margin-top:auto">
          ${script.hasNotes
            ? 'The notes for this session are written — close this to read them.'
            : 'No notes exist for this session yet.'}
        </div>
      </aside>`;
}

function highlight(text, term) {
  if (!term) return esc(text);
  const at = text.toLowerCase().indexOf(term);
  if (at < 0) return esc(text);
  return `${esc(text.slice(0, at))}<mark>${esc(text.slice(at, at + term.length))}</mark>${esc(text.slice(at + term.length))}`;
}

// What the models have cost, and which one does which job.
//
// Dev only, because it is the API bill. The framing is deliberate and matches
// what the server sends: these are tokens THIS BOT counted as it spent them.
// Anthropic reports a remaining balance in a header and Google reports none at
// all, so a page that drew a "quota remaining" gauge would be inventing the
// most important number on it.
function modelsScreen() {
  const m = status?.models;
  if (!m) {
    return `<div class="pane-main pane-wide">
      <h1 class="display sm">Nothing measured yet.</h1>
      <div class="say-2">This bot has not recorded any model calls. They appear here as soon as something is

    </div>`;
  }

  const bar = (fraction) => `
    <div class="bar" style="height:8px"><i style="width:${Math.round((fraction ?? 0) * 100)}%"></i></div>`;

    <div class="pane-main pane-wide">
      <div class="kicker">The API bill</div>

        ${plural(m.today.calls, 'call')}${m.today.rateLimited ? `, ${m.today.rateLimited} refused for quota` : ''}.

      </div>

      ${m.today.budget > 0 ? `
        <div style="max-width:520px;margin-top:20px">
          ${bar(m.today.fraction)}
          <div class="mono" style="font-size:11.5px;color:var(--dim);margin-top:8px">

        <div class="quiet" style="margin-top:16px;max-width:70ch">

      <div style="display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap;margin-top:40px">

            <div class="set-row" style="align-items:flex-start">

                <div class="sub">${role === 'summary'

          <div class="quiet" style="margin-top:14px;max-width:68ch">
            Typed rather than picked from a list, because a bot cannot know what a provider offers without

// Whether the newest snapshot has ever been opened.
//
// "Never checked" renders as its own state rather than as either good or bad,
// because it is neither — and a green tick on a backup nobody has opened is
// exactly the reassurance that gets somebody into trouble.
function backupCard() {
  const b = status?.backup;

  if (!b) {
    return `<div class="card">
      <div class="cap">Backup</div>
      <div class="quiet" style="margin-top:10px">
        Not checked yet. The snapshot is verified right after it is taken, so this fills in the next time one runs.
      </div>
    </div>`;
  }

  const lines = b.counts
    ? Object.entries(b.counts).map(([table, c]) =>
        `<div style="display:flex;justify-content:space-between;font-size:12.5px">
           <span class="muted">${esc(table)}</span><span class="mono">${n(c.backed)}</span>
         </div>`).join('')
    : '';

  return `
    <div class="card" ${b.ok ? '' : 'style="border-color:var(--red-br)"'}>
      <div class="cap" style="${b.ok ? '' : 'color:var(--red-lit)'}">Backup</div>
      <h4 style="${b.ok ? '' : 'color:var(--red-lit)'}">
        ${b.ok ? 'Opens and reads correctly' : 'Not restorable'}
      </h4>
      <div class="quiet" style="margin-top:8px">
        ${b.ok
          ? `Verified ${b.ageHours != null ? `${b.ageHours < 1 ? 'less than an hour' : `${Math.round(b.ageHours)}h`} after it was taken` : ''}
             — opened as a database, integrity checked, row counts compared to live.`
          : esc(b.reason ?? 'The newest snapshot could not be opened.')}
      </div>
      ${lines ? `<div style="margin-top:12px;display:flex;flex-direction:column;gap:4px">${lines}</div>` : ''}
      <div class="quiet" style="margin-top:12px;font-size:12px">
        This proves the file is a database, not that a Pi will boot from it. Only restoring one does that.
      </div>
    </div>`;
}

const LEVEL_TONE = { dev: 'agreed', owner: 'agreed', creator: 'waiting', player: '', none: 'never' };

// Who can get into this bot.
//
// This page used to describe the security model -- token set, audio local,
// nginx password. All true, and none of it answered the question you open an
// access page to ask, which is who can see your campaigns and at what level.
// So the posture is now three lines at the bottom, and the page is a roster.
function accessScreen() {
  const a = status?.access;

  // The roster only reaches dev, so anybody else asking gets told why rather
  // than shown an empty table and left to wonder whether that means nobody.
  if (!a) {
    return `
      <div class="pane-main pane-wide">
        <div class="kicker">Access</div>
        <h1 class="display" style="margin-top:14px">This one is the bot owner's.</h1>
        <div class="say-2">
          A list of everyone who can reach this bot, and what each of them can see, is not a list
          to hand around. You can see your own level in the corner of the rail.
        </div>
      </div>`;
  }

  const open = !a.requireLogin;
  const nobody = a.people.length === 0;

  const rows = a.people.map((p) => {
    const name = p.name || `user ${p.userId.slice(0, 4)}…${p.userId.slice(-4)}`;
    const seen = p.signedIn
      ? `<span class="agreed">signed in</span>`
      : p.codePending
        ? `<span class="waiting">code sent</span>`
        : p.lastSeen
          ? `<span class="muted">${esc(since(Date.parse(p.lastSeen + 'Z')))}</span>`
          : '<span class="muted">never signed in</span>';

    // What they reach, in the terms that matter for that level: a server owner
    // thinks in servers, everybody below them thinks in tables.
    const reach = p.level === 'dev'
      ? 'everything on this bot'
      : p.guilds.length
        ? esc(p.guilds.join(', '))
        : p.campaigns
          ? `${p.campaigns} campaign${p.campaigns === 1 ? '' : 's'}${p.manages ? `, runs ${p.manages}` : ''}`
          : 'nothing yet';

    return `
      <div class="tr">
        <div>${esc(name)}<div class="quiet mono" style="font-size:11px">${esc(p.userId)}</div></div>
        <div class="as-val ${LEVEL_TONE[p.level] ?? ''}">${esc(p.level)}</div>
        <div class="quiet">${reach}</div>
        <div class="r as-val">${seen}</div>
        <div class="r">${
          p.sessions
            ? `<button type="button" class="btn sm" data-act="access/revoke" data-user="${esc(p.userId)}"
                 data-confirm="Sign ${name.replace(/"/g, '')} out of every session? They can sign back in with a new code.">Sign out</button>`
            : ''
        }</div>
      </div>`;
  }).join('');

  return `
    <div class="pane-main pane-wide">
      <div class="kicker ${open ? 'broken' : 'done'}">${open ? 'Sign-in is off' : 'Sign-in required'}</div>
      <h1 class="display" style="margin-top:14px">
        ${open
          ? 'Anyone who opens this page is treated as you.'
          : `${a.total} ${a.total === 1 ? 'person' : 'people'} can reach this bot.`}
      </h1>
      <div class="say-2">
        ${open
          ? `DASHBOARD_REQUIRE_LOGIN is not set, so the levels below are not being enforced — they are what
             each person <em>would</em> see once it is. Sign in yourself first, then turn it on, or you lock
             yourself out of your own bot.`
          : `${a.signedIn} signed in right now. Everyone here can ask the bot for a code and get in at the
             level shown; ending a session does not remove anyone from a table.`}
      </div>

      <div class="grid access" style="margin-top:30px">
        <div class="hd">
          <div>Person</div><div>Level</div><div>Reaches</div>
          <div class="r">Session</div><div class="r"></div>
        </div>
        ${nobody
          ? '<div class="tr"><div class="quiet" style="grid-column:1/-1">Nobody has spoken or signed in yet.</div></div>'
          : rows}
      </div>

      <div class="steps" style="margin-top:34px">
        <div>
          <span class="mark ${a.actionsEnabled ? 'done' : ''}">${a.actionsEnabled ? '✓' : '!'}</span>
          <div style="flex:1"><div class="what">Actions ${a.actionsEnabled ? 'are on' : 'are refused'}</div>
            <div class="sub" style="font-family:var(--sans);font-size:13px">
              ${a.actionsEnabled
                ? 'A token is set on the bot and nginx adds it on the way through, so it is never in this page.'
                : 'No STATUS_TOKEN is set, so every action fails closed rather than being treated as open.'}
            </div></div>
        </div>
        <div>
          <span class="mark done">✓</span>
          <div style="flex:1"><div class="what">Audio never leaves your network</div>
            <div class="sub" style="font-family:var(--sans);font-size:13px">
              Recording, storage and transcription all run on hardware you own. Only finished transcript
              text is sent to a summariser, and only when you release it.
            </div></div>
        </div>
        <div>
          <span class="mark done">✓</span>
          <div style="flex:1"><div class="what">The page is behind a password</div>
            <div class="sub" style="font-family:var(--sans);font-size:13px">
              nginx allows the LAN outright and asks everyone else for the htpasswd credential.
              Both live in <code>dashboard/config/</code> on the Pi.
            </div></div>
        </div>
      </div>
    </div>`;
}

// ==========================================================================

// Rendered only when it opens or closes, never on a poll.
//
// It is the one part of the page you type a URL into, and a five-second
// repaint that replaced the dialog would throw away whatever was half-typed.
// Everything the dialog says about the world it says once, when it opens.
// Starting a campaign. Two fields, because that is the whole act: what it is
// called, and which Discord it belongs to. Everything else a campaign has —
// roster, corrections, where the notes go — is set afterwards, from inside it.
function createDialog() {
  const servers = status?.canCreateIn ?? [];
  return `
    <div class="backdrop" data-backdrop>
      <div class="dialog" role="dialog" aria-modal="true" aria-label="New campaign">
        <div class="kicker">Campaigns</div>
        <h1>Start a campaign</h1>
        <div class="say-2" style="font-size:14.5px;margin-top:12px">
          One per game. It holds the roster, the corrections, and every session you record.
          You will run it.
        </div>

        <form data-act="campaign/create">
          <div class="field">
            <label for="new-name">Name</label>
            <input class="in" id="new-name" name="name" required autocomplete="off" placeholder="Cipher">
            <div class="mono" style="font-size:11px;color:var(--dim);margin-top:9px">
              becomes the folder its notes live in, and the start of every session reference
            </div>
          </div>
          <div class="field">
            <label for="new-guild">Server</label>
            ${servers.length === 1
              ? `<input type="hidden" name="guildId" value="${esc(servers[0].id)}">
                 <div class="in" style="opacity:.7">${esc(servers[0].name)}</div>`
              : `<select class="in" id="new-guild" name="guildId" required>
                   ${servers.map((g) => `<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('')}
                 </select>`}
          </div>
          <div class="foot">
            <button class="btn go big" type="submit" ${can() ? '' : 'disabled'}>Start it</button>
            <button class="btn big" type="button" data-close-modal>Cancel</button>
          </div>
        </form>
      </div>
    </div>`;
}

// Deleting a campaign.
//
// The name has to be typed. Not a yes/no box — the whole purpose is to make the
// hand slow down and read which campaign this actually is, and a button you can
// hit twice in a temper is not a confirmation. The bot checks the typed name
// again on arrival, so this is a courtesy to whoever is looking at the screen
// rather than the thing standing between a campaign and its deletion.
function deleteDialog() {
  const name = detail?.name || detail?.label || '';
  return `
    <div class="backdrop" data-backdrop>
      <div class="dialog" role="dialog" aria-modal="true" aria-label="Delete campaign">
        <div class="kicker" style="color:var(--red-lit)">${esc(name)}</div>
        <h1>Delete this campaign?</h1>
        <div class="say-2" style="font-size:14.5px;margin-top:12px">
          It leaves every list straight away. <b>Nothing is erased</b> — every session, every line and
          every correction stays exactly where it is, and you have ${RESTORE_DAYS} days to bring it back
          from the rail or with <code>/campaign restore</code>.
        </div>

        <form data-act="campaign/delete" data-campaign="${detail?.id ?? ''}">
          <div class="field">
            <label for="del-name">Type <b>${esc(name)}</b> to confirm</label>
            <input class="in" id="del-name" name="confirm" required autocomplete="off"
                   placeholder="${esc(name)}">
          </div>
          <div class="foot">
            <button class="btn go big danger" type="submit" ${can() ? '' : 'disabled'}>Delete it</button>
            <button class="btn big" type="button" data-close-modal>Keep it</button>
          </div>
        </form>
      </div>
    </div>`;
}

// Asking for a campaign back.
//
// The same three questions the Discord modal asks, in the same order and for
// the same reason: they are meant to be read together. "Why was it deleted in
// the first place" and "are you taking ownership" are what separate a delete
// somebody regrets from a table that ended on purpose and should stay ended.
const RESTORE_QUESTIONS = [
  ['reason', 'What is the reason for requesting the restore?'],
  ['whyDeleted', 'Why was the campaign deleted in the first place?'],
  ['takingOwnership', 'Are you intending to take ownership of the campaign?'],
];

function askRestoreDialog() {
  const { id, name } = view.askingRestore ?? {};
  return `
    <div class="backdrop" data-backdrop>
      <div class="dialog" role="dialog" aria-modal="true" aria-label="Ask to restore">
        <div class="kicker">${esc(name ?? '')}</div>
        <h1>Ask for this back</h1>
        <div class="say-2" style="font-size:14.5px;margin-top:12px">
          Restoring is not automatic. What you write here goes to the bot owner, who decides these one at
          a time — you will hear back either way.
        </div>

        <form data-act="campaign/restore" data-campaign="${id ?? ''}">
          ${RESTORE_QUESTIONS.map(([field, question], n) => `
            <div class="field">
              <label for="ask-${field}">${question}</label>
              ${n === 2
                ? `<input class="in" id="ask-${field}" name="${field}" required autocomplete="off"
                          placeholder="yes / no, and why">`
                : `<textarea class="in" id="ask-${field}" name="${field}" required rows="3"></textarea>`}
            </div>`).join('')}
          <div class="foot">
            <button class="btn go big" type="submit" ${can() ? '' : 'disabled'}>Send it</button>
            <button class="btn big" type="button" data-close-modal>Cancel</button>
          </div>
        </form>
      </div>
    </div>`;
}

// Reading one, and deciding it.
function reviewDialog() {
  const req = (status?.restoreQueue ?? []).find((r) => r.id === view.reviewing);
  if (!req) return '';

  const answer = (question, text) => `
    <div class="field">
      <label>${question}</label>
      <div class="quiet" style="color:var(--text-2);white-space:pre-wrap">${esc(text || '(left blank)')}</div>
    </div>`;

  return `
    <div class="backdrop" data-backdrop>
      <div class="dialog" role="dialog" aria-modal="true" aria-label="Restore request">
        <div class="kicker">${esc(req.name)}</div>
        <h1>${esc(req.requesterName || req.requestedBy)} wants this back</h1>
        <div class="say-2" style="font-size:14.5px;margin-top:12px">
          ${req.isTheCreator ? 'They are the person who deleted it.' : 'They played at this table — they are not who deleted it.'}
          ${req.sessions} session${req.sessions === 1 ? '' : 's'}, ${req.daysLeft} day${req.daysLeft === 1 ? '' : 's'} left in the window.
        </div>

        ${answer(RESTORE_QUESTIONS[0][1], req.reason)}
        ${answer(RESTORE_QUESTIONS[1][1], req.whyDeleted)}
        ${answer(RESTORE_QUESTIONS[2][1], req.takingOwnership)}

        <div class="foot">
          <button type="button" class="btn go big" data-act="campaign/restore-review"
                  data-request="${req.id}" data-approve="true">Restore it</button>
          <button type="button" class="btn big danger" data-act="campaign/restore-review"
                  data-request="${req.id}" data-approve="false">Turn it down</button>
          <button type="button" class="btn big" data-close-modal>Later</button>
        </div>
      </div>
    </div>`;
}

let modalShowing = null;

function renderModal() {
  const wanted = view.deleting
    ? 'delete'
    : view.askingRestore ? `ask:${view.askingRestore.id}`
    : view.reviewing ? `review:${view.reviewing}`
    : view.creating ? 'create'
    : view.importing && detail ? `import:${detail.id}`
    : null;
  if (wanted === modalShowing) return;
  modalShowing = wanted;

  if (!wanted) { $('modal').innerHTML = ''; return; }

  if (view.deleting) {
    $('modal').innerHTML = deleteDialog();
    $('del-name')?.focus();
    return;
  }

  if (view.askingRestore) {
    $('modal').innerHTML = askRestoreDialog();
    $('ask-reason')?.focus();
    return;
  }

  if (view.reviewing) {
    $('modal').innerHTML = reviewDialog();
    return;
  }

  if (view.creating) {
    $('modal').innerHTML = createDialog();
    $('new-name')?.focus();
    return;
  }

  if (!detail) { $('modal').innerHTML = ''; return; }
  const busy = (status?.recording ?? []).some((r) => r.guildId === detail.guildId);

  $('modal').innerHTML = `
    <div class="backdrop" data-backdrop>
      <div class="dialog" role="dialog" aria-modal="true" aria-label="Import a recording">
        <div class="kicker">${esc(detail.label || detail.name)}</div>
        <h1>Import a recording</h1>
        <div class="say-2" style="font-size:14.5px;margin-top:12px">
          For a game played at a real table, or anything recorded outside Discord. It runs through the same
          transcribe, summarise and post pipeline.
        </div>

        <form data-act="import" data-campaign="${detail.id}">
          <div class="field">
            <label for="imp-url">The audio</label>
            <input class="in mono" id="imp-url" name="url" type="url" required
                   placeholder="https://…/session-15.m4a">
            <div class="mono" style="font-size:11px;color:var(--dim);margin-top:9px">
              a direct link Quill can download · m4a · mp3 · wav
            </div>
          </div>
          <div class="field">
            <label for="imp-speaker">Speaker label</label>
            <input class="in" id="imp-speaker" name="speaker" placeholder="The Table">
          </div>
          <div class="warnbox">
            <b>Every line will be attributed to one label.</b> A single microphone has no per-speaker
            channels, so Quill cannot tell your players apart. The notes will read as one voice describing
            the session.
          </div>
          ${busy ? `<div class="warnbox" style="border-color:var(--red)">
            That server is recording right now. Stop it with <code>/leave</code> before importing, or the
            two sessions will interleave.</div>` : ''}
          <div class="foot">
            <button class="btn go big" type="submit" ${busy || !can() ? 'disabled' : ''}>Start the import</button>
            <button class="btn big" type="button" data-close-modal>Cancel</button>
            <span class="mono" style="font-size:11.5px;color:var(--dim);margin-left:auto">
              ${status?.working?.transcribing?.length ? 'joins the queue behind what is transcribing' : 'next in the queue · nothing is transcribing'}
            </span>
          </div>
        </form>
      </div>
    </div>`;

  $('imp-url')?.focus();
}

// ==========================================================================
// Painting
// ==========================================================================

function paint() {
  renderRail();
  renderTop();
  renderBanner();
  renderScreen();
  renderModal();

  const rec = status?.recording?.length;
  const needs = (status?.campaigns ?? []).reduce((sum, c) => sum + (c.awaiting || 0), 0);
  document.title = rec ? '● Recording — Quill' : needs ? `(${needs}) Quill` : 'Quill';
}

// ==========================================================================
// Loading
// ==========================================================================

async function get(path) {
  const res = await fetch(`${API}${path}`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function loadCampaign(id, { keepScreen = false } = {}) {
  view.campaignId = id;
  view.meetingId = null;
  view.editing = null;
  notes = null;
  notesKey = null;
  script = null;
  // A search is scoped to one server; carrying its results to the next
  // campaign would offer to invite people who are not in that Discord.
  people.query = ''; people.results = null; people.error = '';
  if (!keepScreen) view.screen = 'campaign';
  try {
    detail = await get(`/campaign?id=${id}`);
  } catch (err) {
    detail = null;
    toast(`Couldn't load that campaign — ${err.message}`, false);
  }
  // Land on something worth reading rather than an empty pane: whatever is
  // waiting on a decision, else the most recent session that has notes.
  const list = sessions();
  const pick = list.find((s) => s.state === 'recording')
    || list.find((s) => s.job?.status === 'awaiting_approval')
    || list.find((s) => s.hasNotes)
    || list[0];
  if (pick) await openSession(pick.meetingId, { quiet: true });
  else paint();
}

async function openSession(meetingId, { quiet = false } = {}) {
  view.meetingId = meetingId;
  view.tab = 'notes';
  notes = null;
  notesKey = null;
  if (!quiet) paint();
  await syncNotes();
  paint();
}

// Fetch whatever the open session's reader needs, and only what it needs.
//
// Called after every action and every poll as well as on open, because the
// thing being watched is a session moving: approve a summary and a few seconds
// later it has notes, which nothing would have gone back for otherwise.
async function syncNotes() {
  const s = selected();
  if (!s) { notes = null; notesKey = null; return; }

  // Keyed on the session AND its live job, so a re-summarise is picked up:
  // the notes on disk do not change when you press the button, they change a
  // minute later when the job that button queued disappears again.
  const key = `${s.meetingId}:${s.job?.id ?? ''}:${s.job?.status ?? ''}`;

  try {
    if (s.hasNotes && notesKey !== key) {
      notes = await get(`/notes?meeting=${s.meetingId}`);
      notesKey = key;
    } else if (!s.hasNotes) {
      notes = null;
      notesKey = null;
    }

    // The approval screen shows the first few lines, so the decision is made
    // looking at the session rather than at its line count.
    const peeking = s.job?.status === 'awaiting_approval' && s.job.type === 'summarize' && s.lines;
    if (peeking && script?.meetingId !== s.meetingId) {
      script = await get(`/transcript?meeting=${s.meetingId}&format=json`);
    }
  } catch (err) {
    toast(`Couldn't open that session — ${err.message}`, false);
  }
}

async function openTranscript(meetingId) {
  view.screen = 'transcript';
  view.search = '';
  view.speaker = null;
  if (script?.meetingId !== Number(meetingId)) script = null;
  paint();
  try {
    script = await get(`/transcript?meeting=${meetingId}&format=json`);
  } catch (err) {
    toast(`Couldn't open that transcript — ${err.message}`, false);
    view.screen = 'campaign';
  }
  paint();
}

const countAwaiting = () =>
  (detail?.sessions ?? []).filter((s) => s.job?.status === 'awaiting_approval').length;

const typing = () => ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName);

async function tick() {
  try {
    // Who the bot thinks is asking, before anything else — it decides both
    // what the rest of the payloads will contain and whether there is an app
    // to draw at all. A bot too old to answer it leaves `me` null, and cap()
    // then defaults to the behaviour that existed before levels did.
    me = await get('/me').catch(() => me);

    if (me?.loginRequired && !me.signedIn) {
      lastSeen = Date.now();
      document.body.classList.remove('stale');
      status = null;
      paint();
      return;
    }

    status = await get('/status');
    lastSeen = Date.now();
    document.body.classList.remove('stale');

    if (view.campaignId == null && status.campaigns?.length) {
      const pick = status.campaigns.find((c) => c.awaiting)
        || status.campaigns.find((c) => c.recording)
        || status.campaigns[0];
      await loadCampaign(pick.id);
      return;
    }

    // The open campaign's detail does not come from the poll, so refresh it
    // when the poll says something about it changed.
    const mine = status.campaigns?.find((c) => c.id === view.campaignId);
    if (mine && detail && (mine.sessions !== detail.sessions.length || mine.awaiting !== countAwaiting())) {
      detail = await get(`/campaign?id=${view.campaignId}`).catch(() => detail);
      // The session on screen may have just grown notes.
      if (view.screen === 'campaign') await syncNotes();
    }

    // Somebody is mid-sentence in a correction, a character name or the
    // transcript search. Rebuilding the pane under them would throw the text
    // away and move the caret, which is worse than a five-second-old panel —
    // so the poll updates only the parts with nothing to type in.
    if (typing()) { renderRail(); renderTop(); renderBanner(); return; }
    paint();
  } catch (err) {
    // The bot being unreachable is itself information. The page dims as well as
    // saying so: a dashboard confidently showing "not recording" while it has
    // no idea is worse than one that admits it lost contact.
    document.body.classList.add('stale');
    document.title = 'Quill — offline';
    toastOffline(err.message);
  }
}

let offlineShown = 0;
function toastOffline(message) {
  if (Date.now() - offlineShown < 30000) return;
  offlineShown = Date.now();
  toast(`Can't reach the bot at ${API} — ${message}. Showing what it last said, ${since(lastSeen)}.`, false);
}

// ==========================================================================
// Acting
// ==========================================================================

let toastTimer = null;
function toast(message, ok) {
  const el = $('toast');
  el.textContent = message;
  el.className = `toast show ${ok ? 'good' : 'bad'}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, ok ? 4500 : 9000);
}

async function send(action, body) {
  let sent = null;
  try {
    const res = await fetch(`${API}/actions/${action}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const payload = await res.json().catch(() => ({}));

    // Some refusals are a question rather than a no: the bot has counted what
    // the change would do and wants that seen first. If the answer is yes it
    // re-sends confirmed, and this call's job is done.
    if (payload?.needsConfirming && (await confirmBlastRadius(action, body, payload))) return;

    toast(payload.message || `HTTP ${res.status}`, res.ok && payload.ok !== false);
    sent = payload;
  } catch (err) {
    toast(`Couldn't reach the bot — ${err.message}`, false);
    return;
  }
  // Straight to a refresh rather than waiting for the next poll: the whole
  // point of pressing the button is to watch the thing move.
  status = await get('/status').catch(() => status);
  if (view.campaignId) detail = await get(`/campaign?id=${view.campaignId}`).catch(() => detail);
  if (view.meetingId) await syncNotes();
  paint();
  // Handed back so a caller can act on what was made — the id of a campaign
  // that did not exist a moment ago is not knowable any other way.
  return sent;
}

// The transcript needs the auth header, which a plain <a href> cannot carry —
// so it is fetched and handed to the browser as a blob rather than linked.
async function downloadTranscript(meetingId) {
  try {
    const res = await fetch(`${API}/transcript?meeting=${meetingId}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement('a');
    a.href = url;
    a.download = `session-${meetingId}-transcript.txt`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (err) {
    toast(`Couldn't fetch that transcript — ${err.message}`, false);
  }
}

async function copy(text, said) {
  try {
    await navigator.clipboard.writeText(text);
    toast(said, true);
  } catch {
    toast('The browser refused clipboard access — this needs https or localhost.', false);
  }
}

// The notes as markdown, in the shape the Obsidian export already writes, so
// pasting one into a vault matches the files Quill puts there itself.
function notesAsMarkdown() {
  if (!notes?.written) return '';
  const section = (title, lines) =>
    lines?.length ? `\n## ${title}\n\n${lines.map((l) => `- ${l}`).join('\n')}\n` : '';
  return [
    `# ${notes.ref}`,
    '',
    notes.tldr,
    notes.scenes.map((s) => `\n## ${s.title}\n\n${s.points.join(' ')}\n`).join(''),
    section('Party decisions', notes.partyDecisions),
    section('Still unresolved', notes.unresolvedThreads),
    section('NPCs introduced', notes.npcsIntroduced),
    section('Locations', notes.locationsVisited),
    section('Loot and rewards', notes.lootAndRewards),
    section('Follow-ups', notes.followUps),
    section('Worth remembering', notes.funnyMoments),
  ].join('\n');
}

// One listener for the whole page rather than one per render. Everything here
// is rebuilt from the poll every few seconds, so a handler attached to a button
// would be thrown away with it — and a click landing in the gap between two
// renders would do nothing at all.
document.addEventListener('click', async (event) => {
  const t = event.target;

  if (t.closest('[data-close-modal]') || t === $('modal')?.querySelector('[data-backdrop]')) {
    closeDialogs(); return paint();
  }
  // One dialog at a time. Opening any has to close the others, or a page left
  // with two flags set shows the first one forever and every later click on
  // the second looks like a dead button.
  if (t.closest('[data-new-campaign]')) { closeDialogs(); view.creating = true; return paint(); }
  if (t.closest('[data-import]')) { closeDialogs(); view.importing = true; return paint(); }
  if (t.closest('[data-delete-campaign]')) { closeDialogs(); view.deleting = true; return paint(); }

  if (t.closest('[data-signin-cancel]')) { view.signingIn = false; return paint(); }

  if (t.closest('[data-signin]')) {
    closeDialogs();
    view.signingIn = true;
    login.stage = 'name'; login.message = ''; login.failed = false;
    return paint();
  }

  const asking = t.closest('[data-ask-restore]');
  if (asking) {
    closeDialogs();
    view.askingRestore = { id: Number(asking.dataset.askRestore), name: asking.dataset.name ?? '' };
    return paint();
  }

  const reading = t.closest('[data-review]');
  if (reading) { closeDialogs(); view.reviewing = Number(reading.dataset.review); return paint(); }
  if (t.closest('[data-diagnose]')) { view.diagnosing = !view.diagnosing; return renderBanner(); }
  if (t.closest('[data-cancel-edit]')) { view.editing = null; return paint(); }

  const edit = t.closest('[data-edit]');
  if (edit) { view.editing = edit.dataset.edit; return paint(); }

  if (t.closest('[data-people-clear]')) {
    people.query = ''; people.results = null; people.error = '';
    return paint();
  }

  if (t.closest('[data-signin-back]')) {
    login.stage = 'name'; login.message = ''; login.failed = false;
    return paint();
  }

  if (t.closest('[data-logout]')) {
    try {
      await post('/auth/logout', {});
    } catch { /* the cookie is dead either way once the row is gone */ }
    me = null; status = null; detail = null; notes = null; script = null;
    view.campaignId = null; view.meetingId = null;
    return tick();
  }
  if (t.closest('[data-copy-notes]')) {
    return copy(notesAsMarkdown(), 'Notes copied as markdown.');
  }
  if (t.closest('[data-copy-transcript]')) {
    return copy(script.lines.map((l) => `[${clock(l.ms)}] ${l.speaker}: ${l.text}`).join('\n'),
                `${n(script.total)} lines copied.`);
  }

  const nav = t.closest('[data-screen]');
  if (nav) {
    view.screen = nav.dataset.screen;
    paint();
    // Coming back to a session that is waiting for approval, its first few
    // lines have to be fetched again — the transcript reader borrowed the same
    // slot to hold the whole thing.
    if (view.screen === 'campaign') { await syncNotes(); paint(); }
    return;
  }

  const camp = t.closest('[data-campaign]:not([data-act]):not(form)');
  if (camp) return loadCampaign(Number(camp.dataset.campaign));

  const tab = t.closest('[data-tab]');
  if (tab) { view.tab = tab.dataset.tab; view.editing = null; return paint(); }

  const sess = t.closest('.sess[data-session]');
  if (sess) return openSession(Number(sess.dataset.session));

  const script_ = t.closest('[data-transcript]');
  if (script_) return openTranscript(Number(script_.dataset.transcript));

  const speaker = t.closest('[data-speaker]');
  if (speaker) { view.speaker = speaker.dataset.speaker || null; return paint(); }

  const dl = t.closest('button[data-download]');
  if (dl) return downloadTranscript(dl.dataset.download);

  // A button inside a form is the submit handler's business -- handling the
  // click here too would fire the action twice. Asking for .type instead was
  // the bug: a <button> with no type attribute reports "submit", so this
  // dropped every action click on the page.
  const btn = t.closest('button[data-act]');
  if (!btn || btn.disabled || btn.closest('form')) return;
  if (btn.dataset.confirm && !confirm(btn.dataset.confirm)) return;

  const d = btn.dataset;
  const body = {};
  if (d.job) body.jobId = Number(d.job);
  if (d.meeting) body.meetingId = Number(d.meeting);
  if (d.campaign) body.campaignId = Number(d.campaign);
  if (d.user) body.userId = d.user;
  if (d.wrong) body.wrong = d.wrong;
  if (d.provider) body.provider = d.provider;
  if (d.action) body.action = d.action;
  if (d.queue) body.queue = d.queue;
  if (d.mode) body.mode = d.mode;
  if (d.paused) body.paused = d.paused === 'true';
  if (d.request) body.requestId = Number(d.request);
  if (d.approve) body.approve = d.approve === 'true';

  const was = btn.textContent;
  btn.disabled = true; btn.textContent = '…';
  const said = await send(d.act, body);

  // A decision made is a dialog finished. Left open it would keep offering
  // buttons for a request that is no longer waiting on anything.
  if (d.act === 'campaign/restore-review' && said?.ok) { view.reviewing = null; paint(); }
  btn.disabled = false; btn.textContent = was;
});

// Forms wherever there is something to type: Enter-to-submit and required-field
// validation for free, and both matter for the things typed most often here.
// Signing in. Two POSTs, and the only two requests on the page that work
// without a credential — everything else is behind one.
async function post(path, body) {
  const res = await fetch(`${API}${path}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return { ok: res.ok, payload: await res.json().catch(() => ({})) };
}

document.addEventListener('submit', async (event) => {
  const asking = event.target.closest('form[data-signin-request]');
  const verifying = event.target.closest('form[data-signin-verify]');
  if (!asking && !verifying) return;
  event.preventDefault();

  login.busy = true;
  login.message = '';
  paint();

  try {
    if (asking) {
      login.name = $('signin-name')?.value.trim() ?? '';
      const { payload } = await post('/auth/request', { name: login.name });
      login.failed = payload.ok === false;
      login.message = payload.message ?? '';
      // The step advances whatever the answer was, because the answer is
      // deliberately the same whether or not the account exists — see
      // web/auth-routes.js. Anything else here would leak who plays what.
      if (payload.ok !== false) login.stage = 'code';
    } else {
      const code = $('signin-code')?.value.trim() ?? '';
      const { payload } = await post('/auth/verify', { name: login.name, code });
      login.failed = payload.ok === false;
      login.message = payload.message ?? '';
      if (payload.ok) {
        login.stage = 'name';
        login.name = '';
        login.message = '';
        view.signingIn = false;
        me = null;
        await tick();
        return;
      }
    }
  } catch (err) {
    login.failed = true;
    login.message = `Couldn't reach the bot — ${err.message}`;
  } finally {
    login.busy = false;
  }
  paint();
  $(asking ? 'signin-code' : 'signin-code')?.focus();
});

// Searching for a person is the one form whose answer is not a toast: it
// returns a list to choose from, so it renders into the page rather than
// disappearing after a second and a half.
document.addEventListener('submit', async (event) => {
  const form = event.target.closest('form[data-people-search]');
  if (!form) return;
  event.preventDefault();

  people.query = $('people-q')?.value.trim() ?? '';
  people.error = '';
  if (people.query.length < 2) {
    people.error = 'Type at least two characters.';
    return paint();
  }

  people.busy = true;
  paint();
  try {
    const res = await fetch(`${API}/actions/roster/search`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ campaignId: detail.id, query: people.query }),
    });
    const payload = await res.json().catch(() => ({}));
    people.results = payload.people ?? [];
    people.error = payload.ok === false ? payload.message || `HTTP ${res.status}` : '';
    if (payload.ok === false) people.results = null;
  } catch (err) {
    people.results = null;
    people.error = `Couldn't reach the bot — ${err.message}`;
  }
  people.busy = false;
  paint();
});

document.addEventListener('submit', async (event) => {
  const form = event.target.closest('form[data-act]');
  if (!form) return;
  event.preventDefault();

  const body = Object.fromEntries(new FormData(form));
  if (form.dataset.campaign) body.campaignId = Number(form.dataset.campaign);
  if (form.dataset.user) body.userId = form.dataset.user;

  const submit = form.querySelector('button[type=submit]');
  if (submit) submit.disabled = true;
  if (form.dataset.act === 'import') view.importing = false;
  if (form.dataset.act === 'campaign/create') view.creating = false;
  if (form.dataset.act === 'campaign/restore') view.askingRestore = null;
  if (form.dataset.act === 'roster/character') view.editing = null;
  const payload = await send(form.dataset.act, body);
  if (submit) submit.disabled = false;

  // The delete dialog stays open when the typed name did not match, because
  // closing it would throw the attempt away and say nothing about why.
  if (form.dataset.act === 'campaign/delete' && payload?.ok) {
    view.deleting = false;
    view.campaignId = null;
    detail = null;
    // The campaign just left the list, so land somewhere that still exists
    // rather than on a screen describing something the bot no longer returns.
    const next = status?.campaigns?.[0];
    if (next) await loadCampaign(next.id);
    else paint();
  }

  // Land in the campaign that was just made. Making one and then having to
  // find it in the rail yourself would be a strange way to finish.
  if (form.dataset.act === 'campaign/create' && payload?.campaignId) {
    await loadCampaign(payload.campaignId);
  }
});

// A correction that would rewrite a large share of the campaign comes back
// refused rather than applied, with the count. Rewriting is not reversible —
// afterwards there is no telling which words were changed — so the number has
// to be seen before it happens, not reported after.
async function confirmBlastRadius(action, body, payload) {
  if (!payload?.needsConfirming) return false;
  const sure = confirm(
    `${payload.message}\n\n` +
    `Apply it anyway to all ${payload.wouldChange} of ${payload.total} lines? This cannot be undone.`
  );
  if (!sure) return false;
  await send(action, { ...body, force: true });
  return true;
}

// Searching re-renders in place rather than on submit, and keeps the caret
// where it was — the list under it is the answer as you type.
document.addEventListener('input', (event) => {
  if (event.target.id !== 'tsearch') return;
  view.search = event.target.value;
  const caret = event.target.selectionStart;
  renderScreen();
  const box = $('tsearch');
  if (box) { box.focus(); box.setSelectionRange(caret, caret); }
});

document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return;
  if (view.importing || view.creating || view.deleting || view.askingRestore || view.reviewing) {
    closeDialogs(); return paint();
  }
  if (view.editing) { view.editing = null; return paint(); }
  if (view.screen === 'transcript') { view.screen = 'campaign'; return paint(); }
});

// The timer and the "last seen" age tick on their own second, so both keep
// counting between polls rather than jumping every five.
setInterval(() => {
  const stamp = $('stamp');
  if (stamp) stamp.textContent = `seen ${since(lastSeen)}`;

  const el = $('timer');
  const live = (status?.recording ?? []).find((r) => r.meetingId === view.meetingId);
  if (el && live && lastSeen) el.textContent = hhmmss(live.recordingForMs + (Date.now() - lastSeen));
}, 1000);

tick();
setInterval(tick, 5000);
</script>
</body>
