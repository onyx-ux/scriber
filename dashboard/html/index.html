<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quill</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Cpath d='M20.5 2.6c-7 .9-11.8 5-14 11.4l-1.7 4.9 4.8-1.7C16 15 20 10.2 20.5 2.6Z' stroke='%23C9A227' stroke-width='1.3' stroke-linejoin='round'/%3E%3Cpath d='M5.1 19.6 2.6 22.2' stroke='%23C9A227' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- The landing page's three faces, now the tool's as well. Fraunces sets the
     headings, Newsreader carries both the summariser's prose and the interface
     text, and Spline Sans Mono takes anything read as a value - clocks, counts,
     refs, and every button. The gate used to load these separately to stay in
     the landing page's world; the whole dashboard lives there now, so they load
     once, up front. Every one has a system fallback, because a LAN dashboard
     pointed at a Raspberry Pi is opened from machines with no internet. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Theme before paint. Reading it here rather than in the app script keeps a
     dark-theme reader from being flashed a page of white paper while the rest
     of the file parses. "auto" is stored as no attribute at all, so the media
     query in the stylesheet is what answers. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('quill-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<style>
  /* -- The palette ------------------------------------------------------
     One system, two grounds. The landing page and the tool used to be two
     products wearing different clothes - pale grey-green stock and correction
     ink out front, brass on near-black once you were through the door. The
     ink is the brand, so the ink is what carries over: ultramarine for
     anything you can act on, and the highlighter for anything Quill kept.

     Both themes define the same names, so every rule further down this file
     is written once and gets light and dark for free. The names describe the
     job, not the colour - "--ink" is the page, whichever way round the page
     happens to be.

     Dark is the default because this is a tool you open at the table with the
     lights down. Light is the landing page's own stock, for reading a recap in
     daylight. "auto" follows the machine.  */

  :root, :root[data-theme="dark"] {
    color-scheme: dark;

    --ink:      #12151B;  /* the page */
    --panel:    #171B22;  /* rail and top bar */
    --column:   #151920;  /* the session column and the facts rail */
    --card:     #191E26;  /* cards on the page */
    --raise:    #232935;  /* selected rows, secondary buttons */
    --sunk:     #0F1218;  /* inputs and read-only values */

    --line:     #262C38;  /* the structural borders */
    --line-2:   #2A3140;  /* input borders, outer frame */
    --rule:     #212734;  /* row rules inside a table */
    --edge:     #3A4356;  /* button borders */
    --dash:     #303848;  /* dashed placeholder outlines */

    --text:     #E8E6DF;
    --text-2:   #C2C0B8;
    --dim:      #8A8B86;

    /* The one accent: the pen. Ultramarine is unreadable on a dark ground, so
       dark gets the same hue lifted to a legible tint rather than a different
       colour. */
    --pen:      #8497F2;
    --pen-lit:  #B3BEFA;
    --pen-br:   #3B4680;
    --pen-bg:   #191D33;
    --on-pen:   #10131C;  /* text on a filled pen button */

    /* The highlighter, the same in both themes - it is the one thing on the
       page that is meant to look like it was added by hand. */
    --mark:     #E1EC97;
    --mark-ink: #2A2E14;
    --mark-cap: #E1EC97;

    --sage:     #7FA765;
    --sage-lit: #A9C692;
    --sage-br:  #3E4E35;
    --red:      #D0453C;
    --red-lit:  #E4A9A4;
    --red-br:   #6B322D;
    --red-bg:   #2A1817;
    --amber:    #D99A2B;

    --shadow:   #0006;
    --shadow-hard: #000A;
    --scrim:    #08090CCC;
    --hover:    #1C222C;  /* the wash under a hovered row */
  }

  :root[data-theme="light"] {
    color-scheme: light;

    --ink:      #E6E8E3;
    --panel:    #DEE2DA;
    --column:   #E1E4DE;
    --card:     #EFF1EC;
    --raise:    #D2D8CC;
    --sunk:     #DBDFD6;

    --line:     #C9CFC3;
    --line-2:   #BCC3B5;
    --rule:     #D2D7CB;
    --edge:     #AEB6A6;
    --dash:     #B8BFB0;

    --text:     #171C22;
    --text-2:   #39434A;
    --dim:      #5C665E;

    --pen:      #2434A8;
    --pen-lit:  #1B2A92;
    --pen-br:   #A3ABDC;
    --pen-bg:   #DFE3F4;
    --on-pen:   #F2F3EF;

    --mark:     #E1EC97;
    --mark-ink: #3A4014;
    --mark-cap: #5A6320;

    --sage:     #4C6B37;
    --sage-lit: #3B5729;
    --sage-br:  #A9BE99;
    --red:      #A8352D;
    --red-lit:  #8E2B24;
    --red-br:   #D8ADA9;
    --red-bg:   #F4E2E0;
    --amber:    #8A5E12;

    --shadow:   #17221C1A;
    --shadow-hard: #17221C2E;
    --scrim:    #4A5148CC;
    --hover:    #DCE0D6;
    --alarm-bg: #F6E4E1;
    --alarm-br: #D8ADA9;
    --select:   #C9D0EE;
  }

  /* No stored choice: follow the machine. Only the light half is written here
     - bare :root above is already the dark set - so a light-preferring machine
     is the one that gets overridden. */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;

      --ink:      #E6E8E3;
      --panel:    #DEE2DA;
      --column:   #E1E4DE;
      --card:     #EFF1EC;
      --raise:    #D2D8CC;
      --sunk:     #DBDFD6;

      --line:     #C9CFC3;
      --line-2:   #BCC3B5;
      --rule:     #D2D7CB;
      --edge:     #AEB6A6;
      --dash:     #B8BFB0;

      --text:     #171C22;
      --text-2:   #39434A;
      --dim:      #5C665E;

      --pen:      #2434A8;
      --pen-lit:  #1B2A92;
      --pen-br:   #A3ABDC;
      --pen-bg:   #DFE3F4;
      --on-pen:   #F2F3EF;

      --mark:     #E1EC97;
      --mark-ink: #3A4014;
      --mark-cap: #5A6320;

      --sage:     #4C6B37;
      --sage-lit: #3B5729;
      --sage-br:  #A9BE99;
      --red:      #A8352D;
      --red-lit:  #8E2B24;
      --red-br:   #D8ADA9;
      --red-bg:   #F4E2E0;
      --amber:    #8A5E12;

      --shadow:   #17221C1A;
      --shadow-hard: #17221C2E;
      --scrim:    #4A5148CC;
      --hover:    #DCE0D6;
      --alarm-bg: #F6E4E1;
      --alarm-br: #D8ADA9;
      --select:   #C9D0EE;
    }
  }

  /* The old names, kept pointing at the new ones. Brass was the accent for the
     whole of this file's first life and it is spelled two hundred times below;
     aliasing costs nothing and means the rename is not a rewrite. New rules
     should say --pen. */
  :root {
    --brass:     var(--pen);
    --brass-lit: var(--pen-lit);
    --brass-br:  var(--pen-br);
    --brass-bg:  var(--pen-bg);

    --display: 'Fraunces', 'Hoefler Text', Georgia, serif;
    --sans:  'Newsreader', Georgia, 'Times New Roman', serif;
    --mono:  'Spline Sans Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
  }

  * { box-sizing: border-box; }

  /* Scrollbars, in the page's own colours. Four columns can be scrolling at
     once here — the campaign rail, the picker column, the recap and the facts
     rail — and the platform default drew four grey trenches through a design
     that has no other grey in it. Thin, round, and only as dark as a hairline
     until the pointer is on them. The track stays transparent so a column that
     can scroll does not announce it while sitting still. */
  * { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--line-2);
    border: 3px solid transparent;
    background-clip: content-box;
    border-radius: 999px;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--edge); background-clip: content-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ink); color: var(--text);
    font: 400 15px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { margin: 0; font-weight: 500; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 5px; }
  ::selection { background: var(--select); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

  /* Shared idioms, named for what they are rather than how they look. */
  .mono   { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .prose  { font-family: var(--serif); }
  .cap    { font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
            color: var(--dim); font-weight: 600; }
  .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .12em;
            text-transform: uppercase; color: var(--brass); }
  .kicker.done   { color: var(--sage-lit); }
  .kicker.wait   { color: var(--brass-lit); }
  .kicker.broken { color: var(--red-lit); }
  .muted  { color: var(--dim); }
  .quiet  { font-size: 13.5px; color: var(--dim); line-height: 1.6; }

  .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px;
         display: inline-block; background: var(--edge); vertical-align: middle; }
  .dot.ok    { background: var(--sage); }
  .dot.bad   { background: var(--red); }
  .dot.warn  { background: var(--amber); }
  .dot.brass { background: var(--brass); }
  .dot.live  { background: var(--red); animation: pulse 1.8s ease-in-out infinite; }

  /* --- buttons ------------------------------------------------------- */

  .btn { font-size: 13px; padding: 7px 14px; border-radius: 7px;
         border: 1px solid var(--edge); background: var(--raise); color: var(--text);
         cursor: pointer; white-space: nowrap;
         transition: background .13s, border-color .13s, color .13s; }
  .btn:hover:not(:disabled) { border-color: var(--dim); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.go { border-color: var(--pen); background: var(--pen); color: var(--on-pen); font-weight: 600; }
  .btn.go:hover:not(:disabled) { background: var(--brass-lit); border-color: var(--brass-lit); }
  .btn.ghost { background: transparent; color: var(--dim); }
  .btn.ghost:hover:not(:disabled) { color: var(--text-2); }
  .btn.warn { border-color: var(--brass-br); background: var(--brass-bg); color: var(--brass-lit); }
  .btn.danger { border-color: var(--red-br); background: var(--red-bg); color: var(--red-lit); }
  .btn.sm { font-size: 12px; padding: 5px 12px; border-radius: 6px; }
  .btn.wide { width: 100%; padding: 8px 16px; }
  .btn.big { font-size: 14px; padding: 10px 20px; border-radius: 8px; }
  .row-btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .in { padding: 9px 12px; border-radius: 7px; border: 1px solid var(--line-2);
        background: var(--sunk); color: var(--text); font-size: 14px; width: 100%; }
  .in:focus-visible { border-color: var(--brass); outline: none; }
  .in::placeholder { color: var(--dim); }
  .val { font-family: var(--mono); font-size: 13.5px; padding: 8px 14px; border-radius: 7px;
         border: 1px solid var(--line-2); background: var(--sunk); color: var(--text);
         white-space: nowrap; }

  /* The segmented control: two or three exclusive choices, no dropdown. */
  .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--sunk);
         border: 1px solid var(--line-2); border-radius: 8px; }
  .seg button { font-size: 12.5px; padding: 6px 14px; border-radius: 5px; border: 0;
                background: transparent; color: var(--dim); cursor: pointer; }
  .seg button:hover:not(.on):not(:disabled) { color: var(--text-2); }
  .seg button.on { background: var(--pen); color: var(--on-pen); font-weight: 600; }
  .seg button:disabled { cursor: default; }

  /* --- shell --------------------------------------------------------- */

  /* No side rail. The campaigns are a page of their own now, so the only
     permanent chrome is the top bar — which means the recap gets the whole
     width of the window rather than whatever three picking columns left it. */
  .app { display: flex; min-height: 100vh; }

  .camp.newcamp { border-style: dashed; opacity: .78; }
  .camp.newcamp:hover { opacity: 1; }
  .camp.newcamp .nm { color: var(--brass); }
  .camp.gone { border-style: dashed; cursor: default; }
  .camp.asked { border-color: var(--brass); cursor: default; }
  .camp.asked .nm { color: var(--brass-lit); }
  .camp.gone .nm { color: var(--dim); text-decoration: line-through; }
  .card.danger { border-color: var(--red); }
  .btn.danger { border-color: var(--red); color: var(--red-lit); }
  .btn.danger:hover { background: var(--red); color: var(--ink); }

  .camp { display: block; width: 100%; text-align: left; padding: 14px; border: 0;
          border-left: 2px solid transparent; border-radius: 8px; background: transparent;
          cursor: pointer; transition: background .13s; }
  .camp:hover { background: var(--hover); }
  .camp.on { background: var(--raise); border-left-color: var(--brass); }
  .camp .l1 { display: flex; align-items: center; gap: 10px; }
  .camp .nm { font-size: 15px; color: var(--text-2); }
  .camp.on .nm { color: var(--text); font-weight: 500; }
  .camp .meta { font-family: var(--mono); font-size: 11px; color: var(--dim);
                margin-top: 7px; line-height: 1.6; }
  .badge { margin-left: auto; font-family: var(--mono); font-size: 10.5px; font-weight: 600;
           background: var(--pen); color: var(--on-pen); padding: 1px 6px; border-radius: 999px; }

  /* The screens that are not a campaign, and who you are. Marks rather than
     words because they live in the top bar next to the theme switch, and five
     more words there would crowd out the health line. */
  .navmark { position: relative; width: 36px; height: 31px; flex: 0 0 auto;
             display: flex; align-items: center; justify-content: center;
             border: 0; border-radius: 9px; background: transparent;
             color: var(--dim); cursor: pointer;
             transition: color .13s, background .13s; }
  .navmark:hover { color: var(--text); background: var(--hover); }
  .navmark.on { color: var(--pen); background: var(--raise); }
  .navmark .n {
    position: absolute; top: 0; right: 1px;
    font-family: var(--mono); font-size: 9.5px; font-weight: 600;
    color: var(--dim); font-variant-numeric: tabular-nums;
  }
  .navmark.on .n { color: var(--pen); }
  .navmark .who {
    width: 26px; height: 26px; border-radius: 50%;
    border: 1px solid var(--edge); display: flex; align-items: center;
    justify-content: center; font-family: var(--mono); font-size: 11px;
    font-weight: 600; text-transform: uppercase; color: var(--text-2);
  }
  .navmark:hover .who, .navmark.on .who { border-color: var(--pen); color: var(--pen); }

  .placeholder { border: 1px dashed var(--dash); border-radius: 8px;
                 padding: 20px 16px; text-align: center; margin: 0 12px; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .top { height: 76px; flex: 0 0 76px; border-bottom: 1px solid var(--line);
         display: flex; align-items: center; gap: 14px; padding: 0 22px 0 26px;
         background: var(--panel); position: sticky; top: 0; z-index: 5; }
  .top h2 { font-family: var(--serif); font-size: 22px; font-weight: 400; }
  .top .health { display: flex; gap: 20px; align-items: center; margin-left: 14px;
                 font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .top .health .dot { margin-right: 7px; }
  .top .health .down { color: var(--red-lit); }
  .top .health .held { color: var(--brass-lit); }
  .top .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .crumb { font-family: var(--mono); font-size: 12.5px; color: var(--dim); }
  .crumb-sep { color: var(--edge); }
  /* The crumb that goes somewhere. A button rather than a span, because it is
     the way back out of a campaign and the only one on the page. */
  .crumb-back { border: 0; background: transparent; cursor: pointer;
                padding: 5px 9px; margin: 0 -9px 0 -2px; border-radius: 7px;
                transition: color .13s, background .13s; }
  .crumb-back:hover { color: var(--text); background: var(--hover); }
  /* The quill, always first, always home. */
  .top .mark { flex: 0 0 auto; display: flex; align-items: center;
               padding: 5px; margin-left: -5px; border: 0; border-radius: 8px;
               background: transparent; cursor: pointer; transition: background .13s; }
  .top .mark:hover { background: var(--hover); }

  /* --- the degraded banner ------------------------------------------- */

  .banner { background: var(--alarm-bg); border-bottom: 1px solid var(--alarm-br);
            padding: 22px 40px; display: flex; align-items: center; gap: 24px; }
  .banner .say { font-family: var(--display); font-size: 21px; color: var(--text); }
  .banner .why { font-size: 13.5px; color: var(--text-2); margin-top: 6px; line-height: 1.55; }
  .banner-more { padding: 26px 40px; border-bottom: 1px solid var(--line);
                 display: flex; gap: 34px; align-items: flex-start; flex-wrap: wrap; }

  /* --- the split ----------------------------------------------------- */

  /* The mockups are fixed 1920×1080 canvases, so they clip. A real session
     list is forty sessions and a real recap is two screens of prose, so the
     two columns that must not move — the session list and the facts rail —
     stick under the top bar and scroll inside themselves, and the document
     scrolls the reading column. */
  .split { flex: 1; display: flex; align-items: flex-start; }

  .sessions { flex: 0 0 430px; border-right: 1px solid var(--line); background: var(--column);
              display: flex; flex-direction: column;
              position: sticky; top: 76px; height: calc(100vh - 76px); }
  .sessions .head { padding: 20px 24px 12px; display: flex; align-items: baseline; gap: 12px; }
  .sessions .head .hint { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
  .sess-list { flex: 1; overflow-y: auto; padding: 0 12px 12px;
               display: flex; flex-direction: column; gap: 4px; }
  .sessions .foot { padding: 16px 24px; border-top: 1px solid var(--line); }

  .sess { padding: 13px 14px; border-radius: 8px; background: transparent; border: 0;
          width: 100%; text-align: left; cursor: pointer; display: block;
          transition: background .13s; }
  .sess:hover { background: #171B21; }
  .sess.on { background: var(--raise); box-shadow: inset 2px 0 0 var(--brass); }
  .sess.on.failed { box-shadow: inset 2px 0 0 var(--red); }
  .sess .l1 { display: flex; align-items: baseline; gap: 10px; }
  .sess .ref { font-size: 14.5px; color: var(--text); }
  .sess.on .ref, .sess.needs .ref { font-weight: 500; }
  .sess.dead .ref { color: var(--dim); }
  .sess .when { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .sess .say { font-family: var(--serif); font-size: 13.5px; color: var(--text-2);
               margin-top: 8px; line-height: 1.6; }
  .sess .plain { font-size: 13px; color: var(--dim); margin-top: 7px; line-height: 1.5; }
  .sess .facets { display: flex; gap: 14px; margin-top: 9px; flex-wrap: wrap;
                  font-family: var(--mono); font-size: 10.5px; color: var(--dim); }

  .pill { margin-left: auto; font-family: var(--mono); font-size: 10.5px;
          padding: 2px 8px; border-radius: 999px; border: 1px solid var(--edge);
          color: var(--dim); white-space: nowrap; }
  .pill.posted    { border-color: var(--sage-br); color: var(--sage-lit); }
  .pill.approval  { border-color: var(--brass-br); color: var(--brass-lit); }
  .pill.failed    { border-color: var(--red-br); color: var(--red-lit); }
  .pill.recording { border-color: var(--red-br); color: var(--red-lit); }

  /* --- the pane ------------------------------------------------------ */

  .pane { flex: 1; min-width: 0; display: flex; align-items: flex-start; }
  .pane-main { flex: 1; min-width: 0; padding: 30px 40px 44px; }
  .pane-wide { max-width: 980px; }

  .tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--line); }
  .tab { font-size: 14.5px; padding: 0 0 13px; background: transparent; border: 0;
         border-bottom: 2px solid transparent; color: var(--dim); cursor: pointer; }
  .tab:hover { color: var(--text-2); }
  .tab.on { color: var(--text); border-bottom-color: var(--brass); font-weight: 500; }
  .tab .n { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-left: 5px; }

  .display { font-family: var(--serif); font-size: 38px; font-weight: 500;
             letter-spacing: -.4px; line-height: 1.1; }
  .display.sm { font-size: 30px; letter-spacing: -.3px; }
  .lede { font-family: var(--serif); font-size: 19px; line-height: 1.65;
          margin-top: 20px; max-width: 66ch; text-wrap: pretty; }
  .say-2 { font-size: 15.5px; color: var(--text-2); margin-top: 16px;
           line-height: 1.65; max-width: 70ch; }

  .scene { border-left: 2px solid var(--line); padding-left: 18px; margin-top: 18px; }
  .scene h4 { font-family: var(--serif); font-size: 17px; margin-bottom: 7px; }
  .scene p { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--text-2); }
  .numbered { max-width: 70ch; display: flex; flex-direction: column; gap: 8px; }
  .numbered div { display: flex; gap: 12px; font-size: 14.5px; line-height: 1.6; color: var(--text-2); }
  .numbered span.i { color: var(--brass); font-family: var(--mono); font-size: 12px; padding-top: 3px; }

  .facts { flex: 0 0 340px; border-left: 1px solid var(--line); background: var(--column);
           padding: 34px 30px 44px; display: flex; flex-direction: column; gap: 24px;
           position: sticky; top: 76px; max-height: calc(100vh - 76px); overflow-y: auto; }
  .facts .who { font-size: 14px; font-weight: 500; }
  .facts .what { font-size: 13px; color: var(--dim); margin-top: 2px; line-height: 1.5; }
  .facts .plainlist { font-size: 14px; line-height: 1.7; color: var(--text-2); }
  .facts .stack { display: flex; flex-direction: column; gap: 11px; }
  .facts .stack .big { font-size: 14px; line-height: 1.55; color: var(--text); }
  .keep { border-left: 2px solid var(--brass); padding-left: 16px; }
  .keep .cap { color: var(--brass); }
  .keep p { font-family: var(--serif); font-size: 14.5px; line-height: 1.6;
            color: var(--brass-lit); margin: 10px 0 0; }

  /* --- cards and step lists ------------------------------------------ */

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 20px 22px; }
  .card.good { border-color: var(--sage-br); }
  .card h4 { font-family: var(--serif); font-size: 19px; margin-top: 10px; font-weight: 400; }
  .aside { flex: 0 0 330px; display: flex; flex-direction: column; gap: 18px; }

  .steps { display: flex; flex-direction: column; gap: 2px; }
  .steps > div { display: flex; align-items: center; gap: 16px; padding: 18px 20px;
                 background: var(--card); border: 1px solid var(--line); }
  .steps > div:first-child { border-radius: 10px 10px 0 0; }
  .steps > div:last-child { border-radius: 0 0 10px 10px; }
  .steps > div.now { background: #181B21; border-color: var(--edge); }
  .steps .mark { width: 24px; height: 24px; flex: 0 0 24px; border-radius: 50%;
                 border: 1px solid var(--edge); color: var(--dim);
                 display: flex; align-items: center; justify-content: center;
                 font-family: var(--mono); font-size: 12px; }
  .steps .mark.done { background: var(--sage-br); border-color: var(--sage-br); color: var(--sage-lit); }
  .steps .mark.live { background: var(--brass); border-color: var(--brass);
                      animation: pulse 1.6s ease-in-out infinite; }
  .steps .what { font-size: 15px; }
  .steps .sub { font-family: var(--mono); font-size: 11.5px; color: var(--dim); margin-top: 3px; }
  .bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; background: var(--brass); }

  /* --- the roster and correction grids -------------------------------- */

  .grid { width: 100%; }
  .grid .hd, .grid .tr { display: grid; gap: 14px; align-items: center; }
  .grid .hd { padding-bottom: 12px; border-bottom: 1px solid var(--line);
              font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
              text-transform: uppercase; color: var(--dim); }
  .grid .tr { padding: 15px 0; border-bottom: 1px solid var(--rule); }
  .grid .tr:last-child { border-bottom: 0; }
  .grid .r { text-align: right; }
  .roster .hd, .roster .tr { grid-template-columns: 1.4fr 1.4fr 90px 150px 190px; }
  /* Nobody left to hear from: the consent column has nothing to say that the
     heading has not, so the table closes up around it. */
  .roster.settled .hd, .roster.settled .tr { grid-template-columns: 1.4fr 1.4fr 90px 150px; }

  /* Two boxes and the arrow between them: the shape of the thing being
     written, which is a substitution. Used where the grid would otherwise be
     drawing headings over an empty table. */
  /* The roster and the correction ledger are real tables: five columns with
     two of them a fixed width. On a phone they cannot fit and must not widen
     the page, so each scrolls inside itself. Nothing else on the page moves
     sideways. */
  @media (max-width: 820px) {
    .grid { overflow-x: auto; }
    .grid .hd, .grid .tr { min-width: 500px; }
  }

  .pair { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
  .pair label {
    display: flex; flex-direction: column; gap: 7px;
    flex: 1 1 200px; min-width: 0;
    font-size: 12.5px; color: var(--dim);
  }
  .pair .in { font-size: 15px; }
  .pair-arrow { color: var(--pen); font-size: 17px; padding-bottom: 11px; }
  .pair .btn { flex: 0 0 auto; }
  @media (max-width: 720px) {
    .pair-arrow { display: none; }
  }
  .corr .hd, .corr .tr { grid-template-columns: 1fr 1fr 130px 100px; }
  .access .hd, .access .tr { grid-template-columns: 1.5fr 92px 1.5fr 150px 104px; }
  .set-row { display: flex; justify-content: space-between; align-items: center; gap: 20px;
             padding: 16px 0; border-bottom: 1px solid var(--rule); }
  .set-row .what { font-size: 15px; }
  .set-row .sub { font-size: 13px; color: var(--dim); margin-top: 3px; }

  .share { display: inline-flex; align-items: center; gap: 10px; justify-content: flex-end; }
  .share i { width: 62px; height: 5px; border-radius: 3px; background: var(--line);
             display: block; overflow: hidden; }
  .share i b { display: block; height: 100%; background: var(--brass); }
  .share i.quiet b { background: var(--edge); }
  .unset { color: var(--dim); font-style: italic; }
  .agreed { color: var(--sage-lit); } .waiting { color: var(--amber); }
  .never { color: var(--amber); } .declined { color: var(--red-lit); }
  .as-val { font-family: var(--mono); font-size: 11.5px; }

  .charbtn { background: transparent; border: 0; border-bottom: 1px dotted transparent;
             padding: 0; text-align: left; cursor: pointer; font-size: 14.5px; }
  .charbtn:hover { border-bottom-color: var(--edge); }

  /* --- the transcript reader ------------------------------------------ */

  .tr-bar { padding: 20px 36px; border-bottom: 1px solid var(--rule);
            display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
            position: sticky; top: 76px; z-index: 3; background: var(--ink); }
  .chip { font-family: var(--mono); font-size: 11.5px; padding: 5px 11px; border-radius: 999px;
          border: 1px solid var(--line-2); background: transparent; color: var(--dim); cursor: pointer; }
  .chip.on { background: var(--raise); border-color: var(--edge); color: var(--text); }
  .lines { flex: 1; padding: 8px 36px 40px; }
  .line { display: grid; grid-template-columns: 82px 148px 1fr; gap: 20px;
          padding: 11px 0; align-items: baseline; }
  .line:nth-child(even) { background: var(--column); }
  .line .t { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
  .line .who { font-size: 14px; color: var(--text-2); }
  /* Whose account owns the campaign — a fact, not a claim about who is DMing. */
  .line .who.owner { color: var(--brass); }
  .line .said { font-size: 15px; line-height: 1.6; color: var(--text); }
  .line mark { background: transparent; color: var(--brass-lit); border-bottom: 1px dotted var(--brass); }

  /* --- the import dialog ---------------------------------------------- */

  .backdrop { position: fixed; inset: 0; background: var(--scrim); z-index: 20;
              display: grid; place-items: center; padding: 24px; }
  .dialog { width: min(720px, 100%); max-height: 90vh; overflow-y: auto;
            background: var(--card); border: 1px solid var(--edge); border-radius: 14px;
            box-shadow: 0 40px 90px var(--shadow-hard); padding: 34px 38px; }
  .dialog h1 { font-family: var(--serif); font-size: 31px; font-weight: 500;
               margin: 12px 0 0; letter-spacing: -.3px; }
  .dialog .foot { display: flex; align-items: center; gap: 10px; margin-top: 28px;
                  padding-top: 22px; border-top: 1px solid var(--line); }
  .field { margin-top: 18px; }
  .field > label { display: block; font-size: 12.5px; color: var(--dim); margin-bottom: 7px; }
  .warnbox { border-left: 2px solid var(--amber); padding: 2px 0 2px 16px; margin-top: 18px;
             font-size: 13.5px; color: var(--brass-lit); line-height: 1.6; }

  /* --- odds and ends --------------------------------------------------- */

  .empty { display: flex; flex-direction: column; justify-content: center;
           align-items: flex-start; gap: 14px; padding: 0 24px; flex: 1; }
  .empty .say { font-family: var(--serif); font-size: 20px; color: var(--text-2); line-height: 1.35; }
  .center { padding: 72px 60px; max-width: 820px; }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
           max-width: 680px; padding: 12px 18px; border-radius: 9px;
           background: var(--card); border: 1px solid var(--edge);
           box-shadow: 0 10px 34px var(--shadow-hard); font-size: 13.5px; z-index: 40;
           opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  .toast.good { border-color: var(--sage-br); }
  .toast.bad { border-color: var(--red-br); color: var(--red-lit); }
  code { font-family: var(--mono); font-size: 12.5px; background: var(--raise);
         border-radius: 4px; padding: 1px 6px; }
  body.stale .main { opacity: .55; transition: opacity .3s; }

  /* Narrow screens: the columns stack rather than shrink to unreadable.
     A phone is a real way this gets opened — to approve a summary from the
     sofa — and the session list is the part that matters there. */
  /* Superseded below — the width this rail needs depends on whether the
     campaign leaf is turned away. Left here so the rule it replaces is
     obvious to anyone reading top to bottom. */
  @media (max-width: 1180px) {
    .facts { display: none; }
    .split { flex-direction: column; }
    .sessions { flex: none; width: 100%; border-right: 0;
                border-bottom: 1px solid var(--line);
                position: static; height: auto; }
    .sess-list { max-height: 42vh; }
    .pane { width: 100%; }
    .pane-main { padding: 26px 24px 40px; }
    .tr-bar { position: static; }
  }
  @media (max-width: 820px) {
    .app { flex-direction: column; }
    .top { height: auto; flex: none; padding: 14px 18px; gap: 14px; flex-wrap: wrap; }
    .banner, .banner-more { padding: 18px 20px; }
    .lines, .tr-bar { padding-inline: 18px; }
    .line { grid-template-columns: 64px 1fr; }
    .line .said { grid-column: 1 / -1; }
  }

  /* ======================================================================
     The campaigns page
     ======================================================================
     The front door. Every campaign this viewer sits at, on a page of its own,
     and picking one carries you into it.

     What this replaces: a 268px rail of campaign rows that slid off to the
     left the moment you picked one. It went away on its own — the picker
     disappeared at the exact moment you had proved you were using it — and
     because the page auto-opened a campaign at boot, most visits never saw
     the list at all. Squeezing the list into a narrow column was the wrong
     answer twice over: a list you consult between games does not want to live
     beside the recap you read during them. So it moved out and got a page.

     Each campaign is an entry in a ledger rather than a card in a grid. The
     tally at the head of an entry is the one real invention here: one stroke
     per session, so a campaign's weight is legible before you have read a
     word of it — twenty-two strokes is a chronicle, one stroke is a one-shot.
     Solid strokes are nights already written up, pen-coloured strokes are the
     ones waiting on you, hollow ones are still with the transcriber. It is
     the count, the progress bar and the to-do list in the same mark, and it
     is what a scribe keeping a ledger would actually draw.  */

  .index { max-width: 1080px; margin: 0 auto; padding: 54px 40px 80px; }

  .index-head { margin-bottom: 12px; }
  .index-head h1 {
    font-family: var(--display); font-variation-settings: 'SOFT' 0, 'WONK' 1;
    font-size: 38px; font-weight: 400; line-height: 1.14; letter-spacing: -.015em;
    margin-top: 15px; max-width: 30ch;
  }
  /* The remark is an aside, so it is said in the quieter colour and on its own
     line. The count is the fact; the rest is the page muttering. Breaking it
     deliberately rather than letting the measure decide means the fact is
     always the first thing read, whatever length of remark follows it. */
  .index-head h1 .aside { display: block; color: var(--dim); }
  .index-now {
    margin-top: 16px; display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 12.5px; letter-spacing: .03em;
    color: var(--text-2);
  }

  .chrons { margin-top: 30px; border-top: 1px solid var(--rule); }

  /* One entry. A button rather than a link because there is no URL behind it;
     the whole band is the target, so there is no small thing to hit. */
  .chron {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: transparent; border: 0; border-bottom: 1px solid var(--rule);
    padding: 26px 20px 28px; margin: 0;
    transition: background .15s;
  }
  .chron:hover { background: var(--hover); }
  .chron-top {
    display: flex; align-items: center; flex-wrap: wrap; gap: 9px 18px;
    min-height: 15px;
  }
  .chron-name {
    font-family: var(--display); font-variation-settings: 'SOFT' 0, 'WONK' 1;
    font-size: 30px; font-weight: 400; line-height: 1.15; letter-spacing: -.012em;
    color: var(--text); margin-top: 13px;
    transition: transform .18s cubic-bezier(.22,.72,.2,1);
  }
  /* The entry leans toward the door it opens. Cheaper than an arrow, and it
     does not need a legend. */
  .chron:hover .chron-name { transform: translateX(7px); }

  .chron-lines {
    display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 11px;
    font-family: var(--mono); font-size: 11.5px; letter-spacing: .03em;
    color: var(--dim);
  }
  .chron-lines b { font-weight: 500; color: var(--text-2); }
  .chron-where { color: var(--dim); }

  /* The tally. Strokes are drawn as flex children rather than a repeating
     background so each one can carry its own state. */
  .tally { display: flex; align-items: center; gap: 9px; height: 13px; }
  /* Grouped in fives, as a tally is. Ungrouped, twenty-two strokes is a
     barcode — a texture rather than a number. Grouped, it can be counted at a
     glance and it looks like something somebody kept by hand. */
  .tally .grp { display: flex; align-items: stretch; gap: 3px; height: 100%; }
  .tally i {
    display: block; width: 2px; border-radius: 1px;
    background: var(--line-2);
  }
  /* The bulk of a tally is nights already written up, so they are the calm
     part; two strokes of pen have to win against twenty of them, and at 2px
     colour alone does not do it. The waiting strokes are wider as well. */
  .tally i.done { background: var(--dim); }
  .tally i.wait { width: 3px; background: var(--pen); }
  .tally .rest {
    font-family: var(--mono); font-size: 10.5px; color: var(--dim);
    margin-left: 5px; align-self: center;
  }

  /* What is true about this table right now, said once, at the top of the
     entry. Only ever one of them: a campaign being recorded is not also
     waiting on you, and neither is worth saying twice. */
  .chron-state {
    font-family: var(--mono); font-size: 10.5px; font-weight: 600;
    letter-spacing: .13em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .chron-state.live { color: var(--red-lit); }
  .chron-state.wait { color: var(--pen); }
  .chron-when { margin-left: auto; font-family: var(--mono); font-size: 11px;
                color: var(--dim); letter-spacing: .03em; }

  /* The doors that are only there sometimes: starting one, and the ones you
     deleted or asked to have back. Under the ledger, not in it. */
  .index-more { margin-top: 40px; display: grid; gap: 14px;
                grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); }
  .index-more .camp { border: 1px solid var(--line); }

  /* Every change of screen: the page comes up from under rather than cutting
     in. One quiet move, the same in both directions — an earlier draft flew
     the campaign's name from the ledger entry up into the header, which was a
     great deal of choreography to spend on a click somebody makes forty times
     a week. */
  @keyframes arrive { from { opacity: 0; transform: translateY(10px); } }
  .arriving { animation: arrive .34s cubic-bezier(.22,.72,.2,1); }

  @media (prefers-reduced-motion: reduce) {
    .chron-name { transition: none; }
    .arriving { animation-duration: .01ms; }
  }

  @media (max-width: 820px) {
    .index { padding: 30px 20px 60px; }
    .index-head h1 { font-size: 28px; }
    .chron { padding: 20px 4px 22px; }
    .chron-name { font-size: 24px; }
    /* Three things do not fit across a phone. The date drops to its own line
       so the tally and the state can keep theirs. */
    .chron-when { margin-left: 0; width: 100%; }
    .chron-state { white-space: nowrap; }
  }

  /* ----------------------------------------------------------------------
     The account panel, hung off the mark at the end of the top bar. The one
     thing from the old rail's foot that is neither a screen nor a campaign,
     so it is neither a page nor a row.  */
  .sheet {
    position: fixed; top: 68px; right: 16px; width: 280px;
    background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 12px; box-shadow: 0 18px 48px var(--shadow-hard);
    padding: 16px 12px 14px; z-index: 40;
    max-height: calc(100vh - 84px); overflow-y: auto;
    animation: sheet-in .16s cubic-bezier(.22,.72,.2,1);
  }
  @keyframes sheet-in {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: none; }
  }
  .sheet > .cap { padding: 0 14px 10px; }
  .sheet-foot {
    margin-top: 12px; padding: 13px 14px 2px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 11px; color: var(--dim); line-height: 1.7;
  }
  .sheet-scrim { position: fixed; inset: 0; z-index: 30; }
  @media (prefers-reduced-motion: reduce) { .sheet { animation-duration: .01ms; } }
  /* ======================================================================
     Room to read
     ======================================================================
     Everything below is spacing. The panels were tuned against a fixed
     1920x1080 mockup and had been squeezed ever since; these are the numbers
     for a real window with no side rail taking a bite out of it.  */

  body { font: 400 15.5px/1.55 var(--sans); }

  /* Fraunces sets every heading. SOFT 0 / WONK 1 is the landing page's
     setting — the wonky leg on the g and the flatter terminals are what make
     it read as lettering rather than as a system serif. */
  .display, .top h2, .card h4, .dialog h1,
  .scene h4, .banner .say, .empty .say, .keep p {
    font-family: var(--display);
    font-variation-settings: 'SOFT' 0, 'WONK' 1;
  }
  .display { font-size: 40px; font-weight: 400; letter-spacing: -.015em; line-height: 1.06; }
  .display.sm { font-size: 29px; }
  .top h2 { font-size: 23px; }

  /* Buttons and labels go to the mono, as they do on the landing page. It is
     the face the whole product uses for anything mechanical. */
  .btn, .seg button, .tab { font-family: var(--mono); }
  .btn { font-size: 12.5px; letter-spacing: .01em; padding: 8px 15px; }
  .btn.sm { font-size: 11.5px; padding: 6px 12px; }
  .btn.big { font-size: 13px; padding: 11px 21px; }
  .tab { font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 14px; }
  .tab .n { margin-left: 7px; }

  /* The reading column. Wider gutters, and a measure that stops short of the
     facts rail instead of running under it. */
  .pane-main { padding: 42px 56px 76px; }
  .pane-wide { max-width: 1020px; }
  .lede { font-size: 20px; line-height: 1.62; margin-top: 22px; max-width: 62ch; }
  .say-2 { font-size: 16px; line-height: 1.68; max-width: 66ch; }

  /* Scenes were a stack of paragraphs 18px apart with a hairline down the
     side, which is why the recap read as one block. They are beats of an
     evening, so they get the space of beats. */
  .scene { margin-top: 30px; padding-left: 22px; border-left-color: var(--line-2); }
  .scene:first-child { margin-top: 14px; }
  .scene h4 { font-size: 18px; font-weight: 500; margin-bottom: 10px; letter-spacing: -.005em; }
  .scene p { font-size: 15.5px; line-height: 1.72; }
  .numbered { gap: 13px; max-width: 66ch; }
  .numbered div { font-size: 15.5px; line-height: 1.68; gap: 14px; }
  .cap { letter-spacing: .16em; }

  /* The session column: cards with air between them, and a heading that is
     not jammed against the first one. */
  /* flex-basis alone was not enough: a flex item will not go below its
     min-content width, and four nowrap pills are wider than the column. The
     column keeps its width and the picker fits inside it instead. */
  .sessions { flex: 0 0 396px; min-width: 0; }
  .sessions .head { padding: 24px 22px 14px; align-items: baseline; gap: 12px; }
  .sess-list { padding: 0 14px 16px; gap: 7px; }
  .sess { padding: 15px 15px 16px; border-radius: 10px; }
  .sess:hover { background: var(--hover); }
  .sess .say { margin-top: 9px; line-height: 1.62; }
  .camp:hover { background: var(--hover); }
  .steps > div.now { background: var(--raise); }
  .line:nth-child(even) { background: var(--column); }

  .facts { flex: 0 0 320px; padding: 42px 30px 56px; gap: 30px; }

  /* The highlighter, spent where the landing page spends it: on the line
     somebody will want to read out loud. */
  .keep { border-left-color: var(--mark); }
  .keep .cap { color: var(--mark-cap); }
  .keep p { color: var(--text); font-size: 15px; line-height: 1.62; }
  .line mark { color: var(--text); background: var(--mark); border-bottom: 0;
               padding: 0 3px; border-radius: 2px; }
  :root[data-theme="dark"] .line mark { color: var(--mark-ink); }

  /* The facts rail costs 320px, and below 1300px the recap's own prose is the
     thing worth keeping — everything in the rail is also in the notes body.
     One threshold rather than the two this used to need: the second existed
     because the campaign rail could be open and cost another 268px, and there
     is no campaign rail any more. */
  @media (max-width: 1300px) { .facts.optional { display: none; } }

  .theme { margin-left: 4px; }
  .theme button { padding: 5px 10px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }

  /* ======================================================================
     Who and where
     ======================================================================
     The summariser already names every NPC and every place, once per session,
     and then that naming is stranded in the session it came from. Read down
     the campaign instead of across it and the same names line up into an
     entry: who they are, the night they walked on, and what has been said
     about them since.  */

  .entries { display: flex; flex-direction: column; gap: 2px; margin-top: 26px; }
  .entry {
    display: grid; grid-template-columns: 186px minmax(0, 1fr);
    gap: 28px; padding: 24px 0; border-bottom: 1px solid var(--rule);
  }
  .entry:last-child { border-bottom: 0; }
  .entry-who { min-width: 0; }
  .entry-name {
    font-family: var(--display); font-variation-settings: 'SOFT' 0, 'WONK' 1;
    font-size: 19px; line-height: 1.25; letter-spacing: -.005em;
  }
  .entry-first {
    display: block;
    font-family: var(--mono); font-size: 11px; letter-spacing: .07em;
    text-transform: uppercase; color: var(--dim); margin-top: 8px; line-height: 1.7;
  }
  .entry-first b { display: block; font-weight: 500; color: var(--pen); margin: 2px 0 4px; }
  .entry-said { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .entry-said:empty { display: none; }
  .entry-said .point { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 14px; }
  .entry-said .point.bare { display: block; }
  .entry-said .s {
    font-family: var(--mono); font-size: 11px; color: var(--dim);
    padding-top: 4px; letter-spacing: .04em;
  }
  .entry-said .p { font-size: 15.5px; line-height: 1.66; color: var(--text-2); }
  .entry-aside {
    margin-top: 4px; border-left: 2px solid var(--mark); padding: 2px 0 2px 15px;
    font-size: 14.5px; line-height: 1.6; color: var(--text);
  }
  .entry-aside + .entry-aside { margin-top: 10px; }

  /* The column holds two pages in a clipped frame and slides between them,
     the same gesture the campaign rail uses one level out: choose, and what
     you chose from leaves to the left while what you chose arrives behind it.
     The header it leaves is the way back.

     Both pages are absolutely positioned so the one on its way out does not
     stretch the frame to the height of the one coming in. */
  .sessions { display: flex; flex-direction: column; }

  .shelf-slider { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .shelf-page {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: var(--column);
    transition: transform .42s cubic-bezier(.22,.72,.2,1);
  }
  .shelf-slider.picking .chooser { transform: translateX(0); }
  .shelf-slider.picking .list    { transform: translateX(100%); }
  .shelf-slider.picked  .chooser { transform: translateX(-100%); }
  .shelf-slider.picked  .list    { transform: translateX(0); }
  .shelf-slider.picking .list,
  .shelf-slider.picked  .chooser { pointer-events: none; }

  /* A row of the chooser: Sessions, NPCs, Places, Items. Built like a ledger
     entry one level in, so picking what to read repeats the shape of picking
     the campaign. */
  .shelf-row {
    display: block; width: 100%; text-align: left;
    padding: 15px 15px 16px; border: 0; border-left: 2px solid transparent;
    border-radius: 10px; background: transparent; cursor: pointer;
    transition: background .13s;
  }
  .shelf-row:hover { background: var(--hover); }
  .shelf-row.on { background: var(--raise); border-left-color: var(--pen); }
  .shelf-row .l1 { display: flex; align-items: baseline; gap: 10px; }
  .shelf-row .nm { font-size: 15.5px; color: var(--text); }
  .shelf-row .n {
    margin-left: auto; font-family: var(--mono); font-size: 11.5px;
    color: var(--dim); font-variant-numeric: tabular-nums;
  }
  .shelf-row .meta {
    font-family: var(--mono); font-size: 11px; color: var(--dim);
    margin-top: 7px; letter-spacing: .03em;
  }

  /* The header of a chosen list, which is also the way out of it. */
  .shelf-back {
    display: inline-flex; align-items: baseline; gap: 9px;
    font-family: var(--mono); font-size: 11.5px;
    letter-spacing: .14em; text-transform: uppercase;
    padding: 4px 10px 4px 6px; margin-left: -6px; border-radius: 7px;
    border: 0; background: transparent; color: var(--text);
    cursor: pointer; transition: background .13s, color .13s;
  }
  .shelf-back:hover { background: var(--hover); }
  .shelf-back .arw { color: var(--pen); font-size: 13px; letter-spacing: 0; }
  .shelf-back .n { color: var(--dim); letter-spacing: .02em; }

  @media (prefers-reduced-motion: reduce) {
    .shelf-page { transition-duration: .01ms; }
  }

    .comp-head { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .comp-count { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
  .comp-bar { margin-top: 30px; display: flex; align-items: center; gap: 10px; }

  @media (max-width: 900px) {
    .entry { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  }

  @media (max-width: 1180px) {
    .pane-main { padding: 30px 26px 48px; }
    .sessions { flex: none; }
  }
  @media (max-width: 820px) {
    /* The top bar carries two pause buttons and the theme switch. At 430px
       that is wider than the phone, and .right pinning itself to the end with
       margin-left:auto meant it overflowed rather than wrapped. */
    .top .right { margin-left: 0; flex-wrap: wrap; }
    .theme { margin-left: 0; }

    /* Five tabs do not fit a phone. The strip scrolls inside itself rather
       than widening the page — nothing else on the page scrolls sideways. */
    .tabs { overflow-x: auto; gap: 18px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { white-space: nowrap; flex: 0 0 auto; }

    .sheet { top: 60px; right: 12px; left: 12px; width: auto;
             max-height: calc(100vh - 76px); }
  }
  /* ======================================================================
     The gate — the sign-in screen, in the landing page's world.
     ======================================================================
     Somebody arriving from / clicked "Log in" on a page made of pale paper
     and ultramarine, and used to land here in the dark. That cut said "you
     have left the website" at the exact moment we were asking them to trust
     us with their Discord account.
     So the gate keeps the landing page's palette and typefaces, and the tool
     goes dark once they are through it. The dashboard's own tokens are
     untouched — everything below is scoped to body.gate-open or .gate, and
     nothing here leaks into a signed-in page.

     The typefaces load on demand, from loadGateFonts(). Most visits to this
     page never see this screen and should not pay for three extra families.  */
  body.gate-open { background: #E6E8E3; }
  body.gate-open .sheet,
  body.gate-open .top,
  body.gate-open #banner { display: none; }
  body.gate-open .app { display: block; min-height: 100vh; }
  body.gate-open .main { display: block; }

  .gate {
    --paper:   #E6E8E3;
    --paper-2: #DEE2DA;
    --paper-3: #D4D9CF;
    --ink:     #171C22;
    --ink-soft:#5C665E;
    --edge:    #C4CABE;
    --pen:     #2434A8;

    --g-display: 'Fraunces', 'Hoefler Text', Georgia, serif;
    --g-body:    'Newsreader', Georgia, 'Times New Roman', serif;
    --g-mono:    'Spline Sans Mono', ui-monospace, Consolas, monospace;

    background: var(--paper);
    color: var(--ink);
    font-family: var(--g-body);
    min-height: 100vh;
    padding: 10vh 24px 60px;
  }
  .gate-inner { max-width: 470px; margin: 0 auto; }

  .gate-eyebrow {
    font-family: var(--g-mono);
    font-size: 11.5px; letter-spacing: .19em; text-transform: uppercase;
    color: var(--pen); margin: 20px 0 0;
  }
  .gate h1 {
    font-family: var(--g-display);
    font-variation-settings: 'SOFT' 0, 'WONK' 1;
    font-weight: 400;
    font-size: clamp(30px, 5vw, 42px);
    line-height: 1.06; letter-spacing: -.022em;
    margin: 14px 0 0; color: var(--ink); text-wrap: balance;
  }
  .gate-say {
    font-size: 17px; line-height: 1.6; color: var(--ink-soft);
    margin: 14px 0 0; max-width: 44ch;
  }
  .gate-say b { color: var(--ink); font-weight: 600; }

  .gate-btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .gate-btn {
    font-family: var(--g-mono);
    font-size: 13px; letter-spacing: .02em;
    padding: 12px 22px; border-radius: 5px;
    border: 1px solid var(--pen); background: var(--pen); color: var(--paper);
    cursor: pointer;
    transition: background .16s ease, border-color .16s ease;
  }
  .gate-btn:hover:not(:disabled) { background: #1B2A92; border-color: #1B2A92; }
  .gate-btn:disabled { opacity: .55; cursor: default; }
  .gate-btn.quiet { background: transparent; color: var(--pen); border-color: var(--edge); }
  .gate-btn.quiet:hover { background: transparent; border-color: var(--pen); }
  .gate-btn.plain {
    background: transparent; border-color: transparent; color: var(--ink-soft);
    padding-inline: 0; text-decoration: underline; text-underline-offset: 3px;
  }
  .gate-btn.plain:hover { background: transparent; color: var(--pen); }

  /* The one button on the page, and the whole of signing in.
     Discord's own blurple rather than the ink this page uses everywhere else,
     because it is the one control here that hands you to somebody else: the
     colour is the promise about where the next screen comes from. */
  .gate-btn.discord {
    display: inline-flex; align-items: center; gap: 10px;
    background: #5865F2; border-color: #5865F2; color: #fff;
    text-decoration: none; font-size: 13.5px; padding: 13px 24px;
  }
  .gate-btn.discord:hover { background: #4752C4; border-color: #4752C4; }
  .gate-btn.discord svg { flex: none; }
  .gate :focus-visible { outline: 2px solid var(--pen); outline-offset: 3px; border-radius: 3px; }

  .gate-msg {
    font-family: var(--g-mono); font-size: 12px; line-height: 1.6;
    margin-top: 18px; padding-left: 14px;
    border-left: 2px solid var(--pen); color: var(--ink-soft);
  }
  .gate-msg.bad { border-left-color: #A8322B; color: #8C2F29; }

  .gate-foot {
    margin-top: 38px; padding-top: 18px;
    border-top: 1px solid var(--edge);
    font-size: 14.5px; line-height: 1.62; color: var(--ink-soft);
    max-width: 50ch;
  }
  .gate-back {
    display: inline-block; margin-top: 22px;
    font-family: var(--g-mono); font-size: 12px; letter-spacing: .04em;
    color: var(--ink-soft); text-decoration: none;
  }
  .gate-back:hover { color: var(--pen); }

  @media (max-width: 520px) {
    .gate { padding-top: 6vh; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- The account, hung off the mark at the end of the top bar. -->
  <div id="sheet"></div>

  <main class="main">
    <header class="top" id="top"></header>
    <div id="banner"></div>
    <div id="screen" class="split"></div>
  </main>
</div>

<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
// Same origin by default: nginx proxies /api to the Pi and adds the status
// token on the way through, so the token never reaches the browser and the
// Pi's port can stay on the LAN even when the dashboard is published.
//
// ?api=http://host:port still overrides it, for pointing at a second bot.
const API = new URLSearchParams(location.search).get('api') || window.SCRIBER_API || '/api';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

// --- what the page is looking at ------------------------------------------
//
// Every render reads this rather than the DOM. The whole page is rebuilt from
// the poll every few seconds, so state kept in the markup would be thrown away
// mid-click.
const view = {
  screen: 'campaigns',  // campaigns | campaign | transcript | servers | models | access
  signingIn: false,     // asked for the sign-in card while it was optional
  campaignId: null,
  tab: 'notes',         // notes | table | corrections | compendium | settings
  shelf: 'sessions',    // what the middle column lists: sessions | npcs | places | items
  shelfPicking: true,   // the column showing the four rather than one of them
  entry: null,          // the chosen npc/place/item, as "<shelf>:<key>"
  meetingId: null,
  editing: null,        // the user id whose character name is being typed
  importing: false,
  creating: false,
  deleting: false,
  askingRestore: null,   // { id, name } of a deleted campaign being asked about
  reviewing: null,       // the id of a restore request being read
  diagnosing: false,    // the degraded banner's detail is open
  sheet: null,          // the account panel, hung off the top bar: account
  search: '',
  speaker: null,        // transcript filter, a user id
};

// Only one dialog is ever open. Kept in one place because every opener has to
// clear the others, and a page left with two flags set shows the first one
// forever while every click on the second looks like a dead button.
const closeDialogs = () => {
  view.importing = false;
  view.creating = false;
  view.deleting = false;
  view.askingRestore = null;
  view.reviewing = null;
  // A sheet is a dialog too as far as "only one thing is open" goes: the
  // campaigns sheet opens the new-campaign form, and leaving the sheet up
  // behind it would put a second scrim over the first one's buttons.
  view.sheet = null;
};

let me = null;          // last /me — who the bot thinks is looking
let status = null;      // last /status
let detail = null;      // last /campaign?id=
let notes = null;       // last /notes?meeting=
let notesKey = null;    // the session and job those notes were fetched for
let script = null;      // last /transcript?…&format=json
let lastSeen = null;

// The member search on the table tab. `results: null` means "not searched
// yet", which renders as nothing — distinct from `[]`, which is the honest
// and different statement that nobody matched.
const people = { query: '', results: null, error: '', busy: false };

// The sign-in card's own state, which is now only whatever went wrong last
// time. There are no steps left to be on: the card is a sentence and a button,
// and everything between pressing it and coming back happens on Discord.
const login = { message: '', failed: false };

const PROVIDERS = { gemini: 'Gemini', anthropic: 'Claude' };
const providerName = (p) => PROVIDERS[p] || p;

// --- small formatters ------------------------------------------------------

function hhmmss(ms) {
  if (ms == null) return '0:00:00';
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 3600)}:${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}
// A position in the recording, always hh:mm:ss — a three-hour session's
// timestamps have to stay comparable at a glance, and m:ss would read "202:15".
const clock = (ms) => {
  const s = Math.floor((ms ?? 0) / 1000);
  return `${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
};

// How long something ran, in the largest two units that say anything: "3:22"
// for a full evening, "0:04" for the session where everyone left before the
// bot had recorded a sentence. Both are states this actually renders.
const runtime = (ms) => {
  if (!ms) return null;
  const s = Math.round(ms / 1000);
  if (s < 3600) return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const m = Math.round(s / 60);
  return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
};
const shortDate = (iso) =>
  iso ? new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : '';
const longDate = (iso) =>
  iso ? new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const hhmm = (iso) =>
  iso ? new Date(iso).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) : '';
const n = (x) => Number(x ?? 0).toLocaleString();
const plural = (count, word) => `${n(count)} ${word}${count === 1 ? '' : 's'}`;

function since(ms) {
  if (ms == null) return 'never';
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 5) return 'just now';
  if (s < 60) return `${s}s ago`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  return h < 48 ? `${h}h ago` : `${Math.floor(h / 24)}d ago`;
}

const uptime = (ms) =>
  ms == null ? '' : `up ${Math.floor(ms / 86400000)}d ${new Date(ms).toISOString().slice(11, 16)}`;

// A user with no display name has never spoken, so all we have is the id.
// Shown as an id rather than as a blank, because that is the string you paste
// into /campaign invite.
const whoIs = (p) => p.displayName || `user ${p.userId.slice(0, 4)}…${p.userId.slice(-4)}`;

// The design's NPC entries are a name and a description. Real ones are one
// string, and the summariser chooses the punctuation between the two halves —
// so this is the same split the Obsidian exporter and the ledger use, kept
// deliberately identical to campaign/entry-name.js.
const SEPARATOR = /\s*:\s+|\s+[—–-]\s+|,\s+|\s+\(/;
function splitEntry(entry) {
  const s = String(entry ?? '').trim();
  const m = s.match(SEPARATOR);
  if (!m || m.index === 0) return { name: s, rest: '' };
  return { name: s.slice(0, m.index).trim(), rest: s.slice(m.index).replace(/^[\s:—–,(-]+/, '').replace(/\)$/, '') };
}

const dotFor = (state) => `<span class="dot ${state === true ? 'ok' : state === false ? 'bad' : ''}"></span>`;

// What this viewer may do.
//
// The server has already cut the payload to match — see web/scope.js — so
// nothing here is a security control. It is what stops the page rendering a
// row of buttons that would all answer 403, which is a worse way to learn what
// you are allowed to do than not being offered it.
//
// Defaults to true against a bot too old to answer /me, so an out-of-step
// deploy degrades to the behaviour that existed before levels did.
const cap = (name) => (me?.can ? Boolean(me.can[name]) : true);

// Starting a campaign needs somewhere to put it. The bot works out which
// servers those are and sends the list; an empty list means the button would
// only ever open a dialog with nothing to pick, so it is not drawn at all.
const canCreate = () => status?.actionsEnabled !== false && (status?.canCreateIn?.length ?? 0) > 0;

// Deleting is not the same authority as managing. A server owner can manage a
// campaign in their Discord; only whoever actually runs it can delete it. The
// bot decides — this only mirrors the answer so the button is not drawn for
// somebody who would be refused.
const RESTORE_DAYS = 30;
const canDelete = () =>
  status?.actionsEnabled !== false && Boolean(detail?.viewerCan?.delete);

// Whether actions are possible at all: the bot must accept them, and this
// viewer must be allowed to make them.
const can = () => status?.actionsEnabled !== false && cap('approvals');

// Managing one campaign is a different question from the machinery — a
// campaign's own creator may edit its roster without being able to pause a
// queue that belongs to somebody else's hardware.
const canManage = () => status?.actionsEnabled !== false && (detail?.viewerCan?.manage ?? cap('manage'));

// Where this campaign's notes end up, in words.
//
// Not a channel name with a # in front of it: a campaign's `channel` is the
// last VOICE channel it recorded in, and the default destination is that
// channel's own text feed — or NOTES_CHANNEL_ID, if the Pi sets one. Naming a
// channel here would be a guess, and it would be wrong on exactly the installs
// that configured something.
const destination = () =>
  detail?.output === 'dm' ? 'you, as a DM'
  : detail?.output === 'channel' ? "this campaign's notes channel"
  : 'the channel you played in';

const campaign = () => status?.campaigns?.find((c) => c.id === view.campaignId) ?? null;
const sessions = () => (detail?.sessions ?? []).map(normalise);
const selected = () => sessions().find((s) => s.meetingId === view.meetingId) ?? null;

// A bot older than this page does not send `state`, `job` or the recap facets.
// Deriving what can be derived keeps the page useful against it rather than
// printing "undefined" in every pill — the two are deployed from different
// places (this file from a bind mount, the fields from an image), so they are
// routinely a few minutes out of step.
function normalise(s) {
  if (s.state) return s;
  const st = s.status ?? '';
  return {
    ...s,
    state: st === 'done' ? 'posted' : st.endsWith('_failed') ? 'failed' : st === 'recording' ? 'recording' : 'queued',
    npcs: 0, locations: 0, threads: 0, tldr: '',
    discardable: s.lines === 0 && st !== 'recording',
  };
}

// ==========================================================================
// The theme
// ==========================================================================
//
// Three states, not two. "auto" is the absence of a stored choice, so a person
// who never touches this follows their machine forever rather than being
// frozen at whatever it happened to be the first time they opened the page.
// The <script> in <head> reads the same key before first paint.

const themeMode = () => {
  try {
    const t = localStorage.getItem('quill-theme');
    return t === 'dark' || t === 'light' ? t : 'auto';
  } catch (e) { return 'auto'; }
};

function setTheme(mode) {
  try {
    if (mode === 'auto') localStorage.removeItem('quill-theme');
    else localStorage.setItem('quill-theme', mode);
  } catch (e) {}
  if (mode === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', mode);
  paint();
}

const themeSwitch = () => {
  const now = themeMode();
  return `<div class="seg theme" role="group" aria-label="Theme">${
    [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']].map(([id, name]) =>
      `<button type="button" class="${now === id ? 'on' : ''}" data-theme-set="${id}"
         aria-pressed="${now === id}">${name}</button>`).join('')
  }</div>`;
};

// ==========================================================================
// The campaigns page, and going in
// ==========================================================================

// What is true about a table right now, and worth acting on. Only ever one
// thing: a campaign being recorded is not also waiting on you, and a campaign
// with nothing to say gets no line rather than a line saying nothing.
//
// Deliberately not `claimed`. It reads like a live state and is not one — it
// means the campaign has a DM who runs it, which is a fact about the campaign
// rather than something happening tonight. The signal an operator actually
// wants from it is the opposite one, a campaign with nobody running it, and
// that is a different line than this.
const campaignState = (c) =>
  c.recording ? { key: 'live', dot: 'live', say: 'recording now' }
  : c.awaiting ? { key: 'wait', dot: 'brass', say: `${plural(c.awaiting, 'night')} waiting on you` }
  : null;

// "played 2 days ago". Days rather than hours, because the unit a campaign is
// measured in is the night it was played, and "played 14h ago" is a sentence
// about a server rather than about a game.
function lastPlayed(iso) {
  if (!iso) return 'no nights recorded';
  const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (days <= 0) return 'played today';
  if (days === 1) return 'played yesterday';
  if (days < 14) return `played ${days} days ago`;
  if (days < 60) return `played ${Math.round(days / 7)} weeks ago`;
  return `played ${Math.round(days / 30)} months ago`;
}

// The tally: one stroke per night. Written up, waiting on you, and still with
// the transcriber, in that order — so the strokes read left to right as the
// life of a session, and the pen-coloured ones are always the ones to look at.
//
// Capped, because past about forty strokes the row stops being a shape you can
// take in at a glance and the number is the better answer.
const TALLY_CAP = 40;
function tally(c) {
  const total = c.sessions ?? 0;
  if (!total) return '';
  const shown = Math.min(total, TALLY_CAP);
  const wait = Math.min(c.awaiting ?? 0, shown);
  const done = Math.max(0, Math.min(c.completed ?? 0, shown - wait));

  const marks = Array.from({ length: shown }, (_, i) =>
    i < done ? 'done' : i < done + wait ? 'wait' : '');

  const groups = [];
  for (let i = 0; i < marks.length; i += 5) {
    groups.push(`<span class="grp">${
      marks.slice(i, i + 5).map((k) => `<i class="${k}"></i>`).join('')}</span>`);
  }
  return `<span class="tally" aria-hidden="true">${groups.join('')}${
    total > shown ? `<span class="rest">+${total - shown}</span>` : ''}</span>`;
}

// Small numbers as words. A display face setting "6 campaigns" reads like a
// receipt; past twelve the word is longer than the thing it counts.
const WORDS = ['no', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven',
               'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve'];
const count = (x) => (x < WORDS.length ? WORDS[x] : String(x));

// How many tables somebody sits at, remarked upon. Indexed by that number, so
// the page gets quietly more concerned about you as the list grows.
//
// Dry rather than loud, and none of them repeats the number the sentence has
// already said. This is the first line on the first screen, read every time
// anybody opens the dashboard — a joke at that frequency has to be quiet
// enough to live with, so these are asides in the scribe's voice rather than
// punchlines, and they are set in the dim colour to read as muttering.
const REMARKS = [
  '',                                            // 0 — the first-run screen answers instead
  'A good place to start.',
  'Twice the names to keep straight.',
  'The calendar is doing the hard part.',
  'Somebody at your table is very patient.',
  'Quill has stopped asking when you sleep.',
  'This is less a hobby than a rota.',
  'One for every night of the week.',
  'Somewhere, a session zero is weeping.',
  'The ink budget has become a real concern.',
  'Quill would like a word.',
  'Nobody needs this many worlds.',
  'One for every month, apparently.',
];
const remark = (howMany) => REMARKS[howMany] ?? 'Quill has stopped counting and started worrying.';

function campaignsScreen() {
  const camps = status?.campaigns ?? [];
  const rec = camps.find((c) => c.recording);
  const waiting = camps.reduce((sum, c) => sum + (c.awaiting || 0), 0);
  const many = `${count(camps.length)} campaign${camps.length === 1 ? '' : 's'}`;

  // What is happening right now, kept out of the headline and given its own
  // line. It is the one thing on this page somebody might need to act on, and
  // a sentence that has to end in a joke is a poor place to keep it.
  const now = rec
    ? `<span class="dot live"></span>Recording at ${esc(rec.name || rec.channel)} right now.`
    : waiting
      ? `<span class="dot brass"></span>${plural(waiting, 'night')} waiting on you.`
      : '';

  return `
    <div class="index">
      <div class="index-head">
        <div class="cap">Campaigns</div>
        <h1>${many}. <span class="aside">${remark(camps.length)}</span></h1>
        ${now ? `<div class="index-now">${now}</div>` : ''}
      </div>

      <div class="chrons">
        ${camps.map(chronicle).join('')}
      </div>

      ${indexMore()}
    </div>`;
}

function chronicle(c) {
  const st = campaignState(c);
  const name = c.name || c.channel || 'unnamed';
  const where = [c.guildName, c.channel ? `#${c.channel}` : ''].filter(Boolean).join(' · ');

  const facts = [
    c.sessions ? `<span><b>${n(c.sessions)}</b> night${c.sessions === 1 ? '' : 's'}</span>` : '',
    c.hours ? `<span><b>${c.hours.toFixed(1)}</b> hours</span>` : '',
    c.lines ? `<span><b>${n(c.lines)}</b> lines</span>` : '',
    `<span><b>${n(c.members)}</b> player${c.members === 1 ? '' : 's'}</span>`,
  ].filter(Boolean).join('');

  return `
    <button type="button" class="chron" data-campaign="${c.id}">
      <div class="chron-top">
        ${tally(c)}
        ${st ? `<span class="chron-state ${st.key}">
                  ${st.dot ? `<span class="dot ${st.dot}"></span>` : ''}${esc(st.say)}
                </span>` : ''}
        <span class="chron-when">${esc(lastPlayed(c.lastSessionAt))}</span>
      </div>
      <div class="chron-name">${esc(name)}</div>
      <div class="chron-lines">
        ${where ? `<span class="chron-where">${esc(where)}</span>` : ''}
        ${facts}
      </div>
    </button>`;
}

// Starting one, and the ones that are not here any more. Under the ledger
// rather than in it: none of these is a campaign you can open.
function indexMore() {
  const bits = [];

  if (canCreate()) {
    bits.push(`<button type="button" class="camp newcamp" data-new-campaign>
      <div class="l1"><span class="nm">+ New campaign</span></div>
      <div class="meta">in a Discord you own</div>
    </button>`);
  }

  // Anything deleted and still inside its window. Shown here because this is
  // where you would come looking for a campaign that has gone missing.
  //
  // The operator restores; everybody else asks. Deleting is the creator's
  // decision and restoring is not, so the page offers the same ticket Discord
  // does rather than a shortcut around it.
  for (const gone of status?.restorable ?? []) {
    bits.push(`
      <div class="camp gone">
        <div class="l1"><span class="nm">${esc(gone.name)}</span></div>
        <div class="meta">deleted · ${gone.daysLeft} day${gone.daysLeft === 1 ? '' : 's'} left</div>
        ${cap('everything')
          ? `<button type="button" class="btn sm" style="margin-top:9px"
                     data-act="campaign/restore" data-campaign="${gone.id}">Restore</button>`
          : `<button type="button" class="btn sm" style="margin-top:9px"
                     data-ask-restore="${gone.id}" data-name="${esc(gone.name)}">Ask to restore</button>`}
      </div>`);
  }

  // What is waiting on a decision. Only the operator is ever sent this.
  for (const req of status?.restoreQueue ?? []) {
    bits.push(`
      <div class="camp asked">
        <div class="l1"><span class="nm">${esc(req.name)}</span></div>
        <div class="meta">
          ${esc(req.requesterName || req.requestedBy)} asked${req.isTheCreator ? ' — they deleted it' : ' — they played here'}
          <br>${req.sessions} session${req.sessions === 1 ? '' : 's'} · ${req.daysLeft} day${req.daysLeft === 1 ? '' : 's'} left
        </div>
        <div class="row-btns" style="margin-top:9px">
          <button type="button" class="btn sm" data-review="${req.id}">Read it</button>
        </div>
      </div>`);
  }

  return bits.length ? `<div class="index-more">${bits.join('')}</div>` : '';
}

// Who the bot thinks you are, and the way out. Shown even when sign-in is not

const glyph = {

function navMarks() {

// The quill is the way home from everywhere. On the campaigns page it is just

const homeMark = `
