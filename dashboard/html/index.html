// ==========================================================================
// The twenty-four voices
// ==========================================================================

// The twelve families, in the order the picker lays them out. The colours
// themselves are in the stylesheet, as .v-<family>-<shade>; this is the names
// and the order, which CSS cannot carry. Kept in step with
// pi-service/src/web/palette.js by test/palette.test.js, which reads both.
const VOICE_FAMILIES = [
  ['red', 'Red'], ['copper', 'Copper'], ['bronze', 'Bronze'], ['brass', 'Brass'],
  ['gold', 'Gold'], ['green', 'Green'], ['ocean', 'Ocean'], ['blue', 'Blue'],
  ['eldritch', 'Eldritch'], ['black', 'Black'], ['silver', 'Silver'], ['white', 'White'],
];

// A colour that came from somewhere else is not a colour.
//
// The server checks this on the way in and stores a slug, so nothing in the
// database should ever fail here. It is checked again on the way out because
// the value is about to become part of a class attribute, and "the server
// validated it" is a promise about today's server rather than about this
// line. Cheap, and it fails to plain ink rather than to broken markup.
const realVoice = (slug) => /^[a-z]+-(deep|bright)$/.test(String(slug ?? ''));

// Whether other people's colours are drawn at all.
//
// A per-viewer preference, kept in this browser beside the theme, because it
// is a fact about reading rather than about the table: two people can be
// looking at the same transcript and want different answers and neither is
// wrong.
//
// Yours is always drawn. Turning colours off is about the other five names —
// finding your own line in four hours of talk is the reason somebody picked a
// colour in the first place, and switching that off is not what the button is
// for.
const VOICES_OFF = 'quill-voices-off';
function voicesShown() {
  try { return localStorage.getItem(VOICES_OFF) !== '1'; } catch (e) { return true; }
}
function showVoices(on) {
  try {
    if (on) localStorage.removeItem(VOICES_OFF); else localStorage.setItem(VOICES_OFF, '1');
  } catch (e) { /* a browser with storage turned off keeps them on */ }
}

// The classes that write something in somebody's colour, or nothing at all.
// Both classes or neither, deliberately: `voiced` on its own would ask for a
// property that is not set anywhere.
function voiceClass(userId, colour) {
  if (!colour || !realVoice(colour)) return '';
  const mine = Boolean(me?.signedIn && userId && String(userId) === String(me.userId));
  if (!voicesShown() && !mine) return '';
  return ` voiced v-${colour}`;
}

// ==========================================================================
// The transcript reader
// ==========================================================================

function transcriptScreen() {
  if (!script) return '<div class="pane-main"><div class="quiet">Opening the transcript…</div></div>';

  const term = view.search.trim().toLowerCase();
  const lines = script.lines.filter((l) =>
    (!view.speaker || l.userId === view.speaker) && (!term || l.text.toLowerCase().includes(term)));

  // Every line needs to know two things about whoever said it — whether they
  // own the campaign, and what colour they are written in. Built once here
  // rather than scanned per line: a four-hour session is thousands of lines
  // against a handful of speakers, and this used to be a find() inside the
  // map.
  const voices = new Map(script.speakers.map((sp) => [sp.userId, sp]));

  return `
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;min-height:0">
        <div class="tr-bar">
          <input class="in" id="tsearch" style="flex:0 0 300px" placeholder="Search ${n(script.total)} lines"
                 value="${esc(view.search)}" aria-label="Search the transcript">
          <div class="row-btns" style="gap:7px">
            <button class="chip ${view.speaker ? '' : 'on'}" data-key="chip-all" data-speaker="">everyone</button>
            ${script.speakers.map((sp) => `
              <button class="chip${view.speaker === sp.userId ? ' on' : ''}${voiceClass(sp.userId, sp.colour)}"
                      data-key="chip-${esc(sp.userId)}" data-speaker="${esc(sp.userId)}">${esc(sp.name)}</button>`).join('')}
          </div>
          <span class="mono" style="margin-left:auto;font-size:11.5px;color:var(--dim)">
            ${lines.length === script.lines.length ? n(script.total) : `${n(lines.length)} of ${n(script.total)}`} lines
          </span>
        </div>
        <div class="lines">
          ${lines.length ? lines.map((l) => `
            <div class="line" data-key="line-${l.ms}-${l.userId}">
              <span class="t">${esc(clock(l.ms))}</span>
              <span class="who ${voices.get(l.userId)?.manager ? 'owner' : ''}${voiceClass(l.userId, voices.get(l.userId)?.colour)}">${esc(l.speaker)}</span>
              <span class="said">${highlight(l.text, term)}</span>
            </div>`).join('')
            : `<div class="quiet" style="padding:40px 0">Nothing matches “${esc(view.search)}”.</div>`}
          ${script.truncated ? '<div class="quiet" style="padding:20px 0">This transcript is longer than the reader shows — download the .txt for all of it.</div>' : ''}
        </div>
      </div>

      <aside class="facts" style="flex:0 0 320px;padding:26px">
        <div>
          <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:14px">
            <div class="cap">Who spoke</div>
            ${otherVoices() ? `
              <button type="button" class="chip ${voicesShown() ? 'on' : ''}" data-voices style="margin-left:auto"
                      title="${voicesShown() ? 'Stop drawing the rest of the table in their own colours, on this browser' : 'Draw the rest of the table in their own colours again'}">colours</button>` : ''}
          </div>
          <div style="display:flex;flex-direction:column;gap:11px">
            ${script.speakers.map((sp) => {
              const ink = voiceClass(sp.userId, sp.colour);
              const mine = Boolean(me?.signedIn && sp.userId && String(sp.userId) === String(me.userId));
              return `
              <div class="${ink.trim()}" style="display:flex;align-items:center;gap:11px">
                ${mine
                  ? `<button type="button" class="voice-pick${ink ? ' voiced' : ''}" data-voice-for="${esc(sp.userId)}"
                             title="Pick the colour your name is written in here">${esc(sp.name)}</button>`
                  : `<span class="${ink ? 'voiced' : ''}" style="font-size:13.5px;width:104px;${!ink && sp.manager ? 'color:var(--brass)' : ''}">${esc(sp.name)}</span>`}
                <i style="flex:1;height:5px;border-radius:3px;background:var(--line);display:block;overflow:hidden">
                  <b style="display:block;height:100%;width:${sp.share}%;background:var(--voice, ${sp.manager ? 'var(--brass)' : 'var(--edge)'})"></b>
                </i>
                <span class="mono" style="font-size:11px;color:var(--dim);width:34px;text-align:right">${sp.share}%</span>
              </div>`;
            }).join('')}
          </div>
        </div>
        ${script.corrections.length ? `
          <div class="keep">
            <div class="cap">Corrections in force</div>
            <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
              ${script.corrections.map((c) => `
                <div style="font-size:13.5px;color:var(--text-2)">“${esc(c.wrong)}” → <b style="color:var(--text)">${esc(c.right)}</b></div>`).join('')}
            </div>
            <div class="quiet" style="margin-top:12px">
              These were applied as the transcript was written, so what you are reading is already corrected.
            </div>
          </div>` : ''}
        <div>
          <div class="cap" style="margin-bottom:12px">This session</div>
          <div class="mono" style="font-size:12.5px;color:var(--text-2);line-height:2">
            ${esc(longDate(script.startedAt))}<br>
            ${esc(n(script.total))} lines · ${plural(script.speakers.length, 'voice')}<br>
            ${esc(script.channel ? `#${script.channel}` : '')}
          </div>
        </div>
        <div class="quiet" style="margin-top:auto">
          ${script.hasNotes
            ? 'The notes for this session are written — close this to read them.'
            : 'No notes exist for this session yet.'}
        </div>
      </aside>`;
}

// Whether anybody OTHER THAN THE READER has picked a colour here.
//
// The switch turns off other people, so on a table where the reader is the
// only one who has chosen it would be a button that visibly does nothing —
// worse than absent, because it looks broken rather than unnecessary.
function otherVoices() {
  return (script?.speakers ?? []).some(
    (sp) => sp.colour && !(me?.signedIn && String(sp.userId) === String(me.userId))
  );
}

function highlight(text, term) {
  if (!term) return esc(text);
  const at = text.toLowerCase().indexOf(term);
  if (at < 0) return esc(text);
  return `${esc(text.slice(0, at))}<mark>${esc(text.slice(at, at + term.length))}</mark>${esc(text.slice(at + term.length))}`;
}

// What the models have cost, and which one does which job.
//
// Dev only, because it is the API bill. The framing is deliberate and matches
// what the server sends: these are tokens THIS BOT counted as it spent them.
// Anthropic reports a remaining balance in a header and Google reports none at
// all, so a page that drew a "quota remaining" gauge would be inventing the
// most important number on it.
function modelsScreen() {
  const m = status?.models;
  if (!m) {
    return `<div class="pane-main pane-wide">
      <h1 class="display sm">Nothing measured yet.</h1>
      <div class="say-2">This bot has not recorded any model calls. They appear here as soon as something is
      summarised or somebody asks a question.</div>
    </div>`;
  }

  const bar = (fraction) => `
    <div class="bar" style="height:8px"><i style="width:${Math.round((fraction ?? 0) * 100)}%"></i></div>`;

  const peak = Math.max(1, ...m.byDay.map((d) => d.tokens ?? 0));

  return `
    <div class="pane-main pane-wide">
      <div class="kicker">The API bill</div>

          <code>MODEL_DAILY_TOKEN_BUDGET</code> to whatever your plan allows and this becomes a gauge.
        </div>`}

      <div style="display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap;margin-top:40px">
        <div style="flex:1;min-width:340px">
          <div class="cap">Which model does what</div>
          ${['summary', 'ask'].map((role) => `
            <div class="set-row" style="align-items:flex-start">
              <div>
                <div class="what">${role === 'summary' ? 'Writing up a session' : 'Answering a question'}</div>
                <div class="sub">${role === 'summary'
                  ? 'The thing the bot exists to do well. Worth the best model available.'
                  : 'A lookup over recaps already written. The flash models think even when the question needs none — measured at 109 tokens against 8 for the same prompt.'}</div>
                ${m.roles[role].ladder.length > 1 ? `<div class="mono" style="font-size:11px;color:var(--dim);margin-top:7px">
                  falls back to ${m.roles[role].ladder.slice(1).map(esc).join(' → ')} when quota runs out
                </div>` : ''}
              </div>
              <form class="row-btns" data-act="model/choose" data-role="${role}">
                <input class="in mono" name="model" style="width:200px;font-size:13px"

          <datalist id="model-choices">
            ${m.choices.map((c) => `<option value="${esc(c)}"></option>`).join('')}
          </datalist>
          <div class="quiet" style="margin-top:14px;max-width:68ch">
            Typed rather than picked from a list, because a bot cannot know what a provider offers without
            asking, and the answer changes underneath you. A name that does not exist fails loudly on the
            next call and can be corrected here. Clear the box to go back to <code>pi-service/.env</code>.
          </div>
        </div>

        <div class="aside">

            <div style="display:flex;align-items:flex-end;gap:3px;height:64px;margin-top:14px">
              ${m.byDay.length ? m.byDay.map((d) => `

                   opacity:.75;border-radius:1px;height:${Math.max(2, Math.round(((d.tokens ?? 0) / peak) * 100))}%"></i>
              `).join('') : '<span class="quiet">nothing yet</span>'}

                ? `Each person may ask ${plural(m.askLimit, 'question')} a day. It is the only place somebody
                   who is not you can spend your API budget.`

      <div class="cap" style="margin:44px 0 0">By model, last seven days</div>
      <div class="grid" style="margin-top:14px;max-width:900px">

          <div>Model</div><div>Role</div><div class="r">Calls</div><div class="r">Tokens</div><div class="r">Refused</div>
        </div>
        ${m.byModel.length ? m.byModel.map((row) => `
          <div class="tr" style="grid-template-columns:1.6fr 90px 90px 1fr 110px">

            <div class="r mono">${n(row.calls)}</div>
            <div class="r mono">${n(row.total_tokens)}</div>
            <div class="r mono ${row.limited ? 'waiting' : ''}">${row.limited ? n(row.limited) : '—'}</div>

      </div>
    </div>`;
}

// Whether the newest snapshot has ever been opened.
//
// "Never checked" renders as its own state rather than as either good or bad,
// because it is neither — and a green tick on a backup nobody has opened is
// exactly the reassurance that gets somebody into trouble.
function backupCard() {
  const b = status?.backup;

  if (!b) {
    return `<div class="card">
      <div class="cap">Backup</div>
      <div class="quiet" style="margin-top:10px">
        Not checked yet. The snapshot is verified right after it is taken, so this fills in the next time one runs.
      </div>
    </div>`;
  }

  const lines = b.counts
    ? Object.entries(b.counts).map(([table, c]) =>
        `<div style="display:flex;justify-content:space-between;font-size:12.5px">
           <span class="muted">${esc(table)}</span><span class="mono">${n(c.backed)}</span>
         </div>`).join('')
    : '';

  return `
    <div class="card" ${b.ok ? '' : 'style="border-color:var(--red-br)"'}>
      <div class="cap" style="${b.ok ? '' : 'color:var(--red-lit)'}">Backup</div>
      <h4 style="${b.ok ? '' : 'color:var(--red-lit)'}">
        ${b.ok ? 'Opens and reads correctly' : 'Not restorable'}
      </h4>
      <div class="quiet" style="margin-top:8px">
        ${b.ok
          ? `Verified ${b.ageHours != null ? `${b.ageHours < 1 ? 'less than an hour' : `${Math.round(b.ageHours)}h`} after it was taken` : ''}
             — opened as a database, integrity checked, row counts compared to live.`
          : esc(b.reason ?? 'The newest snapshot could not be opened.')}
      </div>
      ${lines ? `<div style="margin-top:12px;display:flex;flex-direction:column;gap:4px">${lines}</div>` : ''}
      <div class="quiet" style="margin-top:12px;font-size:12px">
        This proves the file is a database, not that a Pi will boot from it. Only restoring one does that.
      </div>
    </div>`;
}

// Rendered only when it opens or closes, never on a poll.
//
// It is the one part of the page you type a URL into, and a five-second
// repaint that replaced the dialog would throw away whatever was half-typed.
// Everything the dialog says about the world it says once, when it opens.
// Starting a campaign. Two fields, because that is the whole act: what it is
// called, and which Discord it belongs to. Everything else a campaign has —
// roster, corrections, where the notes go — is set afterwards, from inside it.

          ${

            //
            // Only when a limit applies: 0 is unlimited, which is what the

// Deleting a campaign.
//
// The name has to be typed. Not a yes/no box — the whole purpose is to make the
// hand slow down and read which campaign this actually is, and a button you can
// hit twice in a temper is not a confirmation. The bot checks the typed name
// again on arrival, so this is a courtesy to whoever is looking at the screen
// rather than the thing standing between a campaign and its deletion.
function deleteDialog() {
  const name = detail?.name || detail?.label || '';
  return `
    <div class="backdrop" data-backdrop>
      <div class="dialog" role="dialog" aria-modal="true" aria-label="Delete campaign">
        <div class="kicker" style="color:var(--red-lit)">${esc(name)}</div>
        <h1>Delete this campaign?</h1>
        <div class="say-2" style="font-size:14.5px;margin-top:12px">
          It leaves every list straight away. <b>Nothing is erased</b> — every session, every line and
          every correction stays exactly where it is, and you have ${RESTORE_DAYS} days to bring it back

        </div>

        <form data-act="campaign/delete" data-campaign="${detail?.id ?? ''}">
          <div class="field">
            <label for="del-name">Type <b>${esc(name)}</b> to confirm</label>

          <div class="foot">

function voiceDialog() {
  // Reachable from two screens with two different shapes of list behind them:
  // the campaign table, which knows the whole roster, and the transcript
  // legend, which knows only who spoke in that session. Either answers the two
  // questions this needs — who is being coloured, and what is already taken.
  const from = detail?.roster?.length ? detail.roster : (script?.speakers ?? []);
  const p = from.find((r) => String(r.userId) === String(view.picking));
  const label = p?.characterName || p?.name || (p ? whoIs(p) : 'this voice');

  const taken = new Map();
  for (const r of from) {
    if (r.colour && String(r.userId) !== String(view.picking)) {
      taken.set(r.colour, r.characterName || r.name || whoIs(r));
    }
  }

  return `
    <div class="backdrop" data-backdrop>
      <div class="dialog" role="dialog" aria-modal="true" aria-label="Pick a colour">
        <div class="kicker">${esc(label)}</div>
        <h1>How this name is written</h1>
        <div class="say-2" style="font-size:14.5px;margin-top:12px;max-width:58ch">
          In transcripts, and nowhere else. It changes nothing about what is recorded,
          what the notes say, or what anybody is called — only how quickly you can find
          one voice in four hours of talking.
        </div>

        <div class="voices">
          ${VOICE_FAMILIES.map(([family, name]) => {
            const holders = ['deep', 'bright'].map((s) => taken.get(`${family}-${s}`)).filter(Boolean);
            return `
            <div class="voice-row">
              <span class="fam">${esc(name)}</span>
              ${holders.length ? `<span class="taken">${esc(holders.join(', '))}</span>` : ''}
              ${['deep', 'bright'].map((shade) => {
                const slug = `${family}-${shade}`;
                const owner = taken.get(slug);
                return `<button type="button" class="voice-dot pick big v-${slug}${p?.colour === slug ? ' on' : ''}${owner ? ' taken' : ''}"
                          data-pick-voice="${slug}"
                          title="${esc(voiceName(slug))}${owner ? ` — already ${esc(owner)}` : ''}"><i class="swatch"></i></button>`;
              }).join('')}
            </div>`;
          }).join('')}
        </div>

        <div class="foot">
          <button class="btn big" type="button" data-pick-voice="">No colour</button>
          <button class="btn big" type="button" data-close-modal>Cancel</button>
        </div>
      </div>
    </div>`;
}

// Asking for a campaign back.
//
// The same three questions the Discord modal asks, in the same order and for
// the same reason: they are meant to be read together. "Why was it deleted in
// the first place" and "are you taking ownership" are what separate a delete
// somebody regrets from a table that ended on purpose and should stay ended.
const RESTORE_QUESTIONS = [
  ['reason', 'What is the reason for requesting the restore?'],
  ['whyDeleted', 'Why was the campaign deleted in the first place?'],
  ['takingOwnership', 'Are you intending to take ownership of the campaign?'],
];

function askRestoreDialog() {
  const { id, name } = view.askingRestore ?? {};
  return `
    <div class="backdrop" data-backdrop>
      <div class="dialog" role="dialog" aria-modal="true" aria-label="Ask to restore">
        <div class="kicker">${esc(name ?? '')}</div>
        <h1>Ask for this back</h1>
        <div class="say-2" style="font-size:14.5px;margin-top:12px">
          Restoring is not automatic. What you write here goes to the bot owner, who decides these one at
          a time — you will hear back either way.
        </div>

        <form data-act="campaign/restore" data-campaign="${id ?? ''}">
          ${RESTORE_QUESTIONS.map(([field, question], n) => `
            <div class="field">
              <label for="ask-${field}">${question}</label>
              ${n === 2
                ? `<input class="in" id="ask-${field}" name="${field}" required autocomplete="off"
                          placeholder="yes / no, and why">`
                : `<textarea class="in" id="ask-${field}" name="${field}" required rows="3"></textarea>`}
            </div>`).join('')}
          <div class="foot">
            <button class="btn go big" type="submit" ${can() ? '' : 'disabled'}>Send it</button>
            <button class="btn big" type="button" data-close-modal>Cancel</button>
          </div>
        </form>
      </div>
    </div>`;
}

// Reading one, and deciding it.
function reviewDialog() {
  const req = (status?.restoreQueue ?? []).find((r) => r.id === view.reviewing);
  if (!req) return '';

  const answer = (question, text) => `
    <div class="field">
      <label>${question}</label>
      <div class="quiet" style="color:var(--text-2);white-space:pre-wrap">${esc(text || '(left blank)')}</div>
    </div>`;

  return `
    <div class="backdrop" data-backdrop>
      <div class="dialog" role="dialog" aria-modal="true" aria-label="Restore request">
        <div class="kicker">${esc(req.name)}</div>
        <h1>${esc(req.requesterName || req.requestedBy)} wants this back</h1>
        <div class="say-2" style="font-size:14.5px;margin-top:12px">
          ${req.isTheCreator ? 'They are the person who deleted it.' : 'They played at this table — they are not who deleted it.'}
          ${req.sessions} session${req.sessions === 1 ? '' : 's'}, ${req.daysLeft} day${req.daysLeft === 1 ? '' : 's'} left in the window.
        </div>

        ${answer(RESTORE_QUESTIONS[0][1], req.reason)}

}

let modalShowing = null;

function renderModal() {
  const wanted = view.deleting
    ? 'delete'
    : view.askingRestore ? `ask:${view.askingRestore.id}`
    : view.reviewing ? `review:${view.reviewing}`
    : view.creating ? 'create'
    : view.importing && detail ? `import:${detail.id}`
    : view.picking ? `voice:${view.picking}`
    : null;
  if (wanted === modalShowing) return;
  modalShowing = wanted;

  if (!wanted) { morph($('modal'), ''); return; }

  if (view.deleting) {
    morph($('modal'), deleteDialog());
    $('del-name')?.focus();
    return;
  }

  if (view.askingRestore) {
    morph($('modal'), askRestoreDialog());
    $('ask-reason')?.focus();
    return;
  }

  if (view.reviewing) {
    morph($('modal'), reviewDialog());
    return;
  }

  if (view.picking) {
    morph($('modal'), voiceDialog());
    return;
  }

  if (view.creating) {
    morph($('modal'), createDialog());
    $('new-name')?.focus();
    return;
  }

  if (!detail) { morph($('modal'), ''); return; }
  const busy = (status?.recording ?? []).some((r) => r.guildId === detail.guildId);

  morph($('modal'), `
    <div class="backdrop" data-backdrop>
      <div class="dialog" role="dialog" aria-modal="true" aria-label="Import a recording">
        <div class="kicker">${esc(detail.label || detail.name)}</div>
        <h1>Import a recording</h1>
        <div class="say-2" style="font-size:14.5px;margin-top:12px">
          For a game played at a real table, or anything recorded outside Discord. It runs through the same
          transcribe, summarise and post pipeline.
        </div>

        <form data-act="import" data-campaign="${detail.id}">
          <div class="field">
            <label for="imp-url">The audio</label>
            <input class="in mono" id="imp-url" name="url" type="url" required
                   placeholder="https://…/session-15.m4a">
            <div class="mono" style="font-size:11px;color:var(--dim);margin-top:9px">
              a direct link Quill can download · m4a · mp3 · wav
            </div>
          </div>
          <div class="field">
            <label for="imp-speaker">Speaker label</label>
            <input class="in" id="imp-speaker" name="speaker" placeholder="The Table">
          </div>
          <div class="warnbox">
            <b>Every line will be attributed to one label.</b> A single microphone has no per-speaker
            channels, so Quill cannot tell your players apart. The notes will read as one voice describing
            the session.
          </div>
          ${busy ? `<div class="warnbox" style="border-color:var(--red)">
            That server is recording right now. Stop it with <code>/campaign leave</code> before importing, or the
            two sessions will interleave.</div>` : ''}
          <div class="foot">
            <button class="btn go big" type="submit" ${busy || !can() ? 'disabled' : ''}>Start the import</button>
            <button class="btn big" type="button" data-close-modal>Cancel</button>
            <span class="mono" style="font-size:11.5px;color:var(--dim);margin-left:auto">
              ${status?.working?.transcribing?.length ? 'joins the queue behind what is transcribing' : 'next in the queue · nothing is transcribing'}
            </span>
          </div>
        </form>
      </div>
    </div>`);

  $('imp-url')?.focus();
}

// Land on a line in a ledger and say which one. The wash names what you
// arrived at and then goes: a highlight that stayed would still be there the
// next time the shelf was opened, answering a question nobody had asked.
//
// The list is one document, so this is the whole of what following a name
// does — no page is opened and nothing is left behind to go back to.
function reveal(id) {
  const target = document.getElementById(id);
  if (!target) return;
  const still = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  target.scrollIntoView?.({ block: 'start', behavior: still ? 'auto' : 'smooth' });
  target.classList?.remove('flash');
  void target.offsetWidth;
  target.classList?.add('flash');
}

// ==========================================================================
// Painting
// ==========================================================================

// Which page the column is currently showing, as far as the DOM is concerned.
// null when there is no column on screen.
let paintedPicking = null;

function settleColumn() {
  const slider = document.querySelector('.shelf-slider');
  if (!slider) { paintedPicking = null; return; }

  const want = Boolean(view.shelfPicking);
  if (paintedPicking === null || paintedPicking === want) {
    paintedPicking = want;   // first sight of it, or nothing moved
    return;
  }

  const face = (picking) => {
    slider.classList.toggle('picking', picking);
    slider.classList.toggle('picked', !picking);
  };

  // Synchronously, inside this same paint: a rAF here would be stranded by
  // the next render, which replaces these elements out from under it.
  face(paintedPicking);                                  // where it was
  slider.querySelectorAll('.shelf-page')
    .forEach((page) => getComputedStyle(page).transform); // make it believe that
  face(want);                                            // where it goes
  paintedPicking = want;
}

// How long the screen being painted still counts as arriving.
//
// A deadline rather than a one-shot flag, because opening a campaign paints
// twice — once on the click and again when its detail lands — and a flag spent
// on the first paint would have the second one strip the class off half way
// through the animation. Holding the class across both keeps it running: the
// element itself is never replaced, only its contents, so nothing restarts.
let entersUntil = 0;
const entering = () => { entersUntil = Date.now() + 340; };

// How much chrome sits above the split, in pixels, onto --above.
//
// The two sticky columns are a window tall minus whatever is over them. That
// is the top bar on most paints and the top bar plus the degraded banner on
// the rest, and the banner's height is not a number this file can know: it is
// two lines wide on a laptop and six on a phone. So it is measured off the
// laid-out page rather than assumed.
//
// Read before the write, and written only when it changes, so this cannot
// start a layout/paint loop with the very rule it is feeding.
function measureChrome() {
  const split = $('screen');
  if (!split) return;
  const above = Math.max(0, Math.round(split.getBoundingClientRect().top + window.scrollY));
  const root = document.documentElement;
  const next = `${above}px`;
  if (root.style.getPropertyValue('--above') !== next) root.style.setProperty('--above', next);
}

function paint() {
  renderTop();
  renderBanner();
  // After renderScreen, which is what sets body.gate-open — the sheet reads it.
  renderScreen();
  renderSheet();
  settleColumn();
  renderModal();
  // Last, because it measures what everything above has just drawn.
  measureChrome();

  // The card is anchored to a node inside a panel the patcher may have just
  // rebuilt. Reused nodes survive, so this almost never fires — but a name
  // that has genuinely gone leaves a card hanging over the page pointing at
  // nothing at all.
  if (peekFor && !document.contains(peekFor)) peekAway();

  // Which part of the write-up is on screen is a fact about the scroll
  // position, not about the state this page just drew from — so it is put
  // back after the draw rather than baked into it, the same way the
  // threshold puts its torch back. The index itself comes first: marking a
  // row is only meaningful once the rows are the right ones.
  syncParts();
  markPart();

  const rec = status?.recording?.length;
  const needs = (status?.campaigns ?? []).reduce((sum, c) => sum + (c.awaiting || 0), 0);
  document.title = rec ? '● Recording — Quill' : needs ? `(${needs}) Quill` : 'Quill';
}

// ==========================================================================
// Loading
// ==========================================================================

async function get(path) {
  const res = await fetch(`${API}${path}`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function loadCampaign(id, { keepScreen = false } = {}) {
  // Set before the fetch so the campaign opens on the click rather than
  // whenever the network gets back.
  view.campaignId = id;
  view.sheet = null;
  if (!keepScreen) {
    view.screen = 'campaign';
    entering();
  }
  // Opening a campaign lands on what it holds, not on one of the four. The
  // column offers Sessions, NPCs, Places and Items; picking one is the next
  // move, the same shape as picking the campaign was.
  view.shelf = 'sessions';
  view.shelfPicking = true;
  view.entry = null;
  compendium = null;
  view.meetingId = null;
  view.editing = null;
  view.fixing = false;
  // The channel list belongs to one server. Carried across it would offer the
  // last campaign's channels for this one.
  view.outputPicking = false;
  // And an heir chosen for one table is not an heir for the next.
  view.heir = null;
  notes = null;
  notesKey = null;
  script = null;
  // A search is scoped to one server; carrying its results to the next
  // campaign would offer to invite people who are not in that Discord.
  people.query = ''; people.results = null; people.error = '';

  paint();

  try {
    detail = await get(`/campaign?id=${id}`);
    // Which rulebook this table plays out of decides which spell names in its
    // write-ups become links. Not awaited: a recap reads perfectly well for the
    // moment before the list lands, and the next paint picks it up.
    loadRules(detail?.edition);
  } catch (err) {
    detail = null;
    toast(`Couldn't load that campaign — ${err.message}`, false);
  }
  // Land on something worth reading rather than an empty pane: whatever is
  // waiting on a decision, else the most recent session that has notes.
  const list = sessions();
  const pick = list.find((s) => s.state === 'recording')
    || list.find((s) => s.job?.status === 'awaiting_approval')
    || list.find((s) => s.hasNotes)
    || list[0];
  if (pick) await openSession(pick.meetingId, { quiet: true });
  else paint();

  // Those four rows carry counts, and the counts need the whole campaign read
  // back. It is the first thing on screen now, so the read starts here rather
  // than waiting to be asked for — un-awaited, so the page is not held up by
  // it and the numbers arrive when they arrive.
  buildCompendium();
}

async function openSession(meetingId, { quiet = false } = {}) {
  view.meetingId = meetingId;
  view.tab = 'notes';
  view.fixing = false;
  notes = null;
  notesKey = null;
  if (!quiet) paint();
  await syncNotes();
  paint();
}

// Fetch whatever the open session's reader needs, and only what it needs.
//
// Called after every action and every poll as well as on open, because the
// thing being watched is a session moving: approve a summary and a few seconds
// later it has notes, which nothing would have gone back for otherwise.
async function syncNotes() {
  const s = selected();
  if (!s) { notes = null; notesKey = null; return; }

  // Keyed on the session AND its live job, so a re-summarise is picked up:
  // the notes on disk do not change when you press the button, they change a
  // minute later when the job that button queued disappears again.
  const key = `${s.meetingId}:${s.job?.id ?? ''}:${s.job?.status ?? ''}`;

  try {
    if (s.hasNotes && notesKey !== key) {
      notes = await get(`/notes?meeting=${s.meetingId}`);
      notesKey = key;
    } else if (!s.hasNotes) {
      notes = null;
      notesKey = null;
    }

    // The approval screen shows the first few lines, so the decision is made
    // looking at the session rather than at its line count.
    const peeking = s.job?.status === 'awaiting_approval' && s.job.type === 'summarize' && s.lines;
    if (peeking && script?.meetingId !== s.meetingId) {
      script = await get(`/transcript?meeting=${s.meetingId}&format=json`);
    }
  } catch (err) {
    toast(`Couldn't open that session — ${err.message}`, false);
  }
}

async function openTranscript(meetingId) {
  view.screen = 'transcript';
  view.search = '';
  view.speaker = null;
  if (script?.meetingId !== Number(meetingId)) script = null;
  paint();
  try {
    script = await get(`/transcript?meeting=${meetingId}&format=json`);
  } catch (err) {
    toast(`Couldn't open that transcript — ${err.message}`, false);
    view.screen = 'campaign';
  }
  paint();
}

const countAwaiting = () =>
  (detail?.sessions ?? []).filter((s) => s.job?.status === 'awaiting_approval').length;

async function tick() {
  try {
    // Who the bot thinks is asking, before anything else — it decides both
    // what the rest of the payloads will contain and whether there is an app
    // to draw at all. A bot too old to answer it leaves `me` null, and cap()
    // then defaults to the behaviour that existed before levels did.
    me = await get('/me').catch(() => me);

    if (me?.loginRequired && !me.signedIn) {
      lastSeen = Date.now();
      document.body.classList.remove('stale');
      status = null;
      paint();
      return;
    }

    status = await get('/status');
    lastSeen = Date.now();
    document.body.classList.remove('stale');

    // Where the page opens is now settled by view.screen alone, which starts
    // on the desk. The old shortcut — one campaign, so go straight in, on the
    // grounds that an index of one is a door with nothing behind it — does not
    // survive the desk, which is not an index of campaigns. Even a one-table
    // operator has the bill, the servers and the gatehouse on it, and the one
    // table is still a single click away, by name, in its own square.

    // The open campaign's detail does not come from the poll, so refresh it
    // when the poll says something about it changed.
    const mine = status.campaigns?.find((c) => c.id === view.campaignId);
    if (mine && detail && (mine.sessions !== detail.sessions.length || mine.awaiting !== countAwaiting())) {
      detail = await get(`/campaign?id=${view.campaignId}`).catch(() => detail);
      // The session on screen may have just grown notes.
      if (view.screen === 'campaign') await syncNotes();
    }

    // Checked here rather than on the first /me, because what the threshold
    // asks depends on whether it can already see a table for this person.
    maybeWelcome();

    paint();
  } catch (err) {
    // The bot being unreachable is itself information. The page dims as well as
    // saying so: a dashboard confidently showing "not recording" while it has
    // no idea is worse than one that admits it lost contact.
    document.body.classList.add('stale');
    document.title = 'Quill — offline';
    toastOffline(err.message);
  }
}

let offlineShown = 0;
function toastOffline(message) {
  if (Date.now() - offlineShown < 30000) return;
  offlineShown = Date.now();
  toast(`Can't reach the bot at ${API} — ${message}. Showing what it last said, ${since(lastSeen)}.`, false);
}

// ==========================================================================
// Acting
// ==========================================================================

let toastTimer = null;
function toast(message, ok) {
  const el = $('toast');
  el.textContent = message;
  el.className = `toast show ${ok ? 'good' : 'bad'}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, ok ? 4500 : 9000);
}

async function send(action, body) {
  let sent = null;
  try {
    const res = await fetch(`${API}/actions/${action}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const payload = await res.json().catch(() => ({}));

    // Some refusals are a question rather than a no: the bot has counted what
    // the change would do and wants that seen first. If the answer is yes it
    // re-sends confirmed, and this call's job is done.
    if (payload?.needsConfirming && (await confirmBlastRadius(action, body, payload))) return;

    toast(payload.message || `HTTP ${res.status}`, res.ok && payload.ok !== false);
    sent = payload;
  } catch (err) {
    toast(`Couldn't reach the bot — ${err.message}`, false);
    return;
  }
  // Straight to a refresh rather than waiting for the next poll: the whole
  // point of pressing the button is to watch the thing move.
  status = await get('/status').catch(() => status);
  if (view.campaignId) detail = await get(`/campaign?id=${view.campaignId}`).catch(() => detail);
  if (view.meetingId) await syncNotes();
  paint();
  // Handed back so a caller can act on what was made — the id of a campaign
  // that did not exist a moment ago is not knowable any other way.
  return sent;
}

// The transcript needs the auth header, which a plain <a href> cannot carry —
// so it is fetched and handed to the browser as a blob rather than linked.
async function downloadTranscript(meetingId) {
  try {
    const res = await fetch(`${API}/transcript?meeting=${meetingId}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement('a');
    a.href = url;
    a.download = `session-${meetingId}-transcript.txt`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (err) {
    toast(`Couldn't fetch that transcript — ${err.message}`, false);
  }
}

async function copy(text, said) {
  try {
    await navigator.clipboard.writeText(text);
    toast(said, true);
  } catch {
    toast('The browser refused clipboard access — this needs https or localhost.', false);
  }
}

// The notes as markdown, in the shape the Obsidian export already writes, so
// pasting one into a vault matches the files Quill puts there itself — down to
// the wikilinks, which the exporter adds on its way out and this adds on the
// way to the clipboard.
//
// The heading keeps the vault's own name for the file rather than the "Session
// 4" this page reads by. A note sitting in a vault has to say which campaign it
// belongs to, which is the entire reason that reference carries one.
function notesAsMarkdown() {
  if (!notes?.written) return '';
  const section = (title, lines) =>
    lines?.length ? `\n## ${title}\n\n${lines.map((l) => `- ${wikiText(l)}`).join('\n')}\n` : '';
  return [
    `# ${notes.ref || sessionName(notes)}`,
    '',
    wikiText(notes.tldr),
    notes.scenes.map((s) => `\n## ${s.title}\n\n${wikiText(s.points.join(' '))}\n`).join(''),
    section('Party decisions', notes.partyDecisions),
    section('Still unresolved', notes.unresolvedThreads),
    section('NPCs introduced', notes.npcsIntroduced),
    section('Locations', notes.locationsVisited),
    section('Loot and rewards', notes.lootAndRewards),
    section('Follow-ups', notes.followUps),
    section('Worth remembering', notes.funnyMoments),
  ].join('\n');
}

// One listener for the whole page rather than one per render. Everything here
// is rebuilt from the poll every few seconds, so a handler attached to a button
// would be thrown away with it — and a click landing in the gap between two
// renders would do nothing at all.
document.addEventListener('click', async (event) => {
  const t = event.target;

  if (t.closest('[data-close-modal]') || t === $('modal')?.querySelector('[data-backdrop]')) {
    closeDialogs(); return paint();
  }
  // The threshold owns every click while it is up. Answered first because it
  // is the whole screen — nothing underneath it is reachable, and a press on
  // the sheet while the pen is moving means "I read faster than that".
  if (welcome.open) {
    const answer = t.closest('[data-thr-answer]');
    if (answer) return welcomeAnswer(answer.dataset.thrAnswer, answer);

    // Which Discord the new table belongs to, when there is more than one.
    const where = t.closest('[data-thr-where]');
    if (where) {
      welcome.guildId = where.dataset.thrWhere;
      return welcomeCreate(where);
    }

    // Agreeing to be recorded, or not. Its own attribute rather than another
    // data-thr-answer, so no future edit to the question ladder can route a
    // press meant for one of those into a consent row.
    const agreed = t.closest('[data-thr-agree]');
    if (agreed) return welcomeAgree(agreed.dataset.thrAgree, agreed);

    // Pressed by somebody who came to join and has nothing to join with.
    if (t.closest('[data-thr-nolink]')) {
      return welcomeGo(t.closest('[data-thr-nolink]'), () => { welcome.step = 'close'; });
    }

    if (t.closest('[data-thr-link]')) return welcomeLink();

    const ask = t.closest('[data-thr-ask]');
    if (ask) return welcomeAsk(ask.dataset.thrAsk);

    const done = t.closest('[data-thr-done]');
    if (done) return welcomeGo(done, () => { welcome.step = 'close'; });

    if (t.closest('[data-thr-skip]')) return closeWelcome();

    const door = t.closest('[data-thr-door]');
    if (door) {
      const where = door.dataset.thrDoor;
      const id = Number(door.dataset.thrCampaign);
      closeWelcome();
      if (where === 'open' && id) return loadCampaign(id);
      return;
    }

    if (welcome.writing && !welcome.burning && t.closest('.thr-sheet')) return welcomeFinish();
    return;
  }

  // One dialog at a time. Opening any has to close the others, or a page left
  // with two flags set shows the first one forever and every later click on
  // the second looks like a dead button.
  if (t.closest('[data-new-campaign]')) { closeDialogs(); view.creating = true; return paint(); }
  if (t.closest('[data-import]')) { closeDialogs(); view.importing = true; return paint(); }
  if (t.closest('[data-delete-campaign]')) { closeDialogs(); view.deleting = true; return paint(); }

  if (t.closest('[data-signin-cancel]')) { view.signingIn = false; return paint(); }
  if (t.closest('[data-ask-invite]')) return askForInvite();

  if (t.closest('[data-signin]')) {
    closeDialogs();
    view.signingIn = true;
    login.message = ''; login.failed = false;
    return paint();
  }

  const asking = t.closest('[data-ask-restore]');
  if (asking) {
    closeDialogs();
    view.askingRestore = { id: Number(asking.dataset.askRestore), name: asking.dataset.name ?? '' };
    return paint();
  }

  const reading = t.closest('[data-review]');
  if (reading) { closeDialogs(); view.reviewing = Number(reading.dataset.review); return paint(); }
  if (t.closest('[data-diagnose]')) { view.diagnosing = !view.diagnosing; return renderBanner(); }
  if (t.closest('[data-cancel-edit]')) { view.editing = null; return paint(); }

  const edit = t.closest('[data-edit]');
  if (edit) { view.editing = edit.dataset.edit; return paint(); }

  if (t.closest('[data-people-clear]')) {
    people.query = ''; people.results = null; people.error = '';
    return paint();
  }

  if (t.closest('[data-logout]')) {
    try {
      await post('/auth/logout', {});
    } catch { /* the cookie is dead either way once the row is gone */ }
    me = null; status = null; detail = null; notes = null; script = null;
    view.campaignId = null; view.meetingId = null;
    return tick();
  }
  if (t.closest('[data-copy-notes]')) {
    return copy(notesAsMarkdown(), 'Notes copied as markdown.');
  }
  if (t.closest('[data-copy-transcript]')) {
    return copy(script.lines.map((l) => `[${clock(l.ms)}] ${l.speaker}: ${l.text}`).join('\n'),
                `${n(script.total)} lines copied.`);
  }

  const theme = t.closest('[data-theme-set]');
  if (theme) return setTheme(theme.dataset.themeSet);

  // The sheets. Clicking the mark that opened one closes it again, and the
  // scrim behind catches everything else.
  const sheet = t.closest('[data-sheet]');
  if (sheet) {
    const want = sheet.dataset.sheet;
    closeDialogs();
    view.sheet = view.sheet === want ? null : want;
    return paint();
  }
  if (t.closest('[data-close-sheet]')) { view.sheet = null; return paint(); }

  if (t.closest('[data-rebuild-compendium]')) { compendium = null; return buildCompendium(); }

  // The header slides the chooser back in; a row in the chooser slides it out
  // again, on whatever was picked.
  if (t.closest('[data-shelf-back]')) {
    view.shelfPicking = true;
    const unread = !compendium || compendium.campaignId !== view.campaignId;
    paint();
    // The counts on those rows need the whole campaign read back, and that
    // read paints twice on its own. Starting it now would replace the column
    // mid-slide and the movement would be lost, so it waits for the slide to
    // land and the numbers arrive a beat later.
    if (unread) setTimeout(buildCompendium, 460);
    return;
  }

  const pick = t.closest('[data-shelf]');
  if (pick) {
    view.shelfPicking = false;
    if (pick.dataset.shelf !== view.shelf) {
      view.shelf = pick.dataset.shelf;
      view.entry = null;
      // A shelf opens at the top of its list. Nothing is picked out of it
      // until somebody picks something, and the list is what there is to read.
      view.tab = 'notes';
    }
    return paint();
  }

  // A name, picked out of the index or followed out of a write-up. A
  // wikilink in the prose is the same gesture as a row in the column, so it is
  // the same attribute — it just has to bring the column with it, because the
  // name it was following belongs to a shelf the reader may not be on.
  const entry = t.closest('[data-entry]');
  if (entry) {
    const [kind, key] = String(entry.dataset.entry ?? '').split(/:(.*)/);
    if (kind && kind !== view.shelf) view.shelf = kind;
    view.shelfPicking = false;
    view.entry = entry.dataset.entry;
    view.tab = 'notes';
    paint();
    // After the paint, because on a wikilink out of a write-up the row being
    // aimed at does not exist until the shelf it belongs to has been drawn.
    reveal(entryId(kind, key));
    return;
  }

  // A night in the ledger, jumped to from the column.
  const hop = t.closest('[data-jump]');
  if (hop) { reveal(hop.dataset.jump); return; }

  // Fixing a misheard name from the write-up that has it.
  if (t.closest('[data-fix-name]')) { view.fixing = !view.fixing; return paint(); }
  if (t.closest('[data-fix-cancel]')) { view.fixing = false; return paint(); }

  const nav = t.closest('[data-screen]');
  if (nav) {
    // Only a screen that actually changes gets the entrance. The quill is the
    // way home from everywhere including home, and replaying the animation on
    // a click that moved nothing reads as a glitch.
    if (view.screen !== nav.dataset.screen) entering();
    view.screen = nav.dataset.screen;
    view.sheet = null;
    paint();
    // Coming back to a session that is waiting for approval, its first few
    // lines have to be fetched again — the transcript reader borrowed the same
    // slot to hold the whole thing.
    if (view.screen === 'campaign') { await syncNotes(); paint(); }
    return;
  }

  const camp = t.closest('[data-campaign]:not([data-act]):not(form)');
  if (camp) return loadCampaign(Number(camp.dataset.campaign));

  const tab = t.closest('[data-tab]');
  if (tab) { view.tab = tab.dataset.tab; view.editing = null; return paint(); }

  const jump = t.closest('button.btn[data-session]');
  if (jump) {
    view.shelf = 'sessions';
    view.shelfPicking = false;
    view.entry = null;
    return openSession(Number(jump.dataset.session));
  }

  const sess = t.closest('.sess[data-session]');
  if (sess) return openSession(Number(sess.dataset.session));

  const script_ = t.closest('[data-transcript]');
  if (script_) return openTranscript(Number(script_.dataset.transcript));

  const speaker = t.closest('[data-speaker]');
  if (speaker) { view.speaker = speaker.dataset.speaker || null; return paint(); }

  // Back to a part of the write-up. Scrolled rather than jumped, and offset
  // by the sticky top bar so the heading does not land underneath it.
  const goPart = t.closest('[data-part-to]');
  if (goPart) {
    const part = document.getElementById(goPart.dataset.partTo);
    if (part) {
      const top = part.getBoundingClientRect().top + window.scrollY - 96;
      window.scrollTo({ top, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    }
    return;
  }

  // Whether the rest of the table is drawn in their own colours. This
  // browser’s answer, not the table’s and not the account’s — see
  // voicesShown().
  if (t.closest('[data-voices]')) { showVoices(!voicesShown()); return paint(); }

  const openVoice = t.closest('[data-voice-for]');
  if (openVoice) {
    closeDialogs();
    view.picking = openVoice.dataset.voiceFor;
    return paint();
  }

  // A colour chosen. The dialog shuts on the press rather than on the
  // answer: the choice is already made, and a picker that hangs around
  // spinning invites a second press on a second colour.
  const swatch = t.closest('[data-pick-voice]');
  if (swatch) {
    const chosen = swatch.dataset.pickVoice;
    const forWhom = view.picking;
    const where = detail?.id ?? script?.campaignId ?? null;
    view.picking = null;
    paint();
    if (!forWhom || !where) return;
    const said = await send('roster/colour', { campaignId: where, userId: forWhom, colour: chosen });

    // send() refreshes the status and the campaign, and deliberately not the
    // transcript: re-fetching four hours of lines to repaint one name would
    // be the most expensive way possible to change a class. The one field
    // that moved is written in by hand instead.
    if (said?.ok && script) {
      const sp = script.speakers.find((s) => String(s.userId) === String(forWhom));
      if (sp) { sp.colour = said.colour ?? null; paint(); }
    }
    return;
  }

  const dl = t.closest('button[data-download]');
  if (dl) return downloadTranscript(dl.dataset.download);

  // "A chosen channel" opens the list rather than sending anything. It is the
  // one destination that is two answers — that it is a channel, and which one —
  // and there is no honest way for the segment to give the second.
  const chanPick = t.closest('button[data-pick-channel]');
  if (chanPick) {
    if (chanPick.disabled) return;
    view.outputPicking = true;
    return paint();
  }

  // A button inside a form is the submit handler's business -- handling the
  // click here too would fire the action twice. Asking for .type instead was
  // the bug: a <button> with no type attribute reports "submit", so this
  // dropped every action click on the page.
  const btn = t.closest('button[data-act]');
  if (!btn || btn.disabled || btn.closest('form')) return;
  if (btn.dataset.confirm && !confirm(btn.dataset.confirm)) return;

  const d = btn.dataset;
  const body = {};
  if (d.job) body.jobId = Number(d.job);
  if (d.meeting) body.meetingId = Number(d.meeting);
  if (d.campaign) body.campaignId = Number(d.campaign);
  if (d.user) body.userId = d.user;
  if (d.wrong) body.wrong = d.wrong;
  if (d.provider) body.provider = d.provider;
  if (d.action) body.action = d.action;
  if (d.queue) body.queue = d.queue;
  if (d.mode) body.mode = d.mode;
  if (d.edition) body.edition = d.edition;
  if (d.paused) body.paused = d.paused === 'true';
  if (d.request) body.requestId = Number(d.request);
  if (d.approve) body.approve = d.approve === 'true';

  // Moving the destination anywhere else closes the channel list. Left open it
  // would sit under a switch that no longer says "channel", offering to change
  // something the person has just decided against.
  if (d.act === 'campaign/output' && d.mode !== 'channel') view.outputPicking = false;

  const was = btn.textContent;
  btn.disabled = true; btn.textContent = '…';
  const said = await send(d.act, body);

  // A decision made is a dialog finished. Left open it would keep offering
  // buttons for a request that is no longer waiting on anything.
  if (d.act === 'campaign/restore-review' && said?.ok) { view.reviewing = null; paint(); }

  // The campaign has a new manager, so the picker's own selection is now the
  // person it should be leaving out. Cleared rather than left armed, which
  // would offer to hand it straight back.
  if (d.act === 'campaign/manager' && said?.ok) { view.heir = null; paint(); }

  // A different rulebook is a different list of spells, so the one held in
  // memory is now the wrong one. send() has already refreshed the campaign,
  // which is where the new edition comes from.
  if (d.act === 'campaign/edition' && said?.ok) { await loadRules(said.edition); paint(); }
  btn.disabled = false; btn.textContent = was;
});

// Picking a channel out of the list.
//
// A change rather than a click, because the control is a list: the choice IS
// the event, and a dropdown with a Save button beside it invites somebody to
// pick a channel, walk away, and be sure they set it.
//
// Both facts go in one request. Choosing a channel is choosing to post to a
// channel, so making the mode a separate step would only create a state where
// the destination is 'channel' and the channel is nothing.
document.addEventListener('change', async (event) => {
  const sel = event.target.closest?.('select[data-set-channel]');
  if (!sel || sel.disabled || !sel.value) return;
  await send('campaign/output', { campaignId: detail?.id, mode: 'channel', channelId: sel.value });
});

// Choosing who a campaign would go to.
//
// Unlike the channel picker above, this one only ARMS the button beside it. The
// two acts are different sizes: pointing a recap at another channel is undone
// by pointing it back, and handing the campaign over gives somebody else the
// say over this table's records — including whether it is deleted.
document.addEventListener('change', (event) => {
  const sel = event.target.closest?.('select[data-heir]');
  if (!sel) return;
  view.heir = sel.value || null;
  paint();
});

// Forms wherever there is something to type: Enter-to-submit and required-field
// validation for free, and both matter for the things typed most often here.
// Signing out, which is the only request on this page that works without a
// credential — everything else is behind one. Signing IN is not here at all
// any more: it is a link the browser follows to Discord and a redirect back,
// so there is nothing for fetch to do.
async function post(path, body) {
  const res = await fetch(`${API}${path}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return { ok: res.ok, payload: await res.json().catch(() => ({})) };
}

// Searching for a person is the one form whose answer is not a toast: it
// returns a list to choose from, so it renders into the page rather than
// disappearing after a second and a half.
// The torch follows the pointer and the keyboard alike, so the line it is
// standing beside is always the line a press will take. Pointer events rather
// than :hover in CSS, because the flame is one element being moved rather than
// a state on each row — and because the same handler serves both.
document.addEventListener('pointerover', (event) => {
  if (!welcome.open || welcome.burning) return;
  const row = event.target.closest?.('.thr-choices .thr-choice:not([disabled])');
  if (!row) return;
  const rows = thrRows();
  const i = rows.indexOf(row);
  if (i >= 0 && i !== thrPicked) thrPick(i);
});

document.addEventListener('focusin', (event) => {
  if (!welcome.open || welcome.burning) return;
  const row = event.target.closest?.('.thr-choices .thr-choice:not([disabled])');
  if (!row) return;
  const i = thrRows().indexOf(row);
  if (i >= 0) thrPick(i);
});

document.addEventListener('keydown', (event) => {
  if (!welcome.open || welcome.burning) return;
  // Not while somebody is typing a campaign name into the field.
  if (event.target?.classList?.contains('thr-in')) return;
  const rows = thrRows();
  if (!rows.length) return;

  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    event.preventDefault();
    thrPick(thrPicked + (event.key === 'ArrowDown' ? 1 : -1), { focus: true });
  }
});

// The threshold's own two fields. Forms rather than buttons with a click
// handler, so Enter sends them — somebody typing the name of their campaign
// should not have to go looking for the control.
document.addEventListener('submit', (event) => {
  const named = event.target.closest('form[data-thr-name]');
  if (named) { event.preventDefault(); return welcomeNamed(named); }

  const finding = event.target.closest('form[data-thr-find]');
  if (finding) { event.preventDefault(); return welcomeFind(); }

  const joining = event.target.closest('form[data-thr-join]');
  if (joining) { event.preventDefault(); return welcomeJoined(); }

  const seating = event.target.closest('form[data-thr-seat]');
  if (seating) { event.preventDefault(); return welcomeSeat(seating); }
});

document.addEventListener('submit', async (event) => {
  const form = event.target.closest('form[data-people-search]');
  if (!form) return;
  event.preventDefault();

  people.query = $('people-q')?.value.trim() ?? '';
  people.error = '';
  if (people.query.length < 2) {
    people.error = 'Type at least two characters.';
    return paint();
  }

  people.busy = true;
  paint();
  try {
    const res = await fetch(`${API}/actions/roster/search`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ campaignId: detail.id, query: people.query }),
    });
    const payload = await res.json().catch(() => ({}));
    people.results = payload.people ?? [];
    people.error = payload.ok === false ? payload.message || `HTTP ${res.status}` : '';
    if (payload.ok === false) people.results = null;
  } catch (err) {
    people.results = null;
    people.error = `Couldn't reach the bot — ${err.message}`;
  }
  people.busy = false;
  paint();
});

document.addEventListener('submit', async (event) => {
  const form = event.target.closest('form[data-act]');
  if (!form) return;
  event.preventDefault();

  const body = Object.fromEntries(new FormData(form));
  if (form.dataset.campaign) body.campaignId = Number(form.dataset.campaign);
  if (form.dataset.user) body.userId = form.dataset.user;

  const submit = form.querySelector('button[type=submit]');
  if (submit) submit.disabled = true;
  if (form.dataset.act === 'import') view.importing = false;
  if (form.dataset.act === 'campaign/create') view.creating = false;
  if (form.dataset.act === 'campaign/restore') view.askingRestore = null;
  if (form.dataset.act === 'roster/character') view.editing = null;
  // The two boxes on the write-up close on submit rather than on the reply:
  // leaving them open behind a toast reads as though nothing was sent.
  if (form.dataset.act === 'corrections/add') view.fixing = false;
  const payload = await send(form.dataset.act, body);
  if (submit) submit.disabled = false;

  // The delete dialog stays open when the typed name did not match, because
  // closing it would throw the attempt away and say nothing about why.
  if (form.dataset.act === 'campaign/delete' && payload?.ok) {
    view.deleting = false;
    view.campaignId = null;
    detail = null;
    // The campaign just left the list, so land somewhere that still exists
    // rather than on a screen describing something the bot no longer returns.
    const next = status?.campaigns?.[0];
    if (next) await loadCampaign(next.id);
    else paint();
  }

  // Land in the campaign that was just made. Making one and then being put
  // back on the ledger to find it yourself would be a strange way to finish.
  if (form.dataset.act === 'campaign/create' && payload?.campaignId) {
    await loadCampaign(payload.campaignId);
  }
});

// A correction that would rewrite a large share of the campaign comes back
// refused rather than applied, with the count. Rewriting is not reversible —
// afterwards there is no telling which words were changed — so the number has
// to be seen before it happens, not reported after.
async function confirmBlastRadius(action, body, payload) {
  if (!payload?.needsConfirming) return false;
  const sure = confirm(
    `${payload.message}\n\n` +
    `Apply it anyway to all ${payload.wouldChange} of ${payload.total} lines? This cannot be undone.`
  );
  if (!sure) return false;
  await send(action, { ...body, force: true });
  return true;
}

// Searching re-renders in place rather than on submit — the list under it is
// the answer as you type. The box keeps the caret because morph() leaves the
// focused field alone; it used to be saved and put back by hand here.
document.addEventListener('input', (event) => {
  if (event.target.id !== 'tsearch') return;
  view.search = event.target.value;
  renderScreen();
});

document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return;
  if (view.importing || view.creating || view.deleting || view.askingRestore || view.reviewing || view.picking) {
    closeDialogs(); return paint();
  }
  if (view.sheet) { view.sheet = null; return paint(); }
  if (view.editing) { view.editing = null; return paint(); }
  if (view.screen === 'transcript') { view.screen = 'campaign'; return paint(); }
  if (view.screen !== 'campaigns' && status?.campaigns?.length) {
    view.screen = 'campaigns';
    entering();
    return paint();
  }
});

// The banner rewraps when the window changes width — two lines at 1400px,
// six at 390px — so the height the sticky columns are budgeted from has to be
// taken again. Nothing here re-renders; it only re-measures.
window.addEventListener('resize', measureChrome);

// The recording timers tick on their own second, so they keep counting between
// polls rather than jumping every five.
//
// Two of them now: the big one in the session pane, and the desk's, which is
// the only moving thing on the front door. Both read the same payload and both
// add the time since it arrived, so they always agree. morph() rewrites the
// text from the fresh figure on every poll and lands on the same second this
// does, which is why the two do not fight.
setInterval(() => {
  if (!lastSeen) return;
  const since = Date.now() - lastSeen;
  const running = status?.recording ?? [];

  const pane = $('timer');
  const mine = running.find((r) => r.meetingId === view.meetingId);
  if (pane && mine) pane.textContent = hhmmss(mine.recordingForMs + since);

  // Matched on the meeting, not the guild: two tables can be recording in one
  // Discord, and a guild match would count up whichever of them came first.
  const desk = $('desk-timer');
  const there = desk && running.find((r) => String(r.meetingId) === desk.dataset.meeting);
  if (desk && there) desk.textContent = hhmmss(there.recordingForMs + since);
}, 1000);

// Arriving at the card, from either side of it.
//
// #signin is the landing page's "Log in" link. The card is view state rather
// than a screen with a URL, so without this nothing outside the page could ask
// for it: a link could only drop somebody on the operator's dashboard and leave
// them to find the button themselves. That is a poor door for the person it
// matters most to — a player sent here to read a recap who has never seen this
// page before.
//
// #signin-error=... is the way back from Discord when it did not work. The
// callback is a redirect, so it has no response body to explain itself in; it
// says which of five things happened and the page turns that into a sentence.
//
// Fragments rather than queries so nginx needs no rewrite, and read once and
// then wiped so a refresh does not throw the card back up — or replay an error
// that has since been fixed. Still gated on `me` in renderScreen, so somebody
// who already holds a session lands on the dashboard and this does nothing.
const arrivedAt = location.hash ?? '';
if (arrivedAt === '#signin' || arrivedAt.startsWith('#signin-error=')) {
  view.signingIn = true;
  const trouble = arrivedAt.slice('#signin-error='.length);
  // The one outcome that is nobody's mistake gets a screen of its own; every
  // other one is a sentence under the button.
  if (trouble === 'notinvited') view.notInvited = true;
  else if (SIGNIN_TROUBLE[trouble]) {
    login.failed = true;
    login.message = SIGNIN_TROUBLE[trouble];
  }
  history.replaceState(null, '', location.pathname + location.search);
}

// #welcome opens the threshold for somebody who is not new. It is how the
// screen gets looked at at all — the honest way in happens once per account,
// and "sign in as a person who has never signed in" is not a thing the person
// building it can do twice. Wiped from the URL like the two above, so a
// refresh lands on the dashboard.
if (arrivedAt === '#welcome') {
  welcome.forced = true;
  history.replaceState(null, '', location.pathname + location.search);
}

// An invitation to one table: /app/?join=<token>, made by invite/link.
//
// A query rather than a fragment, unlike the three above, and for the opposite
// reason to theirs — see joinLink() in delivery/dashboard-link.js. Those are
// messages this page sends itself through a redirect it controls; this one is
// pasted into a chat window by a person, and half the clients that would render
// it strip a fragment or mangle it.
//
// Moved straight into sessionStorage and wiped from the address bar, which does
// two jobs at once: the token survives the round trip through Discord's sign-in
// for somebody who did not have a session, and it stops being in a URL that
// gets screenshotted, pasted back, or left in a shared browser's history.
const invitedWith = new URLSearchParams(location.search).get('join');
if (invitedWith) {
  try { sessionStorage.setItem(JOINING, invitedWith); } catch (e) { /* fine */ }
  history.replaceState(null, '', location.pathname);
}

tick();
setInterval(tick, 5000);
</script>
</body>
</html>
