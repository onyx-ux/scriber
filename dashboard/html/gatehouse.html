<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Gatehouse</title>

<!-- A key, drawn at the quill's line weight so the two marks are the same
     hand. Verdigris rather than brass: this is the door furniture, not the pen. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Ccircle cx='7.5' cy='8' r='4' stroke='%232C6A5F' stroke-width='1.4'/%3E%3Cpath d='M10.4 10.9 20 20.5M17 18.3l2-2M14.4 15.7l1.6-1.6' stroke='%232C6A5F' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E">

<!-- Three faces, one of them new.
     Newsreader and Spline Sans Mono carry over from the dashboard, because
     this is the same bot's back office and not a different product. Libre
     Caslon Display is only here: Caslon is the face English registers and
     warrants were set in for two centuries, which is exactly the job of the
     one line at the top of this page. It is used at that size and nowhere
     else. Every one has a system fallback -- this is served off a Pi and
     opened from machines with no internet. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Theme before paint, from the same key the dashboard writes.

     This page is a different room on purpose — its own stock, its own accent,
     its own face at the top — but it is not a different reader. Somebody who
     turned the dashboard dark and then clicked through to here was getting a
     full-bright page in the face, because the only dark this page had was
     behind prefers-color-scheme and their machine was set to light. The room
     changes; whether the lights are on does not. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('quill-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>

<style>
  /* -- The palette ------------------------------------------------------
     Ledger stock and iron-gall ink, and light by default -- which is the one
     place this page deliberately parts company with the dashboard.

     The dashboard is dark because it is a tool you open at the table with the
     lights down. This is not that: it is the page you open on purpose, in the
     middle of the day, to change who can get in. Making it a different room
     is the point, and the ground is how a room announces itself.

     Two accents, and they mean one thing each. Verdigris is admission -- the
     colour of the bronze on a door that has been there a while. Seal red is
     the exception: somebody held below their level, or the door standing open
     when it should not be. Nothing else here is coloured at all. */

  :root {
    color-scheme: light;

    --stock:   #D9D7CE;  /* the page */
    --card:    #E9E7DE;  /* the toolbar and the admit box */
    --sunk:    #CFCDC3;  /* inputs */
    --iron:    #1F211C;  /* the ink */
    --faint:   #57584F;  /* secondary ink */
    --rule:    #C2C0B4;  /* the ruling */
    --edge:    #B3B1A4;  /* borders that have a job */
    --hover:   #E2E0D7;  /* the wash under a hovered row */

    --bronze:    #276056;
    --bronze-bg: #CFDCD5;
    --seal:      #9A2E1D;
    --seal-bg:   #E7D2CB;

    --shadow: #1F211C1A;

    /* The select's own chevron, at this page's line weight. */
    --chev: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2012%2012%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M2.5%204.5%206%208l3.5-3.5%22%20stroke%3D%22%2357584F%22%20stroke-width%3D%221.3%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E");
  }

  /* The same room with the lights off. Written twice, because there are three
     states and not two: an explicit choice stamps data-theme on <html> and has
     to beat the machine in both directions, and the default — no attribute at
     all — is what the media query answers. Guarding the query on
     :not([data-theme="light"]) is what stops a dark machine overruling
     somebody who asked for light. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;

      --stock:   #14171A;
      --card:    #1B1F23;
      --sunk:    #101316;
      --iron:    #E4E2D9;
      --faint:   #90928A;
      --rule:    #2B3035;
      --edge:    #3A4046;
      --hover:   #1E2226;

      --bronze:    #6FBFAE;
      --bronze-bg: #16302C;
      --seal:      #DD7A66;
      --seal-bg:   #331A16;

      --shadow: #0006;
      --chev: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2012%2012%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M2.5%204.5%206%208l3.5-3.5%22%20stroke%3D%22%2390928A%22%20stroke-width%3D%221.3%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E");
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;

    --stock:   #14171A;
    --card:    #1B1F23;
    --sunk:    #101316;
    --iron:    #E4E2D9;
    --faint:   #90928A;
    --rule:    #2B3035;
    --edge:    #3A4046;
    --hover:   #1E2226;

    --bronze:    #6FBFAE;
    --bronze-bg: #16302C;
    --seal:      #DD7A66;
    --seal-bg:   #331A16;

    --shadow: #0006;
    --chev: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2012%2012%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M2.5%204.5%206%208l3.5-3.5%22%20stroke%3D%22%2390928A%22%20stroke-width%3D%221.3%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E");
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--stock);
    color: var(--iron);
    font: 400 15.5px/1.6 'Newsreader', Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    padding-bottom: 80px;
  }

  .mono {
    font-family: 'Spline Sans Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--bronze);
    outline-offset: 2px;
    border-radius: 3px;
  }

  /* -- The bar ---------------------------------------------------------- */

  .bar {
    display: flex; align-items: center; gap: 14px;
    padding: 0 22px; height: 52px;
    border-bottom: 1px solid var(--rule);
    background: var(--card);
  }
  .bar .back {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 12px; color: var(--faint); text-decoration: none;
    padding: 5px 9px 5px 6px; border-radius: 5px;
  }
  .bar .back:hover { color: var(--iron); background: var(--sunk); }
  .bar .here {
    margin-left: auto;
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 10.5px; letter-spacing: .17em; text-transform: uppercase;
    color: var(--faint);
  }

  /* -- The column ------------------------------------------------------- */

  .col { max-width: 1180px; margin: 0 auto; padding: 0 22px; }

  /* -- The door state, which is the headline ---------------------------- */

  .door { padding: 50px 0 26px; }

  .eyebrow {
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 11px; font-weight: 600; letter-spacing: .19em; text-transform: uppercase;
    color: var(--bronze);
    display: flex; align-items: center; gap: 10px;
  }
  .eyebrow.alarm { color: var(--seal); }
  .eyebrow::after { content: ''; flex: 1; height: 1px; background: currentColor; opacity: .3; }

  .door h1 {
    font-family: 'Libre Caslon Display', 'Big Caslon', 'Hoefler Text', Georgia, serif;
    font-weight: 400;
    font-size: clamp(31px, 5.6vw, 46px);
    line-height: 1.11;
    letter-spacing: -.012em;
    margin: 20px 0 0;
    text-wrap: balance;
  }

  .door p { margin-top: 17px; max-width: 58ch; color: var(--faint); font-size: 16px; }
  .door p em { font-style: italic; color: var(--iron); }

  /* The way in, for a visitor with no session.
     This page had no such thing until the htpasswd prompt came off it on
     2026-08-31 — the browser used to ask for a shared password before anything
     here ran, so "you are not signed in" was a state the page could never be
     in. It is the ordinary state now, and it gets a door rather than a
     refusal. Built from this page's own tokens rather than lifted from
     index.html: the two pages share three typefaces and no palette. */
  .gate-btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }

  .gate-btn {
    display: inline-flex; align-items: center; gap: 9px;
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 12.5px; font-weight: 500; letter-spacing: .01em;
    padding: 11px 17px; border-radius: 7px;
    border: 1px solid var(--edge); background: transparent; color: var(--iron);
    cursor: pointer; text-decoration: none; white-space: nowrap;
    transition: background .12s, border-color .12s, color .12s;
  }
  .gate-btn:hover { background: var(--sunk); }
  .gate-btn.discord { border-color: var(--bronze); color: var(--bronze); }
  .gate-btn.discord:hover { background: var(--bronze-bg); }
  .gate-btn:focus-visible { outline: 2px solid var(--bronze); outline-offset: 3px; }

  /* An install that cannot sign anybody in says so here rather than sending
     them to Discord to meet an error page that mentions none of this. */
  .gate-msg {
    margin-top: 22px; max-width: 58ch;
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 12px; line-height: 1.65;
    padding-left: 14px; border-left: 2px solid var(--edge); color: var(--faint);
  }
  .gate-msg.bad { border-left-color: var(--seal); color: var(--seal); }
  .door p code, .foot code {
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: .84em; color: var(--iron);
    background: var(--sunk); padding: 1px 5px; border-radius: 4px;
  }

  /* -- Servers that have gone -------------------------------------------
     A record, not an alarm, and the styling is the argument for that.
     Nothing here is red. The reflex for "a server was deleted" is the alarm
     colour and a warning mark, and it would be wrong twice over: nobody needs
     to do anything, and nothing was lost. --seal is this page's word for
     "this next click cannot be undone", and spending it here would make a
     quiet fact shout for the rest of the page's vocabulary.

     The weight is inverted instead. The server that went is --faint and ruled
     through; the tables stranded in it are --iron, full ink, unmarked. That is
     the whole state in one glance — the container is gone, the contents are
     not — and the strike is this product's own mark for it: the landing page
     rules through a misheard name on its way to the right one, meaning struck
     from the record rather than destroyed. Same mark, same meaning. */
  .gone { margin-top: 46px; }

  .gone-head {
    display: flex; align-items: baseline; gap: 12px;
    padding-bottom: 12px; border-bottom: 1px solid var(--edge);
  }
  .gone-head h2 {
    font-family: 'Libre Caslon Display', 'Big Caslon', 'Hoefler Text', Georgia, serif;
    font-weight: 400; font-size: 21px; letter-spacing: -.008em; margin: 0;
  }
  .gone-head .count {
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint);
  }
  .gone-note {
    margin: 14px 0 0; max-width: 62ch;
    color: var(--faint); font-size: 15px; line-height: 1.62;
  }

  /* One block per server, ruled off underneath the way a ledger closes an
     account. The last one carries no rule: there is nothing after it to
     separate from. */
  .gone-entry { padding: 22px 0 20px; border-bottom: 1px solid var(--edge); }
  .gone-entry:last-child { border-bottom: 0; padding-bottom: 4px; }

  .gone-server {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  .gone-server .nm {
    font-family: 'Libre Caslon Display', 'Big Caslon', 'Hoefler Text', Georgia, serif;
    font-size: 20px; font-weight: 400; letter-spacing: -.006em;
    color: var(--faint);
    text-decoration: line-through;
    text-decoration-thickness: 1px;
    /* The rule sits on the name rather than through the middle of it, so the
       name stays readable — it is still the only way anybody identifies which
       server this was. */
    text-underline-offset: 0;
  }
  /* A server whose name was never written down before it went. Nothing can
     recover it: a bot cannot read a server it is not in. */
  .gone-server .nm.unnamed {
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 13px; text-decoration: none; letter-spacing: .02em;
  }
  .gone-server .when {
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 11px; letter-spacing: .07em; color: var(--faint);
    margin-left: auto; white-space: nowrap;
  }

  /* The tables still filed there. Indented under the server the way a
     sub-entry sits under its heading, and in full ink because they are the
     part that is still real. */
  .gone-tables { margin: 14px 0 0; padding-left: 18px; border-left: 2px solid var(--edge); }
  .gone-table { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .gone-table + .gone-table { margin-top: 9px; }
  .gone-table .nm { color: var(--iron); font-size: 16px; }
  .gone-table .meta {
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 11px; letter-spacing: .05em; color: var(--faint);
  }

  @media (max-width: 620px) {
    .gone-server .when { margin-left: 0; width: 100%; }
  }

  /* -- Who came and went --------------------------------------------------
     A terminal, not a table: this is the one place on the page that is a
     stream rather than a state, so it gets the log's own vocabulary -- a
     sunk panel, tabular-numeric mono, one line per event -- instead of a
     row of columns like everything above it. Nothing to click, nothing to
     decide; it exists to answer "did that admission just take" and "who was
     that a minute ago". See store/db.js auth_events for how far back it
     reaches -- it is a convenience, not an audit trail. */
  .signlog { margin-top: 46px; }

  .signlog-head {
    display: flex; align-items: baseline; gap: 12px;
    padding-bottom: 12px; border-bottom: 1px solid var(--edge);
  }
  .signlog-head h2 {
    font-family: 'Libre Caslon Display', 'Big Caslon', 'Hoefler Text', Georgia, serif;
    font-weight: 400; font-size: 21px; letter-spacing: -.008em; margin: 0;
  }
  .signlog-head .count {
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint);
  }

  .log {
    margin-top: 14px; max-height: 280px; overflow-y: auto;
    background: var(--sunk); border: 1px solid var(--edge); border-radius: 7px;
    padding: 4px 16px;
  }
  .log-row {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline;
    padding: 7px 0; border-top: 1px solid var(--rule);
    font-size: 12px; line-height: 1.5;
  }
  .log-row:first-child { border-top: 0; }
  .log-when { color: var(--faint); flex: 0 0 auto; }
  .log-verb { text-transform: uppercase; flex: 0 0 auto; color: var(--faint); font-weight: 600; }
  .log-row.in .log-verb { color: var(--bronze); }
  .log-who { color: var(--iron); }
  .log-id { color: var(--faint); }
  .log-note { color: var(--faint); }
  .log-note::before { content: '— '; }

  /* -- Finding somebody -------------------------------------------------
     A guest list is short until the day it is not. Search filters what is
     already on the page rather than asking the Pi again: the whole roster is a
     few dozen rows at the very most, and a round trip per keystroke to sort a
     list you can already see is work for nobody. */

  .tools {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 14px;
    background: var(--card); border: 1px solid var(--rule); border-radius: 9px;
  }

  .find { position: relative; flex: 1 1 260px; min-width: 0; display: flex; }
  .find svg { position: absolute; left: 11px; top: 50%; margin-top: -8px; color: var(--faint); }
  .find input {
    width: 100%;
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 13px; color: var(--iron);
    padding: 9px 12px 9px 33px; border-radius: 6px;
    border: 1px solid var(--edge); background: var(--sunk);
  }
  .find input::placeholder { color: var(--faint); opacity: .8; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 11px; letter-spacing: .04em;
    padding: 7px 11px; border-radius: 6px;
    border: 1px solid transparent; background: transparent; color: var(--faint);
    cursor: pointer; white-space: nowrap;
  }
  .chip:hover { background: var(--sunk); color: var(--iron); }
  .chip.on { border-color: var(--bronze); color: var(--bronze); background: var(--bronze-bg); }
  .chip .n { opacity: .65; margin-left: 5px; }

  /* -- The table --------------------------------------------------------
     Semi-tabled on purpose. Real columns, because five facts about twenty
     people is what a table is for -- but ruled rather than boxed, and the id
     under the name rather than in a column of its own, because it is the thing
     you check and never the thing you read. */

  .grid { --cols: minmax(0, 1.3fr) 168px 158px minmax(0, 1fr) 76px 148px; }

  .thead, .row {
    display: grid;
    grid-template-columns: var(--cols);
    align-items: center;
    gap: 16px;
  }

  .thead {
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: var(--faint);
    padding: 22px 2px 10px 20px;
    border-bottom: 1px solid var(--edge);
  }

  /* -- One person ------------------------------------------------------
     The standing rule down the left is the whole page in one mark. Solid
     verdigris means the door opens for them, a dashed hairline means it does
     not, and a bead at the top means they are signed in right now. Admission
     and nothing else -- being held below your level is a red select and a red
     caption, and giving the rule that job too would mean the one mark you can
     read at arm's length answered whichever question came second. */

  .row {
    position: relative;
    padding: 13px 2px 13px 20px;
    border-bottom: 1px solid var(--rule);
  }
  .row:hover { background: var(--hover); }

  .row::before {
    content: '';
    position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px;
    background: var(--bronze); border-radius: 2px;
    transform-origin: top center;
  }
  .row.out::before {
    width: 1.5px; left: .75px; background: none;
    background-image: repeating-linear-gradient(
      to bottom, var(--edge) 0 4px, transparent 4px 9px);
  }
  .row.live::after {
    content: '';
    position: absolute; left: -2.5px; top: 5px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--bronze);
    box-shadow: 0 0 0 3px var(--stock);
  }
  .row.live:hover::after { box-shadow: 0 0 0 3px var(--hover); }

  .cell { min-width: 0; }

  .who { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 16.5px; }
  .who.nameless { font-size: 13px; letter-spacing: .01em; }
  .id {
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 11px; color: var(--faint); overflow-wrap: anywhere;
  }

  .tag {
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 4px;
    background: var(--sunk); color: var(--faint);
  }
  .tag.you { background: var(--bronze-bg); color: var(--bronze); }

  .reaches { font-size: 14px; color: var(--faint); }
  .seen {
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 11.5px; color: var(--faint);
  }
  .seen b { font-weight: 500; color: var(--bronze); }

  /* -- The level control ------------------------------------------------
     A select and not a row of buttons, because the options are ordered, they
     are mutually exclusive, and there are five of them. The rungs somebody
     cannot be raised to are disabled AND labelled with what would actually
     raise them, so "why can't I promote them" is answered in the place the
     question gets asked rather than in a toast afterwards. */

  /* Drawn rather than left to the platform. Everything else on this page that
     can be pressed is a mono control with a hairline border and a 6px radius;
     a select carrying Windows' own chevron and Windows' own metrics was the
     one thing here wearing somebody else's clothes. appearance:none takes the
     platform's mark off, and --chev puts back one at this page's line weight
     in this page's ink. */
  .lvl {
    width: 100%;
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 12.5px; color: var(--iron);
    padding: 7px 30px 7px 9px; border-radius: 6px;
    border: 1px solid var(--edge); background: var(--sunk);
    cursor: pointer;
    appearance: none; -webkit-appearance: none;
    background-image: var(--chev);
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 11px;
  }
  .lvl:hover:not(:disabled) { border-color: var(--bronze); }
  .lvl:disabled { cursor: default; opacity: .6; background-image: none; }
  .lvl.held { border-color: var(--seal); color: var(--seal); background: var(--seal-bg); }
  .why {
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 10px; letter-spacing: .05em; color: var(--faint); margin-top: 4px;
  }
  .why.held { color: var(--seal); }

  /* -- The tier ---------------------------------------------------------
     Four buttons rather than a select, because unlike the level this one goes
     UP as well as down and every option is always available -- so there is
     nothing to disable, nothing to explain, and no reason to hide four choices
     behind a click. It reads as a scale, which is what it is. */

  .tier { display: flex; }
  .tier .t {
    flex: 1 1 0; min-width: 0;
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 11.5px; color: var(--faint);
    padding: 6px 0; border: 1px solid var(--edge); border-right-width: 0;
    background: var(--sunk); cursor: pointer;
  }
  /* The house tier is set apart from the paid band the way the numbering sets
     it apart -- 5 to 8 do not exist, and the control should not pretend the
     step from 4 to 9 is the same size as the one from 3 to 4. */
  .tier .t.house { margin-left: 5px; border-left-width: 1px; border-radius: 6px; }
  .tier .t:first-child { border-radius: 6px 0 0 6px; }
  .tier .t:last-child { border-right-width: 1px; border-radius: 0 6px 6px 0; }
  .tier .t:hover { color: var(--iron); background: var(--hover); }
  .tier .t.on {
    color: var(--bronze); background: var(--bronze-bg);
    border-color: var(--bronze); font-weight: 600;
  }
  /* The neighbour's left border would sit on top of the selected one's right. */
  .tier .t.on + .t { border-left-color: var(--bronze); }
  .tier[aria-disabled="true"] .t { cursor: default; opacity: .6; }
  .tier[aria-disabled="true"] .t:hover { color: var(--faint); background: var(--sunk); }
  .tier[aria-disabled="true"] .t.on:hover { color: var(--bronze); background: var(--bronze-bg); }

  .spent {
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 10px; letter-spacing: .05em; color: var(--faint); margin-top: 4px;
  }
  .spent.full { color: var(--seal); }

  /* -- Buttons ---------------------------------------------------------- */

  .doing { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  .btn {
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 11.5px; font-weight: 500;
    padding: 7px 12px; border-radius: 6px;
    border: 1px solid var(--edge); background: transparent; color: var(--iron);
    cursor: pointer; white-space: nowrap;
    transition: background .12s, border-color .12s, color .12s;
  }
  .btn:hover { background: var(--sunk); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:disabled:hover { background: transparent; }
  .btn.go { border-color: var(--bronze); color: var(--bronze); }
  .btn.go:hover { background: var(--bronze-bg); }

  /* Armed is the second half of a two-step. No modal: the button says what
     the next click does, which is the shortest honest way to ask. */
  .btn.armed { border-color: var(--seal); color: var(--seal); background: var(--seal-bg); }

  /* -- Admitting somebody the bot has never seen ------------------------ */

  .admit {
    display: flex; gap: 9px; flex-wrap: wrap; align-items: center;
    margin-top: 20px; padding: 15px 17px;
    background: var(--card); border: 1px solid var(--rule); border-radius: 9px;
  }
  .admit label {
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--faint); width: 100%;
  }
  .admit input {
    flex: 1 1 240px; min-width: 0;
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 13.5px; color: var(--iron);
    padding: 9px 12px; border-radius: 6px;
    border: 1px solid var(--edge); background: var(--sunk);
  }
  .admit input::placeholder { color: var(--faint); opacity: .75; }
  .admit .hint { width: 100%; font-size: 13.5px; color: var(--faint); margin-top: -2px; }

  /* -- The footing ------------------------------------------------------ */

  .foot {
    margin-top: 42px; padding-top: 22px;
    border-top: 1px solid var(--rule);
    font-size: 14px; color: var(--faint); max-width: 82ch;
  }
  .foot p + p { margin-top: 11px; }
  .foot b { font-weight: 400; color: var(--iron); }

  /* Six paragraphs of how-it-works, folded away.
     They are worth having and they are not worth 800px under the table every
     time somebody opens this page to admit one person. Reference reads best
     when it is one click from the thing it explains rather than printed
     underneath it. */
  .foot-more > summary {
    font-family: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
    font-size: 11.5px; letter-spacing: .06em;
    color: var(--faint); cursor: pointer; list-style: none;
    display: inline-flex; align-items: center; gap: 9px;
    padding: 4px 0;
  }
  .foot-more > summary::-webkit-details-marker { display: none; }
  .foot-more > summary::before {
    content: '+'; font-size: 13px; line-height: 1;
    width: 15px; height: 15px; border: 1px solid var(--edge); border-radius: 4px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .foot-more[open] > summary::before { content: '−'; }
  .foot-more > summary:hover { color: var(--iron); }
  .foot-more > summary:hover::before { border-color: var(--bronze); color: var(--bronze); }
  .foot-more[open] > summary { margin-bottom: 14px; }

  .empty { padding: 30px 2px; color: var(--faint); font-size: 15px; }

  /* -- Saying something happened ---------------------------------------- */

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 14px);
    max-width: min(620px, calc(100vw - 36px));
    padding: 12px 17px; border-radius: 8px;
    background: var(--card); color: var(--iron);
    border: 1px solid var(--edge); border-left-width: 3px;
    box-shadow: 0 10px 30px var(--shadow);
    font-size: 14.5px;
    opacity: 0; pointer-events: none;
    transition: opacity .16s, transform .16s;
    z-index: 40;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.good { border-left-color: var(--bronze); }
  .toast.bad  { border-left-color: var(--seal); }

  /* -- The one animation ------------------------------------------------
     The standing rules draw down as the list arrives, in the order the list
     is in. It is the signature introducing itself, and it happens once. */

  @media (prefers-reduced-motion: no-preference) {
    .row::before { animation: rule .3s cubic-bezier(.2,.7,.3,1) backwards; }
    .row.live::after { animation: bead .2s ease-out backwards; }
  }
  @keyframes rule { from { transform: scaleY(0); } }
  @keyframes bead { from { opacity: 0; transform: scale(.3); } }

  /* -- Narrower ---------------------------------------------------------
     Reaches goes first: it is the only column that is a nicety rather than
     something you act on, and it is the widest. */

  @media (max-width: 1060px) {
    .grid { --cols: minmax(0, 1.2fr) 164px 152px 74px 144px; }
    .thead .h-reaches, .row .c-reaches { display: none; }
  }

  @media (max-width: 680px) {
    .col { padding: 0 16px; }
    .door { padding: 36px 0 22px; }
    .thead { display: none; }
    .row { display: block; padding: 15px 2px 15px 20px; }
    .row .cell + .cell { margin-top: 10px; }
    .row .c-reaches { display: block; }
    .lvl { max-width: 280px; }
    /* The header is gone at this width, so the two value-only cells say what
       they are. "3 d" on a line of its own is a number, not a fact. */
    .row .c-reaches::before, .row .seen::before {
      color: var(--faint); opacity: .8;
    }
    .row .c-reaches::before { content: 'sees '; }
    .row .seen::before { content: 'last in '; }
    .doing { justify-content: flex-start; }
    .admit input { flex-basis: 100%; }
  }

  /* People at the door. The one block on this page that is somebody waiting on
     you, so it gets the verdigris the admission accent already means, and sits
     above the hero rather than in the table. */
  .asks {
    border: 1px solid var(--bronze); border-radius: 8px;
    padding: 16px 18px 14px; margin: 0 0 26px;
    background: color-mix(in srgb, var(--bronze) 5%, var(--card));
  }
  .asks-head {
    display: flex; align-items: center; gap: 9px;
    font-family: var(--mono); font-size: 12px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--bronze); margin-bottom: 12px;
  }
  .asks-mark {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--bronze); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bronze) 18%, transparent);
  }
  .ask-row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto auto;
    gap: 14px; align-items: center;
    padding: 9px 0; border-top: 1px solid color-mix(in srgb, var(--bronze) 22%, transparent);
  }
  .ask-who { min-width: 0; }
  .ask-who b { font-size: 16px; }
  .ask-id { font-family: var(--mono); font-size: 12px; color: var(--faint); margin-left: 8px; }
  .ask-when { font-family: var(--mono); font-size: 12px; color: var(--faint); white-space: nowrap; }
  .ask-do { display: flex; gap: 7px; }
  .asks-foot { font-size: 13px; color: var(--faint); margin: 12px 0 0; max-width: 62ch; }

  @media (max-width: 620px) {
    .ask-row { grid-template-columns: 1fr; gap: 6px; }
    .ask-do { margin-top: 4px; }
  }

</style>
</head>
<body>

<header class="bar">
  <a class="back" href="/app/">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M14.5 5.5 8 12l6.5 6.5" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Quill
  </a>
  <span class="here">Gatehouse</span>
</header>

<main class="col" id="page">
  <div class="door">
    <div class="eyebrow">Reading the list</div>
    <h1>&nbsp;</h1>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Patches a panel instead of replacing it, so a poll that lands while
     somebody is typing does not take their caret. Ordinary script, absolute
     path, no build step: nginx's catch-all `location /` serves it under the
     same gate as the page, and the test harness reads it off disk. -->
<script src="/dash/morph.js"></script>
<script>
// The porter's lodge.
//
// Two questions, asked and answered in one screen: who can sign in to this bot,
// and how much of it each of them is shown. The second only ever goes down --
// see levelPicker below, and web/viewer.js for why.
//
// This is a separate page from the dashboard rather than a screen inside it,
// and the reason is the audience. The dashboard is opened by everybody at the
// table; this is opened by one person, rarely, on purpose. A tab in a nav bar
// that four out of five viewers are refused is an invitation to rattle a
// locked door.

// Restricted to a path on this origin — see the longer note in index.html.
// An absolute value here would be worth more than there, because this is the
// page that shows the roster and grants access.
const samePath = (v) => (typeof v === 'string' && /^\/(?![/\\])/.test(v) ? v : null);
const API = samePath(new URLSearchParams(location.search).get('api')) || '/api';

let me = null;
let access = null;

// Which rows are on screen. Deliberately not sent anywhere: filtering is a fact
// about this browser at this moment, and asking the Pi to sort a list it has
// already sent would be a round trip per keystroke.
let query = '';
let only = 'all';

const $ = (id) => document.getElementById(id);

const esc = (s) =>
  String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function since(ms) {
  if (!ms || Number.isNaN(ms)) return '—';
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 90) return 'now';
  if (s < 3600) return `${Math.round(s / 60)} min`;
  if (s < 86400) return `${Math.round(s / 3600)} h`;
  return `${Math.round(s / 86400)} d`;
}

// SQLite writes naive UTC; without the Z a browser reads it as local time and
// everything looks like it happened in the future.
const stamp = (iso) => (iso ? Date.parse(/[Z+]/.test(iso) ? iso : iso + 'Z') : NaN);

// A calendar date, for the one thing on this page that wants one.
//
// since() answers "how long ago" and is right for the roster, where the
// question is whether somebody has been back lately and the answer is a moving
// target. It is wrong for a server that went: "90 d" is not a date anybody can
// place, and the older it gets the less it says. The question there is which
// week this happened, and only a date answers that.
//
// The year is added only when it is not the current one, so a recent departure
// reads as "12 August" and an old one is never ambiguous.
function onDate(ms) {
  if (!ms || Number.isNaN(ms)) return null;
  const d = new Date(ms);
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString(undefined, {
    day: 'numeric', month: 'long', ...(sameYear ? {} : { year: 'numeric' }),
  });
}

let toastTimer = null;
function toast(message, ok) {
  const el = $('toast');
  el.textContent = message;
  el.className = `toast show ${ok ? 'good' : 'bad'}`;
  clearTimeout(toastTimer);
  // A refusal that explains a level is a sentence to read, not a flash. Twice
  // as long on screen as a success, which only has to be noticed.
  toastTimer = setTimeout(() => { el.className = 'toast'; }, ok ? 5000 : 11000);
}

// ==========================================================================
// Talking to the bot
// ==========================================================================

async function get(path) {
  const res = await fetch(`${API}${path}`, { cache: 'no-store' });
  // 403 on /access is an answer, not a failure -- it is the bot saying this
  // roster is not yours. Distinguished from a real outage, which is the thing
  // the caller has to tell apart.
  if (res.status === 403) return null;
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function send(action, body) {
  let payload = {};
  try {
    const res = await fetch(`${API}/actions/${action}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    payload = await res.json().catch(() => ({}));
    toast(payload.message || `HTTP ${res.status}`, res.ok && payload.ok !== false);
  } catch (err) {
    toast(`Couldn't reach the bot — ${err.message}`, false);
    return null;
  }
  await load();
  return payload;
}

async function load() {
  try {
    const [who, roster] = await Promise.all([get('/me'), get('/access')]);
    me = who;
    access = roster;
  } catch (err) {
    morph($('page'), `
      <div class="door">
        <div class="eyebrow alarm">No answer</div>
        <h1>The bot is not reachable.</h1>
        <p><code>${esc(API)}</code> said <em>${esc(err.message)}</em>. Nothing on this
           page is current, so nothing on it can be changed.</p>
      </div>`);
    return;
  }
  paint();
}

// ==========================================================================
// The page
// ==========================================================================

function paint() {
  // The roster only reaches a dev, and the server decides that, not this page
  // -- /access answers 403 to everybody else. Saying so beats an empty table,
  // which could equally mean "nobody has ever signed in".
  //
  // Two different noes, and they used to be one. Until 2026-08-31 this page
  // sat behind an htpasswd prompt, so "not signed in" never reached it: the
  // browser asked for a shared password first. That password is gone -- it
  // could not name a person, only a secret -- and the gate is now the Discord
  // account, which is what "dev" has always been derived from.
  //
  // So somebody arriving with no session is not being refused. They have not
  // been asked yet, and telling them "this is the owner's" would be a lie
  // about a door they have not tried.
  if (!access) {
    const stuck = me && !me.signInAvailable;
    morph($('page'), !me?.signedIn ? `
      <div class="door">
        <div class="eyebrow">The gatehouse</div>
        <h1>Sign in to see who can reach this bot.</h1>
        <p>This page is how accounts are let in, held back, and metered. It answers to
           whoever runs the bot, so it needs to know which Discord account you are —
           there is no password for it, and there is nothing to type.</p>
        ${stuck ? `
          <p class="gate-msg bad">This bot is not set up for Discord sign-in yet, so nobody can
             sign in. Set <code>${esc(me?.signInMissing ?? 'DISCORD_CLIENT_SECRET')}</code> in
             <code>pi-service/.env</code>.</p>` : `
          <div class="gate-btns">
            <a class="gate-btn discord" href="${API}/auth/discord">Continue with Discord</a>
          </div>`}
      </div>
      <div class="foot">
        <p>Quill asks Discord for one thing: who you are. What you can see here is worked
           out from that — see the dashboard at <code>/app/</code> for everything else.</p>
      </div>` : `
      <div class="door">
        <div class="eyebrow">Not yours</div>
        <h1>This one is the bot owner's.</h1>
        <p>A list of everyone who can reach this bot, and what each of them can see,
           is not a list to hand around. Your own level is in the dashboard, under
           your initial at the end of the top bar.</p>
      </div>
      <div class="foot">
        <p>Signed in as <b>${esc(me?.username ?? 'nobody')}</b> — sees ${esc(me?.sees ?? 'nothing yet')}.</p>
      </div>`);
    return;
  }

  morph($('page'), queue() + door() + tools() + `
    <div class="grid">
      <div class="thead">
        <div>Person</div>
        <div>Level</div>
        <div>Tier</div>
        <div class="h-reaches">Reaches</div>
        <div>Last in</div>
        <div></div>
      </div>
      <div id="rows"></div>
    </div>` + admitForm() + gone() + signLog() + footing());

  fill();
}

// The single most important fact here is not the list -- it is whether the
// door is locked at all. With DASHBOARD_REQUIRE_LOGIN off, everything below is
// hypothetical, and a page that led with the list instead would be quietly
// lying by arrangement.
// People who got as far as Discord, were turned away, and pressed the button.
//
// Above the door rather than a row in the table, because it is the one thing on
// this page that is somebody else waiting on you. Everything below is a list
// you maintain at your own pace; this is a question with a person behind it.
// The servers this bot is no longer in, and the tables still filed under them.
//
// Here rather than on the dashboard because the dashboard is the campaign
// list, and the whole point is that these are off it: a table in a Discord the
// bot was removed from cannot be joined, recorded, rostered or posted to, so
// leaving it among the live ones is a row whose every control fails silently.
//
// Read-only on purpose, and this is the one section of the gatehouse with no
// buttons in it. There is nothing to decide. Being removed from a Discord is
// usually an accident, and if the bot is added back every one of these returns
// on its own — so a Delete control here would only offer somebody the chance
// to turn a temporary thing into a permanent one.
function gone() {
  const servers = access.departedGuilds ?? [];
  if (!servers.length) return '';

  const stranded = access.strandedCampaigns ?? [];

  const entries = servers.map((g) => {
    const here = stranded.filter((c) => c.guildId === g.guildId);
    const named = Boolean(g.name);

    const tables = here.map((c) => `
      <div class="gone-table" data-key="stranded-${esc(String(c.id))}">
        <span class="nm">${esc(c.name)}</span>
        <span class="meta">${c.sessions === 1 ? '1 session' : `${c.sessions} sessions`}${(() => {
          // A date here too, not an age. Nothing in this section is going to
          // change again, so "how long ago" is a number that only grows while
          // saying less; the last night they played is a fact that stays put.
          const on = onDate(stamp(c.lastSessionAt));
          return on ? ` · last played ${esc(on)}` : '';
        })()}</span>
      </div>`).join('');

    return `
      <div class="gone-entry" data-key="gone-${esc(g.guildId)}">
        <div class="gone-server">
          <span class="nm${named ? '' : ' unnamed'}">${
            // No name means the bot was already out of that server before it
            // ever wrote one down. The id is all there is, and all there will
            // ever be — so it is shown plainly rather than ruled through as if
            // it were a name.
            esc(named ? g.name : g.guildId)
          }</span>
          <span class="when">${(() => {
            const on = onDate(stamp(g.leftAt));
            return on ? `gone since ${esc(on)}` : 'gone';
          })()}</span>
        </div>
        ${tables ? `<div class="gone-tables">${tables}</div>` : ''}
      </div>`;
  }).join('');

  return `
    <section class="gone">
      <div class="gone-head">
        <h2>Servers that have gone</h2>
        <span class="count">${servers.length === 1 ? '1 server' : `${servers.length} servers`}</span>
      </div>
      <p class="gone-note">
        Quill was removed from these, or they were deleted. Their tables have left the
        campaign list because nothing on one would work — there is no channel to join and
        nowhere to post a write-up. <b>Nothing has been thrown away.</b> Every session,
        transcript and note is still on disk, and if Quill is added back to a server its
        tables return on their own.
      </p>
      ${entries}
    </section>`;
}

// Who came and went, most recent first. Plain lines rather than a table --
// see the .log rules above for why -- and read-only for the same reason
// gone() is: there is nothing here to decide, only to notice.
function signLog() {
  const events = access.log ?? [];
  if (!events.length) return '';

  const rows = events.map((e) => {
    const who = e.username || e.userId;
    const when = new Date(stamp(e.at)).toLocaleString(undefined, {
      month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
    });
    return `
      <div class="log-row ${e.event === 'in' ? 'in' : 'out'}" data-key="log-${esc(e.userId)}-${esc(e.at)}-${e.event}">
        <span class="log-when mono">${esc(when)}</span>
        <span class="log-verb mono">${e.event === 'in' ? 'in' : 'out'}</span>
        <span class="log-who">${esc(who)}</span>
        ${e.username ? `<span class="log-id mono">${esc(e.userId)}</span>` : ''}
        ${e.reason ? `<span class="log-note">${esc(e.reason)}</span>` : ''}
      </div>`;
  }).join('');

  return `
    <section class="signlog">
      <div class="signlog-head">
        <h2>Who's come and gone</h2>
        <span class="count">last ${events.length}</span>
      </div>
      <div class="log">${rows}</div>
    </section>`;
}

function queue() {
  const waiting = (access.people ?? []).filter((p) => p.waiting);
  if (!waiting.length) return '';

  const rows = waiting.map((p) => {
    const name = p.name || p.userId;
    return `
      <div class="ask-row" data-key="ask-${esc(p.userId)}">
        <div class="ask-who">
          <b>${esc(name)}</b>
          ${p.name ? `<span class="ask-id">${esc(p.userId)}</span>` : ''}
        </div>
        <div class="ask-when">asked ${esc(since(stamp(p.requestedAt)))}</div>
        <div class="ask-do">
          <button class="btn go" data-do="access/invite" data-user="${esc(p.userId)}"
                  data-name="${esc(p.name ?? '')}">Let them in</button>
          <button class="btn" data-do="access/dismiss" data-user="${esc(p.userId)}"
                  data-said="Clear ${esc(name)} from the queue? They can ask again.">Not now</button>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="asks">
      <div class="asks-head">
        <span class="asks-mark" aria-hidden="true"></span>
        ${waiting.length === 1 ? 'One person is waiting' : `${waiting.length} people are waiting`}
      </div>
      ${rows}
      <p class="asks-foot">
        Letting somebody in means they can sign in. It does not decide what they see — that is
        still worked out from what their account owns, runs and plays in.
      </p>
    </div>`;
}

function door() {
  if (!access.requireLogin) {
    return `
      <div class="door">
        <div class="eyebrow alarm">The door is not locked</div>
        <h1>Everyone who reaches this page is you.</h1>
        <p><code>DASHBOARD_REQUIRE_LOGIN</code> is off, so no session is needed and every
           visitor is treated as the operator. Nothing below is being enforced — it is
           what <em>would</em> happen. Sign in as yourself once, then turn it on.</p>
      </div>`;
  }

  if (!access.listInUse) {
    return `
      <div class="door">
        <div class="eyebrow">No list in use</div>
        <h1>Any Discord account can sign in.</h1>
        <p>And see nothing, unless it owns a server this bot is in or has spoken at one
           of your tables. That is the right answer on a home network and the wrong one
           now this dashboard has a hostname. Admit somebody and the list closes to
           exactly the names on it.</p>
      </div>`;
  }

  const n = access.people.filter((p) => p.invited).length;
  return `
    <div class="door">
      <div class="eyebrow">The list is closed</div>
      <h1>${n} account${n === 1 ? '' : 's'} can sign in.</h1>
      <p>Everybody else is turned away at Discord's door, with no session written.
         Signing in grants nothing on its own — what each of them sees is worked out
         from their own account, and the Level column is the only place that is
         overruled.</p>
    </div>`;
}

const FILTERS = {
  all:  { label: 'Everyone',    keep: () => true },
  ask:  { label: 'Asked to join', keep: (p) => p.waiting },
  on:   { label: 'On the list', keep: (p) => p.invited },
  off:  { label: 'Turned away', keep: (p) => !p.invited },
  live: { label: 'Signed in',   keep: (p) => p.signedIn },
  held: { label: 'Held down',   keep: (p) => Boolean(p.cap) },
};

function tools() {
  const people = access.people ?? [];
  // A chip for a state nobody is in is a chip that only ever says zero. The
  // three describing the shape of the list stay whatever the count; the rest
  // describe an exception and appear only when there is one.
  //
  // "Asked to join" is first among those, not last, because it is the only
  // one that is somebody waiting on an answer rather than a state of the list.
  const shown = ['all', 'ask', 'on', 'off', 'live', 'held'].filter(
    (k) => ['all', 'on', 'off'].includes(k) || people.some(FILTERS[k].keep)
  );

  return `
    <div class="tools">
      <div class="find">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6" stroke="currentColor" stroke-width="1.6"/>
          <path d="M15 15l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
               aria-label="Search by name or id"
               value="${esc(query)}" placeholder="Search a name or an id">
      </div>
      <div class="chips">
        ${shown.map((k) => `
          <button type="button" class="chip${only === k ? ' on' : ''}" data-only="${k}"
                  aria-pressed="${only === k}">${FILTERS[k].label}<span class="n">${
            people.filter(FILTERS[k].keep).length}</span></button>`).join('')}
      </div>
    </div>`;
}

// Only the rows are redrawn on a keystroke. Repainting the whole page would
// take the search box out from under the person typing into it.
function fill() {
  const people = (access.people ?? []).filter(FILTERS[only]?.keep ?? (() => true));
  const q = query.trim().toLowerCase();
  const found = q
    ? people.filter((p) =>
        String(p.name ?? '').toLowerCase().includes(q) || p.userId.includes(q))
    : people;

  morph($('rows'), found.length
    ? found.map(row).join('')
    : `<div class="empty">${
        q ? `Nobody here matches “${esc(query)}”.` : 'Nobody in this group.'}</div>`);
}

// Where each name stands.
function row(p) {
  // Nobody is given an invented name. An account the bot has only ever been
  // told about wears its id on the top line and does not repeat it below.
  const named = Boolean(p.name);
  const name = p.name || p.userId;
  const isMe = me?.userId && p.userId === me.userId;

  // Only these rows carry a tag, all for the same reason: they are the ones
  // this page cannot remove, so the missing button wants explaining. Every
  // other row says what it is with a button.
  const tag =
    isMe ? '<span class="tag you">you</span>'
    : p.admission === 'owner' ? '<span class="tag">operator</span>'
    : p.admission === 'op' ? '<span class="tag">operator</span>'
    // The one operator this page made, and the one it can unmake. Said in the
    // tag rather than left to the reader to infer from a lit 9, because
    // "operator" is the fact and the tier is only how they got there.
    : p.admission === 'house' ? '<span class="tag">operator · the house</span>'
    : p.admission === 'env' ? '<span class="tag">in .env</span>'
    : '';

  const reach =
    p.level === 'dev' ? 'everything on this bot'
    : p.guilds?.length ? esc(p.guilds.join(', '))
    : p.campaigns ? `${p.campaigns} campaign${p.campaigns === 1 ? '' : 's'}${
        p.manages ? `, runs ${p.manages}` : ''}`
    : 'nothing yet';

  // Same words as every other cell in the column. "signed in" beside "3 d" was
  // two vocabularies in one column, and the bead on the rule already says they
  // are here -- what this cell is for is when.
  const seen = p.signedIn
    ? `<b>now${p.sessions > 1 ? ` ×${p.sessions}` : ''}</b>`
    : esc(since(stamp(p.lastSeen)));

  // Only a row this page wrote can be struck off here. Offering a Remove that
  // would delete nothing and report success is worse than not offering one, so
  // the two it cannot strike off get no button and wear a tag instead.
  const strike =
    p.admission === 'list'
      ? `<button class="btn" data-do="access/uninvite" data-user="${esc(p.userId)}"
                data-said="Remove ${esc(name)} and end their sessions?">Remove</button>`
      : ['owner', 'op', 'env'].includes(p.admission) ? ''
      : `<button class="btn go" data-do="access/invite" data-user="${esc(p.userId)}"
                data-name="${esc(p.name ?? '')}">Admit</button>`;

  const out = p.signedIn
    ? `<button class="btn" data-do="access/revoke" data-user="${esc(p.userId)}"
              data-said="Sign ${esc(name)} out everywhere?">Sign out</button>`
    : '';

  return `
    <div class="row ${p.invited ? '' : 'out'} ${p.signedIn ? 'live' : ''} ${p.cap ? 'held' : ''}"
         data-key="who-${p.userId}">
      <div class="cell">
        <div class="who ${named ? '' : 'nameless mono'}">${esc(name)}${tag}</div>
        ${named ? `<div class="id">${esc(p.userId)}</div>` : ''}
      </div>
      <div class="cell">${levelPicker(p, isMe)}</div>
      <div class="cell">${tierPicker(p)}</div>
      <div class="cell c-reaches reaches">${reach}</div>
      <div class="cell seen">${seen}</div>
      <div class="cell doing">${out}${strike}</div>
    </div>`;
}

// The level control.
//
// It sets a CEILING and never a floor, and the dropdown is built to say so
// rather than to hide it. Every rung is listed; the ones above what this person
// resolves to are disabled and carry the thing that would actually raise them,
// so "why can't I promote them" is answered where the question occurs rather
// than in a toast after a failed attempt.
//
// The reason it only goes down is web/viewer.js: `owner` means Discord says
// they own a server, `creator` means a campaign names them as its manager,
// `player` means they actually spoke at a table. None of those becomes true
// because a row was written here. Showing somebody LESS than they have earned
// needs no fact at all, which is why that half works.
// What a rung ABOVE somebody's own level would actually buy them.
//
// These used to be the reason each one was refused, back when the column only
// went down. It goes both ways now, so they are the caveat instead — every one
// of them says "controls, not campaigns" in its own words, because the shape
// of the mistake is always the same: reading a raise as a claim on something.
//
// Kept to three words or so, and not because of taste. A <select> shows the
// SELECTED option's text when closed, so a long hint on a rung somebody has
// actually been raised to gets cut off mid-word in the closed control —
// "creator · the con". The full sentence lives in the caption underneath,
// which has the room for it.
const SHORT = {
  dev: 'via Tier',
  owner: 'not a server',
  creator: 'not a campaign',
  player: 'nothing new',
  none: '',
};

function levelPicker(p, isMe) {
  const order = access.levels ?? [];
  const derived = p.derivedLevel ?? p.level;

  // An operator is never held down. That click would be unreachable afterwards
  // except over SSH, which is the same trap maySignIn refuses to set -- and a
  // cap on a dev is ignored anyway, so the click would report success and do
  // nothing. The control is shown, disabled, saying which file decides instead.
  if (p.admission === 'owner' || p.admission === 'op' || p.admission === 'house') {
    // Three ways of being an operator, and the caption has to say which —
    // because two of them are only changeable over SSH and the third has its
    // switch on this very row.
    const why =
      p.admission === 'house'
        ? 'on the house tier — move them off it to take this back'
        : `${isMe ? 'you' : 'an operator'} — ${p.admission === 'owner' ? 'OWNER_USER_ID' : 'OPERATOR_USER_IDS'} in .env`;
    return `
      <select class="lvl" disabled aria-label="Level for ${esc(p.name ?? p.userId)}">
        <option>dev</option>
      </select>
      <div class="why">${why}</div>`;
  }

  // Every rung is pickable except dev, which is the Tier column's to give —
  // one way to appoint an operator rather than two, and one thing to remember
  // to take away. A rung above their own carries the caveat with it, so the
  // choice is made with it in view rather than read afterwards in a toast.
  const options = [...order].reverse().map((l) => {
    const above = order.indexOf(l) > order.indexOf(derived);
    // Never on the option that is currently selected. A <select> renders the
    // selected option's text in the closed control, which is narrow — the hint
    // there gets cut off mid-word ("creator · the con") and the caption
    // underneath is already saying the same thing with room to finish it. The
    // hint's job is to inform the CHOICE, so it belongs on the rungs being
    // offered rather than on the one already taken.
    const note = above && SHORT[l] && l !== p.level ? ` · ${SHORT[l]}` : '';
    return `<option value="${l}"${l === p.level ? ' selected' : ''}${
      l === 'dev' ? ' disabled' : ''}>${l}${note}</option>`;
  }).join('');

  // No caption on a row sitting at its own level: "owner — from their account"
  // under a select reading "owner" is the same word twice, and a line under
  // every row would stop the ones that matter from standing out.
  const why =
    p.cap ? `<div class="why held">held down from ${esc(derived)}</div>`
    : p.granted ? `<div class="why">raised from ${esc(derived)} — controls, not campaigns</div>`
    : '';

  return `
    <select class="lvl${p.cap ? ' held' : ''}" data-level="${esc(p.userId)}"
            aria-label="Level for ${esc(p.name ?? p.userId)}">${options}</select>
    ${why}`;
}

// The tier control.
//
// Unlike the level beside it, this one goes up. A level answers "what may they
// see" and is derived from facts, so granting one would mean inventing a fact.
// A tier answers "how much of the owner's GPU and API bill may they spend",
// which no fact answers -- it is the person paying deciding what they will pay.
// See access/tiers.js, which is where the argument lives in full.
//
// The house tier is the exception to all of that and this control is where the
// exception is enforced: tier 9 makes an operator, so only somebody .env names
// may press it -- in either direction, on a row that is already on it or a row
// that is about to be. An operator appointed from this page cannot appoint
// another, which is the whole reason the rule exists.
function tierPicker(p) {
  const tiers = access.tiers ?? [0, 1, 2, 3, 4, 9];
  // An operator named in the file is always on the top tier. A bot that can
  // rate-limit the people who run it out of their own API key is a bot with a
  // trap in it.
  const fixed = p.admission === 'owner' || p.admission === 'op';
  const top = tiers[tiers.length - 1];
  // Whoever is looking may not touch the house. Locking the WHOLE row when
  // they are already on it, because moving a house-tier operator down to 2 is
  // the same act as taking the machinery off them.
  const houseLocked = access.mayGrantHouse === false;
  const barred = (t) => fixed || (houseLocked && (t === top || p.tier === top));

  const buttons = tiers.map((t) => `
    <button type="button" class="t${t === p.tier ? ' on' : ''}${t === top ? ' house' : ''}"${
      barred(t) ? ' disabled' : ''}
            ${barred(t) ? '' : `data-tier="${t}" data-user="${esc(p.userId)}"`}
            ${barred(t) && !fixed ? 'title="Only OWNER_USER_ID or OPERATOR_USER_IDS can hand out the house tier"' : ''}
            aria-pressed="${t === p.tier}">${t}</button>`).join('');

  // Only shown once somebody has actually spent something. A "0/20" under every
  // row is four dozen zeroes and hides the one row that is at its ceiling.
  const spent =
    p.asksToday > 0
      ? `<div class="spent${p.askLimit > 0 && p.asksToday >= p.askLimit ? ' full' : ''}">${
          p.asksToday}${p.askLimit > 0 ? `/${p.askLimit}` : ''} asks today</div>`
      : '';

  return `<div class="tier" role="group" aria-label="Tier for ${esc(p.name ?? p.userId)}"${
    fixed ? ' aria-disabled="true"' : ''}>${buttons}</div>${spent}`;
}

function admitForm() {
  return `
    <form class="admit" id="admit">
      <label for="newid">Admit an account the bot has never seen</label>
      <input id="newid" name="userId" class="mono" inputmode="numeric"
             autocomplete="off" spellcheck="false"
             placeholder="Discord user id — 17 or 18 digits">
      <button type="submit" class="btn go">Admit</button>
      <div class="hint">Anybody the bot already knows is in the table above with an Admit
        button beside their name; this is for the ones it does not. Right-click a name in
        Discord and choose Copy User ID — Developer Mode has to be on, under
        Settings → Advanced.</div>
    </form>`;
}

function footing() {
  return `
    <div class="foot">
      <details class="foot-more">
      <summary>How levels, tiers and admission work</summary>
      <p><b>The Level column goes both ways, and moves controls rather than campaigns.</b>
         Every level is derived from something real — Discord says they own that server, a
         campaign names them as its manager, they actually spoke at that table. Picking a
         lower rung holds somebody below what they have earned; picking a higher one shows
         them more of the machinery. What it never does is add a campaign: which tables
         somebody can see stays the list of tables they have a claim on, so raising a
         player to <b>creator</b> gives them a creator's controls over the campaigns they
         already run, which may be none. To make somebody actually run one, hand it to them
         from that campaign's settings — they resolve to creator on their own. Picking
         their own level back clears the opinion either way.</p>
      <p><b>dev is not on that menu.</b> It is the Tier column's to give, so that
         appointing an operator is one act rather than two.</p>
      <p><b>Tier is the one column that goes up.</b> It is not about what somebody sees,
         it is about how much of your GPU and your API bill they may spend — and no fact
         in the world answers that, so it is yours to decide rather than yours to look up.
         Tier <b>0</b> is free and is where everybody starts. There is no 5 to 8 on
         purpose — the gap is room to add a tier later without renumbering anybody.</p>
      <p><b>Tier 9 is not a spending ceiling — it hands over the bot.</b> The house is
         always the owner's and never metered, and putting somebody else on it makes them
         an <b>operator</b>: the queue, the models, every campaign on this bot, and this
         page. It is the one way of appointing an operator that does not need an SSH
         session, and taking them back off it takes it all away again. Which is why only
         somebody named in <code>pi-service/.env</code> can press it — an operator
         appointed from this page cannot appoint another.</p>
      <p>
         ${access.tiersDiffer
           ? 'Today it governs the daily <code>/campaign ask</code> allowance; transcription minutes and a token budget read the same setting when they arrive.'
           : 'Right now every tier is worth the same, because <code>TIER_ASK_LIMITS</code> is not set in <code>pi-service/.env</code> — write it (say <code>0:5,1:20,2:60,3:200,4:0</code>, keyed by tier, 0 for unlimited) and the buttons start to mean something.'}</p>
      <p><b>Admission is not a level.</b> Letting somebody in shows them nothing extra:
         admitting the wrong person shows them an empty dashboard, not somebody else's
         campaign.</p>
      <p><b>Removing somebody signs them out as well.</b> The list is only consulted when
         a session is made, so a name struck off with a session still open would keep
         working for another month. Sign out on its own does the smaller thing: ends the
         sessions, keeps the welcome.</p>
      <p>The list is two halves. Rows added here live in the bot's database and can be
         removed here. <code>DASHBOARD_ALLOWED_USERS</code> in <code>pi-service/.env</code>
         is the other half, survives anything that happens to the database, and can only
         be changed there. ${access.listInUse
           ? 'Empty both and the door opens to any Discord account again.'
           : 'Both are empty, which is why the door is open to any Discord account.'}</p>
      <p>Actions ${access.actionsEnabled
        ? 'are on — nginx adds the token on the way through, so it is never in this page.'
        : '<b>are refused</b>: no STATUS_TOKEN is set, so nothing on this page will do anything.'}</p>
      </details>
    </div>`;
}

// ==========================================================================
// Acting
// ==========================================================================

// Two clicks, no modal. The button says what the next press does and forgets
// after five seconds. A dialog for "remove one row" is a dialog people learn to
// dismiss without reading, which is the opposite of a confirmation.
let armed = null;
let armedTimer = null;

function disarm() {
  clearTimeout(armedTimer);
  if (armed?.isConnected) {
    armed.classList.remove('armed');
    armed.textContent = armed.dataset.was ?? armed.textContent;
    armed.removeAttribute('title');
  }
  armed = null;
}

document.addEventListener('click', async (e) => {
  const chip = e.target.closest('[data-only]');
  if (chip) {
    disarm();
    only = chip.dataset.only;
    paint();
    return;
  }

  const step = e.target.closest('[data-tier]');
  if (step) {
    disarm();
    await send('access/tier', { userId: step.dataset.user, tier: Number(step.dataset.tier) });
    return;
  }

  const btn = e.target.closest('[data-do]');
  if (!btn) { disarm(); return; }

  const asks = btn.dataset.said;
  if (asks && armed !== btn) {
    disarm();
    armed = btn;
    btn.dataset.was = btn.textContent.trim();
    btn.textContent = 'Sure?';
    btn.classList.add('armed');
    btn.title = asks;
    armedTimer = setTimeout(disarm, 5000);
    return;
  }

  disarm();
  btn.disabled = true;
  await send(btn.dataset.do, { userId: btn.dataset.user, username: btn.dataset.name || undefined });
});

// Redrawing the rows alone is now an economy rather than a necessity: morph()
// would leave the search box alone either way. Kept because filtering a list
// has no reason to touch the door above it.
document.addEventListener('input', (e) => {
  if (e.target?.id !== 'q') return;
  query = e.target.value ?? '';
  fill();
});

// A level is one control, so it is one change and no Save button. Nothing on
// this page is a draft — every other act here happens on the press too.
document.addEventListener('change', async (e) => {
  const sel = e.target;
  if (!sel?.dataset?.level) return;
  sel.disabled = true;
  await send('access/level', { userId: sel.dataset.level, level: sel.value });
});

document.addEventListener('submit', async (e) => {
  const form = e.target.closest('#admit');
  if (!form) return;
  e.preventDefault();

  const input = form.querySelector('#newid');
  const id = input.value.trim();
  if (!/^\d{5,25}$/.test(id)) {
    toast('That is not a Discord user id — they are 17 or 18 digits, nothing else.', false);
    input.focus();
    return;
  }

  const btn = form.querySelector('button');
  btn.disabled = true;
  const sent = await send('access/invite', { userId: id });
  if (sent?.ok) input.value = '';
});

// Escape disarms a half-pressed button, the same as clicking away.
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') disarm(); });

load();
</script>
</body>
</html>
