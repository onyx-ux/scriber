name: Test, build and publish Docker image

# Referenced by README.md ("Publish to GitHub + pull prebuilt images") but
# missing from the original scaffold — this is what actually builds the
# linux/amd64 (PC) + linux/arm64 (Pi) images and pushes them to GHCR so
# neither machine ever compiles whisper.cpp itself.
#
# The test job gates the build: an arm64 image takes ~15 minutes to compile
# under QEMU, so there is no sense publishing one from code that fails a
# suite which runs in under a second.

on:
  push:
    branches: [main]
    paths:
      - "pi-service/**"
      - ".github/workflows/docker-publish.yml"
  # Run the tests on branches/PRs too, so regressions surface before merge
  # rather than after something has already been published.
  pull_request:
    paths:
      - "pi-service/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./pi-service
        run: npm install --no-audit --no-fund

      - name: Run tests
        working-directory: ./pi-service
        run: npm test

  build-and-push:
    needs: test
    # Pull requests get the tests but not a published image — only main does.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./pi-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
