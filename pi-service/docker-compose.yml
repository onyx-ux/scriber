services:
  # This is what runs day-to-day on both the Pi and your PC — pulls the
  # image GitHub Actions already built for the right architecture, no local
  # compiling of whisper.cpp needed on either machine. For iterating on code
  # changes before pushing, use docker-compose.build.yml instead.
  bot:
    image: ghcr.io/onyx-ux/scriber:latest
    restart: unless-stopped
    env_file: .env
    ports:
      # The read-only status API the dashboard polls (STATUS_PORT). This is the
      # only inbound port the bot opens; everything else is outbound-only.
      - '8090:8090'
    volumes:
      # Bind mounts (not named volumes) on purpose — you want these visible
      # as real folders on the Pi's filesystem so you can point Syncthing /
      # Obsidian Sync / whatever you use at the obsidian folder directly,
      # and so audio survives container rebuilds for the export command.
      - ./data:/data
      - ./models:/models
      - ./obsidian-export:/data/obsidian
      # Mounted as a directory, not a single file — rclone rewrites its config
      # in place (rename old -> .old, new -> target) to persist token
      # refreshes, and renaming a bind-mounted file itself fails with EBUSY
      # ("device or resource busy"), since the mount point can't be moved.
      # Mounting the parent dir instead lets that rename happen normally.
      - ./rclone:/root/.config/rclone

  # The dashboard, alongside the bot rather than on the PC.
  #
  # It used to run on the PC, which was fine while it was a window: if the PC
  # was off you lost a status page you could not have used anyway, since the
  # thing it described was the PC's own GPU.
  #
  # It stopped being fine when it became the control surface. Approving a
  # SUMMARY needs nothing but the internet — the PC is irrelevant to it — so a
  # dashboard that is only up when the PC is up meant a session recorded on
  # Friday could not be released until someone turned a gaming rig on. And
  # since the operator buttons have left Discord, there would have been no
  # other way to do it.
  #
  # Here it shares a network with the bot, so nginx proxies to `bot:8090` by
  # service name — no host IP, no mDNS from inside a container, nothing to
  # re-point when the Pi's address changes.
  dashboard:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [bot]
    ports:
      - '8095:80'
      # The same server again, on the port the Cloudflare tunnel was told to
      # look for. Cloudflare's Public Hostname points at `http://localhost:8123`
      # and its URL field will not accept a docker service name, so rather than
      # fight the validator the Pi is made to match what is already configured
      # there — see the tunnel service below. On the LAN the two ports are
      # interchangeable; both land on the same nginx behind the same gate.
      - '8123:80'
    # Deliberately NO env_file here, unlike the bot.
    #
    # env_file: .env would hand this container DISCORD_TOKEN, GEMINI_API_KEY
    # and ANTHROPIC_API_KEY — none of which a web server has any use for, and
    # all of which would then be one careless `${...}` in a template away from
    # being served to a browser. Compose interpolates ${STATUS_TOKEN} from the
    # same .env anyway, so naming the one variable it actually needs costs
    # nothing and keeps the rest out of reach.
    environment:
      PI_API: http://bot:8090
      # Must match STATUS_TOKEN in .env, or the bot answers 401 for reads and
      # 403 for every action.
      STATUS_TOKEN: ${STATUS_TOKEN:-}
    volumes:
      - ../dashboard/html:/usr/share/nginx/html:ro
      # envsubst runs over these at start-up, so the token is injected from the
      # environment rather than baked into an image or committed.
      - ../dashboard/templates:/etc/nginx/templates:ro
      # Who gets in without a password. Kept out of the template so the list
      # can be edited without a container rebuild.
      - ../dashboard/config/allowed-ips.conf:/etc/nginx/allowed-ips.conf:ro
      # See dashboard/config/.htpasswd.example for how to generate this —
      # including the chmod 644, without which nginx's workers cannot read it
      # and every password prompt becomes a 500.
      - ../dashboard/config/.htpasswd:/etc/nginx/.htpasswd:ro

  # The way in from outside the house, without opening a port on the router.
  #
  # An outbound-only connector: cloudflared dials Cloudflare and holds the
  # connection open, and https://quill.thehouseofcake.org is served back down
  # it. Nothing on the home network is exposed, there is no port forward to
  # forget about, and the certificate is Cloudflare's problem rather than
  # certbot's.
  #
  # HOST networking, which is the one surprising line here.
  #
  # The tunnel's Public Hostname is configured — in Cloudflare, not here — as
  # `http://localhost:8123`, and Cloudflare's URL field refuses a docker service
  # name like `dashboard:80`. On a bridge network `localhost` is the cloudflared
  # container's own loopback, which has nothing on it, so every request came
  # back 502. Sharing the host's network makes `localhost:8123` mean the Pi's
  # port 8123, which is where the dashboard is published above.
  #
  # The cost is honest and worth stating: this connector can now reach every
  # port on this Pi, not just the dashboard, so anybody who could edit the
  # tunnel's ingress in Cloudflare could point it at one. That is an account
  # compromise either way — they could equally add a rule to the other tunnel
  # on this box — but it is a wider blast radius than a bridge network, and it
  # is the price of not having to keep two places in step.
  #
  # It also puts cloudflared's own metrics server on the host, at :20241.
  #
  # There is a SECOND cloudflared on this Pi, started by hand long before this
  # one and serving something else. They are different tunnels with different
  # tokens; this one is here, in compose, so it comes back with everything else
  # after a reboot instead of depending on somebody remembering a docker run.
  #
  # SECURITY: what this does NOT do is authenticate anybody. Every request down
  # this tunnel reaches nginx from a docker address, which allowed-ips.conf
  # would wave through as "docker's own bridge networks" — so the dashboard
  # would be open to the whole internet with no password. What stops that is in
  # dashboard/templates/default.conf.template: the visitor's real address is
  # recovered from CF-Connecting-IP before the allow-list is consulted. Read
  # that before changing either file.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on: [dashboard]
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      # Via the environment rather than `--token` on the command line, so the
      # credential is not sitting in `docker inspect` output, `ps` or the shell
      # history of whoever started it. cloudflared reads this by name.
      #
      # `:?` rather than a default: a tunnel that silently starts with no token
      # fails in a way that looks like a network problem.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in pi-service/.env}
